<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Update the HyPlug LinkedIn Companion</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #1f2937; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 10px 0; color: #4b5563; line-height: 1.5; }
    button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid #7c3aed; background: #7c3aed; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.quiet { background: #fff; color: #7c3aed; }
    #status { min-height: 1.4em; font-weight: 600; }
    #status.problem { color: #b91c1c; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    code { background: #f3f0fb; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Update the companion</h1>
  <p id="versions">Checking HyPlug for a newer version…</p>
  <p id="folder"></p>
  <div class="row">
    <button id="update" type="button" disabled>Update</button>
    <button id="choose" type="button" class="quiet">Choose the companion's folder</button>
  </div>
  <p id="status" role="status"></p>
  <p>The first time, choose the folder you loaded the companion from (the unzipped <code>hiringplug-linkedin-companion</code> folder) and allow editing it when the browser asks. After that, updating is one click. When it is done, refresh your HyPlug tabs.</p>
  <script src="updater.js"></script>
  <script src="update.js"></script>
</body>
</html>
