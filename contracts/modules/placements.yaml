# Module contract: placements (a candidate placed in a job, the fee, the
# invoice and the guarantee period).
# See contracts/README.md for the format.
# Salary and fee are sensitive: their own permissions, and the database
# (row-level security) hides them from everyone else.
x-module:
  name: placements
  description: >
    A placement records a candidate starting a job: the start date, the
    guarantee period (if they leave within it, the placement fell through),
    the recruiter credited, the agreed salary and the fee, and whether it has
    been invoiced and paid. Recording one moves the application to placed.
  permissions:
    placements:read:
      description: View placements (salary and fee need placements.fees:read).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    placements:manage:
      description: Record placements and change them (start date, guarantee, status, invoice).
      roles: [owner, admin, recruiter]
    placements.fees:read:
      description: See a placement's agreed salary and fee.
      roles: [owner, admin, recruiter]
    placements.fees:update:
      description: Set or change a placement's agreed salary and fee.
      roles: [owner, admin, recruiter]
  errorCodes:
    PLACEMENT_NOT_ALLOWED:
      status: 422
      description: The placement cannot be recorded or changed like this (the application is closed or already has one, a fall-through after the guarantee ended, ...). The message says why.
  jobs:
    placement.invoice:
      queue: core
      payload: PlacementInvoiceJob
      description: "On a placement's start date: email its invoice to the client, if it is still to be emailed (Go worker)."

paths:
  /v1/placements:
    get:
      operationId: listPlacements
      tags: [placements]
      summary: Placements, newest start date first, with fee totals
      description: >
        `money` is only included with placements.fees:read, and so are the
        fee totals. The list stops at 500 placements; the totals count every
        placement that matches.
      x-permission: placements:read
      parameters:
        - { name: applicationId, in: query, required: false, schema: { $ref: '#/components/schemas/ApplicationId' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/PlacementStatus' } }
        - { name: invoiceStatus, in: query, required: false, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: startFrom, in: query, required: false, description: Started on or after this day., schema: { type: string, format: date } }
        - { name: startTo, in: query, required: false, description: Started on or before this day., schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/companies/{companyId}/billing:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getCompanyBilling
      tags: [placements]
      summary: What a client was billed, this year and all time
      description: >
        The fees of placements on any of the company's jobs that stood (not
        fallen through or cancelled), per currency: those starting this year
        (in the agency's time zone) and all of them.
      x-permission: placements.fees:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyBilling' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/applications/{applicationId}/placement:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      operationId: createPlacement
      tags: [placements]
      summary: Record a placement for an application (moves it to placed)
      description: "`money` needs placements.fees:update."
      x-permission: placements:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/PlacementNotAllowed' }

  /v1/placements/{placementId}:
    parameters:
      - $ref: '#/components/parameters/PlacementIdPath'
    patch:
      operationId: updatePlacement
      tags: [placements]
      summary: Change a placement (start, guarantee, status, invoice, money)
      description: "Fields left out stay as they are. `money` needs placements.fees:update."
      x-permission: placements:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PlacementNotAllowed' }

  /v1/applications/{applicationId}/placement-defaults:
    parameters:
      - { name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/ApplicationId' } }
    get:
      operationId: getPlacementDefaults
      tags: [placements]
      summary: What a new placement starts with, from the client's terms of business
      description: The fee, payment terms and guarantee the client signed, and the job's hiring contact to invoice.
      x-permission: placements:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementDefaults' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/placements/{placementId}/invoicing:
    parameters:
      - $ref: '#/components/parameters/PlacementIdPath'
    put:
      operationId: putPlacementInvoicing
      tags: [placements]
      summary: Who is invoiced, the payment terms and due date, and whether the invoice is emailed on the start date
      x-permission: placements:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementInvoicingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/placements/{placementId}/invoice:
    parameters:
      - $ref: '#/components/parameters/PlacementIdPath'
    post:
      operationId: sendPlacementInvoice
      tags: [placements]
      summary: Email the invoice now (numbered from the template; the placement is then invoiced)
      description: Needs placements.fees:read too (the invoice shows the fee).
      x-permission: placements:manage
      responses:
        '200':
          description: Queued for sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/PlacementNotAllowed' }

  /v1/placements/{placementId}/invoice/file:
    parameters:
      - $ref: '#/components/parameters/PlacementIdPath'
    get:
      operationId: getPlacementInvoiceFile
      tags: [placements]
      summary: The invoice as a PDF or Word file (before it is sent, a preview without its number)
      description: Needs placements.fees:read too.
      x-permission: placements:read
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/InvoiceFormat' } }
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/PlacementNotAllowed' }

  /v1/invoice-settings:
    get:
      operationId: getInvoiceSettings
      tags: [placements]
      summary: The agency's invoice template and the email that sends it
      x-permission: placements:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putInvoiceSettings
      tags: [placements]
      summary: Change the invoice template and its email
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceSettingsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  responses:
    PlacementNotAllowed:
      description: Not allowed (PLACEMENT_NOT_ALLOWED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    PlacementIdPath:
      name: placementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PlacementId' }

  schemas:
    PlacementInvoiceJob:
      type: object
      additionalProperties: false
      required: [placementId]
      properties:
        placementId: { $ref: '#/components/schemas/PlacementId' }
        sendAt:
          type: string
          format: date-time
          description: "The send time this job was queued for (the start date at the hour). A job whose time is no longer the placement's does nothing: another is queued for the new one."
    InvoiceFormat:
      type: string
      enum: [pdf, docx]
    PlacementDefaults:
      type: object
      required: [companyId, companyName, jobTitle, jobType, feePercent, paymentTermsDays, guaranteeDays, contactId, termsSet, tiers, salaryCurrency]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        jobTitle: { type: string }
        jobType: { $ref: '#/components/schemas/PlacementJobType' }
        termsSet: { type: boolean, description: The client has terms of business recorded. }
        tiers:
          type: array
          description: "The client's rates by annual salary: the form picks the one for the salary typed in."
          items: { $ref: '#/components/schemas/CompanyTermsTier' }
        salaryCurrency: { type: string, description: The currency of the tiers' salary limits. }
        feePercent:
          description: From the client's terms (the rate for any salary; null when it depends on the salary).
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        paymentTermsDays: { type: integer, description: "From the client's terms (30 when not set or when it depends on the salary)." }
        guaranteeDays: { type: integer, description: "From the client's terms (90 when not set or when it depends on the salary)." }
        contactId:
          description: The job's hiring contact, when they have an email address.
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
    PlacementInvoicing:
      type: object
      required: [contactId, contactName, contactEmail, paymentTermsDays, dueOn, dueOnSet, autoSend, sendsAt, sentAt, sendError]
      properties:
        contactId:
          description: Who receives the invoice (one of the client's contacts).
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        contactName: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        paymentTermsDays: { type: integer }
        dueOn: { type: string, format: date, description: "When payment is due: the invoice date (the start date until invoiced) plus the terms, unless set." }
        dueOnSet: { type: boolean, description: "true: someone set the due date; false: it follows the start date and the terms." }
        autoSend: { type: boolean, description: Email the invoice to the contact on the start date. }
        sendsAt: { type: string, format: date-time, nullable: true, description: When it will be emailed (null when it will not be). }
        sentAt: { type: string, format: date-time, nullable: true }
        sendError: { type: string, nullable: true, description: Why it could not be emailed on its own. }
    PlacementInvoicingInput:
      type: object
      additionalProperties: false
      required: [contactId, paymentTermsDays, dueOn, autoSend]
      properties:
        contactId:
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        paymentTermsDays: { type: integer, minimum: 0, maximum: 365 }
        dueOn: { type: string, format: date, nullable: true, description: "null: the start date plus the terms." }
        autoSend: { type: boolean }
    InvoiceSettingsBase:
      type: object
      required: [issuer, bankDetails, numberPrefix, nextNumber, taxLabel, taxPercent, lineText, footer, emailSubject, emailBody, sendHour]
      properties:
        issuer: { type: string, maxLength: 1000, description: "Your company's name and details, a line each (address, registration and tax numbers)." }
        bankDetails: { type: string, maxLength: 1000 }
        numberPrefix: { type: string, maxLength: 20, example: INV- }
        nextNumber: { type: integer, minimum: 1, maximum: 99999999, description: "The next invoice's number (INV-0001)." }
        taxLabel: { type: string, maxLength: 40, example: SST }
        taxPercent: { $ref: '#/components/schemas/DecimalAmount' }
        lineText: { type: string, minLength: 1, maxLength: 1000, description: "The invoice line, with {{fields}}." }
        footer: { type: string, maxLength: 2000 }
        emailSubject: { type: string, minLength: 1, maxLength: 200 }
        emailBody: { type: string, minLength: 1, maxLength: 10000 }
        sendHour: { type: integer, minimum: 0, maximum: 23, description: "The hour invoices go out on the start date (the agency's time zone)." }
    InvoiceSettings:
      allOf:
        - $ref: '#/components/schemas/InvoiceSettingsBase'
        - type: object
          required: [version, fields]
          properties:
            version: { type: integer, description: 0 while the defaults are in use. }
            fields:
              type: array
              description: The {{fields}} the texts may use.
              items: { $ref: '#/components/schemas/InvoiceField' }
    InvoiceField:
      type: object
      required: [key, label, example]
      properties:
        key: { type: string, example: invoice.total }
        label: { type: string }
        example: { type: string }
    InvoiceSettingsInput:
      allOf:
        - $ref: '#/components/schemas/InvoiceSettingsBase'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 0 }
    PlacementId:
      type: string
      pattern: '^plc_[0-9a-hjkmnp-tv-z]{26}$'
      example: plc_01jbz6w0m0k8q9x2r3s4t5v6w7
    PlacementStatus:
      type: string
      description: active = started (or starting); fell_through = left within the guarantee period; cancelled = did not start.
      enum: [active, fell_through, cancelled]
    ReplacementStatus:
      type: string
      description: "After a fall-through: owed = the client is owed a replacement candidate (or a refund); provided; refunded. none otherwise."
      enum: [none, owed, provided, refunded]
    InvoiceStatus:
      type: string
      enum: [not_invoiced, invoiced, paid]
    PlacementRestrictedField:
      type: string
      description: A field left out because you lack the permission to see it.
      enum: [money]
    PlacementMoney:
      type: object
      additionalProperties: false
      required: [salary, feePercent, feeAmount, feeCurrency]
      description: >
        The fee is either a percentage of the yearly salary (a monthly salary
        counts 12 times; feeAmount is then worked out) or a fixed amount
        (feePercent null).
      properties:
        salary:
          description: The agreed salary.
          allOf: [{ $ref: '#/components/schemas/SalaryAmount' }]
          nullable: true
        feePercent:
          description: e.g. "20" for 20% of the yearly salary.
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        feeAmount:
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        feeCurrency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          nullable: true
    Placement:
      type: object
      required: [id, version, applicationId, candidateId, candidateName, jobId, jobTitle, companyId, companyName, jobType, poNumber, endDate, recruiterId, recruiterName,
        startDate, guaranteeDays, guaranteeEndsOn, status, leftOn, statusNote, replacement, invoiceStatus, invoiceNumber, invoicedOn, paidOn,
        invoicing, restrictedFields, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/PlacementId' }
        version: { type: integer }
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        candidateName: { type: string }
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        jobTitle: { type: string, description: "As on the placement sheet: the job's title unless changed." }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string, description: "As on the placement sheet: the client's name unless changed." }
        jobType: { $ref: '#/components/schemas/PlacementJobType' }
        poNumber: { type: string, nullable: true, description: "The client's purchase order number." }
        endDate: { type: string, format: date, nullable: true, description: "When the placement ends (a contract's end), if known." }
        invoicing: { $ref: '#/components/schemas/PlacementInvoicing' }
        recruiterId:
          description: The recruiter credited with the placement.
          allOf: [{ $ref: '#/components/schemas/UserId' }]
          nullable: true
        recruiterName: { type: string, nullable: true }
        startDate: { type: string, format: date }
        guaranteeDays: { type: integer, description: "How long after the start the candidate is guaranteed: if they leave within it, the placement fell through." }
        guaranteeEndsOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/PlacementStatus' }
        leftOn: { type: string, format: date, nullable: true, description: When the candidate left (fell_through only). }
        statusNote: { type: string, nullable: true }
        replacement: { $ref: '#/components/schemas/ReplacementStatus' }
        invoiceStatus: { $ref: '#/components/schemas/InvoiceStatus' }
        invoiceNumber: { type: string, nullable: true }
        invoicedOn: { type: string, format: date, nullable: true }
        paidOn: { type: string, format: date, nullable: true }
        money:
          description: Left out (and listed in restrictedFields) without placements.fees:read. null means none recorded.
          allOf: [{ $ref: '#/components/schemas/PlacementMoney' }]
          nullable: true
        restrictedFields:
          type: array
          items: { $ref: '#/components/schemas/PlacementRestrictedField' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyBilling:
      type: object
      required: [year, thisYear, allTime]
      properties:
        year: { type: integer, description: The current year in the agency's time zone. }
        thisYear:
          type: array
          items: { $ref: '#/components/schemas/FeeTotal' }
        allTime:
          type: array
          items: { $ref: '#/components/schemas/FeeTotal' }
    FeeTotal:
      type: object
      required: [currency, total, notInvoiced, invoiced, paid]
      description: Fees of the matching placements that did not fall through or get cancelled, in one currency.
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        total: { $ref: '#/components/schemas/DecimalAmount' }
        notInvoiced: { $ref: '#/components/schemas/DecimalAmount' }
        invoiced: { $ref: '#/components/schemas/DecimalAmount', description: Invoiced and not yet paid. }
        paid: { $ref: '#/components/schemas/DecimalAmount' }
    PlacementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        feeTotals:
          description: Left out without placements.fees:read.
          type: array
          items: { $ref: '#/components/schemas/FeeTotal' }
    PlacementMoneyInput:
      type: object
      additionalProperties: false
      description: "Either feePercent (with a monthly or yearly salary) or feeAmount and feeCurrency; or neither."
      properties:
        salary:
          allOf: [{ $ref: '#/components/schemas/SalaryAmount' }]
          nullable: true
        feePercent:
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        feeAmount:
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        feeCurrency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          nullable: true
    PlacementJobType:
      type: string
      description: "permanent or contract; from the job's work type unless changed (contract and temporary jobs are contract)."
      enum: [permanent, contract]
    PlacementInput:
      type: object
      additionalProperties: false
      required: [startDate]
      properties:
        startDate: { type: string, format: date }
        jobTitle: { type: string, maxLength: 300, description: "Defaults to the job's title." }
        companyName: { type: string, maxLength: 300, description: "Defaults to the client's name." }
        jobType: { $ref: '#/components/schemas/PlacementJobType' }
        poNumber: { type: string, maxLength: 100 }
        endDate: { type: string, format: date }
        guaranteeDays: { type: integer, minimum: 0, maximum: 365, description: Defaults to 90. }
        recruiterId:
          description: Defaults to you.
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        money: { $ref: '#/components/schemas/PlacementMoneyInput' }
    PlacementUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        jobTitle: { type: string, maxLength: 300 }
        companyName: { type: string, maxLength: 300 }
        jobType: { $ref: '#/components/schemas/PlacementJobType' }
        poNumber: { type: string, maxLength: 100, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        guaranteeDays: { type: integer, minimum: 0, maximum: 365 }
        recruiterId:
          allOf: [{ $ref: '#/components/schemas/UserId' }]
          nullable: true
        status: { $ref: '#/components/schemas/PlacementStatus' }
        leftOn: { type: string, format: date, nullable: true }
        statusNote: { type: string, maxLength: 1000, nullable: true }
        replacement:
          description: Only for a fall-through (it becomes owed when the placement falls through).
          allOf: [{ $ref: '#/components/schemas/ReplacementStatus' }]
        invoiceStatus: { $ref: '#/components/schemas/InvoiceStatus' }
        invoiceNumber: { type: string, maxLength: 100, nullable: true }
        invoicedOn: { type: string, format: date, nullable: true }
        paidOn: { type: string, format: date, nullable: true }
        money:
          description: The whole of the salary and fee (null clears them).
          allOf: [{ $ref: '#/components/schemas/PlacementMoneyInput' }]
          nullable: true
