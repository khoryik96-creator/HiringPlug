# Module contract: documents (CVs and other files attached to candidates).
# See contracts/README.md for the format.
x-module:
  name: documents
  description: >
    Files attached to candidates: JobStreet/LinkedIn CVs, the original CV and
    formatted CVs. Uploading a CV queues text extraction in the Python AI worker.
  permissions:
    documents:read:
      description: View and download candidate documents, including extracted text.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    documents:create:
      description: Upload candidate documents.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes:
    DOCUMENT_HAS_NO_TEXT:
      status: 409
      description: The document has no extracted text yet (still being read, scanned without OCR, or unreadable), so there is nothing to parse.
  jobs:
    document.extract_text:
      queue: ai
      payload: DocumentExtractTextJob
      description: Extract plain text from an uploaded document (Python AI worker).
    document.text_extracted:
      queue: core
      payload: DocumentTextExtractedJob
      description: Save the result of text extraction on the document (Go worker).
    document.parse_cv:
      queue: ai
      payload: DocumentParseCvJob
      description: Read profile details out of a CV's extracted text (Python AI worker).
    document.cv_parsed:
      queue: core
      payload: DocumentCvParsedJob
      description: "Save parsed CV details on the document, keeping only values whose quote is found in the CV (Go worker)."
    document.render_pdf:
      queue: ai
      payload: DocumentRenderPdfJob
      priority: low
      description: Turn a formatted CV (.docx) into a PDF with LibreOffice (Python AI worker).
    document.pdf_rendered:
      queue: core
      payload: DocumentPdfRenderedJob
      priority: low
      description: Save a formatted CV's PDF with it (Go worker).

paths:
  /v1/candidates/{candidateId}/documents:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateDocuments
      tags: [documents]
      summary: List a candidate's documents, newest first
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadCandidateDocument
      tags: [documents]
      summary: Upload a CV or other document (PDF, DOCX or old Word .doc, up to 10 MB)
      description: >
        Returns immediately with status `queued`; text extraction runs in the
        background. Poll GET /v1/documents/{documentId} for the result.
      x-permission: documents:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source]
              properties:
                file:
                  type: string
                  format: binary
                source: { $ref: '#/components/schemas/DocumentSource' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /v1/documents/{documentId}/parse:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      operationId: parseDocument
      tags: [documents]
      summary: Read the profile details out of a CV again
      description: >
        CVs are parsed automatically after their text is read. Use this for CVs
        uploaded before parsing existed, or to re-run a newer parser. Returns
        the document with parseStatus `queued`.
      x-permission: documents:create
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/documents/{documentId}/file:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentFile
      tags: [documents]
      summary: Download the document's file as uploaded
      description: >
        The bytes as uploaded; the document's contentType says what they are.
        Content-Disposition carries the original file name.
      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/documents/{documentId}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentPdf
      tags: [documents]
      summary: Download a Word document (a formatted CV, or a CV sent as Word) as PDF
      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: makeDocumentPdf
      tags: [documents]
      summary: Make a Word document's PDF copy (for previewing it), if it has none yet
      description: Word CVs uploaded since previews began get one at once; this makes one for older ones. A PDF, or a document whose copy is made or being made, is left as it is.
      x-permission: documents:read
      responses:
        '202':
          description: Being made (or already there)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document, including its extracted text
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/documents/{documentId}/highlights:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: highlightDocument
      tags: [documents]
      summary: A document's text with the words of a boolean search marked
      x-permission: documents:read
      parameters:
        - name: boolean
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentHighlights' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DocumentId' }

  schemas:
    DocumentHighlights:
      type: object
      required: [parts, matches]
      properties:
        parts:
          type: array
          description: The text in order; parts with match true are the words found (as the search matches them, other forms included).
          items: { $ref: '#/components/schemas/DocumentHighlightPart' }
        matches: { type: integer, description: How many places match. }
    DocumentHighlightPart:
      type: object
      required: [text, match]
      properties:
        text: { type: string }
        match: { type: boolean }
    DocumentId:
      type: string
      pattern: '^doc_[0-9a-hjkmnp-tv-z]{26}$'
      example: doc_01jbz6w0m0k8q9x2r3s4t5v6w7

    DocumentSource:
      type: string
      description: >
        Where the file came from. original = the candidate's own CV;
        formatted = a CV formatted by your team for clients.
      enum: [jobstreet, linkedin, original, formatted, other]
    DocumentStatus:
      type: string
      description: >
        queued = waiting for text extraction; extracted = text available;
        needs_ocr = scanned document, no text layer yet; failed = could not be read.
      enum: [queued, extracted, needs_ocr, failed]

    DocumentParseStatus:
      type: string
      description: >
        queued = being parsed; parsed = details ready to review; failed = the
        parser could not read it.
      enum: [queued, parsed, failed]

    Document:
      type: object
      required: [id, candidateId, source, fileName, contentType, sizeBytes, sha256, status, pageCount, extractor, errorMessage, extractionWarnings, parseStatus, pdfStatus, createdAt, updatedAt]
      properties:
        pdfStatus:
          description: "Formatted CVs made by the app also come as a PDF: queued, ready (GET .../pdf) or failed; null for other documents."
          allOf: [{ $ref: '#/components/schemas/PdfStatus' }]
          nullable: true
        id: { $ref: '#/components/schemas/DocumentId' }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        source: { $ref: '#/components/schemas/DocumentSource' }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        pageCount: { type: integer, nullable: true }
        extractor:
          type: string
          nullable: true
          description: Which extractor produced the text, e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: { type: string, nullable: true }
        extractionWarnings:
          type: array
          items: { type: string }
          description: >
            Problems a recruiter should know about, e.g. "OCR could not read page 3;
            this document may be incomplete." Empty when extraction was clean.
        extractedText:
          type: string
          nullable: true
          description: Only included when fetching a single document.
        parseStatus:
          allOf: [{ $ref: '#/components/schemas/DocumentParseStatus' }]
          nullable: true
          description: Null when the document was never parsed (formatted CVs, or uploaded before parsing existed).
        parsedProfile:
          allOf: [{ $ref: '#/components/schemas/ParsedProfile' }]
          nullable: true
          description: Only included when fetching a single document.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }

    SourcedText:
      type: object
      additionalProperties: false
      required: [value, quote]
      description: >
        A value read from a CV and the exact CV text it came from. Values whose
        quote is not in the CV are dropped before saving.
      properties:
        value: { type: string, minLength: 1, maxLength: 300 }
        quote: { type: string, minLength: 1, maxLength: 1000 }
    ParsedJob:
      type: object
      additionalProperties: false
      required: [title, company, dates, startDate, endDate, current]
      properties:
        title: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        company: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        dates: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        startDate: { type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY. }
        endDate: { type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY; null when current. }
        current: { type: boolean }
    ParsedEducation:
      type: object
      additionalProperties: false
      required: [qualification, institution, dates, endYear]
      properties:
        qualification: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        institution: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        dates: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        endYear: { type: integer, nullable: true, minimum: 1950, maximum: 2100 }
    ParsedProfile:
      type: object
      additionalProperties: false
      required: [parser, fullName, email, phone, linkedinUrl, location, nationality, residenceCountry, industry, noticePeriod, skills, experience, education, dropped]
      description: >
        Details read from a CV, as suggestions to review. nationality is an
        ISO country code; noticePeriod is "<number> day|week|month".
      properties:
        parser: { type: string, description: 'name@version of the parser(s), e.g. rules@1.' }
        fullName: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        email: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        phone: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        linkedinUrl: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        location: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        nationality: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        residenceCountry:
          description: Where the candidate lives, an ISO country code, from their address, the places in it, or their phone's country code.
          allOf: [{ $ref: '#/components/schemas/SourcedText' }]
          nullable: true
        industry:
          description: "The industry of their current (latest) employer, inferred: the quote is the words it was inferred from (Kano's industries)."
          allOf: [{ $ref: '#/components/schemas/SourcedText' }]
          nullable: true
        noticePeriod: { allOf: [{ $ref: '#/components/schemas/SourcedText' }], nullable: true }
        skills:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SourcedText' }
        experience:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/ParsedJob' }
        education:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/ParsedEducation' }
        dropped:
          type: integer
          minimum: 0
          description: How many values were dropped because their quote was not found in the CV.

    # --- Job payloads (messages on the job queue, not HTTP bodies) ---
    DocumentExtractTextJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl, contentType, fileName, sizeBytes]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        downloadUrl:
          type: string
          description: Short-lived signed URL to download the file from.
        contentType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
    ExtractionStatus:
      type: string
      enum: [extracted, needs_ocr, failed]
    PdfStatus:
      type: string
      enum: [queued, ready, failed]
    DocumentRenderPdfJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        downloadUrl: { type: string, description: A short-lived link to the .docx. }
    DocumentPdfRenderedJob:
      type: object
      additionalProperties: false
      required: [documentId, pdfBase64, error]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        pdfBase64: { type: string, nullable: true, maxLength: 28000000, description: The PDF (base64); null when it failed. }
        error: { type: string, nullable: true, maxLength: 1000 }
    DocumentTextExtractedJob:
      type: object
      additionalProperties: false
      required: [documentId, status, text, pageCount, extractor, errorMessage, warnings]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        status: { $ref: '#/components/schemas/ExtractionStatus' }
        text:
          type: string
          nullable: true
          # PostgreSQL cannot store NUL characters (often found in PDF text):
          # the worker must remove them before sending.
          pattern: '^[^\x00]*$'
          description: The document's plain text, with NUL characters removed.
        pageCount: { type: integer, nullable: true }
        extractor:
          type: string
          description: name@version of the extractor(s), e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: { type: string, nullable: true }
        warnings:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
          description: Problems found while reading, e.g. pages OCR could not read.
    DocumentParseCvJob:
      type: object
      additionalProperties: false
      required: [documentId, text]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        text:
          type: string
          pattern: '^[^\x00]*$'
          description: The document's saved text, so quotes match it exactly.
        useAi:
          type: boolean
          description: >
            The AI may fill what the rules leave empty (Kano's way: when the
            rules find name, email, phone, current title and company, only the
            industry is asked for). Set when the AI is on and the company has
            allowance left.
        aiText:
          type: string
          pattern: '^[^\x00]*$'
          description: >
            What the AI may read: the text with salary figures taken out (salary
            never goes to the AI). Sent with useAi; quotes still come from text.
        ai:
          allOf: [{ $ref: '#/components/schemas/AiAccess' }]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    DocumentCvParsedJob:
      type: object
      additionalProperties: false
      required: [documentId, profile, errorMessage]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        profile: { allOf: [{ $ref: '#/components/schemas/ParsedProfile' }], nullable: true }
        errorMessage: { type: string, nullable: true }
        aiTokens: { type: integer, minimum: 0, description: Tokens the AI used (counted in the monthly allowance). }
