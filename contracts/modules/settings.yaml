# Module contract: settings (each company's own dropdown options, and which
# form fields are mandatory).
# See contracts/README.md for the format.
x-module:
  name: settings
  description: >
    Main settings. Dropdown lists a company can change: open lists (candidate
    source, notice period, industry) take new options; fixed lists (work type,
    work arrangement) can be renamed, reordered and hidden only, because
    other systems (job boards, Google for Jobs) need their values. Fields a
    company makes mandatory must be filled in when a person adds a record, and
    cannot be emptied later.
  permissions:
    settings:read:
      description: See the company's dropdown options and mandatory fields (every form needs them).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    settings:manage:
      description: Change dropdown options and mandatory fields.
      roles: [owner, admin]
    settings.backups:manage:
      description: >
        See, make, download and delete backups of the whole server, and turn
        the nightly backup on or off. Only for the agency that runs the server
        (a backup holds every agency's data on it).
      roles: [owner]
  errorCodes: {}
  jobs:
    background_job.ended:
      queue: core
      payload: BackgroundJobEndedJob
      description: >
        An AI-queue job failed for good (its last attempt failed, or the AI
        worker gave up on it). Queued by the database itself, in the
        transaction that ends the job (migration 00199): the Go worker runs
        that kind's dead-job handler, so what the job was for (a CV being
        read) is not left waiting.

paths:
  /v1/settings/salary-calculation:
    get:
      operationId: getSalaryCalculationRules
      tags: [settings]
      summary: Fixed monthly salary calculation rules
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putSalaryCalculationRules
      tags: [settings]
      summary: Choose the company's fixed monthly salary formula
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields:
    get:
      operationId: getFieldSettings
      tags: [settings]
      summary: The company's dropdown lists and mandatory fields
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/lists/{fieldList}:
    parameters:
      - name: fieldList
        in: path
        required: true
        schema: { $ref: '#/components/schemas/FieldListName' }
    put:
      operationId: putFieldList
      tags: [settings]
      summary: Replace a dropdown's options (in the order given)
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldListInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/mandatory:
    put:
      operationId: putMandatoryFields
      tags: [settings]
      summary: Choose which fields are mandatory
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MandatoryFieldsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/policies:
    get:
      operationId: getPolicies
      tags: [settings]
      summary: The company's choices on how the app treats sensitive information
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putPolicies
      tags: [settings]
      summary: Change those choices
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policies' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system:
    get:
      operationId: getSystemStatus
      tags: [settings]
      summary: The company's background jobs (waiting, failed) and the server's last backup
      x-permission: settings:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system/jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$' }
    post:
      operationId: retryBackgroundJob
      tags: [settings]
      summary: Try a job that failed for good again, from its first attempt
      x-permission: settings:manage
      responses:
        '200':
          description: Queued again; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/system/jobs/{jobId}/release:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$' }
    post:
      operationId: releaseHeldJob
      tags: [settings]
      summary: Let a job held after a restore run (it may have happened already, before the backup was restored)
      x-permission: settings:manage
      responses:
        '200':
          description: Released; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/system/jobs/{jobId}/cancel:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$' }
    post:
      operationId: cancelHeldJob
      tags: [settings]
      summary: Cancel a job held after a restore (it never runs; it shows as failed)
      x-permission: settings:manage
      responses:
        '200':
          description: Cancelled; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/system/held:
    post:
      operationId: settleHeldJobs
      tags: [settings]
      summary: Release, or cancel, every job of the company held after a restore
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [release, cancel] }
      responses:
        '200':
          description: Done; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system/paid-ai:
    put:
      operationId: setPaidAi
      tags: [settings]
      summary: Pause every paid AI call on the server, or turn paid AI back on
      description: >
        The server-wide switch: paused, no AI call is made through any
        company's key or the server's own provider, for new work or work
        already queued; local work (reading text and scans, PDF copies, search
        by meaning, reading CVs by the rules) goes on. Only an owner of the
        agency that runs the server (HP_BACKUP_TENANT, or the only agency)
        may change it here; on the server, `hp paid-ai on|off` changes it
        too. HP_AI_PAID=off keeps it paused whatever this says.
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paused]
              properties:
                paused: { type: boolean }
                reason: { type: string, maxLength: 300, description: Why (shown in Settings > System). }
      responses:
        '200':
          description: Changed; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups:
    get:
      operationId: getBackups
      tags: [settings]
      summary: The server's backups (with sizes), the nightly backup switch and the backup service's state
      description: >
        Only the agency that runs the server sees them (HP_BACKUP_TENANT, or
        the only agency when there is just one); for any other, `available`
        is false and nothing else is filled in.
      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/auto:
    put:
      operationId: setAutoBackup
      tags: [settings]
      summary: Turn the nightly backup on or off
      x-permission: settings.backups:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auto]
              properties:
                auto: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/run:
    post:
      operationId: requestBackup
      tags: [settings]
      summary: Make a backup now (the backup service makes it within a minute)
      x-permission: settings.backups:manage
      responses:
        '202':
          description: Asked for
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    delete:
      operationId: deleteBackup
      tags: [settings]
      summary: Delete one backup from the server
      x-permission: settings.backups:manage
      responses:
        '200':
          description: Deleted; the backups left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/backups/{backupName}/link:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    post:
      operationId: createBackupDownloadLink
      tags: [settings]
      summary: A download link for one backup, valid for 10 minutes
      description: >
        The browser saves from this link where the person chooses, without
        loading a large backup into memory. The link names one backup and
        stops working after 10 minutes (a download already going finishes).
      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupDownloadLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/backup-downloads/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    get:
      operationId: downloadBackup
      tags: [settings]
      summary: One backup as a single .tar file (from a link made by createBackupDownloadLink)
      description: >
        The backup's folder (database.dump, files.tar.gz, manifest.json) in
        one .tar file; unpack it to get the folder back. Needs the link's
        `token` (random, kept by the server until it expires), not a sign-in.
      x-permission: public
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '200':
          description: The backup
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    BackupNamePath:
      name: backupName
      in: path
      required: true
      schema: { type: string, pattern: '^hiringplug-[0-9]{8}-[0-9]{6}$' }
  schemas:
    ServerChecks:
      type: object
      required: [version, processes, files, freeBytes, totalBytes, problems]
      properties:
        version: { type: string, description: "The version of HyPlug the API runs (the VERSION file)." }
        processes:
          type: array
          description: The background worker and the AI worker, as each last reported (every half minute).
          items: { $ref: '#/components/schemas/ServerProcess' }
        files:
          type: string
          nullable: true
          description: "null: the API wrote, read back and removed a file in the files folder. Else why it could not."
        freeBytes: { type: integer, format: int64, nullable: true, description: "Free space on the files' disk (null: unknown)." }
        totalBytes: { type: integer, format: int64, nullable: true }
        problems:
          type: array
          description: What the alert emails (HP_ALERT_EMAIL) report now; empty when all is well.
          items: { type: string }
    ServerProcess:
      type: object
      required: [name, state, version, startedAt, seenAt]
      properties:
        name: { type: string, enum: [worker, ai-worker] }
        state:
          type: string
          enum: [running, stopped, old_version, never_seen]
          description: >-
            running; stopped (it reported before but not in the last 2 minutes); old_version (running another
            version than the API: restart it after an update); never_seen (it never reported: not set up here).
        version: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        seenAt: { type: string, format: date-time, nullable: true }
    SystemStatus:
      type: object
      required: [jobs, failed, backup, backupAuto, held, heldEveryCompany, restore, paidAi, server]
      properties:
        paidAi: { $ref: '#/components/schemas/PaidAiSwitch' }
        server:
          description: >-
            Checks of the server itself (its workers, files folder and disk, and what the alert emails
            would report); only for the agency that runs the server (heldEveryCompany), null for others.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ServerChecks' }]
        held:
          type: array
          description: >-
            Jobs a restore held because they act outside HyPlug (emails, calendar updates, webhooks,
            automations...) or ask a paid AI: they run only once released (oldest first, at most 200).
            The company's own; every company's for the agency that runs the server (heldEveryCompany).
          items: { $ref: '#/components/schemas/HeldJob' }
        heldEveryCompany:
          type: boolean
          description: >-
            The person runs the server (an owner or admin of HP_BACKUP_TENANT's agency, or of the only one):
            held lists every company's held jobs, and releasing or cancelling them all acts on every company.
        restore:
          description: >-
            The server's last restore; null when it was never restored. Other companies than the one that
            runs the server see it only while some of their own jobs are held, and only that.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RestoreInfo' }]
        backupAuto: { type: boolean, description: "The nightly backup is on (Settings > Backups): off, an old last backup is expected." }
        jobs:
          type: array
          description: The company's background jobs by kind, kinds with none left out.
          items: { $ref: '#/components/schemas/JobKindStatus' }
        failed:
          type: array
          description: Jobs that failed for good in the last 30 days, newest first (at most 50).
          items: { $ref: '#/components/schemas/FailedJob' }
        backup:
          description: The server's last backup; null when none was ever made.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BackupStatus' }]
    PaidAiSwitch:
      type: object
      required: [paused, reason, changedAt, pausedByServer, canChange]
      properties:
        paused: { type: boolean, description: "Paid AI is paused on the server (this switch, or HP_AI_PAID=off)." }
        reason: { type: string, nullable: true }
        changedAt: { type: string, format: date-time, nullable: true }
        pausedByServer: { type: boolean, description: "HP_AI_PAID=off: paused whatever the switch says." }
        canChange: { type: boolean, description: "The person may change it (an owner of the agency that runs the server)." }
    HeldJob:
      type: object
      required: [id, company, kind, attempts, createdAt, heldAt, runAfter]
      properties:
        id: { type: string }
        company: { type: string, nullable: true, description: "The company's name, in the list of every company's (heldEveryCompany); null otherwise." }
        kind: { type: string, description: "e.g. email.send" }
        attempts: { type: integer, description: "Tries before it was held." }
        createdAt: { type: string, format: date-time, description: "When it was queued (before the backup was made)." }
        heldAt: { type: string, format: date-time, nullable: true }
        runAfter: { type: string, format: date-time, description: "When it was due; released, one due later still waits for its time." }
    RestoreInfo:
      type: object
      required: [everyCompany, backupName, restoredAt, fromAnotherServer, held, resumed, releasedAt]
      properties:
        everyCompany:
          type: boolean
          description: >-
            The restore as the agency that runs the server sees it (every company's count, the backup's name).
            false: only that some of this company's jobs are held after a restore of the server, and how many.
        backupName: { type: string, nullable: true, description: Null unless everyCompany. }
        restoredAt: { type: string, format: date-time }
        fromAnotherServer: { type: boolean, nullable: true, description: "The backup was made on another database server (or is too old to say); null unless everyCompany." }
        held: { type: integer, description: "Jobs the restore held in every company (everyCompany), or this company's still held." }
        resumed: { type: boolean, description: "Restored with -resume-outbound (no outbound job held); false unless everyCompany." }
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the last held job was released or cancelled (everyCompany); null while some wait (and for
            other companies). Alert emails wait while a restore from another server is unsettled, 72 hours at most.
    JobKindStatus:
      type: object
      required: [kind, waiting, running, retrying, failed, oldestWaitingSince]
      properties:
        kind: { type: string, description: "e.g. email.send" }
        waiting: { type: integer, description: Not started yet. }
        running: { type: integer }
        retrying: { type: integer, description: Failed at least once; tried again later. }
        failed: { type: integer, description: Failed for good in the last 30 days. }
        oldestWaitingSince: { type: string, format: date-time, nullable: true, description: When the longest-waiting one was queued. }
    BackgroundJobEndedJob:
      type: object
      additionalProperties: false
      required: [jobId, kind]
      properties:
        jobId: { type: string, description: The AI-queue job that failed for good (it keeps its payload until pruned). }
        kind: { type: string, description: Its kind. }
    FailedJob:
      type: object
      required: [id, kind, attempts, error, failedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        attempts: { type: integer }
        error: { type: string, description: The last attempt's error. }
        failedAt: { type: string, format: date-time }
    BackupStatus:
      type: object
      required: [name, startedAt, finishedAt, status, sizeBytes, error, offsiteStatus, offsiteAt, offsiteError]
      properties:
        offsiteStatus:
          type: string
          nullable: true
          enum: [done, failed, "off"]
          description: "Its copy off the server (HP_OFFSITE_*): done, failed, off (no off-site storage set up), or null (not tried yet)."
        offsiteAt: { type: string, format: date-time, nullable: true, description: When the off-site copy finished or failed. }
        offsiteError: { type: string, nullable: true, description: Why the off-site copy failed. }
        name: { type: string, description: "The backup's folder, e.g. hiringplug-20261107-020000." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, done, failed] }
        sizeBytes: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true }
    Backups:
      type: object
      required: [available, auto, serviceRunning, serviceSeenAt, requestedAt, last, backups, totalBytes]
      properties:
        serviceRunning: { type: boolean, description: "The backup service checked in within the last two minutes, by the server's clock (it does every 30 seconds, also while making a backup)." }
        available: { type: boolean, description: "False for an agency that does not run the server, or when this server keeps no backups (HP_BACKUP_DIR unset)." }
        auto: { type: boolean, description: The nightly backup is on. }
        serviceSeenAt: { type: string, format: date-time, nullable: true, description: When the backup service last checked in (it does every 30 seconds while running). }
        requestedAt: { type: string, format: date-time, nullable: true, description: A backup asked for with "Back up now" and not made yet. }
        last:
          description: The latest backup run (it may have failed); null before the first.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BackupStatus' }]
        backups:
          type: array
          description: The backups on the server, newest first.
          items: { $ref: '#/components/schemas/BackupFile' }
        totalBytes: { type: integer, format: int64, description: "The disk space all of them take (a file unchanged between backups is counted once)." }
    BackupFile:
      type: object
      required: [name, createdAt, sizeBytes, files]
      properties:
        name: { type: string, description: "e.g. hiringplug-20261107-020000" }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64, description: The download's size. }
        files: { type: integer, description: "How many uploaded files (CVs, documents and the like) it holds." }
    BackupDownloadLink:
      type: object
      required: [url, fileName, sizeBytes, expiresAt]
      properties:
        url: { type: string, description: "A path on this server, e.g. /v1/backup-downloads/hiringplug-20261107-020000?token=…" }
        fileName: { type: string, description: "e.g. hiringplug-20261107-020000.tar" }
        sizeBytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
    EmailSalaryVisibility:
      type: string
      description: >
        Who sees a sent email that shows salary: salary_roles = only roles
        that may see salaries (the default); everyone = everyone who may read
        emails. Either way only senders who may see salaries can fill salary
        fields.
      enum: [salary_roles, everyone]
    Policies:
      type: object
      additionalProperties: false
      required: [emailSalaryVisibility]
      properties:
        emailSalaryVisibility: { $ref: '#/components/schemas/EmailSalaryVisibility' }
    FieldListName:
      type: string
      description: >
        candidate_source (a candidate's source), notice_period (keys like
        1_month), industry (candidates and companies), work_type and
        work_arrangement (jobs and ads; fixed), screening_call and
        reference_check (what to ask on those calls, in order: each label is
        written before its answer in the call's note, e.g. "RFL: better
        prospects"; screening starts with RFL and LF, as notice period and
        salaries have their own fields on the call), company_benefits and
        pre_offer_process (the template for a client's benefits and its steps
        before an offer, on the company page; each item may carry a hint),
        company_category (a company's category, e.g. Signed client or VIP
        client, each with its colour), contact_role (what a contact does in
        hiring, e.g. Hiring manager or HR, each with its colour),
        specialization, it_skill and certification (the choices for a
        candidate's specialization, skills and certifications; stored as
        their words, like industries), claim_receipt_type (what a receipt
        is for, e.g. Grab fare, food, drinks: read from receipts, each with
        its colour) and claim_type (what an expense claim is, e.g. travel or
        client entertainment).
      enum: [candidate_source, notice_period, industry, work_type, work_arrangement, screening_call, reference_check, company_benefits, pre_offer_process, company_category, contact_role, specialization, it_skill, certification, claim_receipt_type, claim_type]
    FieldListKind:
      type: string
      description: open = options can be added and removed; fixed = rename, reorder and hide only.
      enum: [open, fixed]
    FieldOption:
      type: object
      required: [key, label, hint, color, hidden, builtIn]
      properties:
        key: { type: string, description: "What is stored (for notice periods: number_unit, e.g. 2_week)." }
        label: { type: string }
        hint: { type: string, nullable: true, description: "What to write for it (lists with hints only)." }
        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', description: "Its colour, e.g. #16a34a (lists with colours only)." }
        hidden: { type: boolean, description: Not offered for new choices; records that have it keep it. }
        builtIn: { type: boolean, description: "Comes with the app: hide it instead of removing it." }
    FieldList:
      type: object
      required: [name, label, kind, hints, colors, options]
      properties:
        name: { $ref: '#/components/schemas/FieldListName' }
        label: { type: string }
        kind: { $ref: '#/components/schemas/FieldListKind' }
        hints: { type: boolean, description: "Its options carry a hint (what to write)." }
        colors: { type: boolean, description: "Its options carry a colour." }
        options:
          type: array
          items: { $ref: '#/components/schemas/FieldOption' }
    FieldOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        key: { type: string, maxLength: 100, description: "Omit for a new option (made from the label); notice periods need number_unit." }
        label: { type: string, minLength: 1, maxLength: 100 }
        hint: { type: string, maxLength: 300, description: "For lists with hints; ignored elsewhere." }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: "For lists with colours; ignored elsewhere." }
        hidden: { type: boolean }
    FieldListInput:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FieldOptionInput' }
    FieldForm:
      type: string
      enum: [candidate, job]
    MandatoryField:
      type: object
      required: [form, field, label, mandatory, alwaysRequired]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, description: "The field's name in the API, e.g. noticePeriod." }
        label: { type: string }
        mandatory: { type: boolean }
        alwaysRequired: { type: boolean, description: "Required by the app itself (e.g. a candidate's first name); cannot be turned off." }
    MandatoryFieldInput:
      type: object
      additionalProperties: false
      required: [form, field, mandatory]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, maxLength: 50 }
        mandatory: { type: boolean }
    MandatoryFieldsInput:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MandatoryFieldInput' }
    FieldSettings:
      type: object
      required: [lists, mandatory]
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/FieldList' }
        mandatory:
          type: array
          items: { $ref: '#/components/schemas/MandatoryField' }

    SalaryCalculationRules:
      type: object
      additionalProperties: false
      required: [allowances, bonus, bonusOnAllowances, cents]
      properties:
        emailSalaryDisplay:
          type: string
          enum: [monthly, breakdown]
          description: Current salary presentation in emails only; omitted defaults to monthly.
        allowances: { type: boolean }
        bonus: { type: boolean }
        bonusOnAllowances: { type: boolean }
        cents: { type: boolean }
