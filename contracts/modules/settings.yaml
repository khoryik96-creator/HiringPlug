# Module contract: settings (each company's own dropdown options, and which
# form fields are mandatory).
# See contracts/README.md for the format.
x-module:
  name: settings
  description: >
    Main settings. Dropdown lists a company can change: open lists (candidate
    source, notice period, industry) take new options; fixed lists (work type,
    work arrangement) can be renamed, reordered and hidden only, because
    other systems (job boards, Google for Jobs) need their values. Fields a
    company makes mandatory must be filled in when a person adds a record, and
    cannot be emptied later.
  permissions:
    settings:read:
      description: See the company's dropdown options and mandatory fields (every form needs them).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    settings:manage:
      description: Change dropdown options and mandatory fields.
      roles: [owner, admin]
    settings.backups:manage:
      description: >
        See, make, download and delete backups of the whole server, and turn
        the nightly backup on or off. Only for the agency that runs the server
        (a backup holds every agency's data on it).
      roles: [owner]
  errorCodes: {}
  jobs: {}

paths:
  /v1/settings/salary-calculation:
    get:
      operationId: getSalaryCalculationRules
      tags: [settings]
      summary: Fixed monthly salary calculation rules
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putSalaryCalculationRules
      tags: [settings]
      summary: Choose the company's fixed monthly salary formula
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryCalculationRules' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields:
    get:
      operationId: getFieldSettings
      tags: [settings]
      summary: The company's dropdown lists and mandatory fields
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/lists/{fieldList}:
    parameters:
      - name: fieldList
        in: path
        required: true
        schema: { $ref: '#/components/schemas/FieldListName' }
    put:
      operationId: putFieldList
      tags: [settings]
      summary: Replace a dropdown's options (in the order given)
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldListInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/mandatory:
    put:
      operationId: putMandatoryFields
      tags: [settings]
      summary: Choose which fields are mandatory
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MandatoryFieldsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/policies:
    get:
      operationId: getPolicies
      tags: [settings]
      summary: The company's choices on how the app treats sensitive information
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putPolicies
      tags: [settings]
      summary: Change those choices
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policies' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system:
    get:
      operationId: getSystemStatus
      tags: [settings]
      summary: The company's background jobs (waiting, failed) and the server's last backup
      x-permission: settings:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system/jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$' }
    post:
      operationId: retryBackgroundJob
      tags: [settings]
      summary: Try a job that failed for good again, from its first attempt
      x-permission: settings:manage
      responses:
        '200':
          description: Queued again; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/backups:
    get:
      operationId: getBackups
      tags: [settings]
      summary: The server's backups (with sizes), the nightly backup switch and the backup service's state
      description: >
        Only the agency that runs the server sees them (HP_BACKUP_TENANT, or
        the only agency when there is just one); for any other, `available`
        is false and nothing else is filled in.
      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/auto:
    put:
      operationId: setAutoBackup
      tags: [settings]
      summary: Turn the nightly backup on or off
      x-permission: settings.backups:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auto]
              properties:
                auto: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/run:
    post:
      operationId: requestBackup
      tags: [settings]
      summary: Make a backup now (the backup service makes it within a minute)
      x-permission: settings.backups:manage
      responses:
        '202':
          description: Asked for
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/backups/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    delete:
      operationId: deleteBackup
      tags: [settings]
      summary: Delete one backup from the server
      x-permission: settings.backups:manage
      responses:
        '200':
          description: Deleted; the backups left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/settings/backups/{backupName}/link:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    post:
      operationId: createBackupDownloadLink
      tags: [settings]
      summary: A download link for one backup, valid for 10 minutes
      description: >
        The browser saves from this link where the person chooses, without
        loading a large backup into memory. The link names one backup and
        stops working after 10 minutes (a download already going finishes).
      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupDownloadLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/backup-downloads/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    get:
      operationId: downloadBackup
      tags: [settings]
      summary: One backup as a single .tar file (from a link made by createBackupDownloadLink)
      description: >
        The backup's folder (database.dump, files.tar.gz, manifest.json) in
        one .tar file; unpack it to get the folder back. Needs the link's
        `token` (random, kept by the server until it expires), not a sign-in.
      x-permission: public
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '200':
          description: The backup
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    BackupNamePath:
      name: backupName
      in: path
      required: true
      schema: { type: string, pattern: '^hiringplug-[0-9]{8}-[0-9]{6}$' }
  schemas:
    SystemStatus:
      type: object
      required: [jobs, failed, backup, backupAuto]
      properties:
        backupAuto: { type: boolean, description: "The nightly backup is on (Settings > Backups): off, an old last backup is expected." }
        jobs:
          type: array
          description: The company's background jobs by kind, kinds with none left out.
          items: { $ref: '#/components/schemas/JobKindStatus' }
        failed:
          type: array
          description: Jobs that failed for good in the last 30 days, newest first (at most 50).
          items: { $ref: '#/components/schemas/FailedJob' }
        backup:
          description: The server's last backup; null when none was ever made.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BackupStatus' }]
    JobKindStatus:
      type: object
      required: [kind, waiting, running, retrying, failed, oldestWaitingSince]
      properties:
        kind: { type: string, description: "e.g. email.send" }
        waiting: { type: integer, description: Not started yet. }
        running: { type: integer }
        retrying: { type: integer, description: Failed at least once; tried again later. }
        failed: { type: integer, description: Failed for good in the last 30 days. }
        oldestWaitingSince: { type: string, format: date-time, nullable: true, description: When the longest-waiting one was queued. }
    FailedJob:
      type: object
      required: [id, kind, attempts, error, failedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        attempts: { type: integer }
        error: { type: string, description: The last attempt's error. }
        failedAt: { type: string, format: date-time }
    BackupStatus:
      type: object
      required: [name, startedAt, finishedAt, status, sizeBytes, error]
      properties:
        name: { type: string, description: "The backup's folder, e.g. hiringplug-20261107-020000." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, done, failed] }
        sizeBytes: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true }
    Backups:
      type: object
      required: [available, auto, serviceRunning, serviceSeenAt, requestedAt, last, backups, totalBytes]
      properties:
        serviceRunning: { type: boolean, description: "The backup service checked in within the last two minutes, by the server's clock (it does every 30 seconds, also while making a backup)." }
        available: { type: boolean, description: "False for an agency that does not run the server, or when this server keeps no backups (HP_BACKUP_DIR unset)." }
        auto: { type: boolean, description: The nightly backup is on. }
        serviceSeenAt: { type: string, format: date-time, nullable: true, description: When the backup service last checked in (it does every 30 seconds while running). }
        requestedAt: { type: string, format: date-time, nullable: true, description: A backup asked for with "Back up now" and not made yet. }
        last:
          description: The latest backup run (it may have failed); null before the first.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BackupStatus' }]
        backups:
          type: array
          description: The backups on the server, newest first.
          items: { $ref: '#/components/schemas/BackupFile' }
        totalBytes: { type: integer, format: int64, description: The space all of them take. }
    BackupFile:
      type: object
      required: [name, createdAt, sizeBytes, files]
      properties:
        name: { type: string, description: "e.g. hiringplug-20261107-020000" }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64, description: The download's size. }
        files: { type: integer, description: "How many uploaded files (CVs, documents and the like) it holds." }
    BackupDownloadLink:
      type: object
      required: [url, fileName, sizeBytes, expiresAt]
      properties:
        url: { type: string, description: "A path on this server, e.g. /v1/backup-downloads/hiringplug-20261107-020000?token=…" }
        fileName: { type: string, description: "e.g. hiringplug-20261107-020000.tar" }
        sizeBytes: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
    EmailSalaryVisibility:
      type: string
      description: >
        Who sees a sent email that shows salary: salary_roles = only roles
        that may see salaries (the default); everyone = everyone who may read
        emails. Either way only senders who may see salaries can fill salary
        fields.
      enum: [salary_roles, everyone]
    Policies:
      type: object
      additionalProperties: false
      required: [emailSalaryVisibility]
      properties:
        emailSalaryVisibility: { $ref: '#/components/schemas/EmailSalaryVisibility' }
    FieldListName:
      type: string
      description: >
        candidate_source (a candidate's source), notice_period (keys like
        1_month), industry (candidates and companies), work_type and
        work_arrangement (jobs and ads; fixed), screening_call and
        reference_check (what to ask on those calls, in order: each label is
        written before its answer in the call's note, e.g. "RFL: better
        prospects"; screening starts with RFL and LF, as notice period and
        salaries have their own fields on the call), company_benefits and
        pre_offer_process (the template for a client's benefits and its steps
        before an offer, on the company page; each item may carry a hint),
        company_category (a company's category, e.g. Signed client or VIP
        client, each with its colour), contact_role (what a contact does in
        hiring, e.g. Hiring manager or HR, each with its colour).
      enum: [candidate_source, notice_period, industry, work_type, work_arrangement, screening_call, reference_check, company_benefits, pre_offer_process, company_category, contact_role]
    FieldListKind:
      type: string
      description: open = options can be added and removed; fixed = rename, reorder and hide only.
      enum: [open, fixed]
    FieldOption:
      type: object
      required: [key, label, hint, color, hidden, builtIn]
      properties:
        key: { type: string, description: "What is stored (for notice periods: number_unit, e.g. 2_week)." }
        label: { type: string }
        hint: { type: string, nullable: true, description: "What to write for it (lists with hints only)." }
        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', description: "Its colour, e.g. #16a34a (lists with colours only)." }
        hidden: { type: boolean, description: Not offered for new choices; records that have it keep it. }
        builtIn: { type: boolean, description: "Comes with the app: hide it instead of removing it." }
    FieldList:
      type: object
      required: [name, label, kind, hints, colors, options]
      properties:
        name: { $ref: '#/components/schemas/FieldListName' }
        label: { type: string }
        kind: { $ref: '#/components/schemas/FieldListKind' }
        hints: { type: boolean, description: "Its options carry a hint (what to write)." }
        colors: { type: boolean, description: "Its options carry a colour." }
        options:
          type: array
          items: { $ref: '#/components/schemas/FieldOption' }
    FieldOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        key: { type: string, maxLength: 100, description: "Omit for a new option (made from the label); notice periods need number_unit." }
        label: { type: string, minLength: 1, maxLength: 100 }
        hint: { type: string, maxLength: 300, description: "For lists with hints; ignored elsewhere." }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: "For lists with colours; ignored elsewhere." }
        hidden: { type: boolean }
    FieldListInput:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FieldOptionInput' }
    FieldForm:
      type: string
      enum: [candidate, job]
    MandatoryField:
      type: object
      required: [form, field, label, mandatory, alwaysRequired]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, description: "The field's name in the API, e.g. noticePeriod." }
        label: { type: string }
        mandatory: { type: boolean }
        alwaysRequired: { type: boolean, description: "Required by the app itself (e.g. a candidate's first name); cannot be turned off." }
    MandatoryFieldInput:
      type: object
      additionalProperties: false
      required: [form, field, mandatory]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, maxLength: 50 }
        mandatory: { type: boolean }
    MandatoryFieldsInput:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MandatoryFieldInput' }
    FieldSettings:
      type: object
      required: [lists, mandatory]
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/FieldList' }
        mandatory:
          type: array
          items: { $ref: '#/components/schemas/MandatoryField' }

    SalaryCalculationRules:
      type: object
      additionalProperties: false
      required: [allowances, bonus, bonusOnAllowances, cents]
      properties:
        emailSalaryDisplay:
          type: string
          enum: [monthly, breakdown]
          description: Current salary presentation in emails only; omitted defaults to monthly.
        allowances: { type: boolean }
        bonus: { type: boolean }
        bonusOnAllowances: { type: boolean }
        cents: { type: boolean }
