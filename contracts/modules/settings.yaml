# Module contract: settings (each company's own dropdown options, and which
# form fields are mandatory).
# See contracts/README.md for the format.
x-module:
  name: settings
  description: >
    Main settings. Dropdown lists a company can change: open lists (candidate
    source, notice period, industry) take new options; fixed lists (work type,
    work arrangement) can be renamed, reordered and hidden only, because
    other systems (job boards, Google for Jobs) need their values. Fields a
    company makes mandatory must be filled in when a person adds a record, and
    cannot be emptied later.
  permissions:
    settings:read:
      description: See the company's dropdown options and mandatory fields (every form needs them).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    settings:manage:
      description: Change dropdown options and mandatory fields.
      roles: [owner, admin]
  errorCodes: {}
  jobs: {}

paths:
  /v1/settings/fields:
    get:
      operationId: getFieldSettings
      tags: [settings]
      summary: The company's dropdown lists and mandatory fields
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/lists/{fieldList}:
    parameters:
      - name: fieldList
        in: path
        required: true
        schema: { $ref: '#/components/schemas/FieldListName' }
    put:
      operationId: putFieldList
      tags: [settings]
      summary: Replace a dropdown's options (in the order given)
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldListInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/fields/mandatory:
    put:
      operationId: putMandatoryFields
      tags: [settings]
      summary: Choose which fields are mandatory
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MandatoryFieldsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/policies:
    get:
      operationId: getPolicies
      tags: [settings]
      summary: The company's choices on how the app treats sensitive information
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putPolicies
      tags: [settings]
      summary: Change those choices
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policies' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policies' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system:
    get:
      operationId: getSystemStatus
      tags: [settings]
      summary: The company's background jobs (waiting, failed) and the server's last backup
      x-permission: settings:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/system/jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$' }
    post:
      operationId: retryBackgroundJob
      tags: [settings]
      summary: Try a job that failed for good again, from its first attempt
      x-permission: settings:manage
      responses:
        '200':
          description: Queued again; the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    SystemStatus:
      type: object
      required: [jobs, failed, backup]
      properties:
        jobs:
          type: array
          description: The company's background jobs by kind, kinds with none left out.
          items: { $ref: '#/components/schemas/JobKindStatus' }
        failed:
          type: array
          description: Jobs that failed for good in the last 30 days, newest first (at most 50).
          items: { $ref: '#/components/schemas/FailedJob' }
        backup:
          description: The server's last backup; null when none was ever made.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/BackupStatus' }]
    JobKindStatus:
      type: object
      required: [kind, waiting, running, retrying, failed, oldestWaitingSince]
      properties:
        kind: { type: string, description: "e.g. email.send" }
        waiting: { type: integer, description: Not started yet. }
        running: { type: integer }
        retrying: { type: integer, description: Failed at least once; tried again later. }
        failed: { type: integer, description: Failed for good in the last 30 days. }
        oldestWaitingSince: { type: string, format: date-time, nullable: true, description: When the longest-waiting one was queued. }
    FailedJob:
      type: object
      required: [id, kind, attempts, error, failedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        attempts: { type: integer }
        error: { type: string, description: The last attempt's error. }
        failedAt: { type: string, format: date-time }
    BackupStatus:
      type: object
      required: [name, startedAt, finishedAt, status, sizeBytes, error]
      properties:
        name: { type: string, description: "The backup's folder, e.g. hiringplug-20261107-020000." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, done, failed] }
        sizeBytes: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true }
    EmailSalaryVisibility:
      type: string
      description: >
        Who sees a sent email that shows salary: salary_roles = only roles
        that may see salaries (the default); everyone = everyone who may read
        emails. Either way only senders who may see salaries can fill salary
        fields.
      enum: [salary_roles, everyone]
    Policies:
      type: object
      additionalProperties: false
      required: [emailSalaryVisibility]
      properties:
        emailSalaryVisibility: { $ref: '#/components/schemas/EmailSalaryVisibility' }
    FieldListName:
      type: string
      description: >
        candidate_source (a candidate's source), notice_period (keys like
        1_month), industry (candidates and companies), work_type and
        work_arrangement (jobs and ads; fixed), screening_call and
        reference_check (what to ask on those calls, in order: each label is
        written before its answer in the call's note, e.g. "RFL: better
        prospects"; screening starts with RFL and LF, as notice period and
        salaries have their own fields on the call), company_benefits and
        pre_offer_process (the template for a client's benefits and its steps
        before an offer, on the company page; each item may carry a hint).
      enum: [candidate_source, notice_period, industry, work_type, work_arrangement, screening_call, reference_check, company_benefits, pre_offer_process]
    FieldListKind:
      type: string
      description: open = options can be added and removed; fixed = rename, reorder and hide only.
      enum: [open, fixed]
    FieldOption:
      type: object
      required: [key, label, hint, hidden, builtIn]
      properties:
        key: { type: string, description: "What is stored (for notice periods: number_unit, e.g. 2_week)." }
        label: { type: string }
        hint: { type: string, nullable: true, description: "What to write for it (lists with hints only)." }
        hidden: { type: boolean, description: Not offered for new choices; records that have it keep it. }
        builtIn: { type: boolean, description: "Comes with the app: hide it instead of removing it." }
    FieldList:
      type: object
      required: [name, label, kind, hints, options]
      properties:
        name: { $ref: '#/components/schemas/FieldListName' }
        label: { type: string }
        kind: { $ref: '#/components/schemas/FieldListKind' }
        hints: { type: boolean, description: "Its options carry a hint (what to write)." }
        options:
          type: array
          items: { $ref: '#/components/schemas/FieldOption' }
    FieldOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        key: { type: string, maxLength: 100, description: "Omit for a new option (made from the label); notice periods need number_unit." }
        label: { type: string, minLength: 1, maxLength: 100 }
        hint: { type: string, maxLength: 300, description: "For lists with hints; ignored elsewhere." }
        hidden: { type: boolean }
    FieldListInput:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FieldOptionInput' }
    FieldForm:
      type: string
      enum: [candidate, job]
    MandatoryField:
      type: object
      required: [form, field, label, mandatory, alwaysRequired]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, description: "The field's name in the API, e.g. noticePeriod." }
        label: { type: string }
        mandatory: { type: boolean }
        alwaysRequired: { type: boolean, description: "Required by the app itself (e.g. a candidate's first name); cannot be turned off." }
    MandatoryFieldInput:
      type: object
      additionalProperties: false
      required: [form, field, mandatory]
      properties:
        form: { $ref: '#/components/schemas/FieldForm' }
        field: { type: string, maxLength: 50 }
        mandatory: { type: boolean }
    MandatoryFieldsInput:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MandatoryFieldInput' }
    FieldSettings:
      type: object
      required: [lists, mandatory]
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/FieldList' }
        mandatory:
          type: array
          items: { $ref: '#/components/schemas/MandatoryField' }
