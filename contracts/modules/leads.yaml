# Module contract: leads (companies that are hiring, as business development
# leads: from public job board feeds, careers pages, or ads saved by hand).
# See contracts/README.md for the format.
x-module:
  name: leads
  description: >
    Hiring signals as leads. A source is a company's public job board feed
    (Greenhouse, Lever, Ashby, SmartRecruiters) or a careers page with job
    markup (schema.org JobPosting, as for Google for Jobs; robots.txt is
    respected). Sources are checked every day: each opening becomes a lead,
    and one no longer listed is marked closed. Ads can also be saved by hand.
    No scraping of sites whose terms forbid it (LinkedIn, JobStreet).
  permissions:
    leads:read:
      description: View hiring leads and their sources.
      roles: [owner, admin, recruiter, sourcer]
    leads:manage:
      description: Add and change sources and leads.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes: {}
  jobs:
    lead_source.check:
      queue: core
      payload: LeadSourceCheckJob
      description: Fetch a source's openings and update its leads (Go worker); queues the next check a day later.

paths:
  /v1/lead-sources:
    get:
      operationId: listLeadSources
      tags: [leads]
      summary: Where leads come from, and how their last check went
      x-permission: leads:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadSourceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createLeadSource
      tags: [leads]
      summary: Add a source (it is checked straight away, then every day)
      x-permission: leads:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadSourceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadSource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/lead-sources/{leadSourceId}:
    parameters:
      - $ref: '#/components/parameters/LeadSourceIdPath'
    patch:
      operationId: updateLeadSource
      tags: [leads]
      summary: Rename a source, link it to a company, or turn its checks off or on
      x-permission: leads:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadSourceUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadSource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteLeadSource
      tags: [leads]
      summary: Remove a source (its leads stay)
      x-permission: leads:manage
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/lead-sources/{leadSourceId}/checks:
    parameters:
      - $ref: '#/components/parameters/LeadSourceIdPath'
    post:
      operationId: checkLeadSource
      tags: [leads]
      summary: Check a source now
      x-permission: leads:manage
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/job-leads:
    get:
      operationId: listJobLeads
      tags: [leads]
      summary: Hiring leads, newest first
      x-permission: leads:read
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/LeadStatus' } }
        - { name: sourceId, in: query, required: false, schema: { $ref: '#/components/schemas/LeadSourceId' } }
        - { name: open, in: query, required: false, description: Only openings still listed (true) or closed (false)., schema: { type: boolean } }
        - { name: q, in: query, required: false, description: Words in the company or title., schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobLeadList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createJobLead
      tags: [leads]
      summary: Save a job ad you found as a lead
      x-permission: leads:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobLeadInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobLead' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/job-leads/{jobLeadId}:
    parameters:
      - $ref: '#/components/parameters/JobLeadIdPath'
    patch:
      operationId: updateJobLead
      tags: [leads]
      summary: Change a lead's status, notes or company
      x-permission: leads:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobLeadUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobLead' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    LeadSourceIdPath:
      name: leadSourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LeadSourceId' }
    JobLeadIdPath:
      name: jobLeadId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobLeadId' }

  schemas:
    LeadSourceId:
      type: string
      pattern: '^lsrc_[0-9a-hjkmnp-tv-z]{26}$'
      example: lsrc_01jbz6w0m0k8q9x2r3s4t5v6w7
    JobLeadId:
      type: string
      pattern: '^lead_[0-9a-hjkmnp-tv-z]{26}$'
      example: lead_01jbz6w0m0k8q9x2r3s4t5v6w7
    LeadSourceKind:
      type: string
      description: >
        greenhouse, lever, ashby, smartrecruiters = the company's public job
        board on that system (identifier: its board name, e.g. "acme" from
        boards.greenhouse.io/acme); careers_page = a careers page address
        whose jobs carry schema.org JobPosting markup.
      enum: [greenhouse, lever, ashby, smartrecruiters, careers_page]
    LeadStatus:
      type: string
      description: new = not looked at; contacted = the company was approached; client = it became a client; ignored = not worth pursuing.
      enum: [new, contacted, client, ignored]
    LeadSource:
      type: object
      required: [id, version, kind, identifier, name, companyId, active, openLeads, lastCheckedAt, lastError, nextCheckAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/LeadSourceId' }
        version: { type: integer }
        kind: { $ref: '#/components/schemas/LeadSourceKind' }
        identifier: { type: string }
        name: { type: string, description: "The company's name, as shown on its leads." }
        companyId:
          allOf: [{ $ref: '#/components/schemas/CompanyId' }]
          nullable: true
        active: { type: boolean }
        openLeads: { type: integer, description: Openings listed at the last check. }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true, description: Why the last check failed (null when it worked). }
        nextCheckAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    LeadSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeadSource' }
    LeadSourceInput:
      type: object
      additionalProperties: false
      required: [kind, identifier]
      properties:
        kind: { $ref: '#/components/schemas/LeadSourceKind' }
        identifier: { type: string, minLength: 1, maxLength: 500, description: "The board name, or the careers page address." }
        name: { type: string, maxLength: 200, description: "The company's name (required for job board feeds; a careers page's markup may name it)." }
        companyId: { $ref: '#/components/schemas/CompanyId' }
    LeadSourceUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
        companyId:
          allOf: [{ $ref: '#/components/schemas/CompanyId' }]
          nullable: true
        active: { type: boolean }
    JobLead:
      type: object
      required: [id, version, sourceId, sourceKind, companyName, companyId, title, location, url, postedAt, firstSeenAt, lastSeenAt, closedAt, status, notes]
      properties:
        id: { $ref: '#/components/schemas/JobLeadId' }
        version: { type: integer }
        sourceId:
          description: null for an ad saved by hand.
          allOf: [{ $ref: '#/components/schemas/LeadSourceId' }]
          nullable: true
        sourceKind:
          allOf: [{ $ref: '#/components/schemas/LeadSourceKind' }]
          nullable: true
        companyName: { type: string }
        companyId:
          allOf: [{ $ref: '#/components/schemas/CompanyId' }]
          nullable: true
        title: { type: string }
        location: { type: string, nullable: true }
        url: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true, description: When the opening stopped being listed. }
        status: { $ref: '#/components/schemas/LeadStatus' }
        notes: { type: string, nullable: true }
    JobLeadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobLead' }
    JobLeadInput:
      type: object
      additionalProperties: false
      required: [companyName, title]
      properties:
        companyName: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, maxLength: 200 }
        url: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 2000 }
        companyId: { $ref: '#/components/schemas/CompanyId' }
    JobLeadUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/LeadStatus' }
        notes: { type: string, maxLength: 2000, nullable: true }
        companyId:
          allOf: [{ $ref: '#/components/schemas/CompanyId' }]
          nullable: true

    # --- Job payloads (messages on the job queue, not HTTP bodies) ---
    LeadSourceCheckJob:
      type: object
      additionalProperties: false
      required: [sourceId, runAt]
      properties:
        sourceId: { $ref: '#/components/schemas/LeadSourceId' }
        runAt: { type: string, format: date-time, description: The check this job is for; an older one (replaced by a "check now") does nothing. }
