# Module contract: jobs (job orders for clients, or requisitions in-house).
# The salary budget is sensitive: its own permissions, and the database
# refuses it to everyone else. See contracts/README.md.
x-module:
  name: jobs
  description: Job orders (agency) or requisitions (in-house), with an optional salary budget.
  permissions:
    jobs:read:
      description: View jobs (the salary budget needs jobs.salary:read).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    jobs:create:
      description: Add jobs.
      roles: [owner, admin, recruiter]
    jobs:update:
      description: Edit jobs and change their status.
      roles: [owner, admin, recruiter]
    jobs.documents:delete:
      description: "Delete the job descriptions kept with a job (give it to the people you trust)."
      roles: [owner, admin]
    jobs.salary:read:
      description: See a job's salary budget.
      sensitive: true
      roles: [owner, admin, recruiter, hiring_manager]
    jobs.salary:update:
      description: Set or change a job's salary budget.
      sensitive: true
      roles: [owner, admin, recruiter]
  errorCodes:
    JOB_AD_BLIND_AI_OFF:
      status: 409
      description: Rewriting a blind ad needs the AI, and no AI provider is set up (or this month's AI allowance is used up).
    JOB_AD_BLIND_TOO_SHORT:
      status: 422
      description: "The ad has too little text to rewrite (CV Studio asks for at least 80 characters of job description)."
    JOB_AD_NOT_PUBLISHABLE:
      status: 422
      description: "The ad cannot be published as it is: the job is not open, the ad has no text, or its closing date has passed. The message says which."
  jobs:
    job.read_jd:
      queue: ai
      payload: JobReadJdJob
      priority: high
      description: Read the text of an uploaded job description (Python AI worker).
    jd.blind:
      queue: ai
      payload: JdBlindJob
      priority: high
      description: "Rewrite an ad as a blind job description CV Studio's way: the AI paraphrases it without the client's identity, then CV Studio's checks (Python AI worker)."
    jd.blinded:
      queue: core
      payload: JdBlindedJob
      priority: high
      description: Save the AI's blind job description as the ad's blind version, or why there is none (Go worker).
    job.jd_read:
      queue: core
      payload: JobJdReadJob
      priority: high
      description: "Save a job description's text and the ad details read from it: title, location, salary... (Go worker)."

paths:
  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List or search jobs, newest first
      x-permission: jobs:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the title, location or client company's name (ignoring case and accents)."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - name: companyId
          in: query
          description: Only this company's jobs.
          schema: { $ref: '#/components/schemas/CompanyId' }
        - name: contactId
          in: query
          description: Only jobs with this hiring contact.
          schema: { $ref: '#/components/schemas/ContactId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/JobOrderId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrderPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createJob
      tags: [jobs]
      summary: Add a job
      description: The salary budget is set separately with PUT /v1/jobs/{jobId}/salary.
      x-permission: jobs:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOrderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      description: >
        `salary` is only included with jobs.salary:read; otherwise it is left
        out and listed in `restrictedFields`.
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Change some fields of a job
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded.
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOrderUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/jobs/{jobId}/ads:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: listJobAds
      tags: [jobs]
      summary: List a job's ads, newest first
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAdList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createJobAd
      tags: [jobs]
      summary: Add an ad for a job (as a draft)
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobAdCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAd' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/job-ads/{adId}/export:
    parameters:
      - $ref: '#/components/parameters/JobAdIdPath'
    get:
      operationId: exportJobAd
      tags: [jobs]
      summary: Download an ad, or its blind version, as a Word file or a PDF
      x-permission: jobs:read
      parameters:
        - { name: version, in: query, required: true, schema: { $ref: '#/components/schemas/JobAdVersion' } }
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/JobAdExportFormat' } }
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/job-ads/{adId}:
    parameters:
      - $ref: '#/components/parameters/JobAdIdPath'
    get:
      operationId: getJobAd
      tags: [jobs]
      summary: Get a job ad
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAd' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateJobAd
      tags: [jobs]
      summary: Change an ad, or publish, unpublish or close it
      description: >
        Only the fields you send change; send `null` to clear one. `version`
        must be the version you loaded. Publishing needs an open job, the ad's
        text, and a closing date that has not passed (JOB_AD_NOT_PUBLISHABLE).
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobAdUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAd' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The ad cannot be published (JOB_AD_NOT_PUBLISHABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{jobId}/salary:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    put:
      operationId: putJobSalary
      tags: [jobs]
      summary: Set a job's salary budget
      description: >
        Replaces the budget; send `range: null` to clear it. Send
        `expectedVersion: 0` the first time, then the `version` you loaded.
      x-permission: jobs.salary:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSalaryUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSalary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/jobs/{jobId}/owner:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    put:
      operationId: setJobOwner
      tags: [jobs]
      summary: Give the job to another recruiter (or to nobody)
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerInput' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/job-ads/{adId}/blind-rewrites:
    parameters:
      - $ref: '#/components/parameters/JobAdIdPath'
    get:
      operationId: listBlindRewrites
      tags: [jobs]
      summary: The latest AI rewrites of an ad's blind version, newest first
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlindRewriteList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: rewriteBlindAd
      tags: [jobs]
      summary: Rewrite the ad's blind version with the AI, CV Studio's way (done in the background)
      description: >
        The AI rewrites the ad as written into a candidate-facing job
        description without the client's identity: names, brands, addresses,
        links and contacts removed, company size and reach described broadly,
        the wording paraphrased (copied wording is retried once), the tech
        stack and requirements kept. When it is done it becomes the ad's
        blind version (as if a person had written it: changes to the ad no
        longer remake it). Its tokens count in the monthly AI allowance.
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlindRewriteInput' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlindRewrite' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BlindAiOff' }
        '422': { $ref: '#/components/responses/BlindTooShort' }

  /v1/jobs/{jobId}/jd-files:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    post:
      operationId: uploadJobDescription
      tags: [jobs]
      summary: Upload the client's job description (PDF, Word or text) to fill in an ad
      description: "Its text is read (a text file at once; PDF and Word in a moment: follow GET /v1/jd-files/{jdFileId}), then the ad's details are read from it: title, location, country, work type and arrangement, salary, closing date and the ad text. Nothing is saved on the job or an ad: the composer puts the details in the ad form."
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdFile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    get:
      operationId: listJobDescriptions
      tags: [jobs]
      summary: The job descriptions kept with a job (uploaded for it, or the one its Add job form was filled in from), newest first
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdFileList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/jd-files:
    post:
      operationId: uploadNewJobDescription
      tags: [jobs]
      summary: Upload the client's job description (PDF, Word or text) to fill in a new job
      description: "As for a job's ads, before the job exists: read it (follow GET /v1/jd-files/{jdFileId}), then the Add job form takes its details. Nothing is saved on a job."
      x-permission: jobs:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdFile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/jd-files/{jdFileId}:
    parameters:
      - name: jdFileId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JdFileId' }
    get:
      operationId: getJobDescriptionFile
      tags: [jobs]
      summary: An uploaded job description, and the ad details read from it once read
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JdFile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteJobDescription
      tags: [jobs]
      summary: Delete an uploaded job description and its file (what was filled in from it stays)
      x-permission: jobs.documents:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/jd-files/{jdFileId}/file:
    parameters:
      - name: jdFileId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JdFileId' }
    get:
      operationId: downloadJobDescription
      tags: [jobs]
      summary: An uploaded job description's file, as uploaded
      x-permission: jobs:read
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    BlindAiOff:
      description: No AI for it (JOB_AD_BLIND_AI_OFF).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BlindTooShort:
      description: Too little text to rewrite (JOB_AD_BLIND_TOO_SHORT).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    JobOrderIdPath:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobOrderId' }
    JobAdIdPath:
      name: adId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobAdId' }

  schemas:
    BlindRewriteId:
      type: string
      pattern: '^jbr_[0-9a-hjkmnp-tv-z]{26}$'
      example: jbr_01jbz6w0m0k8q9x2r3s4t5v6w7
    BlindRewriteTone:
      type: string
      description: "CV Studio's tones: professional (formal, third person), conversational (warm, \"we are looking for\"), concise (direct, bullet-heavy)."
      enum: [professional, conversational, concise]
    BlindRewriteStrength:
      type: string
      description: "How much the wording changes: low (light), medium (balanced), high (bullets may be merged, split or reordered; nothing weakened)."
      enum: [low, medium, high]
    BlindRewriteInput:
      type: object
      additionalProperties: false
      required: [tone, strength]
      properties:
        tone: { $ref: '#/components/schemas/BlindRewriteTone' }
        strength: { $ref: '#/components/schemas/BlindRewriteStrength' }
        removeAlso: { type: string, nullable: true, maxLength: 1000, description: "Anything else to take out (names of products, projects, people), besides the client's name, website and hiring contact." }
        whyJoinUs: { type: string, nullable: true, maxLength: 2000, description: 'Points for "Why join us".' }
        context: { type: string, nullable: true, maxLength: 2000, description: "Anything the AI should know (team, reporting line...)." }
    BlindRewrite:
      type: object
      required: [id, adId, status, tone, strength, error, warnings, retried, model, tokens, createdAt, finishedAt]
      properties:
        id: { $ref: '#/components/schemas/BlindRewriteId' }
        adId: { $ref: '#/components/schemas/JobAdId' }
        status: { type: string, enum: [queued, done, failed], description: "done: it is now the ad's blind version." }
        tone: { $ref: '#/components/schemas/BlindRewriteTone' }
        strength: { $ref: '#/components/schemas/BlindRewriteStrength' }
        error: { type: string, nullable: true, description: "Why there is no rewrite." }
        warnings: { type: array, items: { type: string }, description: "What to check before using it (tech stack terms missing, wording still close to the ad)." }
        retried: { type: boolean, description: "The AI was asked once more because its wording was still too close to the ad." }
        model: { type: string, nullable: true }
        tokens: { type: integer, minimum: 0, description: "AI tokens used (both calls when retried)." }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    BlindRewriteList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BlindRewrite' } }
    JdBlindJob:
      type: object
      additionalProperties: false
      required: [rewriteId, raw, companyName, industry, location, workMode, clientDescription, context, removeAlso, whyJoinUs, tone, strength]
      properties:
        rewriteId: { $ref: '#/components/schemas/BlindRewriteId' }
        raw: { type: string, maxLength: 40000, description: "The ad as written: its title, then its text." }
        companyName: { type: string, description: "The client's name (taken out of the result, and its industry worked out from it)." }
        industry: { type: string, nullable: true }
        location: { type: string, nullable: true, description: "The blind ad's location (without the client's name)." }
        workMode: { type: string, nullable: true, description: "e.g. Hybrid, Remote, On-site." }
        clientDescription: { type: string, nullable: true, description: 'What the blind ad says instead of the client''s name, e.g. "a leading Malaysian bank".' }
        context: { type: string, nullable: true }
        removeAlso: { type: string, nullable: true, description: "Also explicitly remove: the person's own list, the client's website and hiring contact." }
        whyJoinUs: { type: string, nullable: true }
        tone: { $ref: '#/components/schemas/BlindRewriteTone' }
        strength: { $ref: '#/components/schemas/BlindRewriteStrength' }
        ai:
          allOf: [{ $ref: '#/components/schemas/AiAccess' }]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    BlindJd:
      type: object
      additionalProperties: false
      description: "CV Studio's blind job description, after its checks."
      required: [jobTitle, aboutClient, aboutRole, workMode, location, industry, techStack, responsibilities, requirements, niceToHave, whyJoin, altTitles]
      properties:
        jobTitle: { type: string, maxLength: 200 }
        aboutClient: { type: string, maxLength: 4000 }
        aboutRole: { type: string, maxLength: 4000 }
        workMode: { type: string, maxLength: 200 }
        location: { type: string, maxLength: 200 }
        industry: { type: string, maxLength: 200 }
        techStack: { type: array, maxItems: 80, items: { type: string, maxLength: 200 } }
        responsibilities: { type: array, maxItems: 60, items: { type: string, maxLength: 2000 } }
        requirements: { type: array, maxItems: 60, items: { type: string, maxLength: 2000 } }
        niceToHave: { type: array, maxItems: 60, items: { type: string, maxLength: 2000 } }
        whyJoin: { type: array, maxItems: 60, items: { type: string, maxLength: 2000 } }
        altTitles: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
    JdBlindedJob:
      type: object
      additionalProperties: false
      required: [rewriteId, jd, error, warnings, retried, model, inputTokens, outputTokens]
      properties:
        rewriteId: { $ref: '#/components/schemas/BlindRewriteId' }
        jd:
          allOf: [{ $ref: '#/components/schemas/BlindJd' }]
          nullable: true
        error: { type: string, nullable: true, maxLength: 2000 }
        warnings: { type: array, maxItems: 10, items: { type: string, maxLength: 1000 } }
        retried: { type: boolean }
        model: { type: string, nullable: true }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
    JdFileId:
      type: string
      pattern: '^jdf_[0-9a-hjkmnp-tv-z]{26}$'
      example: jdf_01jbz6w0m0k8q9x2r3s4t5v6w7
    JdFileStatus:
      type: string
      enum: [reading, read, failed]
    JdFileList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JdFile' } }
    JdFile:
      type: object
      required: [id, jobId, fileName, contentType, sizeBytes, status, error, details, createdAt]
      properties:
        id: { $ref: '#/components/schemas/JdFileId' }
        contentType: { type: string }
        sizeBytes: { type: integer }
        jobId:
          description: The job it was uploaded for; null for one read before its job was added.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/JobOrderId' }]
        fileName: { type: string }
        status: { $ref: '#/components/schemas/JdFileStatus' }
        error: { type: string, nullable: true, description: "Why it could not be read (a scan with no text, a damaged file...)." }
        details:
          allOf: [{ $ref: '#/components/schemas/JdDetails' }]
          nullable: true
          description: Once read.
        createdAt: { type: string, format: date-time }
    JdDetails:
      type: object
      description: "An ad's details as read from a job description; each is null when the description does not say."
      required: [title, location, country, workType, workArrangement, salaryText, closesOn, description]
      properties:
        title: { type: string, nullable: true }
        location: { type: string, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        salaryText: { type: string, nullable: true, description: "As the description gives it, e.g. \"RM 8,000 - 10,000 per month\"." }
        closesOn: { type: string, format: date, nullable: true }
        description:
          type: string
          description: "The ad text: the description's text, tidied, with its bullet points as lines starting with \"- \"."
    JobReadJdJob:
      type: object
      additionalProperties: false
      required: [jdFileId, downloadUrl, contentType, fileName, sizeBytes]
      properties:
        jdFileId: { $ref: '#/components/schemas/JdFileId' }
        downloadUrl:
          type: string
          description: Short-lived signed URL to download the file from.
        contentType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
    JobJdReadJob:
      type: object
      additionalProperties: false
      required: [jdFileId, status, text, errorMessage]
      properties:
        jdFileId: { $ref: '#/components/schemas/JdFileId' }
        status: { $ref: '#/components/schemas/ExtractionStatus' }
        text:
          type: string
          nullable: true
          pattern: '^[^\x00]*$'
          description: The description's plain text, with NUL characters removed.
        errorMessage: { type: string, nullable: true }
    JobAdId:
      type: string
      pattern: '^ad_[0-9a-hjkmnp-tv-z]{26}$'
      example: ad_01jbz6w0m0k8q9x2r3s4t5v6w7
    JobAdStatus:
      type: string
      description: draft = not shown anywhere; published = advertised; closed = taken down.
      enum: [draft, published, closed]
    JobAd:
      type: object
      required: [id, version, jobId, title, location, country, workType, workArrangement, salaryText, description, closesOn, status, publishedAt,
        blindTitle, blindDescription, blindLocation, blindSalaryText, clientDescription, blindEdited, blindOutdated, publishBlind, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/JobAdId' }
        version: { type: integer }
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        title: { type: string }
        location: { type: string, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        salaryText:
          type: string
          nullable: true
          description: Shown on the ad as written, e.g. "RM 8,000 - 10,000 a month". Separate from the job's private budget.
        description:
          type: string
          nullable: true
          description: The ad's text. Lines starting with "- " are shown as bullet points.
        closesOn: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/JobAdStatus' }
        publishedAt: { type: string, format: date-time, nullable: true }
        blindTitle: { type: string, description: "The blind ad's title: the client is not named." }
        blindDescription:
          type: string
          nullable: true
          description: >
            The blind ad's text: the client's name, website and contacts, and every
            email, phone number and link, replaced (by clientDescription, then "our
            client"). Made from the ad's text unless a person edited it.
        blindLocation: { type: string, nullable: true, description: "The location as the blind ad shows it (the client's name taken out)." }
        blindSalaryText: { type: string, nullable: true, description: The salary line as the blind ad shows it. }
        clientDescription: { type: string, nullable: true, description: 'What the blind ad says instead of the client''s name, e.g. "a leading Malaysian bank".' }
        blindEdited: { type: boolean, description: A person edited the blind text; changes to the ad no longer remake it. }
        blindOutdated: { type: boolean, description: The ad changed after the blind text was edited by a person. }
        publishBlind: { type: boolean, description: The careers page and job feed show the blind version. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobAdList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobAd' }
    JobAdCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, maxLength: 200, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        salaryText: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 20000, nullable: true }
        closesOn: { type: string, format: date, nullable: true }
        clientDescription: { type: string, maxLength: 200, nullable: true }
        publishBlind: { type: boolean }
    JobAdUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, maxLength: 200, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        salaryText: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 20000, nullable: true }
        closesOn: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/JobAdStatus' }
        clientDescription: { type: string, maxLength: 200, nullable: true }
        publishBlind: { type: boolean }
        blindTitle: { type: string, minLength: 1, maxLength: 200, description: Your own blind title (the blind ad stops following the ad). }
        blindDescription: { type: string, maxLength: 20000, nullable: true, description: Your own blind text (likewise). }
        remakeBlind: { type: boolean, description: "true: make the blind ad from the ad again, dropping your own edits." }

    JobAdVersion:
      type: string
      description: original = the ad as written; blind = without the client's identity.
      enum: [original, blind]
    JobAdExportFormat:
      type: string
      enum: [docx, pdf]
    JobOrderId:
      type: string
      pattern: '^jo_[0-9a-hjkmnp-tv-z]{26}$'
      example: jo_01jbz6w0m0k8q9x2r3s4t5v6w7
    JobStatus:
      type: string
      description: open = recruiting; on_hold = paused; filled = all openings filled; closed = cancelled or lost.
      enum: [open, on_hold, filled, closed]
    WorkType:
      type: string
      enum: [full_time, part_time, contract, temporary, internship]
    WorkArrangement:
      type: string
      enum: [onsite, hybrid, remote]
    JobRestrictedField:
      type: string
      enum: [salary]

    JobSalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        min: { $ref: '#/components/schemas/DecimalAmount' }
        max:
          description: Leave empty for a single figure.
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        period: { $ref: '#/components/schemas/PayPeriod' }
    JobSalary:
      type: object
      required: [version, range, updatedAt]
      properties:
        version: { type: integer }
        range:
          allOf: [{ $ref: '#/components/schemas/JobSalaryRange' }]
          nullable: true
        updatedAt: { type: string, format: date-time }
    JobSalaryUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, range]
      properties:
        expectedVersion: { type: integer, minimum: 0, description: '0 if no budget exists yet, otherwise the version you loaded.' }
        range:
          allOf: [{ $ref: '#/components/schemas/JobSalaryRange' }]
          nullable: true

    JobOrder:
      type: object
      required: [id, version, companyId, companyName, contactId, contactName, title, status, location, country, workType, workArrangement, openings, description, intakeDate, ownerId, ownerName, restrictedFields, createdAt, updatedAt]
      properties:
        ownerId:
          description: The recruiter the job belongs to (who added it, unless changed).
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        ownerName: { type: string, nullable: true }
        id: { $ref: '#/components/schemas/JobOrderId' }
        version: { type: integer }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        contactId:
          description: The hiring contact at the company.
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        contactName: { type: string, nullable: true }
        title: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        location: { type: string, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        openings: { type: integer, description: How many people to hire. }
        description: { type: string, nullable: true }
        intakeDate: { type: string, format: date, description: "When the job was officially received (today unless chosen)." }
        salary:
          description: Left out (and listed in restrictedFields) without jobs.salary:read. null means no budget recorded.
          allOf: [{ $ref: '#/components/schemas/JobSalary' }]
          nullable: true
        restrictedFields:
          type: array
          items: { $ref: '#/components/schemas/JobRestrictedField' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobOrderCreate:
      type: object
      additionalProperties: false
      required: [companyId, title]
      properties:
        jdFileId:
          description: 'The job description the form was filled in from (uploaded without a job); it is kept with the new job.'
          allOf: [{ $ref: '#/components/schemas/JdFileId' }]
        companyId: { $ref: '#/components/schemas/CompanyId' }
        contactId:
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/JobStatus' }
        location: { type: string, maxLength: 200, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        openings: { type: integer, minimum: 1, maximum: 999, description: Defaults to 1. }
        description: { type: string, maxLength: 20000, nullable: true }
        intakeDate: { type: string, format: date, description: "When the job was officially received; today if left out." }

    JobOrderUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        contactId:
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/JobStatus' }
        location: { type: string, maxLength: 200, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workType:
          allOf: [{ $ref: '#/components/schemas/WorkType' }]
          nullable: true
        workArrangement:
          allOf: [{ $ref: '#/components/schemas/WorkArrangement' }]
          nullable: true
        openings: { type: integer, minimum: 1, maximum: 999 }
        description: { type: string, maxLength: 20000, nullable: true }
        intakeDate: { type: string, format: date }

    JobOrderSummary:
      type: object
      required: [id, title, companyId, companyName, status, location, openings, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/JobOrderId' }
        title: { type: string }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        location: { type: string, nullable: true }
        openings: { type: integer }
        updatedAt: { type: string, format: date-time }
    JobOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobOrderSummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/JobOrderId' }]
          nullable: true
