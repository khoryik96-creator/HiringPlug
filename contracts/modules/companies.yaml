# Module contract: companies (clients and prospects for agencies; your own
# company's departments for in-house teams). See contracts/README.md.
x-module:
  name: companies
  description: Companies you recruit for or want to win as clients, and their details.
  permissions:
    companies:read:
      description: View companies.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    companies:create:
      description: Add companies.
      roles: [owner, admin, recruiter, sourcer]
    companies:update:
      description: Edit companies.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes:
    COMPANY_DUPLICATE_NAME:
      status: 409
      description: Another company already has this name (ignoring case and accents). `details.existingCompanyId` points to it.
  jobs:
    company.autofill:
      queue: core
      payload: CompanyAutofillJob
      priority: high
      description: Read a company's own website for details to suggest (Go worker).

paths:
  /v1/companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List or search companies, newest first
      x-permission: companies:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name or website (ignoring case and accents); or a phone number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CompanyType' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/CompanyId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCompany
      tags: [companies]
      summary: Add a company
      x-permission: companies:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company
      x-permission: companies:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Change some fields of a company
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded.
      x-permission: companies:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/companies/{companyId}/autofill:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getCompanyAutofill
      tags: [companies]
      summary: Details suggested from the company's website, and how the last reading went
      x-permission: companies:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAutofill' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startCompanyAutofill
      tags: [companies]
      summary: Read the company's website (in the background) for details to suggest
      description: "Needs the company's website. Its own pages only: the home page and its contact page, as robots.txt allows."
      x-permission: companies:update
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAutofill' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/companies/{companyId}/autofill/{suggestionId}:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - { name: suggestionId, in: path, required: true, schema: { $ref: '#/components/schemas/CompanySuggestionId' } }
    post:
      operationId: decideCompanySuggestion
      tags: [companies]
      summary: Accept a suggestion (the company's detail is set) or dismiss it
      x-permission: companies:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestionDecision' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAutofill' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/companies/{companyId}/benefits:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getCompanyBenefits
      tags: [companies]
      summary: A client's benefits and its steps before an offer
      description: >
        As last saved (version 0 and empty lists before the first save). The
        items to fill come from the company_benefits and pre_offer_process
        lists in Settings; a saved item keeps its label even if the list
        changes later.
      x-permission: companies:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyBenefits' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putCompanyBenefits
      tags: [companies]
      summary: Save a client's benefits and pre-offer process (the whole lists, in order)
      description: "`version` must be the version you loaded (0 for the first save)."
      x-permission: companies:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyBenefitsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyBenefits' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/companies/{companyId}/benefits/file:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: exportCompanyBenefits
      tags: [companies]
      summary: Download a client's benefits and pre-offer process as a Word file or a PDF
      x-permission: companies:read
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/CompanyBenefitsFormat' } }
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/companies/{companyId}/terms:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getCompanyTerms
      tags: [companies]
      summary: A client's terms of business (fee, payment terms, guarantee)
      description: Version 0 and nothing set before the first save. They fill in a new placement's fee, payment terms and guarantee.
      x-permission: companies:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyTerms' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putCompanyTerms
      tags: [companies]
      summary: Save a client's terms of business
      description: "`version` must be the version you loaded (0 for the first save)."
      x-permission: companies:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyTermsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyTerms' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CompanyId' }

  schemas:
    CompanyTerms:
      type: object
      required: [feePercent, paymentTermsDays, guaranteeDays, signedOn, notes, version, updatedAt]
      properties:
        feePercent:
          description: "The fee, as a percentage of the yearly salary: e.g. \"18\"."
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        paymentTermsDays: { type: integer, nullable: true, description: "Days after the invoice the fee is due, e.g. 30." }
        guaranteeDays: { type: integer, nullable: true, description: "Days after the start a placement is guaranteed." }
        signedOn: { type: string, format: date, nullable: true, description: When the terms were signed. }
        notes: { type: string, nullable: true }
        version: { type: integer, description: 0 before the first save. }
        updatedAt: { type: string, format: date-time, nullable: true }
    CompanyTermsInput:
      type: object
      additionalProperties: false
      required: [version, feePercent, paymentTermsDays, guaranteeDays, signedOn, notes]
      properties:
        version: { type: integer, minimum: 0 }
        feePercent:
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        paymentTermsDays: { type: integer, minimum: 0, maximum: 365, nullable: true }
        guaranteeDays: { type: integer, minimum: 0, maximum: 365, nullable: true }
        signedOn: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    CompanyBenefitsFormat:
      type: string
      enum: [docx, pdf]
    CompanyBenefit:
      type: object
      additionalProperties: false
      required: [key, label, value, remarks]
      properties:
        key: { type: string, minLength: 1, maxLength: 100, description: The item's key in the company_benefits list. }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, nullable: true, maxLength: 1000, description: "e.g. 18 days, rising to 21 after 3 years." }
        remarks: { type: string, nullable: true, maxLength: 2000, description: Remarks or clauses. }
    CompanyPreOfferStep:
      type: object
      additionalProperties: false
      required: [key, label, applies, remarks]
      properties:
        key: { type: string, minLength: 1, maxLength: 100, description: The item's key in the pre_offer_process list. }
        label: { type: string, minLength: 1, maxLength: 100 }
        applies: { type: boolean, nullable: true, description: "true: the client does it; false: it does not; null: not known yet." }
        remarks: { type: string, nullable: true, maxLength: 2000 }
    CompanyBenefits:
      type: object
      required: [benefits, preOffer, version, updatedAt]
      properties:
        benefits: { type: array, items: { $ref: '#/components/schemas/CompanyBenefit' } }
        preOffer: { type: array, items: { $ref: '#/components/schemas/CompanyPreOfferStep' } }
        version: { type: integer, description: 0 before the first save. }
        updatedAt: { type: string, format: date-time, nullable: true }
    CompanyBenefitsInput:
      type: object
      additionalProperties: false
      required: [version, benefits, preOffer]
      properties:
        version: { type: integer, minimum: 0 }
        benefits: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CompanyBenefit' } }
        preOffer: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CompanyPreOfferStep' } }
    CompanyId:
      type: string
      pattern: '^comp_[0-9a-hjkmnp-tv-z]{26}$'
      example: comp_01jbz6w0m0k8q9x2r3s4t5v6w7
    CompanyType:
      type: string
      description: >
        client = you recruit for them; prospect = you want them as a client;
        internal = a part of your own organisation (in-house hiring).
      enum: [client, prospect, internal]
    CompanySize:
      type: string
      description: Employees. micro 1–10, small 11–50, medium 51–200, large 201–1000, enterprise over 1000.
      enum: [micro, small, medium, large, enterprise]

    Company:
      type: object
      required: [id, version, name, type, website, industry, size, phone, address, city, country, registrationNumber, about, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/CompanyId' }
        version: { type: integer, description: Send it back when you update. }
        name: { type: string }
        type: { $ref: '#/components/schemas/CompanyType' }
        website: { type: string, nullable: true, description: 'Always with https://, e.g. https://example.com.' }
        industry: { type: string, nullable: true }
        size:
          allOf: [{ $ref: '#/components/schemas/CompanySize' }]
          nullable: true
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        registrationNumber: { type: string, nullable: true, description: 'Business registration number, e.g. SSM in Malaysia or UEN in Singapore.' }
        about: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type:
          allOf: [{ $ref: '#/components/schemas/CompanyType' }]
          description: Defaults to client.
        website: { type: string, maxLength: 300, nullable: true, description: 'example.com or a full address; https:// is added if missing.' }
        industry: { type: string, maxLength: 100, nullable: true }
        size:
          allOf: [{ $ref: '#/components/schemas/CompanySize' }]
          nullable: true
        phone: { type: string, maxLength: 40, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        registrationNumber: { type: string, maxLength: 50, nullable: true }
        about: { type: string, maxLength: 4000, nullable: true }

    CompanyUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/CompanyType' }
        website: { type: string, maxLength: 300, nullable: true }
        industry: { type: string, maxLength: 100, nullable: true }
        size:
          allOf: [{ $ref: '#/components/schemas/CompanySize' }]
          nullable: true
        phone: { type: string, maxLength: 40, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        country:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        registrationNumber: { type: string, maxLength: 50, nullable: true }
        about: { type: string, maxLength: 4000, nullable: true }

    CompanySummary:
      type: object
      required: [id, name, type, industry, city, website, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/CompanyId' }
        name: { type: string }
        type: { $ref: '#/components/schemas/CompanyType' }
        industry: { type: string, nullable: true }
        city: { type: string, nullable: true }
        website: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    CompanyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CompanySummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/CompanyId' }]
          nullable: true
    CompanySuggestionId:
      type: string
      pattern: '^csug_[0-9a-hjkmnp-tv-z]{26}$'
      example: csug_01jbz6w0m0k8q9x2r3s4t5v6w7
    CompanySuggestionField:
      type: string
      enum: [name, phone, address, city, country, registrationNumber, size, about]
    CompanySuggestion:
      type: object
      required: [id, field, value, current, source]
      properties:
        id: { $ref: '#/components/schemas/CompanySuggestionId' }
        field: { $ref: '#/components/schemas/CompanySuggestionField' }
        value: { type: string, description: "As it would be saved (size: micro, small, medium, large or enterprise; country: a two-letter code)." }
        current: { type: string, nullable: true, description: The company's value now. }
        source: { type: string, description: "Where it was found, e.g. \"schema.org data on https://contoh.com.my/\"." }
    CompanyAutofillStatus:
      type: string
      description: idle = never read; queued = being read; done; failed (see error).
      enum: [idle, queued, done, failed]
    CompanyAutofill:
      type: object
      required: [status, checkedAt, error, suggestions]
      properties:
        status: { $ref: '#/components/schemas/CompanyAutofillStatus' }
        checkedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        suggestions:
          type: array
          description: Waiting for a decision.
          items: { $ref: '#/components/schemas/CompanySuggestion' }
    SuggestionDecision:
      type: object
      additionalProperties: false
      required: [accept]
      properties:
        accept: { type: boolean }

    # --- Job payloads (messages on the job queue, not HTTP bodies) ---
    CompanyAutofillJob:
      type: object
      additionalProperties: false
      required: [companyId]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }

