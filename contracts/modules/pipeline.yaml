# Module contract: pipeline (a candidate on a job is an application that moves
# through stages). See contracts/README.md.
x-module:
  name: pipeline
  description: Candidates on jobs (applications) and their stages.
  permissions:
    pipeline:read:
      description: See which candidates are on which jobs, and their stages.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    pipeline:update:
      description: Add candidates to jobs, move them between stages, and choose a job's stages.
      roles: [owner, admin, recruiter, sourcer]
    pipeline.templates:manage:
      description: Create, change and delete the company's stage templates, and choose the default.
      roles: [owner, admin]
  errorCodes:
    APPLICATION_EXISTS:
      status: 409
      description: The candidate is already on this job. `details.existingApplicationId` points to it.
    APPLICATIONS_OVERLAP:
      status: 409
      description: >
        Two candidates being merged are on the same job, and both applications there carry interviews, offers or a
        placement: nothing is deleted. Remove one of the two applications by hand, then merge. `details.jobId`
        names the job.
    STAGE_MOVE_NOT_ALLOWED:
      status: 422
      description: The move breaks a pipeline rule (the message says which), e.g. rejecting without a reason.
  jobs: {}

paths:
  /v1/jobs/{jobId}/applications:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: listJobApplications
      tags: [pipeline]
      summary: The candidates on a job (its pipeline), oldest first
      x-permission: pipeline:read
      parameters:
        - name: cursor
          in: query
          schema: { $ref: '#/components/schemas/ApplicationId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        - name: stage
          in: query
          schema: { $ref: '#/components/schemas/Stage' }
        - name: includeCounts
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addApplication
      tags: [pipeline]
      summary: Put a candidate on a job
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/applications:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateApplications
      tags: [pipeline]
      summary: The jobs a candidate is on, newest first
      x-permission: pipeline:read
      parameters:
        - name: cursor
          in: query
          schema: { $ref: '#/components/schemas/ApplicationId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/applications/{applicationId}/move:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      operationId: moveApplication
      tags: [pipeline]
      summary: Move an application to another stage
      description: >
        Moving to rejected or withdrawn needs a `reason`. `version` must be the
        version you loaded, so two people moving the same card cannot overwrite
        each other.
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationMove' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The move is not allowed (STAGE_MOVE_NOT_ALLOWED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/pipeline/summary:
    get:
      operationId: getPipelineSummary
      tags: [pipeline]
      summary: 'The dashboard: open jobs and their pipelines, stuck applications, recent results'
      x-permission: pipeline:read
      parameters:
        - name: stuckDays
          in: query
          description: An application is stuck after this many days in one open stage (offer and earlier). Default 14.
          schema: { type: integer, minimum: 1, maximum: 365, default: 14 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pipeline/jobs:
    get:
      operationId: listJobProgress
      tags: [pipeline]
      summary: "Jobs' progress: candidates per stage, when anything last moved, how many wait over 7 days"
      x-permission: pipeline:read
      parameters:
        - name: jobId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { $ref: '#/components/schemas/JobOrderId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/JobProgress' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pipeline/moves:
    get:
      operationId: listStageMoves
      tags: [pipeline]
      summary: 'Stage moves, newest first: the dashboard timeline, or one candidate''s'
      description: >
        Every time an application was added or changed stage, with who did it
        (none when the app did it, e.g. an offer accepted). Only applications
        you may see.
      x-permission: pipeline:read
      parameters:
        - name: candidateId
          in: query
          description: Only this candidate's moves.
          schema: { $ref: '#/components/schemas/CandidateId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageMoveList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stage-templates:
    get:
      operationId: listStageTemplates
      tags: [pipeline]
      summary: The company's stage templates (the default first, then by name)
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageTemplateList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createStageTemplate
      tags: [pipeline]
      summary: Save a stage template
      x-permission: pipeline.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageTemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stage-templates/{stageTemplateId}:
    parameters:
      - $ref: '#/components/parameters/StageTemplateIdPath'
    put:
      operationId: updateStageTemplate
      tags: [pipeline]
      summary: Change a stage template
      description: >
        Jobs that chose it keep the stages they have (each job keeps its own
        copy); jobs that follow the default template see the change.
      x-permission: pipeline.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageTemplateUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteStageTemplate
      tags: [pipeline]
      summary: Delete a stage template (jobs that chose it keep their stages)
      x-permission: pipeline.templates:manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/jobs/{jobId}/stages:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: getJobStages
      tags: [pipeline]
      summary: A job's stages, in order (its own, else the default template's, else the standard ones)
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStages' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setJobStages
      tags: [pipeline]
      summary: Choose a job's stages (from a template, or its own); null steps follow the default again
      description: >
        Candidates in a stage taken away stay in the first stage of the same
        kind (or, with none left of that kind, a column of that kind is shown
        until they move on).
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobStagesInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStages' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    StageTemplateIdPath:
      name: stageTemplateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/StageTemplateId' }
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ApplicationId' }

  schemas:
    StageTemplateId:
      type: string
      pattern: '^stpl_[0-9a-hjkmnp-tv-z]{26}$'
      example: stpl_01jbz6w0m0k8q9x2r3s4t5v6w7
    OpenStage:
      type: string
      description: The kind of a custom stage (reports, automations, offers and placements go by it).
      enum: [applied, screening, submitted, interview, offer, placed]
    StageStep:
      type: object
      required: [key, label, stage]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]{1,40}$', description: Stays the same when renamed. }
        label: { type: string, minLength: 1, maxLength: 40 }
        stage: { $ref: '#/components/schemas/OpenStage' }
    StageStepInput:
      type: object
      additionalProperties: false
      required: [label, stage]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]{1,40}$', description: A stage kept from before (renamed or moved); omit for a new one. }
        label: { type: string, maxLength: 60 }
        stage: { $ref: '#/components/schemas/OpenStage' }
    StageTemplate:
      type: object
      required: [id, version, name, isDefault, steps, jobCount, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/StageTemplateId' }
        version: { type: integer }
        name: { type: string }
        isDefault: { type: boolean, description: New jobs and jobs that chose none follow it. }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StageStep' }
        jobCount: { type: integer, description: Jobs that chose it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StageTemplateList:
      type: object
      required: [items, standard]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StageTemplate' }
        standard:
          description: The standard stages (what a job has with no template).
          type: array
          items: { $ref: '#/components/schemas/StageStep' }
    StageTemplateInput:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        name: { type: string, maxLength: 80 }
        isDefault: { type: boolean }
        steps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/StageStepInput' }
    StageTemplateUpdate:
      type: object
      additionalProperties: false
      required: [version, name, steps]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        name: { type: string, maxLength: 80 }
        isDefault: { type: boolean }
        steps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/StageStepInput' }
    JobStages:
      type: object
      required: [jobId, version, source, templateId, templateName, steps]
      properties:
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        version: { type: integer, description: 0 while the job follows the default (nothing of its own saved). }
        source:
          type: string
          enum: [standard, default, template, custom]
          description: >
            standard: the standard stages (no template, none default);
            default: the default template's, followed; template: a template's
            copy, chosen for this job; custom: changed for this job.
        templateId:
          allOf: [{ $ref: '#/components/schemas/StageTemplateId' }]
          nullable: true
        templateName: { type: string, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StageStep' }
    JobStagesInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 0, description: The version you loaded (0 while following the default). }
        templateId:
          allOf: [{ $ref: '#/components/schemas/StageTemplateId' }]
          nullable: true
          description: The template these stages came from (its stages are used when steps are omitted).
        steps:
          type: array
          nullable: true
          maxItems: 20
          items: { $ref: '#/components/schemas/StageStepInput' }
          description: The job's own stages; null (with no templateId) follows the default again.
    ApplicationId:
      type: string
      pattern: '^appl_[0-9a-hjkmnp-tv-z]{26}$'
      example: appl_01jbz6w0m0k8q9x2r3s4t5v6w7
    Stage:
      type: string
      description: >
        In order: applied, screening, submitted (to the client or hiring
        manager), interview, offer, placed. rejected and withdrawn close the
        application (with a reason); it can be reopened later.
      enum: [applied, screening, submitted, interview, offer, placed, rejected, withdrawn]
    CloseReason:
      type: string
      description: Why an application was rejected or withdrawn.
      enum: [not_qualified, salary_mismatch, client_rejected, failed_interview, position_filled, candidate_declined, accepted_other_offer, no_response, other]

    ApplicationChannel:
      type: string
      description: Where an application came from, e.g. the job board whose link the candidate used to apply.
      enum: [careers_page, jobstreet, linkedin, indeed, facebook, referral, other]
    Application:
      type: object
      required: [id, version, jobId, jobTitle, companyId, companyName, candidateId, candidateName, candidateTitle, candidateAvailability, stage, reason, reasonNote, channel, stageChangedAt, createdAt, updatedAt]
      properties:
        channel:
          allOf: [{ $ref: '#/components/schemas/ApplicationChannel' }]
          nullable: true
          description: Null when a recruiter added the candidate.
        id: { $ref: '#/components/schemas/ApplicationId' }
        version: { type: integer }
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        jobTitle: { type: string }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        candidateName: { type: string }
        candidateTitle: { type: string, nullable: true, description: "The candidate's current job title." }
        candidateAvailability:
          description: "The candidate's status (Looking out, Passive, Not looking, Placed), which colours their initials; null when not set."
          allOf: [{ $ref: '#/components/schemas/CandidateAvailability' }]
          nullable: true
        stage: { $ref: '#/components/schemas/Stage' }
        step:
          type: string
          nullable: true
          description: The job's own stage it is in (StageStep.key), when the job has custom stages; null at a standard stage or when closed.
        reason:
          description: Set when rejected or withdrawn.
          allOf: [{ $ref: '#/components/schemas/CloseReason' }]
          nullable: true
        reasonNote: { type: string, nullable: true }
        stageChangedAt: { type: string, format: date-time, description: When it entered its current stage. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineColumnCount:
      type: object
      required: [stage, step, count, waiting]
      properties:
        stage: { $ref: '#/components/schemas/Stage' }
        step: { type: string, nullable: true }
        count: { type: integer }
        waiting: { type: integer }
    ApplicationList:
      type: object
      required: [items]
      properties:
        counts:
          type: array
          items: { $ref: '#/components/schemas/PipelineColumnCount' }
        nextCursor:
          $ref: '#/components/schemas/ApplicationId'
          description: Continue after this application ID when more results are available.
        items:
          type: array
          items: { $ref: '#/components/schemas/Application' }

    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        stage:
          description: Defaults to applied. Must be an open stage.
          allOf: [{ $ref: '#/components/schemas/Stage' }]

    ApplicationMove:
      type: object
      additionalProperties: false
      required: [version, stage]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        stage: { $ref: '#/components/schemas/Stage' }
        step:
          type: string
          pattern: '^[a-z0-9_]{1,40}$'
          description: One of the job's stages (its key), whose kind must be `stage`; omit for a standard stage or when closing.
        reason:
          description: Required for rejected and withdrawn; not allowed otherwise.
          allOf: [{ $ref: '#/components/schemas/CloseReason' }]
        reasonNote: { type: string, maxLength: 1000 }

    StageCounts:
      type: object
      description: How many applications are in each open stage.
      required: [applied, screening, submitted, interview, offer, placed]
      properties:
        applied: { type: integer }
        screening: { type: integer }
        submitted: { type: integer }
        interview: { type: integer }
        offer: { type: integer }
        placed: { type: integer }
    JobProgress:
      type: object
      required: [jobId, stageCounts, lastMovedAt, waiting, waitingCounts]
      properties:
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
        lastMovedAt: { type: string, format: date-time, nullable: true, description: When a candidate last joined or moved stage; null with none. }
        waiting: { type: integer, description: Candidates over 7 days in one open stage (offer and earlier). }
        waitingCounts:
          description: Of them, how many in each stage.
          allOf: [{ $ref: '#/components/schemas/StageCounts' }]
    DashboardJob:
      type: object
      required: [jobId, title, companyId, companyName, stageCounts]
      properties:
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        title: { type: string }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
    StageMove:
      type: object
      required: [id, applicationId, candidateId, candidateName, jobId, jobTitle, companyName, fromStage, toStage, changedAt, changedByName]
      properties:
        id: { type: string }
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        candidateName: { type: string }
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        jobTitle: { type: string }
        companyName: { type: string }
        fromStage:
          description: Null when the candidate was added to the job at toStage.
          allOf: [{ $ref: '#/components/schemas/Stage' }]
          nullable: true
        toStage: { $ref: '#/components/schemas/Stage' }
        changedAt: { type: string, format: date-time }
        changedByName: { type: string, nullable: true, description: Who moved them; null when the app did (or before this was recorded). }
    StageMoveList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StageMove' }
    PipelineSummary:
      type: object
      required: [openJobs, stageCounts, jobs, stuck, placedLast30Days, movedLast7Days, movedPrev7Days, addedLast7Days, openedLast7Days]
      properties:
        openJobs: { type: integer, description: Jobs with status open. }
        stageCounts:
          description: Applications on open jobs, per stage.
          allOf: [{ $ref: '#/components/schemas/StageCounts' }]
        jobs:
          type: array
          description: Open jobs (newest first, up to 50) with their pipelines.
          items: { $ref: '#/components/schemas/DashboardJob' }
        stuck:
          type: array
          description: Applications on open jobs longest in one stage (offer and earlier) past stuckDays, oldest first, up to 10.
          items: { $ref: '#/components/schemas/Application' }
        placedLast30Days: { type: integer }
        movedLast7Days: { type: integer, description: Applications that changed stage in the last 7 days. }
        movedPrev7Days: { type: integer, description: Applications that changed stage in the 7 days before those. }
        addedLast7Days: { type: integer, description: Applications added in the last 7 days. }
        openedLast7Days: { type: integer, description: Open jobs added in the last 7 days. }
