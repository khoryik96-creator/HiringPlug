# Module contract: pipeline (a candidate on a job is an application that moves
# through stages). See contracts/README.md.
x-module:
  name: pipeline
  description: Candidates on jobs (applications) and their stages.
  permissions:
    pipeline:read:
      description: See which candidates are on which jobs, and their stages.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    pipeline:update:
      description: Add candidates to jobs and move them between stages.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes:
    APPLICATION_EXISTS:
      status: 409
      description: The candidate is already on this job. `details.existingApplicationId` points to it.
    STAGE_MOVE_NOT_ALLOWED:
      status: 422
      description: The move breaks a pipeline rule (the message says which), e.g. rejecting without a reason.
  jobs: {}

paths:
  /v1/jobs/{jobId}/applications:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: listJobApplications
      tags: [pipeline]
      summary: The candidates on a job (its pipeline), oldest first
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addApplication
      tags: [pipeline]
      summary: Put a candidate on a job
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/applications:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateApplications
      tags: [pipeline]
      summary: The jobs a candidate is on, newest first
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/applications/{applicationId}/move:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      operationId: moveApplication
      tags: [pipeline]
      summary: Move an application to another stage
      description: >
        Moving to rejected or withdrawn needs a `reason`. `version` must be the
        version you loaded, so two people moving the same card cannot overwrite
        each other.
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationMove' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The move is not allowed (STAGE_MOVE_NOT_ALLOWED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/pipeline/summary:
    get:
      operationId: getPipelineSummary
      tags: [pipeline]
      summary: 'The dashboard: open jobs and their pipelines, stuck applications, recent results'
      x-permission: pipeline:read
      parameters:
        - name: stuckDays
          in: query
          description: An application is stuck after this many days in one open stage (offer and earlier). Default 14.
          schema: { type: integer, minimum: 1, maximum: 365, default: 14 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ApplicationId' }

  schemas:
    ApplicationId:
      type: string
      pattern: '^appl_[0-9a-hjkmnp-tv-z]{26}$'
      example: appl_01jbz6w0m0k8q9x2r3s4t5v6w7
    Stage:
      type: string
      description: >
        In order: applied, screening, submitted (to the client or hiring
        manager), interview, offer, placed. rejected and withdrawn close the
        application (with a reason); it can be reopened later.
      enum: [applied, screening, submitted, interview, offer, placed, rejected, withdrawn]
    CloseReason:
      type: string
      description: Why an application was rejected or withdrawn.
      enum: [not_qualified, salary_mismatch, client_rejected, failed_interview, position_filled, candidate_declined, accepted_other_offer, no_response, other]

    ApplicationChannel:
      type: string
      description: Where an application came from, e.g. the job board whose link the candidate used to apply.
      enum: [careers_page, jobstreet, linkedin, indeed, facebook, referral, other]
    Application:
      type: object
      required: [id, version, jobId, jobTitle, companyId, companyName, candidateId, candidateName, candidateTitle, stage, reason, reasonNote, channel, stageChangedAt, createdAt, updatedAt]
      properties:
        channel:
          allOf: [{ $ref: '#/components/schemas/ApplicationChannel' }]
          nullable: true
          description: Null when a recruiter added the candidate.
        id: { $ref: '#/components/schemas/ApplicationId' }
        version: { type: integer }
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        jobTitle: { type: string }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        candidateName: { type: string }
        candidateTitle: { type: string, nullable: true, description: "The candidate's current job title." }
        stage: { $ref: '#/components/schemas/Stage' }
        reason:
          description: Set when rejected or withdrawn.
          allOf: [{ $ref: '#/components/schemas/CloseReason' }]
          nullable: true
        reasonNote: { type: string, nullable: true }
        stageChangedAt: { type: string, format: date-time, description: When it entered its current stage. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Application' }

    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        stage:
          description: Defaults to applied. Must be an open stage.
          allOf: [{ $ref: '#/components/schemas/Stage' }]

    ApplicationMove:
      type: object
      additionalProperties: false
      required: [version, stage]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        stage: { $ref: '#/components/schemas/Stage' }
        reason:
          description: Required for rejected and withdrawn; not allowed otherwise.
          allOf: [{ $ref: '#/components/schemas/CloseReason' }]
        reasonNote: { type: string, maxLength: 1000 }

    StageCounts:
      type: object
      description: How many applications are in each open stage.
      required: [applied, screening, submitted, interview, offer, placed]
      properties:
        applied: { type: integer }
        screening: { type: integer }
        submitted: { type: integer }
        interview: { type: integer }
        offer: { type: integer }
        placed: { type: integer }
    DashboardJob:
      type: object
      required: [jobId, title, companyId, companyName, stageCounts]
      properties:
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        title: { type: string }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
    PipelineSummary:
      type: object
      required: [openJobs, stageCounts, jobs, stuck, placedLast30Days, movedLast7Days]
      properties:
        openJobs: { type: integer, description: Jobs with status open. }
        stageCounts:
          description: Applications on open jobs, per stage.
          allOf: [{ $ref: '#/components/schemas/StageCounts' }]
        jobs:
          type: array
          description: Open jobs (newest first, up to 50) with their pipelines.
          items: { $ref: '#/components/schemas/DashboardJob' }
        stuck:
          type: array
          description: Applications on open jobs longest in one stage (offer and earlier) past stuckDays, oldest first, up to 10.
          items: { $ref: '#/components/schemas/Application' }
        placedLast30Days: { type: integer }
        movedLast7Days: { type: integer, description: Applications that changed stage in the last 7 days. }
