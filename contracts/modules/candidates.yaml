# Module contract: candidates (profiles and their salary details).
# See contracts/README.md for the format.
x-module:
  name: candidates
  description: Candidate profiles. Salary details are stored and permissioned separately.
  permissions:
    candidates:read:
      description: View candidate profiles (salary details need candidates.compensation:read).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    candidates:create:
      description: Add candidates.
      roles: [owner, admin, recruiter, sourcer]
    candidates:update:
      description: Edit candidate profiles.
      roles: [owner, admin, recruiter, sourcer]
    candidates:merge:
      description: Merge a duplicate candidate into another (needs to see salaries, so nothing is lost unseen).
      roles: [owner, admin, recruiter]
    candidates.compensation:read:
      description: See current and expected salary.
      sensitive: true
      roles: [owner, admin, recruiter]
    candidates.compensation:update:
      description: Record or change current and expected salary.
      sensitive: true
      roles: [owner, admin, recruiter]
  errorCodes:
    CANDIDATE_DUPLICATE_EMAIL:
      status: 409
      description: "Another candidate already has this email (one candidate per email). details: existingCandidateId, existingCandidateName and existingOwnerName, when the user may see them."
  jobs: {}

paths:
  /v1/salary-calculations:
    post:
      operationId: calculateSalary
      tags: [candidates]
      summary: Review a fixed monthly salary calculation without changing a candidate
      x-permission: candidates.compensation:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryCalculationInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryCalculation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List or search candidates, newest first
      x-permission: candidates:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email, current title or company (ignoring case and accents); or a phone number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: { type: boolean, default: false }
        - name: tag
          in: query
          description: Only candidates with this tag (ignoring case).
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: skill
          in: query
          description: Only candidates with this skill (ignoring case).
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: owner
          in: query
          description: Only candidates owned by this user ("me" for your own).
          schema: { type: string, minLength: 1, maxLength: 40 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/CandidateId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Add a candidate
      description: Salary details are set separately with PUT /v1/candidates/{candidateId}/compensation.
      x-permission: candidates:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/search:
    post:
      operationId: searchCandidates
      tags: [candidates]
      summary: Advanced search - filters and a boolean search of their CVs and profiles, newest first
      description: >
        Every filter given must hold. The boolean (SAP AND (BW OR BPC) NOT
        internship, "project manager", manag*) is looked for in the
        candidate's CVs (each one read, not formatted ones) and in their
        profile (title, company, skills, tags, industry, specialization,
        location); a candidate is found when either matches. Each hit says
        where, with a snippet of the CV and the words to highlight.
      x-permission: candidates:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateSearch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSearchPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/candidates/find:
    get:
      operationId: findCandidates
      tags: [candidates]
      summary: The home page search - candidates by name, email or phone, several at once
      description: >
        Kano's /find rules. Searches are split on commas (at most six). Each
        is an email (matched exactly), a phone number (the whole number, in
        any format: without a country code it is read as a local number of
        the agency's country, the usual candidate countries, then any
        country where it is valid; never only its last digits) or a name
        (every word in the name, email, title or company; then names alike,
        scored). "name - company" keeps those who work or worked there,
        word for word. Each search gets its own block, with a message
        instead when it is incomplete.
      x-permission: candidates:read
      parameters:
        - name: q
          in: query
          required: true
          description: "For example: ali abu - nintex, +60 12-345 6789, aisyah@example.com"
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateFind' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/candidates/used-values:
    get:
      operationId: listCandidateUsedValues
      tags: [candidates]
      summary: Tags, skills, industries and specializations already used, most used first
      description: For suggestions while typing, so everyone spells them the same way.
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsedValues' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a candidate
      description: >
        `compensation` is only included if you have candidates.compensation:read;
        otherwise it is left out and listed in `restrictedFields`.
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Change some fields of a candidate
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded.
      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/history:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: replaceCandidateHistory
      tags: [candidates]
      summary: Replace a candidate's work history and education
      description: >
        Both lists are replaced as a whole, newest first. `version` is the
        candidate's: a save based on an older version is a conflict.
      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateHistoryUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/merge:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: mergeCandidate
      tags: [candidates]
      summary: Merge a duplicate into this candidate
      description: >
        The duplicate's CVs, jobs and notes move to this candidate; this
        candidate's empty fields (and salary, if none) are filled from the
        duplicate; then the duplicate is deleted. If both are on the same job,
        this candidate's application is kept. `version` is this candidate's.
      x-permission: candidates:merge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateMerge' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/similar:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listSimilarCandidates
      tags: [candidates]
      summary: Possible duplicates of a candidate (same phone, or a very similar name)
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimilarCandidateList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/candidates/{candidateId}/compensation:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: putCandidateCompensation
      tags: [candidates]
      summary: Set a candidate's current and expected salary
      description: >
        Replaces both values. Send `expectedVersion: 0` the first time, then the
        `version` you loaded.
      x-permission: candidates.compensation:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompensationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compensation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/candidates/{candidateId}/owner:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: setCandidateOwner
      tags: [candidates]
      summary: Give the candidate to another recruiter (or to nobody)
      description: >
        Roles that see only their own (or their team's) candidates may no
        longer see a candidate they hand over; nothing else changes.
      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerInput' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/candidates/{candidateId}/screening-calls:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: recordScreeningCall
      tags: [candidates]
      summary: Record a screening call, updating the candidate from it
      description: >
        In one step: the call's notes become a screening note, and the
        profile takes what was asked (notice period, work authorization,
        nationality; the source only when the candidate has none), with the
        salary (needs candidates.compensation:update). Fields left out are
        not changed. Notes need notes:create; sensitive ones
        notes.sensitive:read. Each call is kept with who made it and when
        (calledBy, calledOn: you and today when left out); the salary follows
        the latest call: one dated before a call already recorded with
        salary keeps that salary (salaryApplied false).
      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreeningCallInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningCallResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listScreeningCalls
      tags: [candidates]
      summary: A candidate's screening calls, latest first
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningCallList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CandidateId' }

  schemas:
    OwnerInput:
      type: object
      additionalProperties: false
      required: [ownerId]
      properties:
        ownerId:
          description: A user of the company, or null for nobody.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
    CandidateId:
      type: string
      pattern: '^cand_[0-9a-hjkmnp-tv-z]{26}$'
      example: cand_01jbz6w0m0k8q9x2r3s4t5v6w7

    WorkAuthorizationStatus:
      type: string
      description: >
        local = citizen; expat_eligible = expat who can already work here
        (see `basis`); requires_visa = needs an employment pass.
      enum: [local, expat_eligible, requires_visa]
    WorkAuthorizationBasis:
      type: string
      description: Why an expat can work without sponsorship. rp_t = Residence Pass-Talent.
      enum: [rp_t, permanent_resident, spouse_visa, other]
    WorkAuthorization:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WorkAuthorizationStatus' }
        basis:
          description: Required when status is expat_eligible, otherwise must be empty.
          allOf: [{ $ref: '#/components/schemas/WorkAuthorizationBasis' }]
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 500

    NoticePeriodUnit:
      type: string
      enum: [day, week, month]
    NoticePeriod:
      type: object
      additionalProperties: false
      required: [value, unit]
      description: '`value: 0` means available immediately.'
      properties:
        value: { type: integer, minimum: 0, maximum: 365 }
        unit: { $ref: '#/components/schemas/NoticePeriodUnit' }

    CandidateAvailability:
      type: string
      description: looking = looking out for a move; passive = open to the right offer; not_looking = not looking; placed = placed by you.
      enum: [looking, passive, not_looking, placed]

    CandidateSource:
      type: string
      description: >
        Where the candidate came from: a key from the company's source list
        (Settings; built in: jobstreet, linkedin, referral, careers_page,
        direct, other).
      pattern: '^[a-z0-9_]{1,40}$'
      example: jobstreet

    SalaryAmount:
      type: object
      additionalProperties: false
      required: [amount, currency, period]
      properties:
        description: { type: string, maxLength: 2000 }
        amount: { $ref: '#/components/schemas/DecimalAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        period: { $ref: '#/components/schemas/PayPeriod' }
    SalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        description: { type: string, maxLength: 2000 }
        min: { $ref: '#/components/schemas/DecimalAmount' }
        max:
          description: Leave empty for a single expected figure.
          allOf: [{ $ref: '#/components/schemas/DecimalAmount' }]
          nullable: true
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        period: { $ref: '#/components/schemas/PayPeriod' }
    Compensation:
      type: object
      required: [version, currentSalary, expectedSalary, updatedAt]
      properties:
        version: { type: integer, minimum: 1 }
        currentSalary:
          allOf: [{ $ref: '#/components/schemas/SalaryAmount' }]
          nullable: true
        expectedSalary:
          allOf: [{ $ref: '#/components/schemas/SalaryRange' }]
          nullable: true
        updatedAt: { type: string, format: date-time }
    CompensationUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, currentSalary, expectedSalary]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 if no salary details exist yet, otherwise the version you loaded.
        currentSalary:
          allOf: [{ $ref: '#/components/schemas/SalaryAmount' }]
          nullable: true
        expectedSalary:
          allOf: [{ $ref: '#/components/schemas/SalaryRange' }]
          nullable: true

    RestrictedField:
      type: string
      description: A field left out of the response because you lack the permission to see it.
      enum: [compensation]

    WorkEntry:
      type: object
      additionalProperties: false
      required: [title, company, startDate, endDate, current, description]
      description: One job. A title or a company is required; endDate is null when current.
      properties:
        title: { type: string, nullable: true, maxLength: 200 }
        company: { type: string, nullable: true, maxLength: 200 }
        startDate: { type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY. }
        endDate: { type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY. }
        current: { type: boolean }
        description: { type: string, nullable: true, maxLength: 4000 }
    EducationEntry:
      type: object
      additionalProperties: false
      required: [qualification, institution, endYear]
      description: One qualification. A qualification or an institution is required.
      properties:
        qualification: { type: string, nullable: true, maxLength: 200 }
        institution: { type: string, nullable: true, maxLength: 200 }
        endYear: { type: integer, nullable: true, minimum: 1950, maximum: 2100 }
    CandidateHistoryUpdate:
      type: object
      additionalProperties: false
      required: [version, experience, education]
      properties:
        version: { type: integer, minimum: 1 }
        experience:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/WorkEntry' }
        education:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/EducationEntry' }

    Candidate:
      type: object
      required:
        - id
        - tags
        - skills
        - experience
        - education
        - version
        - firstName
        - lastName
        - fullName
        - email
        - phone
        - nationality
        - residenceCountry
        - linkedinUrl
        - availability
        - availabilitySince
        - workAuthorization
        - noticePeriod
        - industry
        - specialization
        - currentTitle
        - currentCompany
        - location
        - source
        - ownerId
        - ownerName
        - restrictedFields
        - createdAt
        - updatedAt
      properties:
        ownerId:
          description: The recruiter the candidate belongs to; null for none (e.g. applied on the careers page).
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        ownerName: { type: string, nullable: true }
        experience:
          type: array
          description: Work history, newest first.
          items: { $ref: '#/components/schemas/WorkEntry' }
        education:
          type: array
          items: { $ref: '#/components/schemas/EducationEntry' }
        id: { $ref: '#/components/schemas/CandidateId' }
        version: { type: integer, minimum: 1 }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: string, format: email, nullable: true }
        phone:
          type: string
          nullable: true
          description: International (E.164) format, e.g. +60123456789.
        nationality:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        linkedinUrl: { type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah." }
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{ $ref: '#/components/schemas/CandidateAvailability' }]
          nullable: true
        availabilitySince:
          type: string
          format: date-time
          nullable: true
          description: "When the status was last set (the page shows \"Not looking since 3 Nov, 5 days\"); null without a status."
        workAuthorization:
          allOf: [{ $ref: '#/components/schemas/WorkAuthorization' }]
          nullable: true
        noticePeriod:
          allOf: [{ $ref: '#/components/schemas/NoticePeriod' }]
          nullable: true
        industry: { type: string, nullable: true }
        industrySelections: { $ref: '#/components/schemas/IndustrySelections' }
        specialization: { type: string, nullable: true }
        currentTitle: { type: string, nullable: true }
        currentCompany: { type: string, nullable: true }
        location: { type: string, nullable: true }
        source:
          allOf: [{ $ref: '#/components/schemas/CandidateSource' }]
          nullable: true
        tags: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        compensation:
          description: Left out (and listed in restrictedFields) without candidates.compensation:read. null means none recorded.
          allOf: [{ $ref: '#/components/schemas/Compensation' }]
          nullable: true
        restrictedFields:
          type: array
          items: { $ref: '#/components/schemas/RestrictedField' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CandidateCreate:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone:
          type: string
          maxLength: 40
          nullable: true
          description: Any common format; stored in international format.
        nationality:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        linkedinUrl: { type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah." }
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{ $ref: '#/components/schemas/CandidateAvailability' }]
          nullable: true
        workAuthorization:
          allOf: [{ $ref: '#/components/schemas/WorkAuthorization' }]
          nullable: true
        noticePeriod:
          allOf: [{ $ref: '#/components/schemas/NoticePeriod' }]
          nullable: true
        industry: { type: string, maxLength: 100, nullable: true }
        industrySelections: { $ref: '#/components/schemas/IndustrySelections' }
        specialization: { type: string, maxLength: 100, nullable: true }
        currentTitle: { type: string, maxLength: 200, nullable: true }
        currentCompany: { type: string, maxLength: 200, nullable: true }
        location: { type: string, maxLength: 200, nullable: true }
        source:
          allOf: [{ $ref: '#/components/schemas/CandidateSource' }]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 60 }
        skills:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 60 }

    CandidateUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you loaded.
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        nationality:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        linkedinUrl: { type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah." }
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{ $ref: '#/components/schemas/CandidateAvailability' }]
          nullable: true
        workAuthorization:
          allOf: [{ $ref: '#/components/schemas/WorkAuthorization' }]
          nullable: true
        noticePeriod:
          allOf: [{ $ref: '#/components/schemas/NoticePeriod' }]
          nullable: true
        industry: { type: string, maxLength: 100, nullable: true }
        industrySelections: { $ref: '#/components/schemas/IndustrySelections' }
        specialization: { type: string, maxLength: 100, nullable: true }
        currentTitle: { type: string, maxLength: 200, nullable: true }
        currentCompany: { type: string, maxLength: 200, nullable: true }
        location: { type: string, maxLength: 200, nullable: true }
        source:
          allOf: [{ $ref: '#/components/schemas/CandidateSource' }]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 60 }
        skills:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 60 }

    CandidateSummary:
      type: object
      required: [tags, id, fullName, email, phone, currentTitle, currentCompany, location, workAuthorizationStatus, updatedAt,
        availability, availabilitySince, noticePeriod, currentSalary, expectedSalary, salaryRestricted, workAuthorizationBasis,
        nationality, residenceCountry, source, industry]
      properties:
        nationality: { type: string, nullable: true, description: ISO country code. }
        residenceCountry: { type: string, nullable: true, description: ISO country code. }
        source: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        workAuthorizationBasis:
          description: The pass an expat holds (or permanent resident), as on their page.
          allOf: [{ $ref: '#/components/schemas/WorkAuthorizationBasis' }]
          nullable: true
        availability:
          allOf: [{ $ref: '#/components/schemas/CandidateAvailability' }]
          nullable: true
        availabilitySince: { type: string, format: date-time, nullable: true, description: When the status was last set. }
        noticePeriod:
          allOf: [{ $ref: '#/components/schemas/NoticePeriod' }]
          nullable: true
        currentSalary:
          description: Needs candidates.compensation:read (see salaryRestricted).
          allOf: [{ $ref: '#/components/schemas/SalaryAmount' }]
          nullable: true
        expectedSalary:
          description: Needs candidates.compensation:read (see salaryRestricted).
          allOf: [{ $ref: '#/components/schemas/SalaryRange' }]
          nullable: true
        salaryRestricted: { type: boolean, description: "true: you may not see salaries, so both are left out." }
        id: { $ref: '#/components/schemas/CandidateId' }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        currentTitle: { type: string, nullable: true }
        currentCompany: { type: string, nullable: true }
        location: { type: string, nullable: true }
        workAuthorizationStatus:
          allOf: [{ $ref: '#/components/schemas/WorkAuthorizationStatus' }]
          nullable: true
        tags: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    CandidateSearch:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, maxLength: 200, description: "Name, email, phone, title or company, as the quick search." }
        boolean: { type: string, maxLength: 1000, description: "AND, OR, NOT (or -word), ( ), \"phrases\", word*; words side by side must all appear." }
        availability: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/CandidateAvailability' } }
        workAuthorization: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/WorkAuthorizationKind' } }
        nationality: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CountryCode' } }
        residence: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CountryCode' } }
        source: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 60 } }
        industry: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 100 } }
        skills: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 60 } }
        skillsMatch:
          type: string
          enum: [all, any]
          default: all
          description: Whether a candidate needs every skill listed, or any one of them.
        tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 60 } }
        location: { type: string, maxLength: 100, description: Part of where they are (ignoring case). }
        noticeMaxDays: { type: integer, minimum: 0, maximum: 365, description: "Notice period at most this long (a month counts as 30 days); those without one are left out." }
        expectedSalaryMax:
          description: "Expected salary (its lowest figure) at most this, per month (a year counts as 12 months, a day as 22 days, an hour as 176 hours), in this currency. Only for roles that may see salaries."
          allOf: [{ $ref: '#/components/schemas/SalaryCap' }]
        owner: { type: string, minLength: 1, maxLength: 40, description: 'A user id, or "me".' }
        updatedWithinDays: { type: integer, minimum: 1, maximum: 3650 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { $ref: '#/components/schemas/CandidateId' }
    SalaryCap:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$', example: "12000" }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    WorkAuthorizationKind:
      type: string
      description: "How the list colours a candidate: local; pr (permanent resident); expat (RP-T, spouse visa or other pass held); needs_pass; unknown."
      enum: [local, pr, expat, needs_pass, unknown]
    CandidateSearchHit:
      type: object
      required: [candidate, matchedIn, cvSnippet]
      properties:
        candidate: { $ref: '#/components/schemas/CandidateSummary' }
        matchedIn:
          type: array
          description: Where the boolean was found (empty without one).
          items: { type: string, enum: [cv, profile] }
        cvSnippet:
          type: string
          nullable: true
          description: "Where the CV matches, the words found between [[ and ]] (\"... led [[SAP]] [[BW]] upgrades ...\")."
    CandidateSearchPage:
      type: object
      required: [items, nextCursor, terms]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CandidateSearchHit' }
        nextCursor:
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
          nullable: true
        terms:
          type: array
          description: The boolean's words and phrases to highlight (not those left out with NOT).
          items: { type: string }
    CandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CandidateSummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
          nullable: true
    SimilarCandidate:
      type: object
      required: [candidate, reasons]
      properties:
        candidate: { $ref: '#/components/schemas/CandidateSummary' }
        reasons:
          type: array
          description: Why they may be the same person.
          items:
            type: string
            enum: [same_phone, similar_name]
    SimilarCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SimilarCandidate' }
    ScreeningCallInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The candidate's version you loaded.
        notes: { type: string, maxLength: 10000, description: What was said; empty for no note. }
        sensitive: { type: boolean, description: Make the note sensitive (needs notes.sensitive:read). Defaults to false. }
        nationality:
          allOf: [{ $ref: '#/components/schemas/CountryCode' }]
          nullable: true
        workAuthorization:
          allOf: [{ $ref: '#/components/schemas/WorkAuthorization' }]
          nullable: true
        noticePeriod:
          allOf: [{ $ref: '#/components/schemas/NoticePeriod' }]
          nullable: true
        source:
          description: Set only when the candidate has no source yet.
          allOf: [{ $ref: '#/components/schemas/CandidateSource' }]
        compensation:
          description: Current and expected salary, replacing both (needs candidates.compensation:update).
          allOf: [{ $ref: '#/components/schemas/CompensationUpdate' }]
        calledOn: { type: string, format: date, description: "When the call was (today when left out; not in the future)." }
        calledBy:
          description: Who made the call (you when left out).
          allOf: [{ $ref: '#/components/schemas/UserId' }]
    ScreeningCallResult:
      type: object
      required: [candidate, noteId, sourceKept, salaryApplied, call]
      properties:
        candidate: { $ref: '#/components/schemas/Candidate' }
        noteId:
          allOf: [{ $ref: '#/components/schemas/NoteId' }]
          nullable: true
        sourceKept: { type: boolean, description: True when a source was sent but the candidate already had one. }
        salaryApplied:
          type: boolean
          description: "False when salary was sent but a later call (by its date) already set the salary: the salary follows the latest call."
        call: { $ref: '#/components/schemas/ScreeningCallSummary' }
    ScreeningCallSummary:
      type: object
      required: [id, calledOn, calledBy, calledByName, noteId, salaryRecorded, createdAt]
      properties:
        id: { type: string, example: scl_01jbz6w0m0k8q9x2r3s4t5v6w7 }
        calledOn: { type: string, format: date }
        calledBy: { $ref: '#/components/schemas/UserId' }
        calledByName: { type: string, nullable: true }
        noteId:
          allOf: [{ $ref: '#/components/schemas/NoteId' }]
          nullable: true
        salaryRecorded: { type: boolean, description: The call set the candidate's salary. }
        createdAt: { type: string, format: date-time }
    ScreeningCallList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ScreeningCallSummary' } }

    CandidateMerge:
      type: object
      additionalProperties: false
      required: [duplicateId, version]
      properties:
        duplicateId:
          description: The candidate to merge in (and delete).
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
        version: { type: integer, minimum: 1, description: The version of the candidate you keep. }
    CandidateFind:
      type: object
      required: [searches, skipped]
      properties:
        searches: { type: array, items: { $ref: '#/components/schemas/CandidateFindSearch' } }
        skipped: { type: integer, description: Searches past the sixth that were left out. }
    CandidateFindSearch:
      type: object
      required: [text, kind, company, error, items, similar, more, note]
      properties:
        text: { type: string, description: The search as typed. }
        kind: { type: string, enum: [name, email, phone] }
        company: { type: string, nullable: true, description: "From \"name - company\"." }
        error: { type: string, nullable: true, description: Why it could not be run as typed (nothing is searched). }
        items:
          type: array
          description: The matches (at most 10).
          items: { $ref: '#/components/schemas/CandidateFound' }
        similar:
          type: array
          description: "Names alike (each with its score) filling the rest of the 10, best first; for names only."
          items: { $ref: '#/components/schemas/CandidateFound' }
        more: { type: boolean, description: More matched than are shown. }
        note: { type: string, nullable: true, description: Something to check before trusting the matches. }
    CandidateFound:
      type: object
      required: [id, fullName, currentTitle, currentCompany, email, phone, employer, score]
      properties:
        id: { $ref: '#/components/schemas/CandidateId' }
        fullName: { type: string }
        currentTitle: { type: string, nullable: true }
        currentCompany: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        employer:
          description: "With a company searched for: where they work or worked there."
          allOf: [{ $ref: '#/components/schemas/CandidateFoundEmployer' }]
          nullable: true
        score: { type: number, nullable: true, description: "For names alike, how alike (0 to 1)." }
    CandidateFoundEmployer:
      type: object
      required: [company, title, current]
      properties:
        company: { type: string }
        title: { type: string, nullable: true }
        current: { type: boolean, description: "true: works there now; false: worked there." }
    UsedValues:
      type: object
      required: [tags, skills, industries, specializations]
      properties:
        tags: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        specializations: { type: array, items: { type: string } }

    SalaryCalculationInput:
      type: object
      additionalProperties: false
      required: [current, expected, rules]
      properties:
        current: { type: string, maxLength: 2000 }
        currentCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        expected: { type: string, maxLength: 2000 }
        rules: { $ref: '#/components/schemas/SalaryCalculationRules' }
    SalaryCalculation:
      type: object
      required: [base, allowances, bonus, monthly, annualMonths, warnings, excluded, hasCurrent, reviewRequired]
      properties:
        hasCurrent: { type: boolean }
        reviewRequired: { type: boolean }
        base: { type: string }
        allowances: { type: string }
        bonus: { type: string }
        monthly: { type: string }
        annualMonths: { type: number, format: double }
        currentCurrency: { type: string }
        expectedCurrency: { type: string }
        expectedMin: { type: string }
        expectedMax: { type: string }
        warnings: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
