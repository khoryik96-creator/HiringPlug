# Module contract: identity (tenants, users, who is signed in).
# See contracts/README.md for the format.
x-module:
  name: identity
  description: Tenants (companies using HiringPlug), their users, and who is signed in.
  permissions:
    identity.team:manage:
      description: Invite people, change roles, deactivate and reactivate users, and put them in teams.
      roles: [owner, admin]
    identity.roles:manage:
      description: Choose what each role may do and which candidates it sees (Roles and access). Only owners have it.
      roles: [owner]
  errorCodes:
    ROLE_NOT_EDITABLE:
      status: 422
      description: The owner role always has every permission and sees all candidates; it cannot be changed.
    SIGN_IN_FAILED:
      status: 401
      description: The email or password is wrong (which is not said), or the account is not active.
    SIGN_IN_CHOOSE_COMPANY:
      status: 409
      description: The email and password match accounts at several companies; send one of `details.companies` (slug) as `company`.
    TOO_MANY_ATTEMPTS:
      status: 429
      description: Too many attempts from this address or for this email; wait and try again.
    LINK_NOT_VALID:
      status: 410
      description: The invitation or password reset link was used, replaced or has expired.
    TEAM_CHANGE_NOT_ALLOWED:
      status: 422
      description: The change would break a team rule (your own role, the last owner, owners changed only by owners). The message says why.

paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who is signed in, their tenant, and what they may do
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: The company's active users (to pick interviewers, owners, ...)
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [identity]
      summary: Sign in with email and password
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInInput' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '409': { $ref: '#/components/responses/ChooseCompany' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Sign out, ending this session on the server too (its token stops working at once)
      x-permission: authenticated
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [identity]
      summary: Email a password reset link (the answer is the same whether or not the email is known)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: "If the email belongs to an active account, a link is on its way." }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/links/{linkToken}:
    parameters:
      - { name: linkToken, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 200 } }
    get:
      operationId: getAuthLink
      tags: [identity]
      summary: What an invitation or password reset link is for (to show before choosing a password)
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthLink' }
        '410': { $ref: '#/components/responses/LinkNotValid' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
    post:
      operationId: useAuthLink
      tags: [identity]
      summary: Choose a password with an invitation or reset link, and sign in
      description: An invitation activates the account; a reset signs out every other session.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoosePassword' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '410': { $ref: '#/components/responses/LinkNotValid' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/password:
    put:
      operationId: changePassword
      tags: [identity]
      summary: Change your password (signs out your other sessions)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: Changed; a new session for this browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/team:
    get:
      operationId: listTeam
      tags: [identity]
      summary: Everyone in the company, with invited and deactivated people
      x-permission: identity.team:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/team/invites:
    post:
      operationId: inviteUser
      tags: [identity]
      summary: Invite someone (emailed; the link is also in the answer, to pass on if email is not set up)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteInput' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/team/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    patch:
      operationId: updateTeamMember
      tags: [identity]
      summary: Change someone's role, or deactivate or reactivate them (deactivating signs them out)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/team/{userId}/invite:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    post:
      operationId: resendInvite
      tags: [identity]
      summary: Send someone who has not joined yet a new invitation (the old link stops working)
      x-permission: identity.team:manage
      responses:
        '201':
          description: Invited again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/access:
    get:
      operationId: getAccessSettings
      tags: [identity]
      summary: What each role may do and which candidates it sees, with every permission there is
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/access/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { $ref: '#/components/schemas/Role' } }
    put:
      operationId: setRoleAccess
      tags: [identity]
      summary: Choose a role's permissions and which candidates it sees (not the owner's)
      description: Takes effect on each user's next request. version is 0 while the role has the defaults.
      x-permission: identity.roles:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAccessInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAccess' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RoleNotEditable' }
    delete:
      operationId: resetRoleAccess
      tags: [identity]
      summary: Give a role its default permissions back (and all candidates)
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RoleNotEditable' }

  /v1/teams:
    get:
      operationId: listTeams
      tags: [identity]
      summary: The company's teams (groups of users, e.g. desks), with how many people are in each
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroupList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createTeam
      tags: [identity]
      summary: Add a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamGroupInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/teams/{teamId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { $ref: '#/components/schemas/TeamGroupId' } }
    patch:
      operationId: renameTeam
      tags: [identity]
      summary: Rename a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamGroupUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTeam
      tags: [identity]
      summary: Remove a team; its people stay, in no team
      x-permission: identity.team:manage
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    RoleNotEditable:
      description: The owner role cannot be changed (ROLE_NOT_EDITABLE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SignInFailed:
      description: Wrong email or password (SIGN_IN_FAILED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ChooseCompany:
      description: Choose the company (SIGN_IN_CHOOSE_COMPANY).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: Too many attempts (TOO_MANY_ATTEMPTS).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LinkNotValid:
      description: The link is no longer valid (LINK_NOT_VALID).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TeamChangeNotAllowed:
      description: Not allowed (TEAM_CHANGE_NOT_ALLOWED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    CandidateScope:
      type: string
      description: all = every candidate; team = those owned by the user's team (their own without a team); own = their own.
      enum: [all, team, own]
    RoleAccess:
      type: object
      required: [role, permissions, candidateScope, jobCandidates, custom, editable, version]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        candidateScope: { $ref: '#/components/schemas/CandidateScope' }
        jobCandidates:
          type: boolean
          description: With team or own, also the candidates on jobs the user (or their team) owns.
        custom: { type: boolean, description: The company changed this role from the defaults. }
        editable: { type: boolean, description: "False for the owner, who always has every permission and sees all candidates." }
        version: { type: integer, minimum: 0, description: 0 while the role has the defaults. }
    RoleAccessInput:
      type: object
      additionalProperties: false
      required: [version, permissions, candidateScope, jobCandidates]
      properties:
        version: { type: integer, minimum: 0 }
        permissions:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Permission' }
        candidateScope: { $ref: '#/components/schemas/CandidateScope' }
        jobCandidates: { type: boolean }
    PermissionInfo:
      type: object
      required: [permission, module, description, sensitive, defaultRoles]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        module: { type: string }
        description: { type: string }
        sensitive: { type: boolean, description: "Guards sensitive data such as salary." }
        defaultRoles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    AccessSettings:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleAccess' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionInfo' }
    TeamGroupId:
      type: string
      pattern: '^team_[0-9a-hjkmnp-tv-z]{26}$'
      example: team_01jbz6w0m0k8q9x2r3s4t5v6w7
    TeamGroup:
      type: object
      required: [id, version, name, memberCount]
      properties:
        id: { $ref: '#/components/schemas/TeamGroupId' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        memberCount: { type: integer, minimum: 0 }
    TeamGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamGroup' }
    TeamGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    TeamGroupUpdate:
      type: object
      additionalProperties: false
      required: [version, name]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
    UserSummary:
      type: object
      required: [id, name, role, canInterview]
      properties:
        canInterview: { type: boolean, description: "Their role may give interview feedback, so they can be an interviewer." }
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Me:
      type: object
      required: [user, tenant, role, permissions]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenant: { $ref: '#/components/schemas/Tenant' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        email: { type: string, format: email }
        name: { type: string }
    Tenant:
      type: object
      required: [id, name, careersSlug]
      properties:
        careersSlug:
          type: string
          description: The company's public careers page address, e.g. contoh-recruitment (/#/careers/contoh-recruitment).
        id: { $ref: '#/components/schemas/TenantId' }
        name: { type: string }
    SignInInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
        company: { type: string, maxLength: 100, description: "The company's careers page address (slug), when the account is at several companies." }
    Session:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string, description: "Send it as Authorization: Bearer <token>." }
        expiresAt: { type: string, format: date-time }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AuthLink:
      type: object
      required: [kind, email, name, companyName]
      properties:
        kind: { type: string, enum: [invite, reset] }
        email: { type: string }
        name: { type: string }
        companyName: { type: string }
    ChoosePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 10, maxLength: 200, description: At least 10 characters. }
        name: { type: string, minLength: 1, maxLength: 200, description: "Your name (an invitation can correct it)." }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 200 }
        newPassword: { type: string, minLength: 10, maxLength: 200 }
    TeamStatus:
      type: string
      description: invited = has not chosen a password yet; active; deactivated = cannot sign in.
      enum: [invited, active, deactivated]
    TeamMember:
      type: object
      required: [id, name, email, role, teamId, status, lastSignInAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        teamId:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TeamGroupId' }]
        status: { $ref: '#/components/schemas/TeamStatus' }
        lastSignInAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [member, link, expiresAt, emailed]
      properties:
        member: { $ref: '#/components/schemas/TeamMember' }
        link: { type: string, description: "The invitation link (also emailed), to pass on another way if needed." }
        expiresAt: { type: string, format: date-time }
        emailed: { type: boolean, description: "Whether an email was queued (it fails later if no mail server is set up)." }
    TeamMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        teamId:
          description: The team they are in; null for none.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TeamGroupId' }]

