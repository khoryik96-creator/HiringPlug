# Module contract: identity (tenants, users, who is signed in).
# See contracts/README.md for the format.
x-module:
  name: identity
  description: Tenants (companies using HyPlug), their users, and who is signed in.
  permissions:
    identity.team:manage:
      description: Invite people, change roles, deactivate and reactivate users, and put them in teams.
      roles: [owner, admin]
    identity.roles:manage:
      description: Choose what each role may do and which candidates it sees (Roles and access). Only owners have it.
      roles: [owner]
  errorCodes:
    ROLE_NOT_EDITABLE:
      status: 422
      description: The owner role always has every permission and sees all candidates; it cannot be changed.
    SIGN_IN_FAILED:
      status: 401
      description: The email or password is wrong (which is not said), or the account is not active.
    SIGN_IN_CHOOSE_COMPANY:
      status: 409
      description: The email and password (or the Microsoft account) match accounts at several companies; send one of `details.companies` (slug) as `company`. After Microsoft, send it with `details.ticket` (a new one-time ticket) to /v1/auth/microsoft/complete.
    MICROSOFT_SIGN_IN_FAILED:
      status: 401
      description: >-
        Signing in with Microsoft did not work. `details.reason` says why:
        `not_on_team` (the Microsoft account is not on the team of a company that signs in with Microsoft, or was deactivated: an owner invites them),
        `other_organisation` (an account of another Microsoft organisation than the company's, or a guest in it),
        `personal_account` (a personal Microsoft account: use the work account),
        `connect_first` (the account's address is an owner's, or someone's whose Microsoft account was unlinked: an account is never linked to them by its address; they connect it from Your account, signed in, or with an invitation or reconnect link an owner sent),
        `linked_elsewhere` (an invitation or reconnect link was used with a Microsoft account connected to someone else on the team),
        `already_connected` (a reconnect link was used by someone who has another Microsoft account connected: an owner unlinks it first),
        `failed` (the sign-in expired, was used already or finished in another browser, or Microsoft's answer could not be checked: start again).
    MICROSOFT_CONNECT_FAILED:
      status: 422
      description: >-
        Connecting your Microsoft account (Your account) did not work. `details.reason` says why:
        `already_connected` (one is connected to you already: an owner unlinks it on the Team page first),
        `linked_elsewhere` (that Microsoft account is connected to someone else on the team),
        `other_organisation`, `personal_account` or `failed` (as for signing in).
        Starting it asks for your current password (and your two-step code, when you use one): a wrong one is a 400 on `password` or `code`.
    MICROSOFT_SIGN_IN_UNAVAILABLE:
      status: 422
      description: Signing in with Microsoft is not set up for this company (or, when no company is named, on this server).
    MICROSOFT_REQUIRED:
      status: 403
      description: The company requires signing in with Microsoft. Passwords (signing in, password resets and links, sessions signed in with a password) then work only for owners.
    PASSWORD_NOT_SET:
      status: 422
      description: You sign in with Microsoft and have no HyPlug password to check or change. A password reset link sets one, unless the company requires Microsoft.
    TOO_MANY_ATTEMPTS:
      status: 429
      description: Too many attempts from this address or for this email; wait and try again.
    LINK_NOT_VALID:
      status: 410
      description: The invitation or password reset link was used, replaced or has expired.
    TWO_STEP_REQUIRED:
      status: 401
      description: The password was right; send the authenticator app's code (or a recovery code) with `details.challenge` to /v1/auth/two-step.
    TWO_STEP_SETUP_REQUIRED:
      status: 401
      description: The company requires two-step sign-in and this person has not set it up; add an authenticator app with `details.challenge` (/v1/auth/two-step/setup).
    TWO_STEP_NOT_ENABLED:
      status: 422
      description: Set up two-step sign-in for yourself before requiring it of everyone.
    TEAM_CHANGE_NOT_ALLOWED:
      status: 422
      description: The change would break a team rule (your own role, the last owner, owners changed only by owners). The message says why.

paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who is signed in, their tenant, and what they may do
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/agency:
    put:
      operationId: renameAgency
      tags: [identity]
      summary: Rename your agency (company)
      description: >
        The name shows on formatted CVs and their file names ("Hyppies CV -
        Siti Aisyah.docx"), on the careers page and in the app. The careers
        page address stays the same.
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyRename' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: The company's active users (to pick interviewers, owners, ...)
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [identity]
      summary: Sign in with email and password
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInInput' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '403': { $ref: '#/components/responses/MicrosoftRequired' }
        '409': { $ref: '#/components/responses/ChooseCompany' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/two-step:
    post:
      operationId: signInTwoStep
      tags: [identity]
      summary: Finish signing in with the authenticator app's code, or a recovery code (each works once)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepSignIn' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '403': { $ref: '#/components/responses/MicrosoftRequired' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/two-step/setup:
    post:
      operationId: startTwoStepAtSignIn
      tags: [identity]
      summary: Add an authenticator app while signing in, when the company requires two-step sign-in
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepChallenge' }
      responses:
        '200':
          description: The app's secret, to scan or type in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepSetup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/two-step/setup/confirm:
    post:
      operationId: confirmTwoStepAtSignIn
      tags: [identity]
      summary: Confirm the app with its first code; signs in and gives the recovery codes (shown once)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepSignIn' }
      responses:
        '200':
          description: Set up and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepEnabled' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '403': { $ref: '#/components/responses/MicrosoftRequired' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/two-step:
    get:
      operationId: getMyTwoStep
      tags: [identity]
      summary: Whether your two-step sign-in is on, recovery codes left, and whether your company requires it
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/two-step/setup:
    post:
      operationId: startMyTwoStep
      tags: [identity]
      summary: Start adding an authenticator app (a new secret; an app added before keeps working until the new one is confirmed)
      x-permission: authenticated
      responses:
        '200':
          description: The app's secret, to scan or type in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepSetup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/two-step/confirm:
    post:
      operationId: confirmMyTwoStep
      tags: [identity]
      summary: Confirm the app with its first code; turns two-step sign-in on and gives the recovery codes (shown once)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepCode' }
      responses:
        '200':
          description: On
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepRecoveryCodes' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/two-step/recovery-codes:
    post:
      operationId: newRecoveryCodes
      tags: [identity]
      summary: New recovery codes (the old ones stop working), with a code from the app
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepCode' }
      responses:
        '200':
          description: The new codes (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepRecoveryCodes' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/two-step/disable:
    post:
      operationId: disableMyTwoStep
      tags: [identity]
      summary: Turn your two-step sign-in off, with your password, or the app's code if you have no password (not while your company requires it)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepDisable' }
      responses:
        '200':
          description: Off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepStatus' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/team/{userId}/two-step:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    delete:
      operationId: resetTwoStep
      tags: [identity]
      summary: Reset someone's two-step sign-in (a lost phone); they set it up again at their next sign-in if the company requires it
      x-permission: identity.team:manage
      responses:
        '204': { description: Reset }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/agency/two-step:
    put:
      operationId: setTwoStepRequired
      tags: [identity]
      summary: Require two-step sign-in of everyone at the company (those without it are signed out and set it up at their next sign-in)
      x-permission: identity.roles:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoStepPolicy' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoStepPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TwoStepNotEnabled' }

  /v1/auth/microsoft/start:
    post:
      operationId: startMicrosoftSignIn
      tags: [identity]
      summary: Start signing in with Microsoft (send the browser to the returned address)
      description: >-
        The company is found from, in order: the invitation, the careers page
        address (company), the only company on the server that signs in with
        Microsoft, or else the server's own Microsoft app for any company
        (matched after sign-in by organisation and account). An invitation
        or reconnect link (invite) links the Microsoft account to its person,
        whatever the account's address (an account of the company's
        organisation, connected to nobody else there). The email is
        only suggested to Microsoft: it never chooses the company, so the
        answer never shows where an email is on a team.
        Keep a random value (at least 32 characters) in this browser tab's
        sessionStorage, send its SHA-256 here, and the value itself to finish:
        a sign-in can be finished only in the tab that started it.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrosoftSignInStart' }
      responses:
        '200':
          description: Where to send the browser (Microsoft's sign-in page)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MicrosoftSignInRedirect' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '410': { $ref: '#/components/responses/LinkNotValid' }
        '422': { $ref: '#/components/responses/MicrosoftSignInUnavailable' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/microsoft/callback:
    get:
      operationId: microsoftSignInCallback
      tags: [identity]
      summary: Where Microsoft sends the browser back (register this address as the app's redirect URI)
      description: >-
        Nothing is signed in here: the code is kept for the sign-in that sent
        the browser, and the browser goes back to the app
        (/#/sign-in/microsoft) with a one-time ticket, or with error=cancelled
        or error=failed. Microsoft's own error text is never passed on.
      x-permission: public
      security: []
      parameters:
      - { in: query, name: code, schema: { type: string, maxLength: 4096 } }
      - { in: query, name: state, schema: { type: string, maxLength: 4096 } }
      - { in: query, name: error, schema: { type: string, maxLength: 4096 } }
      responses:
        '303':
          description: Back to the app's Microsoft sign-in page
          headers:
            Cache-Control: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string } }
            Location:
              schema:
                type: string

  /v1/auth/microsoft/complete:
    post:
      operationId: completeMicrosoftSignIn
      tags: [identity]
      summary: Finish signing in with Microsoft, in the browser tab that started it
      description: >-
        Send the ticket from the address Microsoft's sign-in came back to, and
        the value whose SHA-256 the start sent. A ticket works once.
        Microsoft sign-ins skip the two-step code.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrosoftSignInComplete' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/MicrosoftSignInFailed' }
        '409': { $ref: '#/components/responses/ChooseCompany' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/microsoft/start:
    post:
      operationId: startConnectingMicrosoft
      tags: [identity]
      summary: Connect your Microsoft work account, to sign in with it (send the browser to the returned address)
      description: >-
        Signed in (with a session, not an API key), at a company that signs in
        with Microsoft, and proving it is you: your current password, and
        your two-step code (or a recovery code) when you use two-step sign-in
        (rate limited like changing your password). Microsoft's redirect
        comes back to /#/sign-in/microsoft as for signing in; finish with
        /v1/me/microsoft/complete in this browser tab, still signed in. The
        way owners link a Microsoft account (never linked to them by its
        address alone); anyone else may use it too. They are emailed.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrosoftConnectStart' }
      responses:
        '200':
          description: Where to send the browser (Microsoft's sign-in page)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MicrosoftSignInRedirect' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/MicrosoftConnectFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/microsoft/complete:
    post:
      operationId: finishConnectingMicrosoft
      tags: [identity]
      summary: Finish connecting your Microsoft account, in the browser tab that started it
      description: Signed in with a session (not an API key). The account must be of the company's organisation (not a guest) and connected to nobody else on the team. Audited (user.microsoft_linked, by self).
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrosoftConnectComplete' }
      responses:
        '204': { description: Connected }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/MicrosoftConnectFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/team/{userId}/microsoft:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    delete:
      operationId: unlinkMicrosoft
      tags: [identity]
      summary: Unlink someone's Microsoft account; their Microsoft sessions end (only owners unlink owners)
      description: >-
        From then on a Microsoft account is linked to them only on purpose,
        never by a sign-in's address: they connect one from Your account
        (with their password), or with a reconnect link an owner sends
        (POST /v1/team/{userId}/microsoft/reconnect). Audited
        (user.microsoft_unlinked).
      x-permission: identity.team:manage
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/team/{userId}/microsoft/reconnect:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    post:
      operationId: sendMicrosoftReconnectLink
      tags: [identity]
      summary: Email someone a link to (re)connect their Microsoft account, whatever its address (7 days, once; only owners for owners; not yourself)
      description: >-
        For someone whose Microsoft account was unlinked, or whose sign-in
        name differs from their HyPlug email. Signing in with Microsoft
        from the link links the account to them: an account of the company's
        organisation, connected to nobody else there. The link goes only to
        their HyPlug email, never to whoever sends it (it would let them
        sign in as that person). Yourself: connect from Your account. A newer
        link replaces the older one. Audited (user.microsoft_reconnect_sent).
      x-permission: identity.team:manage
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MicrosoftReconnectLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/agency/microsoft-sign-in:
    get:
      operationId: getMicrosoftSignIn
      tags: [identity]
      summary: The company's sign-in with Microsoft settings, and the address to register with the app
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MicrosoftSignInSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: setMicrosoftSignIn
      tags: [identity]
      summary: Let the team sign in with Microsoft (accounts of the company's own organisation only), and require it
      description: >-
        Requiring Microsoft refuses passwords to everyone but owners at once:
        signing in, password resets and links, and sessions signed in with a
        password. Turning it off ends sessions signed in with Microsoft;
        changing the organisation ends them too, and removes links to
        Microsoft accounts of any other organisation (the audit entry counts
        them: linksRemoved).
      x-permission: identity.roles:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MicrosoftSignInInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MicrosoftSignInSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/renew:
    post:
      operationId: renewSession
      tags: [identity]
      summary: Keep working signed in (the same session, 12 hours from now)
      description: >
        The web app renews its sign-in while the person is working, so a long
        day never signs them out mid-task. The session stays the one signed
        in: signing out, a password change or a deactivation still ends it.
        Not for API keys.
      x-permission: authenticated
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Sign out, ending this session on the server too (its token stops working at once)
      x-permission: authenticated
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [identity]
      summary: Email a password reset link (the answer is the same whether or not the email is known)
      description: Someone whose company requires Microsoft (and who is not an owner there) is emailed how to sign in instead of a link.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: "If the email belongs to an active account, a link is on its way." }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/links/{linkToken}:
    parameters:
      - { name: linkToken, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 200 } }
    get:
      operationId: getAuthLink
      tags: [identity]
      summary: What an invitation or password reset link is for (to show before choosing a password)
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthLink' }
        '410': { $ref: '#/components/responses/LinkNotValid' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
    post:
      operationId: useAuthLink
      tags: [identity]
      summary: Choose a password with an invitation or reset link, and sign in
      description: An invitation activates the account; a reset signs out every other session. Not for anyone but owners while the company requires Microsoft (they accept an invitation with Microsoft). Never with a reconnect link (410).
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoosePassword' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/SignInFailed' }
        '403': { $ref: '#/components/responses/MicrosoftRequired' }
        '410': { $ref: '#/components/responses/LinkNotValid' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [identity]
      summary: Your own settings, such as the columns of your candidate list, your dashboard's order and its getting-started checklist
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: putMyPreferences
      tags: [identity]
      summary: Change your own settings (no one else's)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/password:
    put:
      operationId: changePassword
      tags: [identity]
      summary: Change your password (signs out your other sessions)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: Changed; a new session for this browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MicrosoftRequired' }
        '422': { $ref: '#/components/responses/PasswordNotSet' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/team:
    get:
      operationId: listTeam
      tags: [identity]
      summary: Everyone in the company, with invited and deactivated people
      x-permission: identity.team:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/team/invites:
    post:
      operationId: inviteUser
      tags: [identity]
      summary: Invite someone (emailed; the link is also in the answer, to pass on if email is not set up)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteInput' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/team/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    patch:
      operationId: updateTeamMember
      tags: [identity]
      summary: Change someone's role, or deactivate or reactivate them (deactivating signs them out)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/team/{userId}/invite:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    post:
      operationId: resendInvite
      tags: [identity]
      summary: Send someone who has not joined yet a new invitation (the old link stops working)
      x-permission: identity.team:manage
      responses:
        '201':
          description: Invited again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }
    delete:
      operationId: cancelInvite
      tags: [identity]
      summary: Cancel the invitation of someone who has not joined yet (their link stops working at once)
      description: >
        For an invitation sent to the wrong address or person. They are removed from the team list and can be
        invited again later. Someone who has joined is deactivated instead (PATCH).
      x-permission: identity.team:manage
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/TeamChangeNotAllowed' }

  /v1/access:
    get:
      operationId: getAccessSettings
      tags: [identity]
      summary: What each role may do and which candidates it sees, with every permission there is
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/access/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { $ref: '#/components/schemas/Role' } }
    put:
      operationId: setRoleAccess
      tags: [identity]
      summary: Choose a role's permissions and which candidates it sees (not the owner's)
      description: Takes effect on each user's next request. version is 0 while the role has the defaults.
      x-permission: identity.roles:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAccessInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAccess' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RoleNotEditable' }
    delete:
      operationId: resetRoleAccess
      tags: [identity]
      summary: Give a role its default permissions back (and all candidates)
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RoleNotEditable' }

  /v1/teams:
    get:
      operationId: listTeams
      tags: [identity]
      summary: The company's teams (groups of users, e.g. desks), with how many people are in each
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroupList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createTeam
      tags: [identity]
      summary: Add a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamGroupInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/teams/{teamId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { $ref: '#/components/schemas/TeamGroupId' } }
    patch:
      operationId: renameTeam
      tags: [identity]
      summary: Rename a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamGroupUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamGroup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTeam
      tags: [identity]
      summary: Remove a team; its people stay, in no team
      x-permission: identity.team:manage
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    RoleNotEditable:
      description: The owner role cannot be changed (ROLE_NOT_EDITABLE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SignInFailed:
      description: Wrong email, password or code (SIGN_IN_FAILED), or a code is needed next (TWO_STEP_REQUIRED, TWO_STEP_SETUP_REQUIRED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ChooseCompany:
      description: Choose the company (SIGN_IN_CHOOSE_COMPANY).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TwoStepNotEnabled:
      description: Set up two-step sign-in for yourself first (TWO_STEP_NOT_ENABLED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyAttempts:
      description: Too many attempts (TOO_MANY_ATTEMPTS).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LinkNotValid:
      description: The link is no longer valid (LINK_NOT_VALID).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TeamChangeNotAllowed:
      description: Not allowed (TEAM_CHANGE_NOT_ALLOWED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MicrosoftSignInFailed:
      description: Signing in with Microsoft did not work (MICROSOFT_SIGN_IN_FAILED; details.reason says why).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MicrosoftConnectFailed:
      description: Connecting your Microsoft account did not work (MICROSOFT_CONNECT_FAILED; details.reason says why).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MicrosoftSignInUnavailable:
      description: Signing in with Microsoft is not set up (MICROSOFT_SIGN_IN_UNAVAILABLE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MicrosoftRequired:
      description: The company requires signing in with Microsoft (MICROSOFT_REQUIRED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PasswordNotSet:
      description: You sign in with Microsoft and have no password (PASSWORD_NOT_SET).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    CandidateScope:
      type: string
      description: all = every candidate; team = those owned by the user's team (their own without a team); own = their own.
      enum: [all, team, own]
    RoleAccess:
      type: object
      required: [role, permissions, candidateScope, jobCandidates, custom, editable, version]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        candidateScope: { $ref: '#/components/schemas/CandidateScope' }
        jobCandidates:
          type: boolean
          description: With team or own, also the candidates on jobs the user (or their team) owns.
        custom: { type: boolean, description: The company changed this role from the defaults. }
        editable: { type: boolean, description: "False for the owner, who always has every permission and sees all candidates." }
        version: { type: integer, minimum: 0, description: 0 while the role has the defaults. }
    RoleAccessInput:
      type: object
      additionalProperties: false
      required: [version, permissions, candidateScope, jobCandidates]
      properties:
        version: { type: integer, minimum: 0 }
        permissions:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Permission' }
        candidateScope: { $ref: '#/components/schemas/CandidateScope' }
        jobCandidates: { type: boolean }
    PermissionInfo:
      type: object
      required: [permission, module, description, sensitive, defaultRoles]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        module: { type: string }
        description: { type: string }
        sensitive: { type: boolean, description: "Guards sensitive data such as salary." }
        defaultRoles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    AccessSettings:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleAccess' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionInfo' }
    TeamGroupId:
      type: string
      pattern: '^team_[0-9a-hjkmnp-tv-z]{26}$'
      example: team_01jbz6w0m0k8q9x2r3s4t5v6w7
    TeamGroup:
      type: object
      required: [id, version, name, memberCount]
      properties:
        id: { $ref: '#/components/schemas/TeamGroupId' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        memberCount: { type: integer, minimum: 0 }
    TeamGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamGroup' }
    TeamGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    TeamGroupUpdate:
      type: object
      additionalProperties: false
      required: [version, name]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
    UserSummary:
      type: object
      required: [id, name, role, canInterview]
      properties:
        canInterview: { type: boolean, description: "Their role may give interview feedback, so they can be an interviewer." }
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Preferences:
      type: object
      additionalProperties: false
      description: Saving sends only the settings it changes; one left out keeps its value.
      properties:
        dashboardBlocks:
          type: array
          nullable: true
          maxItems: 20
          uniqueItems: true
          description: "The dashboard's blocks below search, in the order you dragged them (null: the default order)."
          items: { $ref: '#/components/schemas/DashboardBlock' }
        candidateColumns:
          type: array
          nullable: true
          maxItems: 20
          uniqueItems: true
          description: "The candidate list's columns, in order, after the name (null: the default ones)."
          items: { $ref: '#/components/schemas/CandidateColumn' }
        favourites: { $ref: '#/components/schemas/Favourites' }
        guideDismissed:
          type: boolean
          description: "You hid the dashboard's getting-started checklist (false: it shows while a step you can do is left)."
    Favourites:
      type: object
      additionalProperties: false
      description: >-
        Your favourites in the dropdowns, shown first for you only. Saving
        sends the kinds it changes; a kind left out keeps its favourites.
        Nothing is removed from the lists themselves, and every item can
        still be chosen.
      properties:
        specialization: { $ref: '#/components/schemas/FavouriteWords' }
        itSkill: { $ref: '#/components/schemas/FavouriteWords' }
        certification: { $ref: '#/components/schemas/FavouriteWords' }
        industry:
          type: array
          maxItems: 300
          uniqueItems: true
          description: Industries and subindustries (catalogue IDs), in the order you chose them.
          items: { type: string, minLength: 1, maxLength: 64 }
        country:
          type: array
          maxItems: 300
          uniqueItems: true
          description: Countries (2-letter codes), always at the top of country dropdowns.
          items: { type: string, pattern: '^[A-Z]{2}$' }
    FavouriteWords:
      type: array
      maxItems: 300
      uniqueItems: true
      description: Words of a Settings list, in the order you chose them.
      items: { type: string, minLength: 1, maxLength: 200 }
    DashboardBlock:
      type: string
      description: A block of the dashboard that can be moved.
      enum: [numbers, needsYou, import, tasks, offersToApprove, interviews, activity, openJobs]
    CandidateColumn:
      type: string
      description: A column the candidate list can show.
      enum: [currentRole, status, noticePeriod, currentSalary, expectedSalary, workAuthorization, nationality, residence, location, source, industry, tags, email, phone, updated]
    Me:
      type: object
      required: [user, tenant, role, permissions, hasPassword, microsoftSignIn, microsoftLinked]
      properties:
        microsoftSignIn: { type: boolean, description: "Your company lets the team sign in with Microsoft." }
        microsoftLinked: { type: boolean, description: "A Microsoft account is linked to you (you can sign in with it)." }
        signInMethod:
          description: How this session was signed in (left out for sessions from before 1.46.0).
          allOf: [{ $ref: '#/components/schemas/SignInMethod' }]
        hasPassword: { type: boolean, description: "False for people who sign in with Microsoft only: there is no password to change." }
        user: { $ref: '#/components/schemas/User' }
        tenant: { $ref: '#/components/schemas/Tenant' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        email: { type: string, format: email }
        name: { type: string }
    AgencyRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: Hyppies }
    Tenant:
      type: object
      required: [id, name, careersSlug]
      properties:
        careersSlug:
          type: string
          description: The company's public careers page address, e.g. contoh-recruitment (/#/careers/contoh-recruitment).
        id: { $ref: '#/components/schemas/TenantId' }
        name: { type: string }
    SignInInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
        company: { type: string, maxLength: 100, description: "The company's careers page address (slug), when the account is at several companies." }
    Session:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string, description: "Send it as Authorization: Bearer <token>." }
        expiresAt: { type: string, format: date-time }
    TwoStepChallenge:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string, minLength: 1, maxLength: 1000, description: "From the sign-in answer's details.challenge (valid 10 minutes)." }
    TwoStepSignIn:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge: { type: string, minLength: 1, maxLength: 1000 }
        code: { type: string, minLength: 1, maxLength: 20, description: "The app's 6-digit code, or a recovery code (abcde-fghjk)." }
    TwoStepCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
    TwoStepDisable:
      type: object
      additionalProperties: false
      description: Your password; or, if you sign in with Microsoft and have none, the app's current code.
      properties:
        password: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, minLength: 1, maxLength: 20 }
    TwoStepSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: The key to type into the app if it cannot scan. }
        uri: { type: string, description: "otpauth:// address, shown as a QR code to scan." }
    TwoStepRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
          description: Each signs in once instead of a code; shown only now.
    TwoStepEnabled:
      type: object
      required: [session, recoveryCodes]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        recoveryCodes:
          type: array
          items: { type: string }
    TwoStepStatus:
      type: object
      required: [enabled, enabledAt, recoveryCodesLeft, required]
      properties:
        enabled: { type: boolean }
        enabledAt: { type: string, format: date-time, nullable: true }
        recoveryCodesLeft: { type: integer }
        required: { type: boolean, description: The company requires two-step sign-in of everyone. }
    TwoStepPolicy:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required: { type: boolean }
    SignInMethod:
      type: string
      description: password, or microsoft (Sign in with Microsoft).
      enum: [password, microsoft]
    MicrosoftSignInStart:
      type: object
      additionalProperties: false
      required: [bindingHash]
      properties:
        bindingHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 (hex) of a random value (at least 32 characters) this browser tab keeps in sessionStorage until it finishes.
        email: { type: string, format: email, maxLength: 254, description: "The email they typed: suggested to Microsoft (it does not choose the company)." }
        company: { type: string, maxLength: 100, description: "The company's careers page address (slug)." }
        invite: { type: string, minLength: 20, maxLength: 200, description: "An invitation link's token (accept it with Microsoft instead of choosing a password), or a reconnect link's." }
    MicrosoftConnectStart:
      type: object
      additionalProperties: false
      required: [bindingHash]
      properties:
        password: { type: string, minLength: 1, maxLength: 200, description: "Your current password (needed if you have one)." }
        code: { type: string, minLength: 1, maxLength: 20, description: "Your authenticator app's current code, or a recovery code (needed if you use two-step sign-in)." }
        bindingHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 (hex) of a random value (at least 32 characters) this browser tab keeps in sessionStorage until it finishes.
    MicrosoftConnectComplete:
      type: object
      additionalProperties: false
      required: [ticket, binding]
      properties:
        ticket: { type: string, minLength: 20, maxLength: 200, description: "From the app address Microsoft's sign-in came back to." }
        binding: { type: string, minLength: 32, maxLength: 200, description: "The value whose SHA-256 the start sent." }
    MicrosoftSignInRedirect:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Microsoft's sign-in page; it comes back to /v1/auth/microsoft/callback." }
    MicrosoftSignInComplete:
      type: object
      additionalProperties: false
      required: [ticket, binding]
      properties:
        ticket: { type: string, minLength: 20, maxLength: 200, description: "From the app address Microsoft's sign-in came back to (or details.ticket of SIGN_IN_CHOOSE_COMPANY)." }
        binding: { type: string, minLength: 32, maxLength: 200, description: "The value whose SHA-256 the start sent." }
        company: { type: string, maxLength: 100, description: "The company's careers page address, when the account is at several." }
    MicrosoftSignInSettings:
      type: object
      required: [enabled, organisationId, required, callbackUrl, appSource, clientId, acctClaimMissing]
      properties:
        enabled: { type: boolean, description: The team may sign in with Microsoft accounts of the organisation. }
        organisationId:
          type: string
          nullable: true
          description: "The company's Microsoft organisation (Entra tenant ID, e.g. 72f988bf-86f1-41af-91ab-2d7cd011db47): only its accounts are accepted."
        required: { type: boolean, description: "Passwords work only for owners: everyone else signs in with Microsoft." }
        callbackUrl: { type: string, description: "The redirect URI to register with the Microsoft app (Web platform)." }
        appSource:
          type: string
          enum: [agency, server, none]
          description: "Whose Microsoft app is used: the company's (Settings > Email connection), the server's, or none yet."
        clientId: { type: string, nullable: true }
        acctClaimMissing:
          type: boolean
          description: "The last Microsoft sign-in came without the optional acct claim: guests cannot be told from members, so no account is linked by its address until it is added in Entra (Token configuration)."
    MicrosoftReconnectLink:
      type: object
      required: [expiresAt, emailed]
      description: The link is emailed to the person only (it is not shown to whoever sends it).
      properties:
        expiresAt: { type: string, format: date-time }
        emailed: { type: boolean, description: "Whether an email was queued (it fails later if no mail server is set up)." }
    MicrosoftSignInInput:
      type: object
      additionalProperties: false
      required: [enabled, organisationId, required]
      properties:
        enabled: { type: boolean }
        organisationId: { type: string, nullable: true, maxLength: 64 }
        required: { type: boolean }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AuthLink:
      type: object
      required: [kind, email, name, companyName, microsoft]
      properties:
        microsoft:
          type: string
          enum: [none, available, required]
          description: "Whether this person can accept with Microsoft instead (/v1/auth/microsoft/start with invite), or must (the company requires Microsoft and they are not an owner: choosing a password is refused). Always required for a reconnect link."
        kind: { type: string, enum: [invite, reset, reconnect], description: "reconnect: an owner's link to connect a Microsoft account (/v1/auth/microsoft/start with invite); no password is chosen with it." }
        email: { type: string }
        name: { type: string }
        companyName: { type: string }
    ChoosePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 10, maxLength: 200, description: At least 10 characters. }
        name: { type: string, minLength: 1, maxLength: 200, description: "Your name (an invitation can correct it)." }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 200 }
        newPassword: { type: string, minLength: 10, maxLength: 200 }
    TeamStatus:
      type: string
      description: invited = has not chosen a password yet; active; deactivated = cannot sign in.
      enum: [invited, active, deactivated]
    TeamMember:
      type: object
      required: [id, name, email, role, teamId, status, lastSignInAt, createdAt, twoStep, signInMethods]
      properties:
        signInMethods:
          type: array
          description: "How they can sign in: with a password they chose, with the Microsoft account linked to them, or both (none while invited)."
          items: { $ref: '#/components/schemas/SignInMethod' }
        twoStep: { type: boolean, description: Signs in with a code from an authenticator app too. }
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        teamId:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TeamGroupId' }]
        status: { $ref: '#/components/schemas/TeamStatus' }
        lastSignInAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [member, link, expiresAt, emailed, delivery]
      properties:
        member: { $ref: '#/components/schemas/TeamMember' }
        link: { type: string, description: "The invitation link (also emailed), to pass on another way if needed." }
        expiresAt: { type: string, format: date-time }
        emailed: { type: boolean, description: "Whether it is on its way to them (delivery server or mailbox)." }
        delivery:
          type: string
          enum: [server, mailbox, test_inbox, none]
          description: >
            How the invitation goes: server, from the server's mail (HP_SMTP_*); mailbox, from the inviter's own
            connected mailbox (the server's mail is not set up); test_inbox, held in the server's test inbox
            (Mailpit), never reaching them; none, nothing can send it (no server mail, no connected mailbox).
            With test_inbox or none, pass the link on another way.
    TeamMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        teamId:
          description: The team they are in; null for none.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TeamGroupId' }]

