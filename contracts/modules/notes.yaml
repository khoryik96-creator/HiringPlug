# Module contract: notes (screening, interview, call and general notes on
# candidates, jobs, companies and contacts) and the activity timeline of a
# record (from the audit log). See contracts/README.md.
x-module:
  name: notes
  description: Notes on records, and what changed on them (activity).
  permissions:
    notes:read:
      description: Read notes (sensitive ones need notes.sensitive:read).
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    notes:create:
      description: Write notes, and delete your own.
      roles: [owner, admin, recruiter, sourcer, hiring_manager]
    notes:manage:
      description: Delete anyone's notes.
      roles: [owner, admin]
    notes.sensitive:read:
      description: Read notes marked sensitive (e.g. salary talks), and mark notes sensitive.
      sensitive: true
      roles: [owner, admin, recruiter]
    notes.activity:read:
      description: See the history of changes on a record.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
  errorCodes: {}
  jobs: {}

paths:
  /v1/notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: The notes on a record, newest first
      description: Sensitive notes are left out without notes.sensitive:read; `hiddenSensitive` says how many.
      x-permission: notes:read
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/NoteSubjectType' }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createNote
      tags: [notes]
      summary: Write a note on a record
      x-permission: notes:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/NoteId' }
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note (your own, or any with notes:manage)
      x-permission: notes:create
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/activity:
    get:
      operationId: listActivity
      tags: [notes]
      summary: What changed on a record, who changed it and when, newest first
      description: Salary changes say only that they changed, never the amounts.
      x-permission: notes.activity:read
      parameters:
        - name: entityType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ActivityEntityType' }
        - name: entityId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  schemas:
    NoteId:
      type: string
      pattern: '^note_[0-9a-hjkmnp-tv-z]{26}$'
      example: note_01jbz6w0m0k8q9x2r3s4t5v6w7
    NoteSubjectType:
      type: string
      enum: [candidate, job, company, contact]
    NoteKind:
      type: string
      enum: [general, screening, interview, call, reference]
    Note:
      type: object
      required: [id, subjectType, subjectId, kind, body, sensitive, authorId, authorName, createdAt]
      properties:
        id: { $ref: '#/components/schemas/NoteId' }
        subjectType: { $ref: '#/components/schemas/NoteSubjectType' }
        subjectId: { type: string }
        kind: { $ref: '#/components/schemas/NoteKind' }
        body: { type: string }
        sensitive: { type: boolean, description: Only readable with notes.sensitive:read. }
        authorId: { $ref: '#/components/schemas/UserId' }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
    NoteList:
      type: object
      required: [items, hiddenSensitive]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        hiddenSensitive:
          type: integer
          description: How many sensitive notes were left out because you may not read them.
    NoteCreate:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, body]
      properties:
        subjectType: { $ref: '#/components/schemas/NoteSubjectType' }
        subjectId: { type: string, minLength: 1, maxLength: 40 }
        kind:
          allOf: [{ $ref: '#/components/schemas/NoteKind' }]
          description: Defaults to general.
        body: { type: string, minLength: 1, maxLength: 10000 }
        sensitive: { type: boolean, description: Needs notes.sensitive:read. Defaults to false. }

    ActivityEntityType:
      type: string
      enum: [candidate, job, company, contact, application]
    ActivityEntry:
      type: object
      required: [id, action, actorName, changes, at]
      properties:
        id: { type: string }
        action: { type: string, description: 'What happened, e.g. candidate.updated or application.moved.' }
        actorName: { type: string, description: 'Who did it (a user, or "System" for background work).' }
        changes:
          type: object
          additionalProperties: true
          description: 'Changed fields as {"field": {"from": old, "to": new}}; sensitive ones as {"changed": true, "redacted": true}.'
        at: { type: string, format: date-time }
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEntry' }
