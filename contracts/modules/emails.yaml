# Module contract: emails (templates, sending, and the record of what was sent).
# See contracts/README.md for the format.
x-module:
  name: emails
  description: >
    Email from the app: formatted templates with fields ([First name],
    [Expected salary], ...) filled from the candidate, job, interview and
    sender; cc and bcc; image banners; attachments (the candidate's CVs or
    files from the computer); messages sent through the company's mail
    server in the background; a record of each one on the candidate's
    timeline. Replies go to the person who sent it. Salary fields fill only
    for senders who may see salaries, and by default an email with salary in
    it is hidden from roles that may not (Settings can show it to all).
  permissions:
    emails:read:
      description: See emails sent from the app.
      roles: [owner, admin, recruiter, sourcer, hiring_manager]
    emails:send:
      description: Send email from the app.
      roles: [owner, admin, recruiter, sourcer]
    emails.templates:create:
      description: "Add new email templates, e.g. save an email being written as one (changing or deleting templates needs emails.templates:manage)."
      roles: [owner, admin, recruiter, sourcer]
    emails.templates:manage:
      description: "Change and delete the company's email templates, and add banners (admins: give it to the people you trust)."
      roles: [owner, admin]
    emails.apps:manage:
      description: "Enter the agency's Microsoft and Google app details (client ID and secret) that let people connect their mailbox."
      roles: [owner, admin]
  errorCodes:
    EMAIL_DO_NOT_CONTACT:
      status: 409
      description: The candidate withdrew consent to be contacted (see their data protection panel), so no email is sent to them.
    EMAIL_UNDELIVERABLE:
      status: 409
      description: An automated email's recipient is a contact who has left, or whose mailbox does not exist (it would bounce), so it is not sent.
  jobs:
    email.send:
      queue: core
      payload: EmailSendJob
      priority: high
      description: Send one queued email through the mail server (Go worker).
    email.bounce_scan:
      queue: core
      payload: EmailBounceScanJob
      description: Look in the sending Microsoft 365 mailbox's inbox for bounce notices about a sent email (Go worker).

paths:
  /v1/mailbox:
    get:
      operationId: getMailboxConnection
      tags:
      - emails
      summary: getMailboxConnection
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveSmtpMailbox
      tags:
      - emails
      summary: saveSmtpMailbox
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxStatus'
        '409': { $ref: '#/components/responses/Conflict' }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpMailboxInput'
    delete:
      operationId: disconnectMailbox
      tags:
      - emails
      summary: disconnectMailbox
      x-permission: emails:send
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mailbox/authorize:
    post:
      operationId: authorizeMailbox
      tags:
      - emails
      summary: authorizeMailbox
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxAuthorization'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxAuthorizeInput'
  /v1/mailbox/callback:
    get:
      operationId: completeMailboxAuthorization
      tags:
      - emails
      summary: Complete mailbox sign-in
      x-permission: public
      security: []
      parameters:
      - in: query
        name: code
        schema:
          type: string
          maxLength: 4096
      - in: query
        name: state
        schema:
          type: string
          maxLength: 4096
      - in: query
        name: error
        schema:
          type: string
          maxLength: 4096
      responses:
        '303':
          description: Return to email connection settings
          headers:
            Cache-Control: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string } }
            Location:
              schema:
                type: string
  /v1/email-templates:
    get:
      operationId: listEmailTemplates
      tags: [emails]
      summary: The company's email templates (starter templates are added the first time)
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplateList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEmailTemplate
      tags: [emails]
      summary: Add a template
      x-permission: emails.templates:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/email-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/EmailTemplateIdPath'
    put:
      operationId: updateEmailTemplate
      tags: [emails]
      summary: Change a template
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteEmailTemplate
      tags: [emails]
      summary: Delete a template
      x-permission: emails.templates:manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/email-previews:
    post:
      operationId: previewEmail
      tags: [emails]
      summary: Fill an email's fields for a candidate (and a job or interview), to see before sending
      description: >
        Fields ([Current salary], {{candidate.firstName}}, ...) are filled as
        sending would fill them; those without a value stay in brackets and
        are listed in `missing` (sending refuses them).
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailPreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailPreview' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/email-attachments:
    post:
      operationId: addEmailAttachment
      tags: [emails]
      summary: Upload a file from the computer, to attach to the next email you send
      description: Up to 10 MB a file; an email takes up to 10 files and 20 MB in all.
      x-permission: emails:send
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailAttachment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/email-banners:
    get:
      operationId: listEmailBanners
      tags: [emails]
      summary: The company's email banners
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailBannerList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: addEmailBanner
      tags: [emails]
      summary: Upload a banner image (PNG, JPEG or GIF, up to 1 MB)
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailBanner' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/email-banners/{bannerId}:
    parameters:
      - { name: bannerId, in: path, required: true, schema: { $ref: '#/components/schemas/EmailBannerId' } }
    delete:
      operationId: deleteEmailBanner
      tags: [emails]
      summary: Delete a banner (emails already sent keep it)
      x-permission: emails.templates:manage
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/email-banners/{bannerId}/file:
    parameters:
      - { name: bannerId, in: path, required: true, schema: { $ref: '#/components/schemas/EmailBannerId' } }
    get:
      operationId: getEmailBannerFile
      tags: [emails]
      summary: A banner's image
      x-permission: emails:send
      responses:
        '200':
          description: The image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/email-drafts:
    post:
      operationId: draftEmail
      tags: [emails]
      summary: Fill a template for a candidate (and a job or interview) to review before sending
      description: >
        Placeholders without a value are left in brackets and listed in
        `missing`, so they are fixed before sending. Times are written in
        `timeZone` (the sender's, e.g. Asia/Kuala_Lumpur).
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailDraftRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDraft' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/email-batches:
    post:
      operationId: sendEmailsSeparately
      tags: [emails]
      summary: Send one email to several candidates or contacts, each their own copy
      description: >
        Each person gets their own email, to them alone, with the fields filled
        from them ([First name] is theirs), kept on their emails. Those who
        cannot be sent to (no email address, an address that is not valid,
        withdrew consent to be contacted, or no value for a field the message
        uses) are listed with the reason and left out; the others are sent.
        With checkOnly nothing is sent: the list says who would get it.
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailBatch' }
      responses:
        '200':
          description: Who got it (or would get it) and who did not, in the order given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailBatchResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: Emails sent about a candidate, or to a client's contact, newest first
      description: Give candidateId or contactId.
      x-permission: emails:read
      parameters:
        - { name: candidateId, in: query, required: false, schema: { $ref: '#/components/schemas/CandidateId' } }
        - { name: contactId, in: query, required: false, schema: { $ref: '#/components/schemas/ContactId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: sendEmail
      tags: [emails]
      summary: Send an email (it is queued and sent in the background)
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailSend' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Email' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DoNotContact' }

  /v1/settings/email-apps:
    get:
      operationId: getMailApps
      tags: [emails]
      summary: The agency's Microsoft and Google app details for connecting mailboxes (secrets masked)
      x-permission: emails.apps:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailApps' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/settings/email-apps/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MailAppProvider' }
    put:
      operationId: saveMailApp
      tags: [emails]
      summary: Save the agency's app details for one provider (the secret is kept when left out)
      description: >
        The secret is stored encrypted and never shown again, only its last four
        characters. Mailboxes connected with other details must connect again.
      x-permission: emails.apps:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailAppInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailApps' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteMailApp
      tags: [emails]
      summary: Remove the agency's app details for one provider (the server's are used again, if any)
      x-permission: emails.apps:manage
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailApps' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  responses:
    DoNotContact:
      description: The candidate asked not to be contacted (EMAIL_DO_NOT_CONTACT).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    EmailTemplateIdPath:
      name: templateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/EmailTemplateId' }

  schemas:
    MailAppProvider:
      type: string
      enum: [microsoft, google]
    MailApps:
      type: object
      required: [storageReady, callbackUrl, microsoft, google]
      properties:
        storageReady: { type: boolean, description: "The server can store secrets (HP_MAIL_KEYS_SECRET is set): without it nothing can be saved." }
        callbackUrl: { type: string, description: "The redirect URI to register with Microsoft and Google, e.g. http://localhost:3000/v1/mailbox/callback." }
        microsoft: { $ref: '#/components/schemas/MailApp' }
        google: { $ref: '#/components/schemas/MailApp' }
    MailApp:
      type: object
      required: [source, clientId, secretEnding, updatedAt]
      properties:
        source:
          type: string
          enum: [agency, server, none]
          description: "agency: entered here; server: the server's own settings file; none: not set up (people cannot connect this provider)."
        clientId: { type: string, nullable: true, description: "The app's client ID (not a secret)." }
        secretEnding: { type: string, nullable: true, description: "The secret's last four characters, to recognise it; the rest is never shown." }
        updatedAt: { type: string, format: date-time, nullable: true }
    MailAppInput:
      type: object
      additionalProperties: false
      required: [clientId]
      properties:
        clientId: { type: string, minLength: 1, maxLength: 200 }
        clientSecret: { type: string, minLength: 1, maxLength: 500, description: "Left out: keep the saved secret." }
    MailboxProvider:
      type: string
      enum:
      - microsoft
      - google
      - smtp
    MailboxStatus:
      type: object
      required:
      - storageReady
      - microsoftReady
      - googleReady
      - serverMode
      - connected
      - version
      properties:
        deliveryMode: { type: string, enum: [test, live] }
        storageReady:
          type: boolean
        microsoftReady:
          type: boolean
        googleReady:
          type: boolean
        serverMode:
          type: string
          enum:
          - test
          - live
          - unconfigured
        connected:
          type: boolean
        version:
          type: integer
          minimum: 0
        provider:
          $ref: '#/components/schemas/MailboxProvider'
        address:
          type: string
          format: email
        host:
          type: string
        port:
          type: integer
        tls:
          type: string
        username:
          type: string
    SmtpMailboxInput:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - address
      - host
      - port
      - tls
      - username
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        address:
          type: string
          format: email
          maxLength: 254
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        tls:
          type: string
          enum:
          - starttls
          - tls
          - none
        username:
          type: string
          maxLength: 320
        password:
          type: string
          maxLength: 4000
    MailboxAuthorizeInput:
      type: object
      additionalProperties: false
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - microsoft
          - google
    MailboxAuthorization:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
    EmailTemplateId:
      type: string
      pattern: '^etpl_[0-9a-hjkmnp-tv-z]{26}$'
      example: etpl_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailId:
      type: string
      pattern: '^eml_[0-9a-hjkmnp-tv-z]{26}$'
      example: eml_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailBannerId:
      type: string
      pattern: '^ebn_[0-9a-hjkmnp-tv-z]{26}$'
      example: ebn_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailAttachmentId:
      type: string
      pattern: '^eat_[0-9a-hjkmnp-tv-z]{26}$'
      example: eat_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailBanner:
      type: object
      required: [id, name, contentType, sizeBytes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/EmailBannerId' }
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    EmailBannerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmailBanner' }
    EmailAttachment:
      type: object
      required: [id, fileName, contentType, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/EmailAttachmentId' }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
    EmailField:
      type: object
      required: [token, key, label, salary]
      properties:
        token: { type: string, description: 'What to type or insert, e.g. "[Expected salary]".' }
        key: { type: string, description: 'The same as a placeholder, e.g. "candidate.expectedSalary".' }
        label: { type: string }
        salary: { type: boolean, description: Fills only for senders who may see salaries. }
    EmailCvAttachment:
      type: object
      additionalProperties: false
      required: [documentId]
      properties:
        documentId: { $ref: '#/components/schemas/DocumentId' }
        asPdf: { type: boolean, description: "A formatted CV's PDF instead of its Word file. Defaults to false." }
    EmailPreviewRequest:
      type: object
      additionalProperties: false
      required: [subject, bodyHtml, timeZone]
      properties:
        recipientCandidateId:
          description: Candidate recipient when the message contains details about selected candidates.
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
        subject: { type: string, maxLength: 200 }
        bodyHtml: { type: string, maxLength: 100000 }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        interviewId: { $ref: '#/components/schemas/InterviewId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        candidates:
          type: array
          minItems: 1
          maxItems: 10
          description: As for sending to the client about several candidates; fieldValues are then the job's, its client's and the sender's.
          items: { $ref: '#/components/schemas/EmailCandidate' }
        timeZone: { type: string, maxLength: 64, example: Asia/Kuala_Lumpur }
    EmailBatch:
      type: object
      additionalProperties: false
      required: [recipients, subject]
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/EmailRecipient' }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        bodyHtml: { type: string, maxLength: 100000 }
        timeZone: { type: string, maxLength: 64 }
        attachmentIds:
          type: array
          maxItems: 10
          description: "Files you uploaded to /v1/email-attachments; each email carries them."
          items: { $ref: '#/components/schemas/EmailAttachmentId' }
        checkOnly: { type: boolean, description: "Send nothing; say who would get it." }
    EmailRecipient:
      type: object
      additionalProperties: false
      description: A candidate or one of a client's contacts.
      properties:
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
    EmailBatchResult:
      type: object
      required: [recipients, sent]
      properties:
        sent: { type: integer, description: "How many emails were sent (0 with checkOnly)." }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/EmailBatchRecipient' }
    EmailBatchRecipient:
      type: object
      required: [candidateId, contactId, name, to, emailId, problem]
      properties:
        candidateId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        name: { type: string }
        to: { type: string, nullable: true, description: Their address. }
        emailId: { type: string, nullable: true, description: "Their email, once sent." }
        problem: { type: string, nullable: true, description: "Why they do not get it, e.g. \"has no email address\"; null: they do." }
    EmailCandidate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateVersion: { type: integer, minimum: 1, description: Profile version used when inserting details. }
        compensationVersion: { type: integer, minimum: 0, description: Salary version used when inserting salary details; 0 means none existed. }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        applicationId:
          description: Their application to the job the email is about.
          allOf: [{ $ref: '#/components/schemas/ApplicationId' }]
    EmailPreview:
      type: object
      required: [subject, bodyHtml, missing, salary, clientEmail, fieldValues]
      properties:
        candidateVersion: { type: integer, minimum: 1 }
        compensationVersion: { type: integer, minimum: 0 }
        fieldValues:
          type: object
          additionalProperties: { type: string }
          description: "Each field that has a value for this candidate, by its token: \"[Expected salary]\" -> \"RM 12,000 / month\" (salary only for roles that may see salaries). The composer puts the value in the message, where it can be edited; the candidate's record is not changed."
        clientEmail:
          type: string
          nullable: true
          description: "The job's hiring contact, to send to (when an application is given and its job has one)."
        subject: { type: string }
        bodyHtml: { type: string, description: "Formatted and made safe, as it will be sent." }
        missing:
          type: array
          description: Fields with no value (sending refuses them), e.g. "[Expected salary]".
          items: { type: string }
        salary: { type: boolean, description: "The email shows salary, so it may be hidden from roles that may not see salaries." }
    EmailTemplate:
      type: object
      required: [id, version, name, subject, body, bodyHtml, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/EmailTemplateId' }
        version: { type: integer }
        name: { type: string }
        subject: { type: string }
        body:
          type: string
          description: "Plain text with placeholders such as {{candidate.firstName}}; see GET /v1/email-templates for the list in `placeholders`."
        bodyHtml:
          type: string
          nullable: true
          description: "The formatted message (with its signature and banner), when the template has one; fields such as [Expected salary]. A value filled in from a candidate (<span data-field=\"...\">) is saved as its field, never the value."
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmailTemplateList:
      type: object
      required: [items, placeholders, fields]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EmailTemplate' }
        fields:
          type: array
          description: The fields a message may use, with their tokens.
          items: { $ref: '#/components/schemas/EmailField' }
        placeholders:
          type: array
          description: The placeholders templates may use.
          items: { type: string }
    EmailTemplateInput:
      type: object
      additionalProperties: false
      required: [name, subject]
      description: Give body (plain text), bodyHtml (formatted), or both.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        bodyHtml: { type: string, maxLength: 100000 }
    EmailTemplateUpdate:
      type: object
      additionalProperties: false
      required: [version, name, subject]
      description: Give body (plain text), bodyHtml (formatted), or both.
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        bodyHtml: { type: string, maxLength: 100000 }
    EmailDraftRequest:
      type: object
      additionalProperties: false
      required: [templateId, timeZone]
      description: For a candidate (candidateId) or one of a client's contacts (contactId).
      properties:
        templateId: { $ref: '#/components/schemas/EmailTemplateId' }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        interviewId: { $ref: '#/components/schemas/InterviewId' }
        timeZone: { type: string, maxLength: 64, example: Asia/Kuala_Lumpur }
    EmailDraft:
      type: object
      required: [to, subject, body, bodyHtml, missing]
      properties:
        bodyHtml:
          type: string
          nullable: true
          description: "The template's formatted message, filled the same way (values made safe for HTML); null for a plain-text template."
        to:
          type: array
          description: Suggested recipients (the candidate, or the job's hiring contact for templates addressed to the client).
          items: { type: string, format: email }
        subject: { type: string }
        body: { type: string }
        missing:
          type: array
          description: Placeholders that had no value (left as [placeholder] in the text).
          items: { type: string }
    EmailStatus:
      type: string
      description: queued = waiting to be sent; sent = accepted by the mail server; failed = could not be sent (see error).
      enum: [queued, sent, failed]
    Email:
      type: object
      required: [id, candidateId, applicationId, contactId, to, cc, bcc, subject, body, bodyHtml, attachments, salary, status, error, sentBy, sentByName, createdAt, sentAt, bouncedTo, bouncedAt]
      properties:
        deliveryMode: { type: string, enum: [test, live, unknown], description: 'Local test inbox, live provider acceptance, or unknown historical delivery.' }
        bouncedTo:
          type: array
          description: Recipients whose mail server returned it (a bounce notice in the sending Microsoft 365 mailbox).
          items: { type: string }
        bouncedAt: { type: string, format: date-time, nullable: true }
        id: { $ref: '#/components/schemas/EmailId' }
        candidateId:
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
          nullable: true
        contactId:
          description: The client's contact it was written to (from the contact's page).
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true
        applicationId:
          allOf: [{ $ref: '#/components/schemas/ApplicationId' }]
          nullable: true
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        subject: { type: string }
        body: { type: string, description: The plain-text version. }
        bodyHtml: { type: string, nullable: true, description: "The formatted version, if it had one." }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/EmailAttachment' }
        salary: { type: boolean, description: "It shows salary (hidden from roles that may not see salaries, unless Settings say otherwise)." }
        status: { $ref: '#/components/schemas/EmailStatus' }
        error: { type: string, nullable: true }
        sentBy: { $ref: '#/components/schemas/UserId' }
        sentByName: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
    EmailList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Email' }
    EmailSend:
      type: object
      additionalProperties: false
      required: [to, subject]
      description: >
        Give body (plain text) or bodyHtml (formatted). Fields in the subject
        and the formatted message ([Expected salary], ...) are filled from
        the candidate and application; one with no value refuses the email.
      properties:
        recipientCandidateId:
          description: Candidate recipient when the message contains details about selected candidates.
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
        to:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        cc:
          type: array
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        bcc:
          type: array
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        bodyHtml: { type: string, maxLength: 100000 }
        timeZone: { type: string, maxLength: 64, description: For interview times in fields (default Asia/Kuala_Lumpur). }
        candidateId: { $ref: '#/components/schemas/CandidateId' }
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        contactId:
          description: "To one of a client's contacts (from their page): fields are filled from the contact ([First name] is theirs) and their company."
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
        candidates:
          type: array
          minItems: 1
          maxItems: 10
          description: >
            An email to the client about several candidates (a shortlist), in
            the order given; instead of candidateId and applicationId; may include contactId or recipientCandidateId for the recipient. Their
            details are put in the message by the composer (a block or a table
            row each); fields left in the message are filled from the job, its
            client and the sender, not from one candidate. The email is kept
            on each candidate's emails.
          items: { $ref: '#/components/schemas/EmailCandidate' }
        attachmentIds:
          type: array
          maxItems: 10
          description: Files you uploaded to /v1/email-attachments.
          items: { $ref: '#/components/schemas/EmailAttachmentId' }
        cvs:
          type: array
          maxItems: 10
          description: The candidate's CVs from the ATS (needs documents:read); with candidates, any of theirs.
          items: { $ref: '#/components/schemas/EmailCvAttachment' }

    # --- Job payloads (messages on the job queue, not HTTP bodies) ---
    EmailBounceScanJob:
      type: object
      additionalProperties: false
      required: [emailId]
      properties:
        emailId: { $ref: '#/components/schemas/EmailId' }
    EmailSendJob:
      type: object
      additionalProperties: false
      required: [emailId]
      properties:
        emailId: { $ref: '#/components/schemas/EmailId' }
