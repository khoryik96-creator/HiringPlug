# Module contract: contacts (people at companies: hiring managers, HR) with a
# built-in email check. See contracts/README.md.
x-module:
  name: contacts
  description: People at companies, each with a checked email address.
  permissions:
    contacts:read:
      description: View contacts.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    contacts:create:
      description: Add contacts.
      roles: [owner, admin, recruiter, sourcer]
    contacts:update:
      description: Edit contacts and re-check their email.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes:
    CONTACT_DUPLICATE_EMAIL:
      status: 409
      description: Another contact already has this email. `details.existingContactId` points to them.
  jobs:
    contact.read_linkedin:
      queue: ai
      payload: ContactReadLinkedinJob
      description: Read a contact's LinkedIn profile PDF and the jobs in it (Python AI worker).
    contact.linkedin_read:
      queue: core
      payload: ContactLinkedinReadJob
      description: Save what the profile says about where the contact works now (Go worker).

paths:
  /v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List or search contacts, newest first
      x-permission: contacts:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email or job title (ignoring case and accents); or a phone or mobile number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: { type: boolean, default: false }
        - name: companyId
          in: query
          description: Only this company's contacts.
          schema: { $ref: '#/components/schemas/CompanyId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/ContactId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact (their email is checked)
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Change some fields of a contact
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded. A changed email is checked again.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}/email-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmail
      tags: [contacts]
      summary: Check the contact's email again
      description: Re-runs the email check (for example after "unknown" because the mail server lookup timed out).
      x-permission: contacts:update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/{contactId}/linkedin-profile:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmployment
      tags: [contacts]
      summary: Check where the contact works now, from their LinkedIn profile saved as PDF
      description: >
        LinkedIn cannot be read automatically, so drop the PDF LinkedIn makes
        (More > Save to PDF on their profile). It is read in the background,
        compared with the contact's company, and then deleted: only what it
        says about their jobs is kept (Contact.employment).
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Being read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEmployment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

components:
  parameters:
    ContactIdPath:
      name: contactId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ContactId' }

  schemas:
    ContactId:
      type: string
      pattern: '^cont_[0-9a-hjkmnp-tv-z]{26}$'
      example: cont_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactStatus:
      type: string
      description: active = works there; left = has left the company.
      enum: [active, left]
    EmailCheckStatus:
      type: string
      description: >
        valid = well formed and the domain receives mail; risky = deliverable
        but a shared (hr@), disposable or catch-all address; invalid = will
        bounce (bad format, or the domain has no mail server); unknown = the
        mail server lookup failed, check again later.
      enum: [valid, risky, invalid, unknown]
    EmailCheck:
      type: object
      required: [status, reasons, checkedAt]
      properties:
        status: { $ref: '#/components/schemas/EmailCheckStatus' }
        reasons:
          type: array
          description: Why, in words (empty when valid).
          items: { type: string }
        checkedAt: { type: string, format: date-time }

    Contact:
      type: object
      required: [id, version, companyId, companyName, firstName, lastName, fullName, title, email, emailCheck, phone, mobile, linkedinUrl, status, notes, employment, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        version: { type: integer }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        title: { type: string, nullable: true, description: 'Job title, e.g. HR Manager.' }
        email: { type: string, nullable: true }
        emailCheck:
          description: The latest check of `email`; null without an email.
          allOf: [{ $ref: '#/components/schemas/EmailCheck' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        notes: { type: string, nullable: true }
        employment:
          description: The latest employment check (from their LinkedIn profile); null before the first.
          allOf: [{ $ref: '#/components/schemas/ContactEmployment' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactCreate:
      type: object
      additionalProperties: false
      required: [companyId, firstName]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, phone, mobile, status, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        fullName: { type: string }
        title: { type: string, nullable: true }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        email: { type: string, nullable: true }
        emailCheckStatus:
          allOf: [{ $ref: '#/components/schemas/EmailCheckStatus' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        updatedAt: { type: string, format: date-time }
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactSummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true

    ContactEmploymentCheckId:
      type: string
      pattern: '^cec_[0-9a-hjkmnp-tv-z]{26}$'
      example: cec_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactEmployment:
      type: object
      required: [id, status, verdict, fileName, error, profileName, profileUrl, current, positions, nameMatches, urlMatches, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        status: { type: string, enum: [reading, read, failed] }
        verdict:
          type: string
          description: >
            same_company = their current job is at the contact's company;
            moved = their current job is somewhere else; no_current_job = the
            profile shows no current job; unknown = still reading, or not read.
          enum: [same_company, moved, no_current_job, unknown]
        fileName: { type: string }
        error: { type: string, nullable: true }
        profileName: { type: string, nullable: true, description: The name on the profile. }
        profileUrl: { type: string, nullable: true, description: The LinkedIn address on the profile. }
        current:
          description: Their current job (the latest without an end date).
          allOf: [{ $ref: '#/components/schemas/ContactPosition' }]
          nullable: true
        positions:
          type: array
          description: Their jobs on the profile, the latest first (up to 10).
          items: { $ref: '#/components/schemas/ContactPosition' }
        nameMatches: { type: boolean, nullable: true, description: The profile's name is the contact's; null when not read. }
        urlMatches: { type: boolean, nullable: true, description: The profile's address is the contact's LinkedIn; null when either is missing. }
        checkedAt: { type: string, format: date-time }
    ContactPosition:
      type: object
      required: [title, company, startDate, endDate, current]
      properties:
        title: { type: string, nullable: true }
        company: { type: string, nullable: true }
        startDate: { type: string, nullable: true, description: YYYY-MM or YYYY. }
        endDate: { type: string, nullable: true, description: YYYY-MM or YYYY; null when current. }
        current: { type: boolean }
    ContactReadLinkedinJob:
      type: object
      additionalProperties: false
      required: [checkId, downloadUrl, fileName, sizeBytes]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        downloadUrl: { type: string, description: Short-lived signed URL to download the PDF from. }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
    ContactLinkedinReadJob:
      type: object
      additionalProperties: false
      required: [checkId, profile, errorMessage]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        profile:
          description: What the rules read from the profile (no AI); null when it could not be read.
          allOf: [{ $ref: '#/components/schemas/ParsedProfile' }]
          nullable: true
        errorMessage: { type: string, nullable: true }
