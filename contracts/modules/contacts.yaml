# Module contract: contacts (people at companies: hiring managers, HR) with a
# built-in email check. See contracts/README.md.
x-module:
  name: contacts
  description: People at companies, each with a checked email address.
  permissions:
    contacts:export:
      description: Export the contact list (what a search finds) to Excel or CSV.
      roles: [owner, admin]
    contacts:read:
      description: View contacts.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    contacts:create:
      description: Add contacts.
      roles: [owner, admin, recruiter, sourcer]
    contacts:update:
      description: Edit contacts and re-check their email.
      roles: [owner, admin, recruiter, sourcer]
    contacts:merge:
      description: Merge a duplicate contact into another (their emails, jobs, notes and checks move over).
      roles: [owner, admin, recruiter]
    contacts.apollo:use:
      description: Connect a personal Apollo account and confirm work-email lookups in Find HR.
      roles: [owner, admin, recruiter, sourcer]
    contacts.role:update:
      description: "Change a contact's role (hiring manager, HR…) on their card and form."
      roles: [owner, admin, recruiter]
  errorCodes:
    APOLLO_BROKER_UNAVAILABLE:
      status: 503
      description: Apollo sign-in is currently unavailable through the configured broker.
    CONTACT_DUPLICATE_EMAIL:
      status: 409
      description: Another contact already has this email. `details.existingContactId` points to them.
    CONTACT_LINKEDIN_CHECK_CLOSED:
      status: 409
      description: The LinkedIn check was already answered, or expired (15 minutes). Start a new one.
  jobs:
    contact.read_linkedin:
      queue: ai
      payload: ContactReadLinkedinJob
      priority: high
      description: Read a contact's LinkedIn profile PDF and the jobs in it (Python AI worker).
    contact.linkedin_read:
      queue: core
      payload: ContactLinkedinReadJob
      priority: high
      description: Save what the profile says about where the contact works now (Go worker).
    contact.check_mailbox:
      queue: core
      payload: ContactCheckMailboxJob
      description: Ask a contact's mail server whether their mailbox exists (no email is sent).

    contact.apollo_lookup:
      queue: core
      payload: ContactApolloLookupJob
      description: Look up one work email in Apollo after explicit credit confirmation.

paths:
  /v1/contacts/export:
    get:
      operationId: exportContacts
      tags: [contacts]
      summary: Contacts matching the list's filters, as Excel or CSV (at most 10,000)
      x-permission: contacts:export
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/ExportFormat' } }
        - name: q
          in: query
          description: "Every word must appear in the name, email or job title (ignoring case and accents); or a phone or mobile number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: boolean
          in: query
          description: >-
            A boolean search of the name, job title and email: (HR OR
            "talent acquisition") AND manager NOT intern*, word NEAR/3 word.
            Words match their other forms (manager, managers).
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - name: companyId
          in: query
          description: Only this company's contacts.
          schema: { $ref: '#/components/schemas/CompanyId' }
        - name: role
          in: query
          description: Only contacts with this role (a key of the contact_role list, e.g. hr or hiring_manager).
          schema: { $ref: '#/components/schemas/ContactRole' }
        - name: roleNotSet
          in: query
          description: Only contacts whose role is not set yet (ignored with role).
          schema: { type: boolean, default: false }
        - name: status
          in: query
          description: Only contacts who still work there (active) or have left.
          schema: { $ref: '#/components/schemas/ContactStatus' }
        - name: folder
          in: query
          description: Only the records in this folder (yours, or shared with you).
          schema: { type: string, pattern: '^fld_[0-9a-hjkmnp-tv-z]{26}$' }
      responses:
        '200':
          description: The file (an Excel workbook or a CSV)
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Too many rows (EXPORT_TOO_LARGE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List or search contacts, newest first
      x-permission: contacts:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email or job title (ignoring case and accents); or a phone or mobile number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: boolean
          in: query
          description: >-
            A boolean search of the name, job title and email: (HR OR
            "talent acquisition") AND manager NOT intern*, word NEAR/3 word.
            Words match their other forms (manager, managers).
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: { type: boolean, default: false }
        - name: companyId
          in: query
          description: Only this company's contacts.
          schema: { $ref: '#/components/schemas/CompanyId' }
        - name: role
          in: query
          description: Only contacts with this role (a key of the contact_role list, e.g. hr or hiring_manager).
          schema: { $ref: '#/components/schemas/ContactRole' }
        - name: roleNotSet
          in: query
          description: Only contacts whose role is not set yet (ignored with role).
          schema: { type: boolean, default: false }
        - name: status
          in: query
          description: Only contacts who still work there (active) or have left.
          schema: { $ref: '#/components/schemas/ContactStatus' }
        - name: folder
          in: query
          description: Only the records in this folder (yours, or shared with you).
          schema: { type: string, pattern: '^fld_[0-9a-hjkmnp-tv-z]{26}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/ContactId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact (their email is checked)
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Change some fields of a contact
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded. A changed email is checked again.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/duplicates:
    get:
      operationId: listContactDuplicates
      tags: [contacts]
      summary: Possible duplicates among all contacts
      description: >
        Groups of contacts with the same LinkedIn profile, or the same name
        (any order, titles aside) at the same company, newest first. Open one
        and merge the others into it.
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDuplicateGroups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/contacts/{contactId}/similar:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: listSimilarContacts
      tags: [contacts]
      summary: Possible duplicates of a contact (same LinkedIn profile, name or mobile, or a name much alike at the same company)
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimilarContacts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/{contactId}/merge:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: mergeContact
      tags: [contacts]
      summary: Merge a duplicate into this contact
      description: >
        The duplicate's emails (and Outlook threads), jobs, invoices, notes,
        folder places and checks move to this contact; this contact's empty
        fields are filled from the duplicate's (its email only if this
        contact has none); then the duplicate is deleted. Both must be at the
        same company (someone at another company may have changed jobs).
        `version` is this contact's.
      x-permission: contacts:merge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMerge' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}/email-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmail
      tags: [contacts]
      summary: Check the contact's email again
      description: Re-runs the email check (for example after "unknown" because the mail server lookup timed out).
      x-permission: contacts:update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/{contactId}/mailbox-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactMailbox
      tags: [contacts]
      summary: Verify the contact's email with their mail server
      description: >
        Asks the mail server, in the background, whether it takes mail for
        the address and for a made-up address beside it (no email is sent).
        The result shows on the contact (`mailboxCheck`): invalid when the
        server says the mailbox does not exist (an email would bounce).
      x-permission: contacts:update
      responses:
        '202':
          description: Being checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMailboxCheck' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/mailbox-checks:
    post:
      operationId: checkCompanyMailboxes
      tags: [contacts]
      summary: Verify the emails of all a company's contacts
      description: Starts a mailbox check for each of the company's contacts with an email (those being checked already are skipped).
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMailboxChecksStart' }
      responses:
        '202':
          description: Being checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMailboxChecksStarted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/contacts/linkedin-checks:
    post:
      operationId: startContactLinkedinChecks
      tags: [contacts]
      summary: Start checking on LinkedIn where a company's contacts (or one contact) work
      description: >
        For each contact with a LinkedIn profile, a check bound to the contact,
        their profile and the company's LinkedIn page. The recruiter's
        HiringPlug LinkedIn companion (a browser extension) reads the dates of
        their time at that company from the profile and answers each check
        within 15 minutes. LinkedIn is never read by the server.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactLinkedinChecksStart' }
      responses:
        '201':
          description: Checks to answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactLinkedinChecksStarted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/linkedin-checks/{checkId}/answer:
    parameters:
      - name: checkId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
    post:
      operationId: answerContactLinkedinCheck
      tags: [contacts]
      summary: Answer a LinkedIn check with what the profile shows
      description: >
        Only by whoever started it. When the profile shows the contact's time
        at the company ended, with no current role there, a contact who
        "works there" becomes "has left". Unclear dates change nothing.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactLinkedinCheckAnswer' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactLinkedinCheck' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/address-check:
    post:
      operationId: checkContactAddresses
      tags: [contacts]
      summary: Which of these addresses would bounce, or reach someone who left
      description: For the email composer, before sending. Addresses that are not a contact's, or that are fine, are left out.
      x-permission: contacts:read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactAddressCheck' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactAddressProblems' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/contacts/{contactId}/email-suggestion:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: suggestContactEmail
      tags: [contacts]
      summary: Suggest an email address from how colleagues' addresses are spelled
      description: >
        From the addresses of the contact's colleagues at the same company
        (first.last@, flast@, first@ ...): a suggestion when at least two
        follow the same pattern at the company's main domain. Verify it
        before relying on it (setting it as the email verifies it).
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEmailSuggestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/{contactId}/linkedin-profile:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmployment
      tags: [contacts]
      summary: Check where the contact works now, from their LinkedIn profile saved as PDF
      description: >
        LinkedIn cannot be read automatically, so drop the PDF LinkedIn makes
        (More > Save to PDF on their profile). It is read in the background,
        compared with the contact's company, and then deleted: only what it
        says about their jobs is kept (Contact.employment).
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Being read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEmployment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /v1/contacts/apollo:
    get:
      operationId: getApolloConnection
      tags: [contacts]
      summary: View the current recruiter's Apollo connection
      x-permission: contacts.apollo:use
      responses:
        '200':
          description: Apollo status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApolloConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: updateApolloConnection
      tags: [contacts]
      summary: Start, check or disconnect the recruiter's Apollo sign-in
      x-permission: contacts.apollo:use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApolloConnectionAction' }
      responses:
        '200':
          description: Apollo status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApolloConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '503':
          description: The Apollo broker could not confirm sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/companies/{companyId}/hr-scan/apollo:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    post:
      operationId: lookupApolloWorkEmail
      tags: [contacts]
      summary: Check a scanned person for a work email, confirm credit use, or recover a lookup
      x-permission: contacts.apollo:use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApolloLookupRequest' }
      responses:
        '200':
          description: Apollo status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApolloLookup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/companies/{companyId}/hr-scan:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    get:
      operationId: getHrScan
      tags: [contacts]
      summary: The company's latest Find HR scan (LinkedIn people in HR), with who is a contact already
      x-permission: contacts:read
      responses:
        '200':
          description: OK (scan is null before the first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrScanOrNone' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: startHrScan
      tags: [contacts]
      summary: Start a new Find HR scan (it replaces the last one); the companion then reads its pages
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrScanStart' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrScan' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/companies/{companyId}/hr-scan/pages:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    post:
      operationId: addHrScanPage
      tags: [contacts]
      summary: "What the companion read on one page of the scan (or why it could not): the scan moves on, or stops there to resume"
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrScanPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrScan' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/companies/{companyId}/hr-scan/joined:
    parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
    post:
      operationId: addHrScanJoined
      tags: [contacts]
      summary: A person's dates at the company, read from their LinkedIn profile by the companion
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrScanJoined' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrScan' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    ContactIdPath:
      name: contactId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ContactId' }

  schemas:
    ApolloConnection:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [disabled, disconnected, pending, connected, expired, failed, disconnected_locally]
        authorizationUrl: { type: string }
        accountName: { type: string }
    ApolloConnectionAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [start, poll, disconnect, forget]
    ApolloLookupRequest:
      type: object
      additionalProperties: false
      required: [action, profileUrl]
      properties:
        action:
          type: string
          enum: [preview, unlock, check]
        profileUrl: { type: string, minLength: 1, maxLength: 500 }
        confirmation: { type: string, pattern: '^[a-f0-9]{64}$', description: Required for unlock. Use the value from preview. }
    ApolloLookup:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [existing, ready, ineligible, rescan, disabled, disconnected, busy, previous_connection, queued, sending, found, not_found, mismatch, pending, unconfirmed, auth_required, limited, cancelled]
        email: { type: string }
        confirmation: { type: string }
        emailStatus:
          type: string
          enum: [verified, unverified, catch_all, unavailable, user_managed, unknown]
        reason:
          type: string
          enum: [profile_not_found, email_not_returned, personal_email_only, email_redacted, email_unusable, contact_unconfirmed, queue_expired, retryable_limit, reconnect_required]
    ContactApolloLookupJob:
      type: object
      additionalProperties: false
      required: [lookupId]
      properties:
        lookupId: { type: string, pattern: '^[a-f0-9]{64}$' }
    HrCountry:
      type: string
      description: A country LinkedIn's people search is narrowed to (its two-letter code).
      enum: [MY, SG, ID, PH, TH, VN, HK, TW, CN, JP, KR, IN, AU, NZ, AE, GB, US]
    HrScanStart:
      type: object
      additionalProperties: false
      required: [linkedinCompanyId, linkedinCompanyName, keywords, pages]
      properties:
        linkedinCompanyId: { type: string, pattern: '^[0-9]{1,24}$', description: "LinkedIn's number for the company (the companion reads it)." }
        linkedinCompanyName: { type: string, minLength: 1, maxLength: 200, description: The company's name as LinkedIn shows it. }
        linkedinCompanyUrl:
          type: string
          maxLength: 500
          description: The company page the companion used to resolve the LinkedIn ID. Required for Apollo lookup.
        country:
          description: Only people in this country; none means anywhere.
          allOf: [{ $ref: '#/components/schemas/HrCountry' }]
        keywords:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 60 }
        pages: { type: integer, minimum: 1, maximum: 10, description: Pages read for each search. }
    HrScanPage:
      type: object
      additionalProperties: false
      required: [query, page]
      properties:
        query: { type: integer, minimum: 0, description: Which search (HrScan.queries). }
        page: { type: integer, minimum: 1 }
        people:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/HrScanPersonRead' }
        hasNext: { type: boolean }
        error: { type: string, maxLength: 300, description: "Why the page could not be read; the scan stops there, to resume." }
    HrScanPersonRead:
      type: object
      additionalProperties: false
      required: [url, name, title]
      properties:
        url: { type: string, pattern: '^https://www\.linkedin\.com/in/[A-Za-z0-9_%~-]+$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, maxLength: 500 }
        location: { type: string, maxLength: 240 }
    HrScanJoined:
      type: object
      additionalProperties: false
      required: [url, current]
      properties:
        url: { type: string, pattern: '^https://www\.linkedin\.com/in/[A-Za-z0-9_%~-]+$' }
        current: { type: boolean, nullable: true }
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
    HrScanStatus:
      type: string
      description: "running: pages still to read (next says which); stopped: a page could not be read (resume reads it again); done."
      enum: [running, stopped, done]
    HrScanPerson:
      type: object
      required: [url, name, title, location, tier, hidden, joined, left, current, contactId, contactName, duplicateOf, duplicateName, match]
      properties:
        url: { type: string }
        name: { type: string }
        title: { type: string }
        location: { type: string }
        tier:
          type: string
          enum: [A, B, C]
          description: "How likely they hire: A recruitment and HR leads, B HR managers and partners, C other HR roles."
        hidden: { type: string, nullable: true, description: "Why they are left out (a former employee, an intern), or null." }
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        current: { type: boolean, nullable: true, description: "From their profile once read: true works there now; null not read or unclear." }
        contactId: { type: string, nullable: true, description: A contact with this LinkedIn profile already. }
        contactName: { type: string, nullable: true }
        duplicateOf: { type: string, nullable: true, description: "A contact with the same or a similar name (a possible duplicate), when none has their profile." }
        duplicateName: { type: string, nullable: true }
        match:
          nullable: true
          description: The contact in HiringPlug who is, or may be, this person (the likeliest), anywhere in the agency; null for none.
          allOf: [{ $ref: '#/components/schemas/HrScanMatch' }]
    HrScanMatch:
      type: object
      required: [kind, contactId, name, title, companyId, companyName, sameCompany, email, emailCheckStatus, emailPersonal, left, more]
      properties:
        kind:
          type: string
          enum: [profile, same_name, similar_name]
          description: >
            profile = the same LinkedIn profile (them); same_name = the same
            name, in any order (titles, bin/binti and the like aside);
            similar_name = one name inside the other ("Aisyah Ahmad", "Nur
            Aisyah binti Ahmad").
        contactId: { $ref: '#/components/schemas/ContactId' }
        name: { type: string }
        title: { type: string, nullable: true }
        companyId: { type: string }
        companyName: { type: string, description: The company the contact is at in HiringPlug. }
        sameCompany: { type: boolean, description: The contact is at the company searched. }
        email: { type: string, nullable: true, description: Their email in HiringPlug. }
        emailCheckStatus:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/EmailCheckStatus' }]
        emailPersonal: { type: boolean, description: "The email is at a free mail service (gmail.com and the like): their own, not their work address." }
        left: { type: boolean, description: The contact is marked as having left that company. }
        more: { type: integer, minimum: 0, description: How many other contacts may also be them. }
    HrScanNext:
      type: object
      required: [query, page]
      properties:
        query: { type: integer }
        page: { type: integer }
    HrScan:
      type: object
      required: [companyId, linkedinCompanyId, linkedinCompanyName, country, countryName, geoId, keywords, queries, pages, status, next, pagesRead, error, people, startedAt, updatedAt]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        linkedinCompanyId: { type: string }
        linkedinCompanyName: { type: string }
        country:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/HrCountry' }]
        countryName: { type: string, nullable: true, description: "The country as LinkedIn names it (\"Hong Kong SAR\")." }
        geoId: { type: string, nullable: true, description: "LinkedIn's number for the country (its geoUrn)." }
        keywords: { type: array, items: { type: string } }
        queries:
          type: array
          description: "The searches run, a few keywords each (LinkedIn returns nothing for long ORs)."
          items: { type: string }
        pages: { type: integer }
        status: { $ref: '#/components/schemas/HrScanStatus' }
        next:
          description: The page to read next (also after a stop); null once done.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/HrScanNext' }]
        pagesRead: { type: integer }
        error: { type: string, nullable: true }
        people:
          type: array
          description: Best first (tier, then name).
          items: { $ref: '#/components/schemas/HrScanPerson' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HrScanOrNone:
      type: object
      required: [scan]
      properties:
        scan:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/HrScan' }]
    ContactId:
      type: string
      pattern: '^cont_[0-9a-hjkmnp-tv-z]{26}$'
      example: cont_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactRole:
      type: string
      pattern: '^[a-z0-9_]{1,40}$'
      description: "What the contact does in hiring: a key of the contact_role list in Settings (hiring_manager, hr, or one the agency added)."
    ContactStatus:
      type: string
      description: active = works there; left = has left the company.
      enum: [active, left]
    EmailCheckStatus:
      type: string
      description: >
        valid = well formed and the domain receives mail; risky = deliverable
        but a shared (hr@), disposable or catch-all address; invalid = will
        bounce (bad format, or the domain has no mail server); unknown = the
        mail server lookup failed, check again later.
      enum: [valid, risky, invalid, unknown]
    EmailCheck:
      type: object
      required: [status, reasons, checkedAt]
      properties:
        status: { $ref: '#/components/schemas/EmailCheckStatus' }
        reasons:
          type: array
          description: Why, in words (empty when valid).
          items: { type: string }
        checkedAt: { type: string, format: date-time }

    Contact:
      type: object
      required: [id, version, companyId, companyName, firstName, lastName, fullName, title, email, emailCheck, phone, mobile, linkedinUrl, status, role, notes, employment, linkedinCheck, mailboxCheck, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        version: { type: integer }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        title: { type: string, nullable: true, description: 'Job title, e.g. HR Manager.' }
        email: { type: string, nullable: true }
        emailCheck:
          description: The latest check of `email`; null without an email.
          allOf: [{ $ref: '#/components/schemas/EmailCheck' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, nullable: true }
        employment:
          description: The latest employment check (from their LinkedIn profile); null before the first.
          allOf: [{ $ref: '#/components/schemas/ContactEmployment' }]
          nullable: true
        linkedinCheck:
          description: The latest answered LinkedIn check (by the LinkedIn companion); null before the first.
          allOf: [{ $ref: '#/components/schemas/ContactLinkedinCheck' }]
          nullable: true
        mailboxCheck:
          description: The latest mailbox check of `email`; null before the first (or after the email changed).
          allOf: [{ $ref: '#/components/schemas/ContactMailboxCheck' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactCreate:
      type: object
      additionalProperties: false
      required: [companyId, firstName]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactMerge:
      type: object
      additionalProperties: false
      required: [duplicateId, version]
      properties:
        duplicateId:
          description: The contact to merge in (and delete).
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
        version: { type: integer, minimum: 1, description: The version of the contact you keep. }
    ContactDuplicateReason:
      type: string
      enum: [same_linkedin, same_name, same_phone, similar_name]
    ContactLookalike:
      type: object
      required: [id, companyId, companyName, fullName, title, email, reasons]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        companyId: { type: string }
        companyName: { type: string, nullable: true }
        fullName: { type: string }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        reasons: { type: array, items: { $ref: '#/components/schemas/ContactDuplicateReason' } }
    SimilarContacts:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContactLookalike' } }
    ContactDuplicateGroup:
      type: object
      required: [reasons, contacts]
      properties:
        reasons: { type: array, items: { $ref: '#/components/schemas/ContactDuplicateReason' } }
        contacts:
          description: Newest first; `reasons` on each is empty (the group's say why).
          type: array
          items: { $ref: '#/components/schemas/ContactLookalike' }
    ContactDuplicateGroups:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContactDuplicateGroup' } }
    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, mailboxStatus, mailboxCheckedAt, linkedinEmployment, phone, mobile, status, role, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        fullName: { type: string }
        title: { type: string, nullable: true }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        email: { type: string, nullable: true }
        emailCheckStatus:
          allOf: [{ $ref: '#/components/schemas/EmailCheckStatus' }]
          nullable: true
        mailboxStatus:
          description: The latest mailbox check of `email`; null before the first.
          allOf: [{ $ref: '#/components/schemas/MailboxCheckStatus' }]
          nullable: true
        mailboxCheckedAt: { type: string, format: date-time, nullable: true, description: When the mailbox was last checked. }
        linkedinEmployment:
          description: What the latest LinkedIn check saw of their time at the company; null before the first.
          allOf: [{ $ref: '#/components/schemas/LinkedinEmployment' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        updatedAt: { type: string, format: date-time }
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactSummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true

    MailboxCheckStatus:
      type: string
      description: >
        checking = being checked; accepted = the mail server takes this mailbox
        and refused a made-up one (delivery is still not guaranteed);
        catch_all = the server takes any address, so the mailbox is not
        established; invalid = the mailbox does not exist or the domain takes
        no mail (an email would bounce); unknown = no conclusion (the server
        restricts checks, was busy or unreachable): not a sign it is invalid.
      enum: [checking, accepted, catch_all, invalid, unknown]
    ContactMailboxCheck:
      type: object
      required: [email, status, reason, provider, attempts, recheckAt, requestedAt, checkedAt]
      properties:
        email: { type: string, description: The address checked. }
        status: { $ref: '#/components/schemas/MailboxCheckStatus' }
        reason: { type: string, nullable: true, description: "What was established, in words." }
        provider: { type: string, nullable: true, description: "Microsoft 365, Google Workspace or another mail server (from the server's name)." }
        attempts: { type: integer, description: Sessions with mail servers. }
        recheckAt:
          type: string
          format: date-time
          nullable: true
          description: When an inconclusive answer (the server was busy) is checked again on its own.
        requestedAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time, nullable: true }
    ContactMailboxChecksStart:
      type: object
      additionalProperties: false
      required: [companyId]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
    ContactMailboxChecksStarted:
      type: object
      required: [started, skipped]
      properties:
        started: { type: integer, description: Contacts whose email is being checked. }
        skipped: { type: integer, description: "Contacts without an email, or being checked already." }
    ContactCheckMailboxJob:
      type: object
      additionalProperties: false
      required: [contactId, email, deep]
      properties:
        contactId: { $ref: '#/components/schemas/ContactId' }
        email: { type: string, description: The address to check (skipped if the contact's email changed since). }
        deep: { type: boolean, description: Compare the domain's mail servers (an automatic recheck). }
        refresh: { type: boolean, description: "The monthly re-check: runs only if the address was last checked 25 days ago or more, for a contact who still works there." }

    ContactLinkedinCheckId:
      type: string
      pattern: '^clc_[0-9a-hjkmnp-tv-z]{26}$'
      example: clc_01jbz6w0m0k8q9x2r3s4t5v6w7
    LinkedinYearMonth:
      type: string
      pattern: '^(19|20)[0-9]{2}(-(0[1-9]|1[0-2]))?$'
      description: A year (2020) or year and month (2020-06), as precise as the profile shows.
    LinkedinEmployment:
      type: object
      required: [current, joined, left, matchedByName, checkedAt]
      properties:
        current:
          type: boolean
          nullable: true
          description: true = a current role at the company; false = their time there ended; null = could not tell.
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        matchedByName: { type: boolean, description: "Matched by the company's name (their role links to no LinkedIn page): shown, not acted on." }
        checkedAt: { type: string, format: date-time }
    ContactLinkedinChecksStart:
      type: object
      additionalProperties: false
      description: A company (all its contacts) or one contact.
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        dueOnly: { type: boolean, description: "Only contacts not checked on LinkedIn in the last 90 days (the others are skipped: recent)." }
    ContactLinkedinCheckRequest:
      type: object
      required: [id, contactId, contactName, profileUrl]
      properties:
        id: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        contactName: { type: string }
        profileUrl: { type: string, description: "https://www.linkedin.com/in/..." }
    ContactLinkedinChecksStarted:
      type: object
      required: [companyUrl, companyName, checks, skipped]
      properties:
        companyUrl: { type: string, description: "The company's LinkedIn page, https://www.linkedin.com/company/.../" }
        companyName: { type: string, description: "The company's name in HiringPlug: a role linked to no LinkedIn page may match it by name." }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ContactLinkedinCheckRequest' }
        skipped:
          type: array
          description: Contacts not checked this time, and why.
          items: { $ref: '#/components/schemas/ContactLinkedinCheckSkipped' }
    ContactLinkedinCheckSkipped:
      type: object
      required: [contactId, contactName, reason]
      properties:
        contactId: { $ref: '#/components/schemas/ContactId' }
        contactName: { type: string }
        reason:
          type: string
          enum: [no_profile, too_many, recent]
          description: no_profile = no LinkedIn profile address (or a short lnkd.in link); too_many = over 200 at once (check again for the rest); recent = checked in the last 90 days (with dueOnly).
    ContactLinkedinCheckAnswer:
      type: object
      additionalProperties: false
      description: >
        What the profile shows (profileUrl, companyUrl and linkedinCompanyId
        must be the check's), or why it could not be read (error).
      properties:
        profileUrl: { type: string, maxLength: 300 }
        companyUrl: { type: string, maxLength: 300 }
        linkedinCompanyId: { type: string, pattern: '^[0-9]{1,24}$', description: "LinkedIn's number for the company." }
        joined: { type: string, maxLength: 7, description: "YYYY or YYYY-MM; empty when not shown." }
        left: { type: string, maxLength: 7, description: "YYYY or YYYY-MM; empty while current or not shown." }
        current: { type: boolean, nullable: true }
        movedTo:
          type: array
          maxItems: 3
          description: With current false, their current roles elsewhere, as the profile shows them.
          items: { $ref: '#/components/schemas/LinkedinMove' }
        matchedByName:
          type: boolean
          description: >
            The role is linked to no LinkedIn company page and matched the
            company by its exact name (never marks the contact as left).
        error: { type: string, maxLength: 300, description: "Why the profile could not be read (then nothing else)." }
    LinkedinMove:
      type: object
      additionalProperties: false
      required: [companyUrl, companyName, title, since]
      properties:
        companyUrl: { type: string, maxLength: 300, description: "Their new company's LinkedIn page, https://www.linkedin.com/company/.../" }
        companyName: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200, description: Their job title there; empty when not shown. }
        since: { type: string, maxLength: 7, description: "YYYY or YYYY-MM; empty when not shown." }
    ContactLinkedinCheck:
      type: object
      required: [id, contactId, status, joined, left, current, markedLeft, matchedByName, movedTo, error, createdAt, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        status:
          type: string
          enum: [pending, observed, failed, expired]
          description: observed = read (the dates may still be unclear); failed = could not be read.
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        current: { type: boolean, nullable: true, description: "true = a current role there; false = their time there ended; null = unclear." }
        markedLeft: { type: boolean, description: This check set the contact to "has left". }
        matchedByName: { type: boolean, description: "The role was matched by the company's exact name (it links to no LinkedIn page): confirm it before acting on it." }
        movedTo:
          type: array
          description: Where they work now, when their time at the company ended (from the same profile).
          items: { $ref: '#/components/schemas/LinkedinMove' }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time, nullable: true }

    ContactAddressCheck:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 320 }
    ContactAddressProblems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactAddressProblem' }
    ContactAddressProblem:
      type: object
      required: [email, contactId, contactName, companyName, problem]
      properties:
        email: { type: string }
        contactId: { $ref: '#/components/schemas/ContactId' }
        contactName: { type: string }
        companyName: { type: string }
        problem:
          type: string
          enum: [bounces, left]
          description: bounces = their mail server says the mailbox does not exist; left = they have left the company.

    ContactEmailSuggestion:
      type: object
      required: [suggestion]
      properties:
        suggestion:
          description: Null when colleagues' addresses show no clear pattern.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/EmailGuess' }]
    EmailGuess:
      type: object
      required: [email, pattern, matches, of]
      properties:
        email: { type: string }
        pattern: { type: string, description: "e.g. first.last, flast, first" }
        matches: { type: integer, description: Colleagues whose address follows the pattern. }
        of: { type: integer, description: Colleagues with an address at that domain. }

    ContactEmploymentCheckId:
      type: string
      pattern: '^cec_[0-9a-hjkmnp-tv-z]{26}$'
      example: cec_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactEmployment:
      type: object
      required: [id, status, verdict, fileName, error, profileName, profileUrl, current, positions, nameMatches, urlMatches, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        status: { type: string, enum: [reading, read, failed] }
        verdict:
          type: string
          description: >
            same_company = their current job is at the contact's company;
            moved = their current job is somewhere else; no_current_job = the
            profile shows no current job; unknown = still reading, or not read.
          enum: [same_company, moved, no_current_job, unknown]
        fileName: { type: string }
        error: { type: string, nullable: true }
        profileName: { type: string, nullable: true, description: The name on the profile. }
        profileUrl: { type: string, nullable: true, description: The LinkedIn address on the profile. }
        current:
          description: Their current job (the latest without an end date).
          allOf: [{ $ref: '#/components/schemas/ContactPosition' }]
          nullable: true
        positions:
          type: array
          description: Their jobs on the profile, the latest first (up to 10).
          items: { $ref: '#/components/schemas/ContactPosition' }
        nameMatches: { type: boolean, nullable: true, description: The profile's name is the contact's; null when not read. }
        urlMatches: { type: boolean, nullable: true, description: The profile's address is the contact's LinkedIn; null when either is missing. }
        checkedAt: { type: string, format: date-time }
    ContactPosition:
      type: object
      required: [title, company, startDate, endDate, current]
      properties:
        title: { type: string, nullable: true }
        company: { type: string, nullable: true }
        startDate: { type: string, nullable: true, description: YYYY-MM or YYYY. }
        endDate: { type: string, nullable: true, description: YYYY-MM or YYYY; null when current. }
        current: { type: boolean }
    ContactReadLinkedinJob:
      type: object
      additionalProperties: false
      required: [checkId, downloadUrl, fileName, sizeBytes]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        downloadUrl: { type: string, description: Short-lived signed URL to download the PDF from. }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
    ContactLinkedinReadJob:
      type: object
      additionalProperties: false
      required: [checkId, profile, errorMessage]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        profile:
          description: What the rules read from the profile (no AI); null when it could not be read.
          allOf: [{ $ref: '#/components/schemas/ParsedProfile' }]
          nullable: true
        errorMessage: { type: string, nullable: true }
