# Module contract: contacts (people at companies: hiring managers, HR) with a
# built-in email check. See contracts/README.md.
x-module:
  name: contacts
  description: People at companies, each with a checked email address.
  permissions:
    contacts:read:
      description: View contacts.
      roles: [owner, admin, recruiter, sourcer, hiring_manager, viewer]
    contacts:create:
      description: Add contacts.
      roles: [owner, admin, recruiter, sourcer]
    contacts:update:
      description: Edit contacts and re-check their email.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes:
    CONTACT_DUPLICATE_EMAIL:
      status: 409
      description: Another contact already has this email. `details.existingContactId` points to them.
    CONTACT_LINKEDIN_CHECK_CLOSED:
      status: 409
      description: The LinkedIn check was already answered, or expired (15 minutes). Start a new one.
  jobs:
    contact.read_linkedin:
      queue: ai
      payload: ContactReadLinkedinJob
      priority: high
      description: Read a contact's LinkedIn profile PDF and the jobs in it (Python AI worker).
    contact.linkedin_read:
      queue: core
      payload: ContactLinkedinReadJob
      priority: high
      description: Save what the profile says about where the contact works now (Go worker).
    contact.check_mailbox:
      queue: core
      payload: ContactCheckMailboxJob
      description: Ask a contact's mail server whether their mailbox exists (no email is sent).

paths:
  /v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List or search contacts, newest first
      x-permission: contacts:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email or job title (ignoring case and accents); or a phone or mobile number, however it is written."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: { type: boolean, default: false }
        - name: companyId
          in: query
          description: Only this company's contacts.
          schema: { $ref: '#/components/schemas/CompanyId' }
        - name: role
          in: query
          description: Only contacts with this role (a key of the contact_role list, e.g. hr or hiring_manager).
          schema: { $ref: '#/components/schemas/ContactRole' }
        - name: roleNotSet
          in: query
          description: Only contacts whose role is not set yet (ignored with role).
          schema: { type: boolean, default: false }
        - name: status
          in: query
          description: Only contacts who still work there (active) or have left.
          schema: { $ref: '#/components/schemas/ContactStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { $ref: '#/components/schemas/ContactId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact (their email is checked)
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Change some fields of a contact
      description: >
        Only the fields you send change. Send `null` to clear a field. `version`
        must be the version you loaded. A changed email is checked again.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}/email-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmail
      tags: [contacts]
      summary: Check the contact's email again
      description: Re-runs the email check (for example after "unknown" because the mail server lookup timed out).
      x-permission: contacts:update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/{contactId}/mailbox-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactMailbox
      tags: [contacts]
      summary: Verify the contact's email with their mail server
      description: >
        Asks the mail server, in the background, whether it takes mail for
        the address and for a made-up address beside it (no email is sent).
        The result shows on the contact (`mailboxCheck`): invalid when the
        server says the mailbox does not exist (an email would bounce).
      x-permission: contacts:update
      responses:
        '202':
          description: Being checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMailboxCheck' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/mailbox-checks:
    post:
      operationId: checkCompanyMailboxes
      tags: [contacts]
      summary: Verify the emails of all a company's contacts
      description: Starts a mailbox check for each of the company's contacts with an email (those being checked already are skipped).
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMailboxChecksStart' }
      responses:
        '202':
          description: Being checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMailboxChecksStarted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/contacts/linkedin-checks:
    post:
      operationId: startContactLinkedinChecks
      tags: [contacts]
      summary: Start checking on LinkedIn where a company's contacts (or one contact) work
      description: >
        For each contact with a LinkedIn profile, a check bound to the contact,
        their profile and the company's LinkedIn page. The recruiter's
        HiringPlug LinkedIn companion (a browser extension) reads the dates of
        their time at that company from the profile and answers each check
        within 15 minutes. LinkedIn is never read by the server.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactLinkedinChecksStart' }
      responses:
        '201':
          description: Checks to answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactLinkedinChecksStarted' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/contacts/linkedin-checks/{checkId}/answer:
    parameters:
      - name: checkId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
    post:
      operationId: answerContactLinkedinCheck
      tags: [contacts]
      summary: Answer a LinkedIn check with what the profile shows
      description: >
        Only by whoever started it. When the profile shows the contact's time
        at the company ended, with no current role there, a contact who
        "works there" becomes "has left". Unclear dates change nothing.
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactLinkedinCheckAnswer' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactLinkedinCheck' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/contacts/{contactId}/linkedin-profile:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmployment
      tags: [contacts]
      summary: Check where the contact works now, from their LinkedIn profile saved as PDF
      description: >
        LinkedIn cannot be read automatically, so drop the PDF LinkedIn makes
        (More > Save to PDF on their profile). It is read in the background,
        compared with the contact's company, and then deleted: only what it
        says about their jobs is kept (Contact.employment).
      x-permission: contacts:update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Being read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactEmployment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

components:
  parameters:
    ContactIdPath:
      name: contactId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ContactId' }

  schemas:
    ContactId:
      type: string
      pattern: '^cont_[0-9a-hjkmnp-tv-z]{26}$'
      example: cont_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactRole:
      type: string
      pattern: '^[a-z0-9_]{1,40}$'
      description: "What the contact does in hiring: a key of the contact_role list in Settings (hiring_manager, hr, or one the agency added)."
    ContactStatus:
      type: string
      description: active = works there; left = has left the company.
      enum: [active, left]
    EmailCheckStatus:
      type: string
      description: >
        valid = well formed and the domain receives mail; risky = deliverable
        but a shared (hr@), disposable or catch-all address; invalid = will
        bounce (bad format, or the domain has no mail server); unknown = the
        mail server lookup failed, check again later.
      enum: [valid, risky, invalid, unknown]
    EmailCheck:
      type: object
      required: [status, reasons, checkedAt]
      properties:
        status: { $ref: '#/components/schemas/EmailCheckStatus' }
        reasons:
          type: array
          description: Why, in words (empty when valid).
          items: { type: string }
        checkedAt: { type: string, format: date-time }

    Contact:
      type: object
      required: [id, version, companyId, companyName, firstName, lastName, fullName, title, email, emailCheck, phone, mobile, linkedinUrl, status, role, notes, employment, linkedinCheck, mailboxCheck, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        version: { type: integer }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        title: { type: string, nullable: true, description: 'Job title, e.g. HR Manager.' }
        email: { type: string, nullable: true }
        emailCheck:
          description: The latest check of `email`; null without an email.
          allOf: [{ $ref: '#/components/schemas/EmailCheck' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, nullable: true }
        employment:
          description: The latest employment check (from their LinkedIn profile); null before the first.
          allOf: [{ $ref: '#/components/schemas/ContactEmployment' }]
          nullable: true
        linkedinCheck:
          description: The latest answered LinkedIn check (by the LinkedIn companion); null before the first.
          allOf: [{ $ref: '#/components/schemas/ContactLinkedinCheck' }]
          nullable: true
        mailboxCheck:
          description: The latest mailbox check of `email`; null before the first (or after the email changed).
          allOf: [{ $ref: '#/components/schemas/ContactMailboxCheck' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactCreate:
      type: object
      additionalProperties: false
      required: [companyId, firstName]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The version you loaded. }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        linkedinUrl: { type: string, maxLength: 300, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        notes: { type: string, maxLength: 4000, nullable: true }

    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, mailboxStatus, linkedinEmployment, phone, mobile, status, role, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactId' }
        fullName: { type: string }
        title: { type: string, nullable: true }
        companyId: { $ref: '#/components/schemas/CompanyId' }
        companyName: { type: string }
        email: { type: string, nullable: true }
        emailCheckStatus:
          allOf: [{ $ref: '#/components/schemas/EmailCheckStatus' }]
          nullable: true
        mailboxStatus:
          description: The latest mailbox check of `email`; null before the first.
          allOf: [{ $ref: '#/components/schemas/MailboxCheckStatus' }]
          nullable: true
        linkedinEmployment:
          description: What the latest LinkedIn check saw of their time at the company; null before the first.
          allOf: [{ $ref: '#/components/schemas/LinkedinEmployment' }]
          nullable: true
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ContactStatus' }
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{ $ref: '#/components/schemas/ContactRole' }]
          nullable: true
        updatedAt: { type: string, format: date-time }
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactSummary' }
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{ $ref: '#/components/schemas/ContactId' }]
          nullable: true

    MailboxCheckStatus:
      type: string
      description: >
        checking = being checked; accepted = the mail server takes this mailbox
        and refused a made-up one (delivery is still not guaranteed);
        catch_all = the server takes any address, so the mailbox is not
        established; invalid = the mailbox does not exist or the domain takes
        no mail (an email would bounce); unknown = no conclusion (the server
        restricts checks, was busy or unreachable): not a sign it is invalid.
      enum: [checking, accepted, catch_all, invalid, unknown]
    ContactMailboxCheck:
      type: object
      required: [email, status, reason, provider, attempts, recheckAt, requestedAt, checkedAt]
      properties:
        email: { type: string, description: The address checked. }
        status: { $ref: '#/components/schemas/MailboxCheckStatus' }
        reason: { type: string, nullable: true, description: "What was established, in words." }
        provider: { type: string, nullable: true, description: "Microsoft 365, Google Workspace or another mail server (from the server's name)." }
        attempts: { type: integer, description: Sessions with mail servers. }
        recheckAt:
          type: string
          format: date-time
          nullable: true
          description: When an inconclusive answer (the server was busy) is checked again on its own.
        requestedAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time, nullable: true }
    ContactMailboxChecksStart:
      type: object
      additionalProperties: false
      required: [companyId]
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
    ContactMailboxChecksStarted:
      type: object
      required: [started, skipped]
      properties:
        started: { type: integer, description: Contacts whose email is being checked. }
        skipped: { type: integer, description: "Contacts without an email, or being checked already." }
    ContactCheckMailboxJob:
      type: object
      additionalProperties: false
      required: [contactId, email, deep]
      properties:
        contactId: { $ref: '#/components/schemas/ContactId' }
        email: { type: string, description: The address to check (skipped if the contact's email changed since). }
        deep: { type: boolean, description: Compare the domain's mail servers (an automatic recheck). }

    ContactLinkedinCheckId:
      type: string
      pattern: '^clc_[0-9a-hjkmnp-tv-z]{26}$'
      example: clc_01jbz6w0m0k8q9x2r3s4t5v6w7
    LinkedinYearMonth:
      type: string
      pattern: '^(19|20)[0-9]{2}(-(0[1-9]|1[0-2]))?$'
      description: A year (2020) or year and month (2020-06), as precise as the profile shows.
    LinkedinEmployment:
      type: object
      required: [current, joined, left, checkedAt]
      properties:
        current:
          type: boolean
          nullable: true
          description: true = a current role at the company; false = their time there ended; null = could not tell.
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        checkedAt: { type: string, format: date-time }
    ContactLinkedinChecksStart:
      type: object
      additionalProperties: false
      description: A company (all its contacts) or one contact.
      properties:
        companyId: { $ref: '#/components/schemas/CompanyId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
    ContactLinkedinCheckRequest:
      type: object
      required: [id, contactId, contactName, profileUrl]
      properties:
        id: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        contactName: { type: string }
        profileUrl: { type: string, description: "https://www.linkedin.com/in/..." }
    ContactLinkedinChecksStarted:
      type: object
      required: [companyUrl, checks, skipped]
      properties:
        companyUrl: { type: string, description: "The company's LinkedIn page, https://www.linkedin.com/company/.../" }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ContactLinkedinCheckRequest' }
        skipped:
          type: array
          description: Contacts not checked this time, and why.
          items: { $ref: '#/components/schemas/ContactLinkedinCheckSkipped' }
    ContactLinkedinCheckSkipped:
      type: object
      required: [contactId, contactName, reason]
      properties:
        contactId: { $ref: '#/components/schemas/ContactId' }
        contactName: { type: string }
        reason:
          type: string
          enum: [no_profile, too_many]
          description: no_profile = no LinkedIn profile address (or a short lnkd.in link); too_many = over 200 at once (check again for the rest).
    ContactLinkedinCheckAnswer:
      type: object
      additionalProperties: false
      description: >
        What the profile shows (profileUrl, companyUrl and linkedinCompanyId
        must be the check's), or why it could not be read (error).
      properties:
        profileUrl: { type: string, maxLength: 300 }
        companyUrl: { type: string, maxLength: 300 }
        linkedinCompanyId: { type: string, pattern: '^[0-9]{1,24}$', description: "LinkedIn's number for the company." }
        joined: { type: string, maxLength: 7, description: "YYYY or YYYY-MM; empty when not shown." }
        left: { type: string, maxLength: 7, description: "YYYY or YYYY-MM; empty while current or not shown." }
        current: { type: boolean, nullable: true }
        error: { type: string, maxLength: 300, description: "Why the profile could not be read (then nothing else)." }
    ContactLinkedinCheck:
      type: object
      required: [id, contactId, status, joined, left, current, markedLeft, error, createdAt, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactLinkedinCheckId' }
        contactId: { $ref: '#/components/schemas/ContactId' }
        status:
          type: string
          enum: [pending, observed, failed, expired]
          description: observed = read (the dates may still be unclear); failed = could not be read.
        joined:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        left:
          allOf: [{ $ref: '#/components/schemas/LinkedinYearMonth' }]
          nullable: true
        current: { type: boolean, nullable: true, description: "true = a current role there; false = their time there ended; null = unclear." }
        markedLeft: { type: boolean, description: This check set the contact to "has left". }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time, nullable: true }

    ContactEmploymentCheckId:
      type: string
      pattern: '^cec_[0-9a-hjkmnp-tv-z]{26}$'
      example: cec_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactEmployment:
      type: object
      required: [id, status, verdict, fileName, error, profileName, profileUrl, current, positions, nameMatches, urlMatches, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        status: { type: string, enum: [reading, read, failed] }
        verdict:
          type: string
          description: >
            same_company = their current job is at the contact's company;
            moved = their current job is somewhere else; no_current_job = the
            profile shows no current job; unknown = still reading, or not read.
          enum: [same_company, moved, no_current_job, unknown]
        fileName: { type: string }
        error: { type: string, nullable: true }
        profileName: { type: string, nullable: true, description: The name on the profile. }
        profileUrl: { type: string, nullable: true, description: The LinkedIn address on the profile. }
        current:
          description: Their current job (the latest without an end date).
          allOf: [{ $ref: '#/components/schemas/ContactPosition' }]
          nullable: true
        positions:
          type: array
          description: Their jobs on the profile, the latest first (up to 10).
          items: { $ref: '#/components/schemas/ContactPosition' }
        nameMatches: { type: boolean, nullable: true, description: The profile's name is the contact's; null when not read. }
        urlMatches: { type: boolean, nullable: true, description: The profile's address is the contact's LinkedIn; null when either is missing. }
        checkedAt: { type: string, format: date-time }
    ContactPosition:
      type: object
      required: [title, company, startDate, endDate, current]
      properties:
        title: { type: string, nullable: true }
        company: { type: string, nullable: true }
        startDate: { type: string, nullable: true, description: YYYY-MM or YYYY. }
        endDate: { type: string, nullable: true, description: YYYY-MM or YYYY; null when current. }
        current: { type: boolean }
    ContactReadLinkedinJob:
      type: object
      additionalProperties: false
      required: [checkId, downloadUrl, fileName, sizeBytes]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        downloadUrl: { type: string, description: Short-lived signed URL to download the PDF from. }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
    ContactLinkedinReadJob:
      type: object
      additionalProperties: false
      required: [checkId, profile, errorMessage]
      properties:
        checkId: { $ref: '#/components/schemas/ContactEmploymentCheckId' }
        profile:
          description: What the rules read from the profile (no AI); null when it could not be read.
          allOf: [{ $ref: '#/components/schemas/ParsedProfile' }]
          nullable: true
        errorMessage: { type: string, nullable: true }
