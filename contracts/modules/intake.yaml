# Module contract: intake (importing CVs and LinkedIn PDFs, one or many at
# once, as new candidates).
# See contracts/README.md for the format.
x-module:
  name: intake
  description: >
    CV imports. Each file (a CV, or a LinkedIn profile saved as PDF) becomes a
    candidate named after the file, owned by whoever uploaded it, and is read
    like any CV. When the reading is done the candidate is filled in from it
    (name, email, phone, location, LinkedIn link, current job, work history,
    education, skills, industry), or, when its email already belongs to a
    candidate, merged into that candidate (one candidate per email). Files are
    sent one per request, so a batch shows each file's progress.
  permissions:
    intake:create:
      description: Import CVs and LinkedIn PDFs as candidates, and follow your imports.
      roles: [owner, admin, recruiter, sourcer]
  errorCodes: {}
  jobs: {}

paths:
  /v1/cv-imports:
    get:
      operationId: listCvImports
      tags: [intake]
      summary: Your latest imports, newest first, with each file's progress
      x-permission: intake:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvImportList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCvImport
      tags: [intake]
      summary: Start an import (then send its files one by one)
      x-permission: intake:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CvImportInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvImport' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/cv-imports/{cvImportId}:
    parameters:
      - $ref: '#/components/parameters/CvImportIdPath'
    get:
      operationId: getCvImport
      tags: [intake]
      summary: One of your imports, with each file's progress
      x-permission: intake:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvImport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cv-imports/{cvImportId}/files:
    parameters:
      - $ref: '#/components/parameters/CvImportIdPath'
    post:
      operationId: addCvImportFile
      tags: [intake]
      summary: Add one file (PDF, .docx or .doc) to an import
      description: A file that is not a CV file is recorded as failed, so the import shows it.
      x-permission: intake:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvImportItem' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

components:
  parameters:
    CvImportIdPath:
      name: cvImportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CvImportId' }

  schemas:
    CvImportId:
      type: string
      pattern: '^cvi_[0-9a-hjkmnp-tv-z]{26}$'
      example: cvi_01jbz6w0m0k8q9x2r3s4t5v6w7
    CvImportItemId:
      type: string
      pattern: '^cvf_[0-9a-hjkmnp-tv-z]{26}$'
      example: cvf_01jbz6w0m0k8q9x2r3s4t5v6w7
    CvImportItemStatus:
      type: string
      description: >
        reading = being read; created = a new candidate, filled in from the
        file; added = the file went to the candidate who already has its email;
        unread = a new candidate named after the file (its details could not
        be read: fill them in); failed = not a CV file (see error).
      enum: [reading, created, added, unread, failed]
    CvImportItem:
      type: object
      required: [id, fileName, status, candidateId, candidateName, error, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/CvImportItemId' }
        fileName: { type: string }
        status: { $ref: '#/components/schemas/CvImportItemStatus' }
        candidateId:
          allOf: [{ $ref: '#/components/schemas/CandidateId' }]
          nullable: true
        candidateName: { type: string, nullable: true, description: Null when there is none or you may not see them. }
        error: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    CvImportCounts:
      type: object
      required: [reading, created, added, unread, failed]
      properties:
        reading: { type: integer }
        created: { type: integer }
        added: { type: integer }
        unread: { type: integer }
        failed: { type: integer }
    CvImport:
      type: object
      required: [id, source, createdAt, counts, items]
      properties:
        id: { $ref: '#/components/schemas/CvImportId' }
        source: { $ref: '#/components/schemas/CandidateSource' }
        createdAt: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/CvImportCounts' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CvImportItem' }
    CvImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CvImport' }
    CvImportInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          description: The new candidates' source (e.g. linkedin for LinkedIn PDFs), from the company's list.
          allOf: [{ $ref: '#/components/schemas/CandidateSource' }]
