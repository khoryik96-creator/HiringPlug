# Module contract: reports (figures across the pipeline and placements).
# See contracts/README.md for the format.
x-module:
  name: reports
  description: >
    How the business is doing over a period: how far candidates get (pipeline
    conversion), which sources bring candidates who get hired, placements and
    fees per recruiter, and how long jobs take to fill; each recruiter's
    activity (calls, CVs sent, interviews arranged, placements) against the
    targets set for them; and the fees expected from the open pipeline,
    weighted by stage. Reports read other modules' records; they keep only
    the targets and the forecast's stage weights.
  permissions:
    reports:read:
      description: See the reports and your own activity against your targets (fees in them need placements.fees:read).
      roles: [owner, admin, recruiter]
    reports.team:read:
      description: See every user's activity against their targets, not only your own.
      roles: [owner, admin]
    reports.settings:manage:
      description: Set activity targets (per user, or one for everyone; for calls, CVs sent, interviews, placements and each stage category) and the forecast's weight for each stage.
      roles: [owner, admin]
    reports.forecast:read:
      description: See the revenue forecast (fees expected from the pipeline); it also needs placements.fees:read.
      sensitive: true
      roles: [owner, admin]
  errorCodes: {}
  jobs: {}

paths:
  /v1/reports/activity:
    get:
      operationId: getActivity
      tags: [reports]
      summary: Activity per user in a week or month, against their targets (your own only, unless you may see the team's)
      x-permission: reports:read
      parameters:
        - { name: period, in: query, required: false, description: week (Monday to Sunday) or month; week unless given., schema: { $ref: '#/components/schemas/ActivityPeriod' } }
        - { name: day, in: query, required: false, description: Any day in the week or month (today unless given)., schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports/settings:
    get:
      operationId: getReportSettings
      tags: [reports]
      summary: The activity targets and the forecast's stage weights
      x-permission: reports.settings:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putReportSettings
      tags: [reports]
      summary: Replace the activity targets and the forecast's stage weights
      x-permission: reports.settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports/forecast:
    get:
      operationId: getForecast
      tags: [reports]
      summary: Fees expected from the open pipeline and placements not yet invoiced, weighted by stage, per month and per recruiter
      description: Needs placements.fees:read as well as reports.forecast:read.
      x-permission: reports.forecast:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports/performance:
    get:
      operationId: getPerformance
      tags: [reports]
      summary: "Performance over time: CVs sent, each stage category, placements and fees by week, month, quarter or year; conversions; days to first CV and to fill"
      x-permission: reports:read
      parameters:
        - name: grain
          in: query
          required: false
          description: How the range is split (month unless given).
          schema: { $ref: '#/components/schemas/PerformanceGrain' }
        - { name: from, in: query, required: false, description: First day (1 January this year unless given)., schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: Last day (today unless given)., schema: { type: string, format: date } }
        - name: user
          in: query
          required: false
          description: "Whose numbers (repeat for more than one); none: the whole team's. Without reports.team:read, only your own."
          style: form
          explode: true
          schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/UserId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/reports/summary/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: The reports for a period as Excel (a sheet each) or CSV
      description: >
        With the activity in the period per user (your own only, unless you
        may see the team's) and, with reports.forecast:read and
        placements.fees:read, today's revenue forecast.
      x-permission: reports:read
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: '#/components/schemas/ExportFormat' } }
        - { name: from, in: query, required: false, description: First day of the period., schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: Last day of the period (today unless given)., schema: { type: string, format: date } }
      responses:
        '200':
          description: The file (an Excel workbook or a CSV)
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Too many rows (EXPORT_TOO_LARGE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/reports/summary:
    get:
      operationId: getReport
      tags: [reports]
      summary: The reports for a period (the last 90 days unless given)
      x-permission: reports:read
      parameters:
        - { name: from, in: query, required: false, description: First day of the period., schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: Last day of the period (today unless given)., schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  schemas:
    Report:
      type: object
      required: [from, to, funnel, sources, recruiters, timeToFill, feesHidden]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        funnel:
          type: array
          description: >
            Applications made in the period, by the furthest stage they reached
            (a rejected candidate who was interviewed counts as reaching
            interview), in pipeline order.
          items: { $ref: '#/components/schemas/FunnelStage' }
        sources:
          type: array
          description: "Applications made in the period by where they came from (the application's channel, else the candidate's source), most first."
          items: { $ref: '#/components/schemas/SourceRow' }
        recruiters:
          type: array
          description: Placements starting in the period per recruiter credited, most first.
          items: { $ref: '#/components/schemas/RecruiterRow' }
        timeToFill: { $ref: '#/components/schemas/TimeToFill' }
        feesHidden: { type: boolean, description: "Fees are left out (placements.fees:read is needed)." }
    FunnelStage:
      type: object
      required: [stage, category, label, reached, percentOfPrevious]
      properties:
        stage: { $ref: '#/components/schemas/Stage' }
        category: { type: string, description: "The category (StageCategory.key); a row per category, in the company's order." }
        label: { type: string, description: The category's name. }
        reached: { type: integer }
        percentOfPrevious:
          type: integer
          nullable: true
          description: Of those who reached the stage before, how many reached this one (rounded); null for the first stage or when none reached the one before.
    SourceRow:
      type: object
      required: [source, applications, interviewed, placed]
      properties:
        source: { type: string, description: "e.g. jobstreet, linkedin, careers_page, referral; unknown when not recorded." }
        applications: { type: integer }
        interviewed: { type: integer, description: Reached the interview stage. }
        placed: { type: integer }
    RecruiterRow:
      type: object
      required: [recruiterId, recruiterName, placements, fellThrough, fees]
      properties:
        recruiterId:
          allOf: [{ $ref: '#/components/schemas/UserId' }]
          nullable: true
        recruiterName: { type: string, nullable: true, description: null when no recruiter is credited. }
        placements: { type: integer, description: Placements that stand (not fallen through or cancelled). }
        fellThrough: { type: integer }
        fees:
          type: array
          description: Fees of the placements that stand, per currency (empty when fees are hidden).
          items: { $ref: '#/components/schemas/MoneyTotal' }
    MoneyTotal:
      type: object
      required: [currency, amount]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amount: { $ref: '#/components/schemas/DecimalAmount' }
    TimeToFill:
      type: object
      required: [medianDaysToFill, medianDaysToPlace, jobs]
      description: For candidates first placed in the period.
      properties:
        medianDaysToFill: { type: integer, nullable: true, description: From a job being opened to its first placement. }
        medianDaysToPlace: { type: integer, nullable: true, description: From a candidate being added to the job to being placed. }
        jobs:
          type: array
          description: Jobs with a placement in the period, slowest first.
          items: { $ref: '#/components/schemas/JobFill' }
    JobFill:
      type: object
      required: [jobId, jobTitle, daysToFill, placements]
      properties:
        jobId: { $ref: '#/components/schemas/JobOrderId' }
        jobTitle: { type: string }
        daysToFill: { type: integer, description: From the job being opened to its first placement in the period. }
        placements: { type: integer }

    PerformanceGrain:
      type: string
      enum: [week, month, quarter, year]
    PerformanceRow:
      type: object
      required: [from, to, cvsSent, categories, placements, fees]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        cvsSent: { type: integer, description: "CVs sent to clients (moved to submitted or emailed; a candidate once a day per person)." }
        categories:
          type: object
          description: "Candidates moved into each stage category (StageCategory.key), each once per person and category in the period."
          additionalProperties: { type: integer }
        placements: { type: integer, description: "Placements that stand, by their start date." }
        fees:
          type: array
          description: Their fees per currency (empty when fees are hidden).
          items: { $ref: '#/components/schemas/MoneyTotal' }
    PerformanceConversion:
      type: object
      required: [from, to, entered, reached, percent]
      properties:
        from: { type: string, description: The category (StageCategory.key) candidates were moved into in the range. }
        to: { type: string, description: The next category; reached counts those who got to it or further by now. }
        entered: { type: integer }
        reached: { type: integer }
        percent: { type: integer, nullable: true, description: Rounded; null when none entered. }
    PerformanceDays:
      type: object
      required: [average, jobs]
      properties:
        average: { type: number, nullable: true, description: Days on average (one decimal); null when no job counts. }
        jobs: { type: integer }
    Performance:
      type: object
      required: [grain, from, to, users, team, rows, total, conversions, daysToFirstCv, daysToFill, feesHidden]
      properties:
        grain: { $ref: '#/components/schemas/PerformanceGrain' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        users:
          type: array
          description: Whose numbers; empty for the whole team.
          items: { $ref: '#/components/schemas/UserId' }
        team: { type: boolean, description: You may see others' numbers (reports.team:read). }
        rows:
          type: array
          description: Each period, in order (the first and last cut to the range).
          items: { $ref: '#/components/schemas/PerformanceRow' }
        total: { $ref: '#/components/schemas/PerformanceRow' }
        conversions:
          type: array
          description: "For each stage category after the first, in the company's order: of the candidates moved into the one before it in the range, how many went on."
          items: { $ref: '#/components/schemas/PerformanceConversion' }
        daysToFirstCv: { allOf: [{ $ref: '#/components/schemas/PerformanceDays' }], description: "From a job being opened to its first CV sent, for jobs whose first CV was sent in the range (the chosen people's jobs)." }
        daysToFill: { allOf: [{ $ref: '#/components/schemas/PerformanceDays' }], description: "From a job being opened to its first placement, for jobs first placed in the range (the chosen people's jobs)." }
        feesHidden: { type: boolean, description: "Fees are left out (placements.fees:read is needed)." }
    ActivityPeriod:
      type: string
      enum: [week, month]
    ActivityCounts:
      type: object
      required: [calls, cvsSent, interviews, placements, categories]
      properties:
        calls: { type: integer, description: "Calls logged: screening calls, reference checks and notes of a call." }
        cvsSent: { type: integer, description: "CVs sent to clients: applications moved to submitted, and CVs attached to an email to anyone but the candidate (the same candidate on the same day counts once)." }
        interviews: { type: integer, description: Interviews arranged (scheduled by the user). }
        placements: { type: integer, description: Placements recorded and credited to the user (not cancelled). }
        categories:
          type: object
          description: "Candidates the user moved into a stage of each category (StageCategory.key), e.g. 1st Interview: each candidate once per category in the period."
          additionalProperties: { type: integer }
    ActivityGoal:
      type: object
      additionalProperties: false
      description: A target for each activity; null when none is set for it.
      required: [calls, cvsSent, interviews, placements]
      properties:
        calls: { type: integer, nullable: true, minimum: 0, maximum: 100000 }
        cvsSent: { type: integer, nullable: true, minimum: 0, maximum: 100000 }
        interviews: { type: integer, nullable: true, minimum: 0, maximum: 100000 }
        placements: { type: integer, nullable: true, minimum: 0, maximum: 100000 }
        categories:
          type: object
          maxProperties: 50
          description: "A target per stage category (StageCategory.key); a category left out has none."
          additionalProperties: { type: integer, minimum: 0, maximum: 100000 }
    ActivityRow:
      type: object
      required: [userId, userName, done, target]
      properties:
        userId: { $ref: '#/components/schemas/UserId' }
        userName: { type: string }
        done: { $ref: '#/components/schemas/ActivityCounts' }
        target:
          description: The user's own target for the period, else the one for everyone; null when neither is set.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ActivityGoal' }]
    ActivityReport:
      type: object
      required: [period, from, to, team, rows]
      properties:
        period: { $ref: '#/components/schemas/ActivityPeriod' }
        from: { type: string, format: date }
        to: { type: string, format: date, description: The last day of the week or month. }
        team: { type: boolean, description: "Every active user who recruits (whose role may move candidates) is listed, and anyone else who did something (reports.team:read); else only you." }
        rows:
          type: array
          description: By name.
          items: { $ref: '#/components/schemas/ActivityRow' }
    ActivityTarget:
      type: object
      additionalProperties: false
      required: [userId, period, goal]
      properties:
        userId:
          description: The user it is for; null for everyone without their own.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        period: { $ref: '#/components/schemas/ActivityPeriod' }
        goal: { $ref: '#/components/schemas/ActivityGoal' }
    ForecastStage:
      type: string
      enum: [submitted, interview, offer, placed]
    StageWeight:
      type: object
      additionalProperties: false
      required: [stage, percent, monthsAhead]
      properties:
        stage: { $ref: '#/components/schemas/ForecastStage' }
        percent: { type: integer, minimum: 0, maximum: 100, description: How likely an application at this stage is to be placed (and the fee paid). }
        monthsAhead: { type: integer, minimum: 0, maximum: 12, description: "The month its fee is expected in: this month (0), next month (1), ... Placements go by their start date." }
    ReportSettings:
      type: object
      additionalProperties: false
      required: [targets, stageWeights]
      properties:
        targets:
          type: array
          maxItems: 500
          description: At most one per user (or everyone) and period.
          items: { $ref: '#/components/schemas/ActivityTarget' }
        stageWeights:
          type: array
          description: One for each forecast stage (stages left out keep their weight).
          maxItems: 4
          items: { $ref: '#/components/schemas/StageWeight' }
    ForecastTotal:
      type: object
      required: [currency, expected, full]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        expected: { $ref: '#/components/schemas/DecimalAmount' }
        full: { allOf: [{ $ref: '#/components/schemas/DecimalAmount' }], description: The fees before weighting. }
    ForecastMonth:
      type: object
      required: [month, totals]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', example: '2026-11' }
        totals: { type: array, items: { $ref: '#/components/schemas/ForecastTotal' } }
    ForecastRecruiter:
      type: object
      required: [recruiterId, recruiterName, totals]
      properties:
        recruiterId:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        recruiterName: { type: string, nullable: true, description: null when no recruiter is credited and the job has no owner. }
        totals: { type: array, items: { $ref: '#/components/schemas/ForecastTotal' } }
    ForecastLine:
      type: object
      required: [applicationId, candidateName, jobTitle, companyName, stage, recruiterId, recruiterName, month, currency, fee, percent, expected, feeFrom]
      properties:
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        candidateName: { type: string }
        jobTitle: { type: string }
        companyName: { type: string }
        stage: { $ref: '#/components/schemas/ForecastStage' }
        recruiterId:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UserId' }]
        recruiterName: { type: string, nullable: true }
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fee: { $ref: '#/components/schemas/DecimalAmount' }
        percent: { type: integer }
        expected: { $ref: '#/components/schemas/DecimalAmount' }
        feeFrom:
          type: string
          enum: [placement, terms]
          description: "placement: the fee recorded on the placement; terms: the client's rate applied to the job's salary budget."
    ForecastGap:
      type: object
      required: [applicationId, candidateName, jobTitle, stage, reason]
      properties:
        applicationId: { $ref: '#/components/schemas/ApplicationId' }
        candidateName: { type: string }
        jobTitle: { type: string }
        stage: { $ref: '#/components/schemas/ForecastStage' }
        reason:
          type: string
          enum: [no_salary_budget, no_terms, no_rate]
          description: "no_salary_budget: the job has none (or one per hour or day); no_terms: the client has no terms of business; no_rate: none of the client's rates fits the salary."
    Forecast:
      type: object
      required: [months, recruiters, lines, gaps, stageWeights]
      properties:
        months:
          type: array
          description: From this month on, in order.
          items: { $ref: '#/components/schemas/ForecastMonth' }
        recruiters:
          type: array
          description: Most expected first.
          items: { $ref: '#/components/schemas/ForecastRecruiter' }
        lines:
          type: array
          description: Each application counted, most expected first (at most 2000).
          items: { $ref: '#/components/schemas/ForecastLine' }
        gaps:
          type: array
          description: Applications whose fee could not be worked out, so not counted (at most 500).
          items: { $ref: '#/components/schemas/ForecastGap' }
        stageWeights: { type: array, items: { $ref: '#/components/schemas/StageWeight' } }
