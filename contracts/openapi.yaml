        status: {$ref: '#/components/schemas/AssistantAnswerStatus'}
        text: {type: string, nullable: true}
        model: {type: string, nullable: true}
        askedAt: {type: string, format: date-time}
    TalentSearchId:
      type: string
      pattern: '^tsr_[0-9a-hjkmnp-tv-z]{26}$'
