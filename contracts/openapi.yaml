          in: query
          description: An application is stuck after this many days in one open stage (offer and earlier). Default 14.
          schema: {type: integer, minimum: 1, maximum: 365, default: 14}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PipelineSummary'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/placements:
    get:
      operationId: listPlacements
      tags: [placements]
      summary: Placements, newest start date first, with fee totals
      description: >
        `money` is only included with placements.fees:read, and so are the fee totals.

      x-permission: placements:read
      parameters:
        - {name: applicationId, in: query, required: false, schema: {$ref: '#/components/schemas/ApplicationId'}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/PlacementStatus'}}
        - {name: invoiceStatus, in: query, required: false, schema: {$ref: '#/components/schemas/InvoiceStatus'}}
        - {name: startFrom, in: query, required: false, description: Started on or after this day., schema: {type: string, format: date}}
        - {name: startTo, in: query, required: false, description: Started on or before this day., schema: {type: string, format: date}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlacementList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/applications/{applicationId}/placement:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      operationId: createPlacement
      tags: [placements]
      summary: Record a placement for an application (moves it to placed)
      description: "`money` needs placements.fees:update."
      x-permission: placements:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlacementInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/PlacementNotAllowed'}
  /v1/placements/{placementId}:
    parameters:
      - $ref: '#/components/parameters/PlacementIdPath'
    patch:
      operationId: updatePlacement
      tags: [placements]
      summary: Change a placement (start, guarantee, status, invoice, money)
      description: "Fields left out stay as they are. `money` needs placements.fees:update."
      x-permission: placements:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlacementUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/PlacementNotAllowed'}
  /v1/reports/summary:
    get:
      operationId: getReport
      tags: [reports]
      summary: The reports for a period (the last 90 days unless given)
      x-permission: reports:read
      parameters:
        - {name: from, in: query, required: false, description: First day of the period., schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: Last day of the period (today unless given)., schema: {type: string, format: date}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationFailed:
      description: The request is invalid (VALIDATION_FAILED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Missing or invalid credentials (UNAUTHENTICATED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Missing permission (FORBIDDEN).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (NOT_FOUND).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflict, e.g. CONFLICT_STALE_VERSION or a duplicate.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Too large (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Unsupported type (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignInFailed:
      description: Wrong email or password (SIGN_IN_FAILED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChooseCompany:
      description: Choose the company (SIGN_IN_CHOOSE_COMPANY).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyAttempts:
      description: Too many attempts (TOO_MANY_ATTEMPTS).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LinkNotValid:
      description: The link is no longer valid (LINK_NOT_VALID).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TeamChangeNotAllowed:
      description: Not allowed (TEAM_CHANGE_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InterviewNotAllowed:
      description: Not allowed (INTERVIEW_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OfferNotAllowed:
      description: Not allowed (OFFER_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PlacementNotAllowed:
      description: Not allowed (PLACEMENT_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Role:
      type: string
      enum:
        - owner
        - admin
        - recruiter
        - sourcer
        - hiring_manager
        - viewer
    Permission:
      type: string
      enum:
        - candidates.compensation:read
        - candidates.compensation:update
        - candidates:create
        - candidates:merge
        - candidates:read
        - candidates:update
        - companies:create
        - companies:read
        - companies:update
        - contacts:create
        - contacts:read
        - contacts:update
        - cvformats.templates:manage
        - cvformats:create
        - documents:create
        - documents:read
        - emails.templates:manage
        - emails:read
        - emails:send
        - identity.team:manage
        - integrations:manage
        - interviews:feedback
        - interviews:read
        - interviews:schedule
        - jobs.salary:read
        - jobs.salary:update
        - jobs:create
        - jobs:read
        - jobs:update
        - leads:manage
        - leads:read
        - notes.activity:read
        - notes.sensitive:read
        - notes:create
        - notes:manage
        - notes:read
        - offers.salary:read
        - offers.salary:update
        - offers:approve
        - offers:manage
        - offers:read
        - pipeline:read
        - pipeline:update
        - placements.fees:read
        - placements.fees:update
        - placements:manage
        - placements:read
        - reports:read
    ErrorCode:
      type: string
      enum:
        - APPLICATION_EXISTS
        - CANDIDATE_DUPLICATE_EMAIL
        - CAREERS_TOO_MANY_APPLICATIONS
        - COMPANY_DUPLICATE_NAME
        - CONFLICT_STALE_VERSION
        - CONTACT_DUPLICATE_EMAIL
        - DOCUMENT_HAS_NO_TEXT
        - FORBIDDEN
        - INTERNAL
        - INTERVIEW_CLASH
        - INTERVIEW_NOT_ALLOWED
        - JOB_AD_NOT_PUBLISHABLE
        - LINK_NOT_VALID
        - METHOD_NOT_ALLOWED
        - NOT_FOUND
        - OFFER_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - PLACEMENT_NOT_ALLOWED
        - ROUTE_NOT_FOUND
        - SERVICE_UNAVAILABLE
        - SIGN_IN_CHOOSE_COMPANY
        - SIGN_IN_FAILED
        - STAGE_MOVE_NOT_ALLOWED
        - TEAM_CHANGE_NOT_ALLOWED
        - TOO_MANY_ATTEMPTS
        - UNAUTHENTICATED
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
    JobKind:
      type: string
      enum:
        - document.cv_parsed
        - document.extract_text
        - document.parse_cv
        - document.pdf_rendered
        - document.render_pdf
        - document.text_extracted
        - email.send
        - interview.remind
        - lead_source.check
        - webhook.deliver
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            requestId:
              type: string
              description: Quote this when reporting a problem.
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. `fields` for VALIDATION_FAILED.
    TenantId:
      type: string
      pattern: '^tnt_[0-9a-hjkmnp-tv-z]{26}$'
      example: tnt_01jbz6w0m0k8q9x2r3s4t5v6w7
    UserId:
      type: string
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      example: usr_01jbz6w0m0k8q9x2r3s4t5v6w7
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code, e.g. MY, SG.
      pattern: '^[A-Z]{2}$'
      example: MY
    CurrencyCode:
      type: string
      description: ISO 4217 currency code, e.g. MYR, SGD, USD.
      pattern: '^[A-Z]{3}$'
      example: MYR
    PayPeriod:
      type: string
      description: What a salary figure is per (shared by candidates and jobs).
      enum: [hour, day, month, year]
    DecimalAmount:
      type: string
      description: A non-negative amount with up to 2 decimal places, as a string so no precision is lost.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      example: '8500.00'
    CandidateId:
      type: string
      pattern: '^cand_[0-9a-hjkmnp-tv-z]{26}$'
      example: cand_01jbz6w0m0k8q9x2r3s4t5v6w7
    WorkAuthorizationStatus:
      type: string
      description: >
        local = citizen; expat_eligible = expat who can already work here (see `basis`); requires_visa = needs an employment pass.

      enum: [local, expat_eligible, requires_visa]
    WorkAuthorizationBasis:
      type: string
      description: Why an expat can work without sponsorship. rp_t = Residence Pass-Talent.
      enum: [rp_t, permanent_resident, spouse_visa, other]
    WorkAuthorization:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/WorkAuthorizationStatus'}
        basis:
          description: Required when status is expat_eligible, otherwise must be empty.
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationBasis'}]
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 500
    NoticePeriodUnit:
      type: string
      enum: [day, week, month]
    NoticePeriod:
      type: object
      additionalProperties: false
      required: [value, unit]
      description: '`value: 0` means available immediately.'
      properties:
        value: {type: integer, minimum: 0, maximum: 365}
        unit: {$ref: '#/components/schemas/NoticePeriodUnit'}
    CandidateSource:
      type: string
      enum: [jobstreet, linkedin, referral, careers_page, direct, other]
    SalaryAmount:
      type: object
      additionalProperties: false
      required: [amount, currency, period]
      properties:
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    SalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        min: {$ref: '#/components/schemas/DecimalAmount'}
        max:
          description: Leave empty for a single expected figure.
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    Compensation:
      type: object
      required: [version, currentSalary, expectedSalary, updatedAt]
      properties:
        version: {type: integer, minimum: 1}
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
        updatedAt: {type: string, format: date-time}
    CompensationUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, currentSalary, expectedSalary]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 if no salary details exist yet, otherwise the version you loaded.
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
    RestrictedField:
      type: string
      description: A field left out of the response because you lack the permission to see it.
      enum: [compensation]
    WorkEntry:
      type: object
      additionalProperties: false
      required: [title, company, startDate, endDate, current, description]
      description: One job. A title or a company is required; endDate is null when current.
      properties:
        title: {type: string, nullable: true, maxLength: 200}
        company: {type: string, nullable: true, maxLength: 200}
        startDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        current: {type: boolean}
        description: {type: string, nullable: true, maxLength: 4000}
    EducationEntry:
      type: object
      additionalProperties: false
      required: [qualification, institution, endYear]
      description: One qualification. A qualification or an institution is required.
      properties:
        qualification: {type: string, nullable: true, maxLength: 200}
        institution: {type: string, nullable: true, maxLength: 200}
        endYear: {type: integer, nullable: true, minimum: 1950, maximum: 2100}
    CandidateHistoryUpdate:
      type: object
      additionalProperties: false
      required: [version, experience, education]
      properties:
        version: {type: integer, minimum: 1}
        experience:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/WorkEntry'}
        education:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/EducationEntry'}
    Candidate:
      type: object
      required:
        - id
        - tags
        - skills
        - experience
        - education
        - version
        - firstName
        - lastName
        - fullName
        - email
        - phone
        - nationality
        - workAuthorization
        - noticePeriod
        - industry
        - specialization
        - currentTitle
        - currentCompany
        - location
        - source
        - restrictedFields
        - createdAt
        - updatedAt
      properties:
        experience:
          type: array
          description: Work history, newest first.
          items: {$ref: '#/components/schemas/WorkEntry'}
        education:
          type: array
          items: {$ref: '#/components/schemas/EducationEntry'}
        id: {$ref: '#/components/schemas/CandidateId'}
        version: {type: integer, minimum: 1}
        firstName: {type: string}
        lastName: {type: string}
        fullName: {type: string}
        email: {type: string, format: email, nullable: true}
        phone:
          type: string
          nullable: true
          description: International (E.164) format, e.g. +60123456789.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, nullable: true}
        specialization: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        compensation:
          description: Left out (and listed in restrictedFields) without candidates.compensation:read. null means none recorded.
          allOf: [{$ref: '#/components/schemas/Compensation'}]
          nullable: true
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/RestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CandidateCreate:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone:
          type: string
          maxLength: 40
          nullable: true
          description: Any common format; stored in international format.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you loaded.
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateSummary:
      type: object
      required: [tags, id, fullName, email, phone, currentTitle, currentCompany, location, workAuthorizationStatus, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CandidateId'}
        fullName: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        workAuthorizationStatus:
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationStatus'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
    CandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
    SimilarCandidate:
      type: object
      required: [candidate, reasons]
      properties:
        candidate: {$ref: '#/components/schemas/CandidateSummary'}
        reasons:
          type: array
          description: Why they may be the same person.
          items:
            type: string
            enum: [same_phone, similar_name]
    SimilarCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SimilarCandidate'}
    CandidateMerge:
      type: object
      additionalProperties: false
      required: [duplicateId, version]
      properties:
        duplicateId:
          description: The candidate to merge in (and delete).
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
        version: {type: integer, minimum: 1, description: The version of the candidate you keep.}
    UsedValues:
      type: object
      required: [tags, skills, industries, specializations]
      properties:
        tags: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        industries: {type: array, items: {type: string}}
        specializations: {type: array, items: {type: string}}
    CareersPage:
      type: object
      required: [companyName, ads]
      properties:
        companyName: {type: string}
        ads:
          type: array
          items: {$ref: '#/components/schemas/PublicJobAd'}
    PublicJobAd:
      type: object
      description: A published ad as visitors see it (no internal fields).
      required: [id, title, location, workType, workArrangement, salaryText, description, closesOn, publishedAt]
      properties:
        id: {$ref: '#/components/schemas/JobAdId'}
        title: {type: string}
        location: {type: string, nullable: true}
        workType:
          allOf: [{$ref: '#/components/schemas/WorkType'}]
          nullable: true
        workArrangement:
          allOf: [{$ref: '#/components/schemas/WorkArrangement'}]
          nullable: true
        salaryText: {type: string, nullable: true}
        description: {type: string}
        closesOn: {type: string, format: date, nullable: true}
        publishedAt: {type: string, format: date-time}
    ApplicationReceived:
      type: object
      required: [received]
      properties:
        received: {type: boolean}
    CompanyId:
      type: string
      pattern: '^comp_[0-9a-hjkmnp-tv-z]{26}$'
      example: comp_01jbz6w0m0k8q9x2r3s4t5v6w7
    CompanyType:
      type: string
      description: >
        client = you recruit for them; prospect = you want them as a client; internal = a part of your own organisation (in-house hiring).

      enum: [client, prospect, internal]
    CompanySize:
      type: string
      description: Employees. micro 1–10, small 11–50, medium 51–200, large 201–1000, enterprise over 1000.
      enum: [micro, small, medium, large, enterprise]
    Company:
      type: object
      required: [id, version, name, type, website, industry, size, phone, address, city, country, registrationNumber, about, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompanyId'}
        version: {type: integer, description: Send it back when you update.}
        name: {type: string}
        type: {$ref: '#/components/schemas/CompanyType'}
        website: {type: string, nullable: true, description: 'Always with https://, e.g. https://example.com.'}
        industry: {type: string, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        city: {type: string, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, nullable: true, description: 'Business registration number, e.g. SSM in Malaysia or UEN in Singapore.'}
        about: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        type:
          allOf: [{$ref: '#/components/schemas/CompanyType'}]
          description: Defaults to client.
        website: {type: string, maxLength: 300, nullable: true, description: 'example.com or a full address; https:// is added if missing.'}
        industry: {type: string, maxLength: 100, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, maxLength: 40, nullable: true}
        address: {type: string, maxLength: 500, nullable: true}
        city: {type: string, maxLength: 100, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, maxLength: 50, nullable: true}
        about: {type: string, maxLength: 4000, nullable: true}
    CompanyUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        name: {type: string, minLength: 1, maxLength: 200}
        type: {$ref: '#/components/schemas/CompanyType'}
        website: {type: string, maxLength: 300, nullable: true}
        industry: {type: string, maxLength: 100, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, maxLength: 40, nullable: true}
        address: {type: string, maxLength: 500, nullable: true}
        city: {type: string, maxLength: 100, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, maxLength: 50, nullable: true}
        about: {type: string, maxLength: 4000, nullable: true}
    CompanySummary:
      type: object
      required: [id, name, type, industry, city, website, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompanyId'}
        name: {type: string}
        type: {$ref: '#/components/schemas/CompanyType'}
        industry: {type: string, nullable: true}
        city: {type: string, nullable: true}
        website: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}
    CompanyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CompanySummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/CompanyId'}]
          nullable: true
    ContactId:
      type: string
      pattern: '^cont_[0-9a-hjkmnp-tv-z]{26}$'
      example: cont_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactStatus:
      type: string
      description: active = works there; left = has left the company.
      enum: [active, left]
    EmailCheckStatus:
      type: string
      description: >
        valid = well formed and the domain receives mail; risky = deliverable but a shared (hr@), disposable or catch-all address; invalid = will bounce (bad format, or the domain has no mail server); unknown = the mail server lookup failed, check again later.

      enum: [valid, risky, invalid, unknown]
    EmailCheck:
      type: object
      required: [status, reasons, checkedAt]
      properties:
        status: {$ref: '#/components/schemas/EmailCheckStatus'}
        reasons:
          type: array
          description: Why, in words (empty when valid).
          items: {type: string}
        checkedAt: {type: string, format: date-time}
    Contact:
      type: object
      required: [id, version, companyId, companyName, firstName, lastName, fullName, title, email, emailCheck, phone, mobile, linkedinUrl, status, notes, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactId'}
        version: {type: integer}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        fullName: {type: string}
        title: {type: string, nullable: true, description: 'Job title, e.g. HR Manager.'}
        email: {type: string, nullable: true}
        emailCheck:
          description: The latest check of `email`; null without an email.
          allOf: [{$ref: '#/components/schemas/EmailCheck'}]
          nullable: true
        phone: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        linkedinUrl: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ContactCreate:
      type: object
      additionalProperties: false
      required: [companyId, firstName]
      properties:
        companyId: {$ref: '#/components/schemas/CompanyId'}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        title: {type: string, maxLength: 200, nullable: true}
        email: {type: string, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        mobile: {type: string, maxLength: 40, nullable: true}
        linkedinUrl: {type: string, maxLength: 300, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, maxLength: 4000, nullable: true}
    ContactUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        title: {type: string, maxLength: 200, nullable: true}
        email: {type: string, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        mobile: {type: string, maxLength: 40, nullable: true}
        linkedinUrl: {type: string, maxLength: 300, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, maxLength: 4000, nullable: true}
    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, phone, mobile, status, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactId'}
        fullName: {type: string}
        title: {type: string, nullable: true}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        email: {type: string, nullable: true}
        emailCheckStatus:
          allOf: [{$ref: '#/components/schemas/EmailCheckStatus'}]
          nullable: true
        phone: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        updatedAt: {type: string, format: date-time}
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ContactSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
    CvTemplateId:
      type: string
      description: standard = the built-in template.
      pattern: '^(standard|ctpl_[0-9a-hjkmnp-tv-z]{26})$'
      example: standard
    CvTemplate:
      type: object
      required: [id, name, builtIn, uploadedByName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/CvTemplateId'}
        name: {type: string}
        builtIn: {type: boolean}
        uploadedByName: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
    CvTemplateList:
      type: object
      required: [items, placeholders, blocks]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CvTemplate'}
        placeholders:
          type: array
          description: "Placeholders a template may use, written {{name}}; one with no value removes its whole paragraph (so a label like Email: goes too)."
          items: {type: string}
        blocks:
          type: array
          description: "Repeating blocks: paragraphs between {{#experience}} and {{/experience}} (each on its own line) repeat for each job; inside, {{title}}, {{company}}, {{dates}}, {{description}}. Likewise {{#education}} with {{qualification}}, {{institution}}, {{year}}."
          items: {type: string}
    FormatCvInput:
      type: object
      additionalProperties: false
      properties:
        templateId: {$ref: '#/components/schemas/CvTemplateId'}
        applicationId:
          description: The job the CV is for (its title and company can appear in the CV).
          allOf: [{$ref: '#/components/schemas/ApplicationId'}]
        showContact: {type: boolean, description: "Include the candidate's email and phone (left out unless asked, so the client goes through you)."}
        includeSalary: {type: boolean, description: "Include current and expected salary (needs candidates.compensation:read)."}
        summary: {type: string, maxLength: 3000, description: Your summary of the candidate for the client.}
    FormattedCv:
      type: object
      required: [documentId, fileName]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        fileName: {type: string}
    DocumentId:
      type: string
      pattern: '^doc_[0-9a-hjkmnp-tv-z]{26}$'
      example: doc_01jbz6w0m0k8q9x2r3s4t5v6w7
    DocumentSource:
      type: string
      description: >
        Where the file came from. original = the candidate's own CV; formatted = a CV formatted by your team for clients.

      enum: [jobstreet, linkedin, original, formatted, other]
    DocumentStatus:
      type: string
      description: >
        queued = waiting for text extraction; extracted = text available; needs_ocr = scanned document, no text layer yet; failed = could not be read.

      enum: [queued, extracted, needs_ocr, failed]
    DocumentParseStatus:
      type: string
      description: >
        queued = being parsed; parsed = details ready to review; failed = the parser could not read it.

      enum: [queued, parsed, failed]
    Document:
      type: object
      required: [id, candidateId, source, fileName, contentType, sizeBytes, sha256, status, pageCount, extractor, errorMessage, extractionWarnings, parseStatus, pdfStatus, createdAt, updatedAt]
      properties:
        pdfStatus:
          description: "Formatted CVs made by the app also come as a PDF: queued, ready (GET .../pdf) or failed; null for other documents."
          allOf: [{$ref: '#/components/schemas/PdfStatus'}]
          nullable: true
        id: {$ref: '#/components/schemas/DocumentId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        source: {$ref: '#/components/schemas/DocumentSource'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          nullable: true
          description: Which extractor produced the text, e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        extractionWarnings:
          type: array
          items: {type: string}
          description: >
            Problems a recruiter should know about, e.g. "OCR could not read page 3; this document may be incomplete." Empty when extraction was clean.

        extractedText:
          type: string
          nullable: true
          description: Only included when fetching a single document.
        parseStatus:
          allOf: [{$ref: '#/components/schemas/DocumentParseStatus'}]
          nullable: true
          description: Null when the document was never parsed (formatted CVs, or uploaded before parsing existed).
        parsedProfile:
          allOf: [{$ref: '#/components/schemas/ParsedProfile'}]
          nullable: true
          description: Only included when fetching a single document.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Document'}
    SourcedText:
      type: object
      additionalProperties: false
      required: [value, quote]
      description: >
        A value read from a CV and the exact CV text it came from. Values whose quote is not in the CV are dropped before saving.

      properties:
        value: {type: string, minLength: 1, maxLength: 300}
        quote: {type: string, minLength: 1, maxLength: 1000}
    ParsedJob:
      type: object
      additionalProperties: false
      required: [title, company, dates, startDate, endDate, current]
      properties:
        title: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        company: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        startDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY; null when current.}
        current: {type: boolean}
    ParsedEducation:
      type: object
      additionalProperties: false
      required: [qualification, institution, dates, endYear]
      properties:
        qualification: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        institution: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        endYear: {type: integer, nullable: true, minimum: 1950, maximum: 2100}
    ParsedProfile:
      type: object
      additionalProperties: false
      required: [parser, fullName, email, phone, linkedinUrl, location, nationality, noticePeriod, skills, experience, education, dropped]
      description: >
        Details read from a CV, as suggestions to review. nationality is an ISO country code; noticePeriod is "<number> day|week|month".

      properties:
        parser: {type: string, description: 'name@version of the parser(s), e.g. rules@1.'}
        fullName: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        email: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        phone: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        linkedinUrl: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        location: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        nationality: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        noticePeriod: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        skills:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SourcedText'}
        experience:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/ParsedJob'}
        education:
          type: array
          maxItems: 15
          items: {$ref: '#/components/schemas/ParsedEducation'}
        dropped:
          type: integer
          minimum: 0
          description: How many values were dropped because their quote was not found in the CV.
    DocumentExtractTextJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl, contentType, fileName, sizeBytes]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        downloadUrl:
          type: string
          description: Short-lived signed URL to download the file from.
        contentType: {type: string}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
    ExtractionStatus:
      type: string
      enum: [extracted, needs_ocr, failed]
    PdfStatus:
      type: string
      enum: [queued, ready, failed]
    DocumentRenderPdfJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        downloadUrl: {type: string, description: A short-lived link to the .docx.}
    DocumentPdfRenderedJob:
      type: object
      additionalProperties: false
      required: [documentId, pdfBase64, error]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        pdfBase64: {type: string, nullable: true, maxLength: 28000000, description: The PDF (base64); null when it failed.}
        error: {type: string, nullable: true, maxLength: 1000}
    DocumentTextExtractedJob:
      type: object
      additionalProperties: false
      required: [documentId, status, text, pageCount, extractor, errorMessage, warnings]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        status: {$ref: '#/components/schemas/ExtractionStatus'}
        text:
          type: string
          nullable: true
          pattern: '^[^\x00]*$'
          description: The document's plain text, with NUL characters removed.
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          description: name@version of the extractor(s), e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        warnings:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 500}
          description: Problems found while reading, e.g. pages OCR could not read.
    DocumentParseCvJob:
      type: object
      additionalProperties: false
      required: [documentId, text]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        text:
          type: string
          pattern: '^[^\x00]*$'
          description: The document's saved text, so quotes match it exactly.
    DocumentCvParsedJob:
      type: object
      additionalProperties: false
      required: [documentId, profile, errorMessage]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        profile: {allOf: [{$ref: '#/components/schemas/ParsedProfile'}], nullable: true}
        errorMessage: {type: string, nullable: true}
    EmailTemplateId:
      type: string
      pattern: '^etpl_[0-9a-hjkmnp-tv-z]{26}$'
      example: etpl_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailId:
      type: string
      pattern: '^eml_[0-9a-hjkmnp-tv-z]{26}$'
      example: eml_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailTemplate:
      type: object
      required: [id, version, name, subject, body, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/EmailTemplateId'}
        version: {type: integer}
        name: {type: string}
        subject: {type: string}
        body:
          type: string
          description: "Plain text with placeholders such as {{candidate.firstName}}; see GET /v1/email-templates for the list in `placeholders`."
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EmailTemplateList:
      type: object
      required: [items, placeholders]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EmailTemplate'}
        placeholders:
          type: array
          description: The placeholders templates may use.
          items: {type: string}
    EmailTemplateInput:
      type: object
      additionalProperties: false
      required: [name, subject, body]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
    EmailTemplateUpdate:
      type: object
      additionalProperties: false
      required: [version, name, subject, body]
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
    EmailDraftRequest:
      type: object
      additionalProperties: false
      required: [templateId, candidateId, timeZone]
      properties:
        templateId: {$ref: '#/components/schemas/EmailTemplateId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        interviewId: {$ref: '#/components/schemas/InterviewId'}
        timeZone: {type: string, maxLength: 64, example: Asia/Kuala_Lumpur}
    EmailDraft:
      type: object
      required: [to, subject, body, missing]
      properties:
        to:
          type: array
          description: Suggested recipients (the candidate, or the job's hiring contact for templates addressed to the client).
          items: {type: string, format: email}
        subject: {type: string}
        body: {type: string}
        missing:
          type: array
          description: Placeholders that had no value (left as [placeholder] in the text).
          items: {type: string}
    EmailStatus:
      type: string
      description: queued = waiting to be sent; sent = accepted by the mail server; failed = could not be sent (see error).
      enum: [queued, sent, failed]
    Email:
      type: object
      required: [id, candidateId, applicationId, to, cc, subject, body, status, error, sentBy, sentByName, createdAt, sentAt]
      properties:
        id: {$ref: '#/components/schemas/EmailId'}
        candidateId:
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
        applicationId:
          allOf: [{$ref: '#/components/schemas/ApplicationId'}]
          nullable: true
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        subject: {type: string}
        body: {type: string}
        status: {$ref: '#/components/schemas/EmailStatus'}
        error: {type: string, nullable: true}
        sentBy: {$ref: '#/components/schemas/UserId'}
        sentByName: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, nullable: true}
    EmailList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Email'}
    EmailSend:
      type: object
      additionalProperties: false
      required: [to, subject, body]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
        cc:
          type: array
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
    EmailSendJob:
      type: object
      additionalProperties: false
      required: [emailId]
      properties:
        emailId: {$ref: '#/components/schemas/EmailId'}
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserSummary'}
    UserSummary:
      type: object
      required: [id, name, role, canInterview]
      properties:
        canInterview: {type: boolean, description: "Their role may give interview feedback, so they can be an interviewer."}
        id: {$ref: '#/components/schemas/UserId'}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    Me:
      type: object
      required: [user, tenant, role, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tenant: {$ref: '#/components/schemas/Tenant'}
        role: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    User:
      type: object
      required: [id, email, name]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        email: {type: string, format: email}
        name: {type: string}
    Tenant:
      type: object
      required: [id, name, careersSlug]
      properties:
        careersSlug:
          type: string
          description: The company's public careers page address, e.g. contoh-recruitment (/#/careers/contoh-recruitment).
        id: {$ref: '#/components/schemas/TenantId'}
        name: {type: string}
    SignInInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 200}
