# GENERATED by `task gen` from contracts/openapi.base.yaml and contracts/modules/*.yaml.
# DO NOT EDIT: change those files instead, then run `task gen`.
openapi: 3.0.3
info:
  title: HiringPlug API
  version: 0.1.0
  description: |
    The HiringPlug applicant tracking system API.

    **Authentication.** Send `Authorization: Bearer <token>` on every request.

    **Permissions.** Every operation declares `x-permission`: the permission a
    caller needs. `authenticated` means any signed-in user. The permissions a
    role has by default are listed under `x-permissions`.

    **Errors.** Every error response has the same shape (`Error`). Use
    `error.code` to decide what to do, and quote `error.requestId` when
    reporting a problem: it finds every log line for that request.

    **Concurrency.** Records that can be edited carry a `version`. Send it back
    when you change the record; if someone else changed it first you get
    `409 CONFLICT_STALE_VERSION` instead of silently overwriting their change.
servers:
  - url: /
security:
  - bearerAuth: []
x-roles:
  owner: Full access, including users and billing.
  admin: Full access to recruiting data and settings.
  recruiter: Works candidates, jobs and clients, including salary details.
  sourcer: Finds and adds candidates; no salary details.
  hiring_manager: Reviews candidates for their jobs; no salary details.
  viewer: Read-only access; no salary details.
x-error-codes:
  AI_KEYS_NOT_SET_UP:
    module: aiproviders
    status: 409
    description: The server cannot store API keys yet (HP_AI_KEYS_SECRET is not set).
  AI_PROVIDER_NO_KEY:
    module: aiproviders
    status: 409
    description: That provider has no API key yet; save one first.
  APPLICATION_EXISTS:
    module: pipeline
    status: 409
    description: The candidate is already on this job. `details.existingApplicationId` points to it.
  ASSISTANT_LIMIT_REACHED:
    module: assistant
    status: 429
    description: The company has used this month's AI allowance; it starts again on the 1st.
  ASSISTANT_OFF:
    module: assistant
    status: 409
    description: The AI assistant is switched off (no AI provider is set up).
  AUTOMATION_NOT_ALLOWED:
    module: automations
    status: 422
    description: The automation run cannot be sent or skipped like this (it is no longer waiting, the candidate cannot be emailed, ...). The message says why.
  BOOKING_CLOSED:
    module: scheduling
    status: 409
    description: The booking link was cancelled or has expired, or the meeting is too close to move.
  BOOKING_SLOT_TAKEN:
    module: scheduling
    status: 409
    description: That time is no longer free; pick another.
  BOOKING_TOO_MANY_TRIES:
    module: scheduling
    status: 429
    description: Too many bookings from one address in a short time; try again later.
  CANDIDATE_DUPLICATE_EMAIL:
    module: candidates
    status: 409
    description: 'Another candidate already has this email (one candidate per email). details: existingCandidateId, existingCandidateName and existingOwnerName, when the user may see them.'
  CAREERS_TOO_MANY_APPLICATIONS:
    module: careers
    status: 429
    description: Too many applications from one place in a short time. Try again later.
  COMPANY_DUPLICATE_NAME:
    module: companies
    status: 409
    description: Another company already has this name (ignoring case and accents). `details.existingCompanyId` points to it.
  CONFLICT_STALE_VERSION:
    module: shared
    status: 409
    description: Someone changed the record since you loaded it. Reload and try again.
  CONTACT_DUPLICATE_EMAIL:
    module: contacts
    status: 409
    description: Another contact already has this email. `details.existingContactId` points to them.
  CV_NOT_BLIND:
    module: cvformats
    status: 422
    description: A blind CV would still show something that identifies the candidate (usually text in the template itself); nothing was saved. The message says what kind of detail.
  DOCUMENT_DUPLICATE:
    module: documents
    status: 409
    description: 'The candidate already has this exact file (the same bytes): it is not uploaded again. `details.existingDocumentId` is the one they have.'
  DOCUMENT_HAS_NO_TEXT:
    module: documents
    status: 409
    description: The document has no extracted text yet (still being read, scanned without OCR, or unreadable), so there is nothing to parse.
  DOCUMENT_NOT_DELETABLE:
    module: documents
    status: 409
    description: Only formatted CVs can be deleted; the candidate's own CVs (and other files) are kept.
  EMAIL_DO_NOT_CONTACT:
    module: emails
    status: 409
    description: The candidate withdrew consent to be contacted (see their data protection panel), so no email is sent to them.
  FORBIDDEN:
    module: shared
    status: 403
    description: You are signed in but lack the permission this operation needs.
  INTERNAL:
    module: shared
    status: 500
    description: Something went wrong on our side. Quote the requestId when reporting it.
  INTERVIEW_CLASH:
    module: interviews
    status: 409
    description: 'An interviewer already has an interview at that time. `details.clashes` lists them; send ignoreClashes: true to schedule anyway.'
  INTERVIEW_NOT_ALLOWED:
    module: interviews
    status: 422
    description: The interview cannot be scheduled or changed like this (closed application, feedback from someone who is not an interviewer, ...). The message says why.
  JOB_AD_BLIND_AI_OFF:
    module: jobs
    status: 409
    description: Rewriting a blind ad needs the AI, and no AI provider is set up (or this month's AI allowance is used up).
  JOB_AD_BLIND_TOO_SHORT:
    module: jobs
    status: 422
    description: The ad has too little text to rewrite (CV Studio asks for at least 80 characters of job description).
  JOB_AD_NOT_PUBLISHABLE:
    module: jobs
    status: 422
    description: 'The ad cannot be published as it is: the job is not open, the ad has no text, or its closing date has passed. The message says which.'
  LINK_NOT_VALID:
    module: identity
    status: 410
    description: The invitation or password reset link was used, replaced or has expired.
  MATCHING_LIMIT_REACHED:
    module: matching
    status: 429
    description: The company has used this month's AI allowance; it starts again on the 1st.
  MATCHING_OFF:
    module: matching
    status: 409
    description: Matching is switched off (no AI provider is set up).
  MATCH_CONSENT_WITHDRAWN:
    module: matching
    status: 409
    description: The candidate withdrew consent to their data being used, so it is not sent to the AI.
  MATCH_NEEDS_TEXT:
    module: matching
    status: 409
    description: There is nothing to compare yet - the candidate has no CV with readable text, or the job has no description or ad text. The message says which.
  METHOD_NOT_ALLOWED:
    module: shared
    status: 405
    description: The endpoint exists but not with this HTTP method.
  NOT_FOUND:
    module: shared
    status: 404
    description: The record does not exist
  OFFER_NOT_ALLOWED:
    module: offers
    status: 422
    description: The offer cannot be made or changed like this (the application is closed or has an open offer, an approval of your own request, a step out of order, ...). The message says why.
  PAYLOAD_TOO_LARGE:
    module: shared
    status: 413
    description: The request body or uploaded file is too large.
  PLACEMENT_NOT_ALLOWED:
    module: placements
    status: 422
    description: The placement cannot be recorded or changed like this (the application is closed or already has one, a fall-through after the guarantee ended, ...). The message says why.
  ROLE_NOT_EDITABLE:
    module: identity
    status: 422
    description: The owner role always has every permission and sees all candidates; it cannot be changed.
  ROUTE_NOT_FOUND:
    module: shared
    status: 404
    description: No such endpoint.
  SCHEDULING_NOT_SET_UP:
    module: scheduling
    status: 409
    description: Set your hours for calls (Account > Booking hours) before sending booking links.
  SERVICE_UNAVAILABLE:
    module: shared
    status: 503
    description: A dependency is temporarily unavailable. Retry later.
  SIGN_IN_CHOOSE_COMPANY:
    module: identity
    status: 409
    description: The email and password match accounts at several companies; send one of `details.companies` (slug) as `company`.
  SIGN_IN_FAILED:
    module: identity
    status: 401
    description: The email or password is wrong (which is not said), or the account is not active.
  STAGE_MOVE_NOT_ALLOWED:
    module: pipeline
    status: 422
    description: The move breaks a pipeline rule (the message says which), e.g. rejecting without a reason.
  STUDIO_CV_OFF:
    module: cvformats
    status: 409
    description: CV Studio formatting needs the AI, and no AI provider is set up (or this month's AI allowance is used up).
  STUDIO_CV_SOURCE:
    module: cvformats
    status: 422
    description: The chosen document cannot be formatted (not this candidate's, not a CV they sent, or not a PDF or Word file).
  TEAM_CHANGE_NOT_ALLOWED:
    module: identity
    status: 422
    description: The change would break a team rule (your own role, the last owner, owners changed only by owners). The message says why.
  TOO_MANY_ATTEMPTS:
    module: identity
    status: 429
    description: Too many attempts from this address or for this email; wait and try again.
  UNAUTHENTICATED:
    module: shared
    status: 401
    description: Missing
  UNSUPPORTED_MEDIA_TYPE:
    module: shared
    status: 415
    description: The content type or file type is not supported.
  VALIDATION_FAILED:
    module: shared
    status: 400
    description: The request is invalid. `details` says which fields and why.
paths:
  /v1/ai-providers:
    get:
      operationId: getAiProviders
      tags: [aiproviders]
      summary: The AI provider in use, and each provider's model and key (only its last characters)
      x-permission: aiproviders:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviders'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: chooseAiProvider
      tags: [aiproviders]
      summary: Switch the AI provider the company uses
      x-permission: aiproviders:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderChoiceInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviders'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AiProviderConflict'}
  /v1/ai-providers/{aiProvider}:
    parameters:
      - $ref: '#/components/parameters/AiProviderPath'
    put:
      operationId: saveAiProvider
      tags: [aiproviders]
      summary: Save a provider's model and (new) API key, and check them
      x-permission: aiproviders:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderInput'}
      responses:
        '200':
          description: Saved; the check runs in the background
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviders'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AiProviderConflict'}
    delete:
      operationId: removeAiProviderKey
      tags: [aiproviders]
      summary: Remove a provider's API key (the AI is switched off if it was in use)
      x-permission: aiproviders:manage
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviders'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/ai-providers/{aiProvider}/check:
    parameters:
      - $ref: '#/components/parameters/AiProviderPath'
    post:
      operationId: checkAiProvider
      tags: [aiproviders]
      summary: Check a provider's saved key and model again
      x-permission: aiproviders:manage
      responses:
        '202':
          description: The check runs in the background
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviders'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AiProviderConflict'}
  /v1/assistant:
    get:
      operationId: getAssistant
      tags: [assistant]
      summary: Whether the assistant is on, and how much of this month's allowance the company has used
      x-permission: assistant:use
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/assistant/answers:
    get:
      operationId: listAssistantAnswers
      tags: [assistant]
      summary: Your latest questions about one candidate, job or application, newest first
      x-permission: assistant:use
      parameters:
        - {name: subjectType, in: query, required: true, schema: {$ref: '#/components/schemas/AssistantSubjectType'}}
        - {name: subjectId, in: query, required: true, schema: {type: string, maxLength: 40}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantAnswerList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the assistant (answered in the background)
      x-permission: assistant:use
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantQuestion'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantAnswer'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AssistantOff'}
        '429': {$ref: '#/components/responses/AssistantLimitReached'}
  /v1/automations:
    get:
      operationId: listAutomations
      tags: ["automations"]
      summary: The automations, with the default for new ones
      description: The first time, the ready-made automations are added (switched off).
      x-permission: automations:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAutomation
      tags: ["automations"]
      summary: Add an automation
      x-permission: automations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Automation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/automations/{automationId}:
    parameters:
      - $ref: '#/components/parameters/AutomationIdPath'
    put:
      operationId: updateAutomation
      tags: ["automations"]
      summary: Change an automation (switch it on or off, ...)
      description: version is the one read; a stale one is refused. Runs already scheduled follow the change when they are due.
      x-permission: automations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Automation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteAutomation
      tags: ["automations"]
      summary: Remove an automation (and what it has scheduled)
      x-permission: automations:manage
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/automation-settings:
    put:
      operationId: putAutomationSettings
      tags: ["automations"]
      summary: The default for new automations (send on their own, or ask first)
      x-permission: automations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationSettings'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/automation-runs:
    get:
      operationId: listAutomationRuns
      tags: ["automations"]
      summary: What automations did, will do, or wait to send (newest first, at most 200)
      x-permission: automations:read
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/AutomationRunStatus'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationRunList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/automation-runs/{runId}/send:
    parameters:
      - $ref: '#/components/parameters/AutomationRunIdPath'
    post:
      operationId: sendAutomationRun
      tags: ["automations"]
      summary: Send an email waiting for approval, from your mailbox
      x-permission: automations:approve
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationRun'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/AutomationNotAllowed'}
  /v1/automation-runs/{runId}/skip:
    parameters:
      - $ref: '#/components/parameters/AutomationRunIdPath'
    post:
      operationId: skipAutomationRun
      tags: ["automations"]
      summary: Do not send an email waiting for approval
      x-permission: automations:approve
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationRun'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/AutomationNotAllowed'}
  /v1/tasks:
    get:
      operationId: listTasks
      tags: ["automations"]
      summary: Your tasks (open ones, and those done in the last 7 days)
      x-permission: automations.tasks:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/TaskId'}
    patch:
      operationId: updateTask
      tags: ["automations"]
      summary: Mark one of your tasks done (or not done)
      x-permission: automations.tasks:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/salary-calculations:
    post:
      operationId: calculateSalary
      tags: [candidates]
      summary: Review a fixed monthly salary calculation without changing a candidate
      x-permission: candidates.compensation:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SalaryCalculationInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalaryCalculation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List or search candidates, newest first
      x-permission: candidates:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email, current title or company (ignoring case and accents); or a phone number, however it is written."
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: {type: boolean, default: false}
        - name: tag
          in: query
          description: Only candidates with this tag (ignoring case).
          schema: {type: string, minLength: 1, maxLength: 60}
        - name: skill
          in: query
          description: Only candidates with this skill (ignoring case).
          schema: {type: string, minLength: 1, maxLength: 60}
        - name: owner
          in: query
          description: Only candidates owned by this user ("me" for your own).
          schema: {type: string, minLength: 1, maxLength: 40}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: {$ref: '#/components/schemas/CandidateId'}
        - name: sort
          in: query
          schema: {$ref: '#/components/schemas/CandidateSort'}
        - name: offset
          in: query
          description: With a sort other than newest, the `nextOffset` of the previous page.
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidatePage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Add a candidate
      description: Salary details are set separately with PUT /v1/candidates/{candidateId}/compensation.
      x-permission: candidates:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/search:
    post:
      operationId: searchCandidates
      tags: [candidates]
      summary: Advanced search - filters and a boolean search of their CVs and profiles, newest first
      description: >
        Every filter given must hold. The boolean (SAP AND (BW OR BPC) NOT internship, "project manager", manag*) is looked for in the candidate's CVs (each one read, not formatted ones) and in their profile (title, company, skills, tags, industry, specialization, location); a candidate is found when either matches. Each hit says where, with a snippet of the CV and the words to highlight.

      x-permission: candidates:read
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateSearch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateSearchPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/candidates/find:
    get:
      operationId: findCandidates
      tags: [candidates]
      summary: The home page search - candidates by name, email or phone, several at once
      description: >
        Kano's /find rules. Searches are split on commas (at most six). Each is an email (matched exactly), a phone number (the whole number, in any format: without a country code it is read as a local number of the agency's country, the usual candidate countries, then any country where it is valid; never only its last digits) or a name (every word in the name, email, title or company; then names alike, scored). "name - company" keeps those who work or worked there, word for word. Each search gets its own block, with a message instead when it is incomplete.

      x-permission: candidates:read
      parameters:
        - name: q
          in: query
          required: true
          description: "For example: ali abu - nintex, +60 12-345 6789, aisyah@example.com"
          schema: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateFind'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/candidates/used-values:
    get:
      operationId: listCandidateUsedValues
      tags: [candidates]
      summary: Tags, skills, industries and specializations already used, most used first
      description: For suggestions while typing, so everyone spells them the same way.
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsedValues'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a candidate
      description: >
        `compensation` is only included if you have candidates.compensation:read; otherwise it is left out and listed in `restrictedFields`.

      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Change some fields of a candidate
      description: >
        Only the fields you send change. Send `null` to clear a field. `version` must be the version you loaded.

      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/history:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: replaceCandidateHistory
      tags: [candidates]
      summary: Replace a candidate's work history and education
      description: >
        Both lists are replaced as a whole, newest first. `version` is the candidate's: a save based on an older version is a conflict.

      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateHistoryUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/merge:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: mergeCandidate
      tags: [candidates]
      summary: Merge a duplicate into this candidate
      description: >
        The duplicate's CVs, jobs and notes move to this candidate; this candidate's empty fields (and salary, if none) are filled from the duplicate; then the duplicate is deleted. If both are on the same job, this candidate's application is kept. `version` is this candidate's.

      x-permission: candidates:merge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateMerge'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Candidate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/similar:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listSimilarCandidates
      tags: [candidates]
      summary: Possible duplicates of a candidate (same phone, or a very similar name)
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimilarCandidateList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/candidates/{candidateId}/compensation:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: putCandidateCompensation
      tags: [candidates]
      summary: Set a candidate's current and expected salary
      description: >
        Replaces both values. Send `expectedVersion: 0` the first time, then the `version` you loaded.

      x-permission: candidates.compensation:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompensationUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Compensation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/owner:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    put:
      operationId: setCandidateOwner
      tags: [candidates]
      summary: Give the candidate to another recruiter (or to nobody)
      description: >
        Roles that see only their own (or their team's) candidates may no longer see a candidate they hand over; nothing else changes.

      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerInput'}
      responses:
        '204': {description: Changed}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/candidates/{candidateId}/screening-calls:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: recordScreeningCall
      tags: [candidates]
      summary: Record a screening call, updating the candidate from it
      description: >
        In one step: the call's notes become a screening note, and the profile takes what was asked (notice period, work authorization, nationality; the source only when the candidate has none), with the salary (needs candidates.compensation:update). Fields left out are not changed. Notes need notes:create; sensitive ones notes.sensitive:read. Each call is kept with who made it and when (calledBy, calledOn: you and today when left out); the salary follows the latest call: one dated before a call already recorded with salary keeps that salary (salaryApplied false).

      x-permission: candidates:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScreeningCallInput'}
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreeningCallResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      operationId: listScreeningCalls
      tags: [candidates]
      summary: A candidate's screening calls, latest first
      x-permission: candidates:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreeningCallList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/public/careers/{slug}:
    parameters:
      - $ref: '#/components/parameters/CareersSlugPath'
    get:
      operationId: getCareersPage
      tags: [careers]
      summary: A company's careers page with its published ads
      description: Ads past their closing date are left out.
      x-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CareersPage'}
        '404': {$ref: '#/components/responses/NotFound'}
