        title: {type: string, maxLength: 200, nullable: true}
        email: {type: string, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        mobile: {type: string, maxLength: 40, nullable: true}
        linkedinUrl: {type: string, maxLength: 300, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{$ref: '#/components/schemas/ContactRole'}]
          nullable: true
        notes: {type: string, maxLength: 4000, nullable: true}
    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, phone, mobile, status, role, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactId'}
        fullName: {type: string}
        title: {type: string, nullable: true}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        email: {type: string, nullable: true}
        emailCheckStatus:
          allOf: [{$ref: '#/components/schemas/EmailCheckStatus'}]
          nullable: true
        phone: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        role:
          description: Hiring manager, HR… (a key of the contact_role list); null when not set.
          allOf: [{$ref: '#/components/schemas/ContactRole'}]
          nullable: true
        updatedAt: {type: string, format: date-time}
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ContactSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
    ContactEmploymentCheckId:
      type: string
      pattern: '^cec_[0-9a-hjkmnp-tv-z]{26}$'
      example: cec_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactEmployment:
      type: object
      required: [id, status, verdict, fileName, error, profileName, profileUrl, current, positions, nameMatches, urlMatches, checkedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactEmploymentCheckId'}
        status: {type: string, enum: [reading, read, failed]}
        verdict:
          type: string
          description: >
            same_company = their current job is at the contact's company; moved = their current job is somewhere else; no_current_job = the profile shows no current job; unknown = still reading, or not read.

          enum: [same_company, moved, no_current_job, unknown]
        fileName: {type: string}
        error: {type: string, nullable: true}
        profileName: {type: string, nullable: true, description: The name on the profile.}
        profileUrl: {type: string, nullable: true, description: The LinkedIn address on the profile.}
        current:
          description: Their current job (the latest without an end date).
          allOf: [{$ref: '#/components/schemas/ContactPosition'}]
          nullable: true
        positions:
          type: array
          description: Their jobs on the profile, the latest first (up to 10).
          items: {$ref: '#/components/schemas/ContactPosition'}
        nameMatches: {type: boolean, nullable: true, description: The profile's name is the contact's; null when not read.}
        urlMatches: {type: boolean, nullable: true, description: The profile's address is the contact's LinkedIn; null when either is missing.}
        checkedAt: {type: string, format: date-time}
    ContactPosition:
      type: object
      required: [title, company, startDate, endDate, current]
      properties:
        title: {type: string, nullable: true}
        company: {type: string, nullable: true}
        startDate: {type: string, nullable: true, description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, description: YYYY-MM or YYYY; null when current.}
        current: {type: boolean}
    ContactReadLinkedinJob:
      type: object
      additionalProperties: false
      required: [checkId, downloadUrl, fileName, sizeBytes]
      properties:
        checkId: {$ref: '#/components/schemas/ContactEmploymentCheckId'}
        downloadUrl: {type: string, description: Short-lived signed URL to download the PDF from.}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
    ContactLinkedinReadJob:
      type: object
      additionalProperties: false
      required: [checkId, profile, errorMessage]
      properties:
        checkId: {$ref: '#/components/schemas/ContactEmploymentCheckId'}
        profile:
          description: What the rules read from the profile (no AI); null when it could not be read.
          allOf: [{$ref: '#/components/schemas/ParsedProfile'}]
          nullable: true
        errorMessage: {type: string, nullable: true}
    CvTemplateId:
      type: string
      description: standard = the built-in template.
      pattern: '^(standard|ctpl_[0-9a-hjkmnp-tv-z]{26})$'
      example: standard
    CvTemplate:
      type: object
      required: [id, name, builtIn, uploadedByName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/CvTemplateId'}
        name: {type: string}
        builtIn: {type: boolean}
        uploadedByName: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true}
    CvTemplateList:
      type: object
      required: [items, placeholders, blocks]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CvTemplate'}
        placeholders:
          type: array
          description: "Placeholders a template may use, written {{name}}; one with no value removes its whole paragraph (so a label like Email: goes too)."
          items: {type: string}
        blocks:
          type: array
          description: "Repeating blocks: paragraphs between {{#experience}} and {{/experience}} (each on its own line) repeat for each job; inside, {{title}}, {{company}}, {{dates}}, {{description}}. Likewise {{#education}} with {{qualification}}, {{institution}}, {{year}}."
          items: {type: string}
    FormatCvInput:
      type: object
      additionalProperties: false
      properties:
        templateId: {$ref: '#/components/schemas/CvTemplateId'}
        applicationId:
          description: The job the CV is for (its title and company can appear in the CV).
          allOf: [{$ref: '#/components/schemas/ApplicationId'}]
        showContact: {type: boolean, description: "Include the candidate's email and phone (left out unless asked, so the client goes through you)."}
        includeSalary: {type: boolean, description: "Include current and expected salary (needs candidates.compensation:read)."}
        summary: {type: string, maxLength: 3000, description: Your summary of the candidate for the client.}
        blind:
          type: boolean
          description: "A blind CV: a reference instead of the name; no contact details or nationality; names, emails, phone numbers and profile links removed from free text; checked before it is saved that none of them is left."
    StudioCvId:
      type: string
      pattern: '^scv_[0-9a-hjkmnp-tv-z]{26}$'
    StudioCvAlignment:
      type: string
      description: How paragraphs are aligned in the Word file.
      enum: [left, justify]
    StudioCvInput:
      type: object
      additionalProperties: false
      required: [documentId]
      properties:
        documentId:
          description: The CV to format (one the candidate sent, PDF or Word).
          allOf: [{$ref: '#/components/schemas/DocumentId'}]
        blind: {type: boolean, description: "A blind CV: the AI anonymises it (no name, contact details, employers or schools named), then CV Studio's checks; checked again before it is saved."}
        neutralGender: {type: boolean, description: "With blind: the candidate referred to as \"the candidate\" rather than he or she."}
        correctLanguage: {type: boolean, description: "Correct spelling, punctuation and capitalisation (never the meaning, numbers or dates)."}
        alignment: {$ref: '#/components/schemas/StudioCvAlignment'}
        summary: {$ref: '#/components/schemas/StudioCvSummary'}
        summaryFocus: {$ref: '#/components/schemas/StudioCvSummaryFocus'}
        summaryDirection:
          type: string
          maxLength: 500
          nullable: true
          description: "The recruiter's own direction for the summary, in their words: what to bring out and the tone (e.g. confident and concise, lead with the S/4HANA migration). Never about pay: the summary never mentions it."
    StudioCvSummary:
      type: string
      description: "The About Him / Her summary, written by the AI from the CV as CV Studio does: none (only the CV's own), short (4-5 bullets), normal (6-7, the default) or detailed (8-10). Never for a blind CV: it keeps the CV's own summary."
      enum: [none, short, normal, detailed]
    StudioCvSummaryFocus:
      type: string
      description: "What the summary brings out, CV Studio's choices: general (the default), technology (skills, tech stack, delivery), leadership (teams, stakeholders, strategy) or commercial (revenue, clients, growth)."
      enum: [general, technology, leadership, commercial]
    StudioCvStatus:
      type: string
      enum: [queued, done, failed]
    StudioCv:
      type: object
      required: [id, candidateId, sourceDocumentId, status, blind, correctLanguage, alignment, documentId, fileName, error, warning, payStatementsRemoved, createdAt]
      properties:
        id: {$ref: '#/components/schemas/StudioCvId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        sourceDocumentId: {$ref: '#/components/schemas/DocumentId'}
        status: {$ref: '#/components/schemas/StudioCvStatus'}
        blind: {type: boolean}
        correctLanguage: {type: boolean}
        alignment: {$ref: '#/components/schemas/StudioCvAlignment'}
        documentId:
          description: The formatted CV, once done.
          nullable: true
          allOf: [{$ref: '#/components/schemas/DocumentId'}]
        fileName: {type: string, nullable: true}
        error: {type: string, nullable: true, description: Why it failed.}
        warning: {type: string, nullable: true, description: "CV Studio's check found something in the CV that the result may have lost or changed: compare them before sending it."}
        payStatementsRemoved: {type: integer, description: "Statements of the candidate's own pay left out of the result."}
        createdAt: {type: string, format: date-time}
    StudioCvList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StudioCv'}
    CvFormatStudioJob:
      type: object
      additionalProperties: false
      required: [studioCvId, downloadUrl, contentType, fileName, sizeBytes, blind, neutralGender, correctLanguage, alignment, summary]
      properties:
        studioCvId: {$ref: '#/components/schemas/StudioCvId'}
        downloadUrl: {type: string, description: A signed link to the CV (expires).}
        contentType: {type: string}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
        blind: {type: boolean}
        neutralGender: {type: boolean}
        correctLanguage: {type: boolean}
        alignment: {$ref: '#/components/schemas/StudioCvAlignment'}
        summary: {$ref: '#/components/schemas/StudioCvSummary'}
        summaryFocus: {$ref: '#/components/schemas/StudioCvSummaryFocus'}
        summaryDirection: {type: string, nullable: true, maxLength: 500, description: "The recruiter's direction and tone for the summary."}
        ai:
          allOf: [{$ref: '#/components/schemas/AiAccess'}]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    CvStudioFormattedJob:
      type: object
      additionalProperties: false
      required: [studioCvId, docxBase64, error, warning, payStatementsRemoved, model, inputTokens, outputTokens]
      properties:
        studioCvId: {$ref: '#/components/schemas/StudioCvId'}
        docxBase64: {type: string, nullable: true, description: The formatted Word file.}
        error: {type: string, nullable: true, maxLength: 2000}
        warning: {type: string, nullable: true, maxLength: 4000}
        payStatementsRemoved: {type: integer, minimum: 0}
        model: {type: string, nullable: true}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
    FormattedCv:
      type: object
      required: [documentId, fileName]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        fileName: {type: string}
    DocumentMatchRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [fileName, sha256]
            properties:
              fileName: {type: string, minLength: 1, maxLength: 255}
              sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    DocumentMatch:
      type: object
      required: [documentId, candidateId, candidateName, fileName, createdAt]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        fileName: {type: string}
        createdAt: {type: string, format: date-time}
    DocumentMatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DocumentMatchResult'}
    DocumentMatchResult:
      type: object
      required: [fileName, sha256, sameContent, sameName]
      properties:
        fileName: {type: string}
        sha256: {type: string}
        sameContent:
          description: A CV with exactly this content (skip uploading it again).
          allOf: [{$ref: '#/components/schemas/DocumentMatch'}]
          nullable: true
        sameName:
          description: CVs with the same file name (ignoring case) but other content (ask before uploading).
          type: array
          items: {$ref: '#/components/schemas/DocumentMatch'}
    DocumentHighlights:
      type: object
      required: [parts, matches]
      properties:
        parts:
          type: array
          description: The text in order; parts with match true are the words found (as the search matches them, other forms included).
          items: {$ref: '#/components/schemas/DocumentHighlightPart'}
        matches: {type: integer, description: How many places match.}
    DocumentHighlightPart:
      type: object
      required: [text, match]
      properties:
        text: {type: string}
        match: {type: boolean}
    DocumentId:
      type: string
      pattern: '^doc_[0-9a-hjkmnp-tv-z]{26}$'
      example: doc_01jbz6w0m0k8q9x2r3s4t5v6w7
    DocumentSource:
      type: string
      description: >
        Where the file came from. original = the candidate's own CV; formatted = a CV formatted by your team for clients.

      enum: [jobstreet, linkedin, original, formatted, other]
    DocumentStatus:
      type: string
      description: >
        queued = waiting for text extraction; extracted = text available; needs_ocr = scanned document, no text layer yet; failed = could not be read.

      enum: [queued, extracted, needs_ocr, failed]
    DocumentParseStatus:
      type: string
      description: >
        queued = being parsed; parsed = details ready to review; failed = the parser could not read it.

      enum: [queued, parsed, failed]
    Document:
      type: object
      required: [id, candidateId, source, fileName, contentType, sizeBytes, sha256, status, pageCount, extractor, errorMessage, extractionWarnings, parseStatus, pdfStatus, createdAt, updatedAt]
      properties:
        pdfStatus:
          description: "Formatted CVs made by the app also come as a PDF: queued, ready (GET .../pdf) or failed; null for other documents."
          allOf: [{$ref: '#/components/schemas/PdfStatus'}]
          nullable: true
        id: {$ref: '#/components/schemas/DocumentId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        source: {$ref: '#/components/schemas/DocumentSource'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          nullable: true
          description: Which extractor produced the text, e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        extractionWarnings:
          type: array
          items: {type: string}
          description: >
            Problems a recruiter should know about, e.g. "OCR could not read page 3; this document may be incomplete." Empty when extraction was clean.

        extractedText:
          type: string
          nullable: true
          description: Only included when fetching a single document.
        parseStatus:
          allOf: [{$ref: '#/components/schemas/DocumentParseStatus'}]
          nullable: true
          description: Null when the document was never parsed (formatted CVs, or uploaded before parsing existed).
        parsedProfile:
          allOf: [{$ref: '#/components/schemas/ParsedProfile'}]
          nullable: true
          description: Only included when fetching a single document.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Document'}
    SourcedText:
      type: object
      additionalProperties: false
      required: [value, quote]
      description: >
        A value read from a CV and the exact CV text it came from. Values whose quote is not in the CV are dropped before saving.

      properties:
        value: {type: string, minLength: 1, maxLength: 300}
        quote: {type: string, minLength: 1, maxLength: 1000}
    ParsedJob:
      type: object
      additionalProperties: false
      required: [title, company, dates, startDate, endDate, current]
      properties:
        title: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        company: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        startDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY; null when current.}
        current: {type: boolean}
    ParsedEducation:
      type: object
      additionalProperties: false
      required: [qualification, institution, dates, endYear]
      properties:
        qualification: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        institution: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        endYear: {type: integer, nullable: true, minimum: 1950, maximum: 2100}
    ParsedProfile:
      type: object
      additionalProperties: false
      required: [parser, fullName, email, phone, linkedinUrl, location, nationality, residenceCountry, industry, noticePeriod, skills, experience, education, dropped]
      description: >
        Details read from a CV, as suggestions to review. nationality is an ISO country code; noticePeriod is "<number> day|week|month".

      properties:
        selectedEmployerIndex: {type: integer, minimum: 0, maximum: 199, description: 'Go-selected current or latest dated employer; omitted when review is needed.'}
        parser: {type: string, description: 'name@version of the parser(s), e.g. rules@1.'}
        fullName: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        email: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        phone: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        linkedinUrl: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        location: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        nationality: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        residenceCountry:
          description: Where the candidate lives, an ISO country code, from their address, the places in it, or their phone's country code.
          allOf: [{$ref: '#/components/schemas/SourcedText'}]
          nullable: true
        industry:
          description: "The industry of their current (latest) employer, inferred: the quote is the words it was inferred from (Kano's industries)."
          allOf: [{$ref: '#/components/schemas/SourcedText'}]
          nullable: true
        noticePeriod: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        skills:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SourcedText'}
        experience:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/ParsedJob'}
        education:
          type: array
          maxItems: 15
          items: {$ref: '#/components/schemas/ParsedEducation'}
        dropped:
          type: integer
          minimum: 0
          description: How many values were dropped because their quote was not found in the CV.
    DocumentExtractTextJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl, contentType, fileName, sizeBytes]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        downloadUrl:
          type: string
          description: Short-lived signed URL to download the file from.
        contentType: {type: string}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
    ExtractionStatus:
      type: string
      enum: [extracted, needs_ocr, failed]
    PdfStatus:
      type: string
      enum: [queued, ready, failed]
    DocumentRenderPdfJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        downloadUrl: {type: string, description: A short-lived link to the .docx.}
    DocumentPdfRenderedJob:
      type: object
      additionalProperties: false
      required: [documentId, pdfBase64, error]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        pdfBase64: {type: string, nullable: true, maxLength: 28000000, description: The PDF (base64); null when it failed.}
        error: {type: string, nullable: true, maxLength: 1000}
    DocumentTextExtractedJob:
      type: object
      additionalProperties: false
      required: [documentId, status, text, pageCount, extractor, errorMessage, warnings]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        status: {$ref: '#/components/schemas/ExtractionStatus'}
        text:
          type: string
          nullable: true
          pattern: '^[^\x00]*$'
          description: The document's plain text, with NUL characters removed.
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          description: name@version of the extractor(s), e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        warnings:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 500}
          description: Problems found while reading, e.g. pages OCR could not read.
    DocumentParseCvJob:
      type: object
      additionalProperties: false
      required: [documentId, text]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        text:
          type: string
          pattern: '^[^\x00]*$'
          description: The document's saved text, so quotes match it exactly.
        fileName:
          type: string
          maxLength: 255
          description: "The file's name, a hint to the candidate's name (\"SITI AISYAH-SEEK-Profile.pdf\")."
        useAi:
          type: boolean
          description: >
            The AI may fill what the rules leave empty (Kano's way: when the rules find name, email, phone, current title and company, only the industry is asked for). Set when the AI is on and the company has allowance left.

        aiText:
          type: string
          pattern: '^[^\x00]*$'
          description: >
            What the AI may read: the text with salary figures taken out (salary never goes to the AI). Sent with useAi; quotes still come from text.

        ai:
          allOf: [{$ref: '#/components/schemas/AiAccess'}]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    DocumentCvParsedJob:
      type: object
      additionalProperties: false
      required: [documentId, profile, errorMessage]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        profile: {allOf: [{$ref: '#/components/schemas/ParsedProfile'}], nullable: true}
        errorMessage: {type: string, nullable: true}
        aiTokens: {type: integer, minimum: 0, description: Tokens the AI used (counted in the monthly allowance).}
    MailboxProvider:
      type: string
      enum:
        - microsoft
        - google
        - smtp
    MailboxStatus:
      type: object
      required:
        - storageReady
        - microsoftReady
        - googleReady
        - serverMode
        - connected
        - version
      properties:
        deliveryMode: {type: string, enum: [test, live]}
        storageReady:
          type: boolean
        microsoftReady:
          type: boolean
        googleReady:
          type: boolean
        serverMode:
          type: string
          enum:
            - test
            - live
            - unconfigured
        connected:
          type: boolean
        version:
          type: integer
          minimum: 0
        provider:
          $ref: '#/components/schemas/MailboxProvider'
        address:
          type: string
          format: email
        host:
          type: string
        port:
          type: integer
        tls:
          type: string
        username:
          type: string
    SmtpMailboxInput:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - address
        - host
        - port
        - tls
        - username
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        address:
          type: string
          format: email
          maxLength: 254
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        tls:
          type: string
          enum:
            - starttls
            - tls
            - none
        username:
          type: string
          maxLength: 320
        password:
          type: string
          maxLength: 4000
    MailboxAuthorizeInput:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - microsoft
            - google
    MailboxAuthorization:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    EmailTemplateId:
      type: string
      pattern: '^etpl_[0-9a-hjkmnp-tv-z]{26}$'
      example: etpl_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailId:
      type: string
      pattern: '^eml_[0-9a-hjkmnp-tv-z]{26}$'
      example: eml_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailBannerId:
      type: string
      pattern: '^ebn_[0-9a-hjkmnp-tv-z]{26}$'
      example: ebn_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailAttachmentId:
      type: string
      pattern: '^eat_[0-9a-hjkmnp-tv-z]{26}$'
      example: eat_01jbz6w0m0k8q9x2r3s4t5v6w7
    EmailBanner:
      type: object
      required: [id, name, contentType, sizeBytes, createdAt]
      properties:
        id: {$ref: '#/components/schemas/EmailBannerId'}
        name: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer}
        createdAt: {type: string, format: date-time}
    EmailBannerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EmailBanner'}
    EmailAttachment:
      type: object
      required: [id, fileName, contentType, sizeBytes]
      properties:
        id: {$ref: '#/components/schemas/EmailAttachmentId'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer}
    EmailField:
      type: object
      required: [token, key, label, salary]
      properties:
        token: {type: string, description: 'What to type or insert, e.g. "[Expected salary]".'}
        key: {type: string, description: 'The same as a placeholder, e.g. "candidate.expectedSalary".'}
        label: {type: string}
        salary: {type: boolean, description: Fills only for senders who may see salaries.}
    EmailCvAttachment:
      type: object
      additionalProperties: false
      required: [documentId]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        asPdf: {type: boolean, description: "A formatted CV's PDF instead of its Word file. Defaults to false."}
    EmailPreviewRequest:
      type: object
      additionalProperties: false
      required: [subject, bodyHtml, timeZone]
      properties:
        recipientCandidateId:
          description: Candidate recipient when the message contains details about selected candidates.
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
        subject: {type: string, maxLength: 200}
        bodyHtml: {type: string, maxLength: 100000}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        interviewId: {$ref: '#/components/schemas/InterviewId'}
        contactId: {$ref: '#/components/schemas/ContactId'}
        candidates:
          type: array
          minItems: 1
          maxItems: 10
          description: As for sending to the client about several candidates; fieldValues are then the job's, its client's and the sender's.
          items: {$ref: '#/components/schemas/EmailCandidate'}
        timeZone: {type: string, maxLength: 64, example: Asia/Kuala_Lumpur}
    EmailBatch:
      type: object
      additionalProperties: false
      required: [recipients, subject]
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/EmailRecipient'}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 20000}
        bodyHtml: {type: string, maxLength: 100000}
        timeZone: {type: string, maxLength: 64}
        attachmentIds:
          type: array
          maxItems: 10
          description: "Files you uploaded to /v1/email-attachments; each email carries them."
          items: {$ref: '#/components/schemas/EmailAttachmentId'}
        checkOnly: {type: boolean, description: "Send nothing; say who would get it."}
    EmailRecipient:
      type: object
      additionalProperties: false
      description: A candidate or one of a client's contacts.
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        contactId: {$ref: '#/components/schemas/ContactId'}
    EmailBatchResult:
      type: object
      required: [recipients, sent]
      properties:
        sent: {type: integer, description: "How many emails were sent (0 with checkOnly)."}
        recipients:
          type: array
          items: {$ref: '#/components/schemas/EmailBatchRecipient'}
    EmailBatchRecipient:
      type: object
      required: [candidateId, contactId, name, to, emailId, problem]
      properties:
        candidateId: {type: string, nullable: true}
        contactId: {type: string, nullable: true}
        name: {type: string}
        to: {type: string, nullable: true, description: Their address.}
        emailId: {type: string, nullable: true, description: "Their email, once sent."}
        problem: {type: string, nullable: true, description: "Why they do not get it, e.g. \"has no email address\"; null: they do."}
    EmailCandidate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateVersion: {type: integer, minimum: 1, description: Profile version used when inserting details.}
        compensationVersion: {type: integer, minimum: 0, description: Salary version used when inserting salary details; 0 means none existed.}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId:
          description: Their application to the job the email is about.
          allOf: [{$ref: '#/components/schemas/ApplicationId'}]
    EmailPreview:
      type: object
      required: [subject, bodyHtml, missing, salary, clientEmail, fieldValues]
      properties:
        candidateVersion: {type: integer, minimum: 1}
        compensationVersion: {type: integer, minimum: 0}
        fieldValues:
          type: object
          additionalProperties: {type: string}
          description: "Each field that has a value for this candidate, by its token: \"[Expected salary]\" -> \"RM 12,000 / month\" (salary only for roles that may see salaries). The composer puts the value in the message, where it can be edited; the candidate's record is not changed."
        clientEmail:
          type: string
          nullable: true
          description: "The job's hiring contact, to send to (when an application is given and its job has one)."
        subject: {type: string}
        bodyHtml: {type: string, description: "Formatted and made safe, as it will be sent."}
        missing:
          type: array
          description: Fields with no value (sending refuses them), e.g. "[Expected salary]".
          items: {type: string}
        salary: {type: boolean, description: "The email shows salary, so it may be hidden from roles that may not see salaries."}
    EmailTemplate:
      type: object
      required: [id, version, name, subject, body, bodyHtml, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/EmailTemplateId'}
        version: {type: integer}
        name: {type: string}
        subject: {type: string}
        body:
          type: string
          description: "Plain text with placeholders such as {{candidate.firstName}}; see GET /v1/email-templates for the list in `placeholders`."
        bodyHtml:
          type: string
          nullable: true
          description: "The formatted message (with its signature and banner), when the template has one; fields such as [Expected salary]. A value filled in from a candidate (<span data-field=\"...\">) is saved as its field, never the value."
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EmailTemplateList:
      type: object
      required: [items, placeholders, fields]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EmailTemplate'}
        fields:
          type: array
          description: The fields a message may use, with their tokens.
          items: {$ref: '#/components/schemas/EmailField'}
        placeholders:
          type: array
          description: The placeholders templates may use.
          items: {type: string}
    EmailTemplateInput:
      type: object
      additionalProperties: false
      required: [name, subject]
      description: Give body (plain text), bodyHtml (formatted), or both.
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 20000}
        bodyHtml: {type: string, maxLength: 100000}
    EmailTemplateUpdate:
      type: object
      additionalProperties: false
      required: [version, name, subject]
      description: Give body (plain text), bodyHtml (formatted), or both.
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 20000}
        bodyHtml: {type: string, maxLength: 100000}
    EmailDraftRequest:
      type: object
      additionalProperties: false
      required: [templateId, timeZone]
      description: For a candidate (candidateId) or one of a client's contacts (contactId).
      properties:
        templateId: {$ref: '#/components/schemas/EmailTemplateId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        contactId: {$ref: '#/components/schemas/ContactId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        interviewId: {$ref: '#/components/schemas/InterviewId'}
        timeZone: {type: string, maxLength: 64, example: Asia/Kuala_Lumpur}
    EmailDraft:
      type: object
      required: [to, subject, body, bodyHtml, missing]
      properties:
        bodyHtml:
          type: string
          nullable: true
          description: "The template's formatted message, filled the same way (values made safe for HTML); null for a plain-text template."
        to:
          type: array
          description: Suggested recipients (the candidate, or the job's hiring contact for templates addressed to the client).
          items: {type: string, format: email}
        subject: {type: string}
        body: {type: string}
        missing:
          type: array
          description: Placeholders that had no value (left as [placeholder] in the text).
          items: {type: string}
    EmailStatus:
      type: string
      description: queued = waiting to be sent; sent = accepted by the mail server; failed = could not be sent (see error).
      enum: [queued, sent, failed]
    Email:
      type: object
      required: [id, candidateId, applicationId, contactId, to, cc, bcc, subject, body, bodyHtml, attachments, salary, status, error, sentBy, sentByName, createdAt, sentAt]
      properties:
        deliveryMode: {type: string, enum: [test, live, unknown], description: 'Local test inbox, live provider acceptance, or unknown historical delivery.'}
        id: {$ref: '#/components/schemas/EmailId'}
        candidateId:
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
        contactId:
          description: The client's contact it was written to (from the contact's page).
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        applicationId:
          allOf: [{$ref: '#/components/schemas/ApplicationId'}]
          nullable: true
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        bcc: {type: array, items: {type: string}}
        subject: {type: string}
        body: {type: string, description: The plain-text version.}
        bodyHtml: {type: string, nullable: true, description: "The formatted version, if it had one."}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EmailAttachment'}
        salary: {type: boolean, description: "It shows salary (hidden from roles that may not see salaries, unless Settings say otherwise)."}
        status: {$ref: '#/components/schemas/EmailStatus'}
        error: {type: string, nullable: true}
        sentBy: {$ref: '#/components/schemas/UserId'}
        sentByName: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, nullable: true}
    EmailList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Email'}
    EmailSend:
      type: object
      additionalProperties: false
      required: [to, subject]
      description: >
        Give body (plain text) or bodyHtml (formatted). Fields in the subject and the formatted message ([Expected salary], ...) are filled from the candidate and application; one with no value refuses the email.

      properties:
        recipientCandidateId:
          description: Candidate recipient when the message contains details about selected candidates.
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
        to:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
        cc:
          type: array
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
        bcc:
          type: array
          maxItems: 10
          items: {type: string, format: email, maxLength: 254}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 20000}
        bodyHtml: {type: string, maxLength: 100000}
        timeZone: {type: string, maxLength: 64, description: For interview times in fields (default Asia/Kuala_Lumpur).}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        contactId:
          description: "To one of a client's contacts (from their page): fields are filled from the contact ([First name] is theirs) and their company."
          allOf: [{$ref: '#/components/schemas/ContactId'}]
        candidates:
          type: array
          minItems: 1
          maxItems: 10
          description: >
            An email to the client about several candidates (a shortlist), in the order given; instead of candidateId and applicationId; may include contactId or recipientCandidateId for the recipient. Their details are put in the message by the composer (a block or a table row each); fields left in the message are filled from the job, its client and the sender, not from one candidate. The email is kept on each candidate's emails.

          items: {$ref: '#/components/schemas/EmailCandidate'}
        attachmentIds:
          type: array
          maxItems: 10
          description: Files you uploaded to /v1/email-attachments.
          items: {$ref: '#/components/schemas/EmailAttachmentId'}
        cvs:
          type: array
          maxItems: 10
          description: The candidate's CVs from the ATS (needs documents:read); with candidates, any of theirs.
          items: {$ref: '#/components/schemas/EmailCvAttachment'}
    EmailSendJob:
      type: object
      additionalProperties: false
      required: [emailId]
      properties:
        emailId: {$ref: '#/components/schemas/EmailId'}
    CandidateScope:
      type: string
      description: all = every candidate; team = those owned by the user's team (their own without a team); own = their own.
      enum: [all, team, own]
    RoleAccess:
      type: object
      required: [role, permissions, candidateScope, jobCandidates, custom, editable, version]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
        candidateScope: {$ref: '#/components/schemas/CandidateScope'}
        jobCandidates:
          type: boolean
          description: With team or own, also the candidates on jobs the user (or their team) owns.
        custom: {type: boolean, description: The company changed this role from the defaults.}
        editable: {type: boolean, description: "False for the owner, who always has every permission and sees all candidates."}
        version: {type: integer, minimum: 0, description: 0 while the role has the defaults.}
    RoleAccessInput:
      type: object
      additionalProperties: false
      required: [version, permissions, candidateScope, jobCandidates]
      properties:
        version: {type: integer, minimum: 0}
        permissions:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/Permission'}
        candidateScope: {$ref: '#/components/schemas/CandidateScope'}
        jobCandidates: {type: boolean}
    PermissionInfo:
      type: object
      required: [permission, module, description, sensitive, defaultRoles]
      properties:
        permission: {$ref: '#/components/schemas/Permission'}
        module: {type: string}
        description: {type: string}
        sensitive: {type: boolean, description: "Guards sensitive data such as salary."}
        defaultRoles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    AccessSettings:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleAccess'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PermissionInfo'}
    TeamGroupId:
      type: string
      pattern: '^team_[0-9a-hjkmnp-tv-z]{26}$'
      example: team_01jbz6w0m0k8q9x2r3s4t5v6w7
    TeamGroup:
      type: object
      required: [id, version, name, memberCount]
      properties:
        id: {$ref: '#/components/schemas/TeamGroupId'}
        version: {type: integer, minimum: 1}
        name: {type: string}
        memberCount: {type: integer, minimum: 0}
    TeamGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TeamGroup'}
    TeamGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    TeamGroupUpdate:
      type: object
      additionalProperties: false
      required: [version, name]
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 100}
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserSummary'}
    UserSummary:
      type: object
      required: [id, name, role, canInterview]
      properties:
        canInterview: {type: boolean, description: "Their role may give interview feedback, so they can be an interviewer."}
        id: {$ref: '#/components/schemas/UserId'}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    Preferences:
      type: object
      additionalProperties: false
      required: [candidateColumns]
      properties:
        candidateColumns:
          type: array
          nullable: true
          maxItems: 20
          uniqueItems: true
          description: "The candidate list's columns, in order, after the name (null: the default ones)."
          items: {$ref: '#/components/schemas/CandidateColumn'}
    CandidateColumn:
      type: string
      description: A column the candidate list can show.
      enum: [currentRole, status, noticePeriod, currentSalary, expectedSalary, workAuthorization, nationality, residence, location, source, industry, tags, email, phone, updated]
    Me:
      type: object
      required: [user, tenant, role, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tenant: {$ref: '#/components/schemas/Tenant'}
        role: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    User:
      type: object
      required: [id, email, name]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        email: {type: string, format: email}
        name: {type: string}
    AgencyRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, example: Hyppies}
    Tenant:
      type: object
      required: [id, name, careersSlug]
      properties:
        careersSlug:
          type: string
          description: The company's public careers page address, e.g. contoh-recruitment (/#/careers/contoh-recruitment).
        id: {$ref: '#/components/schemas/TenantId'}
        name: {type: string}
    SignInInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 200}
        company: {type: string, maxLength: 100, description: "The company's careers page address (slug), when the account is at several companies."}
    Session:
      type: object
      required: [token, expiresAt]
      properties:
        token: {type: string, description: "Send it as Authorization: Bearer <token>."}
        expiresAt: {type: string, format: date-time}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    AuthLink:
      type: object
      required: [kind, email, name, companyName]
      properties:
        kind: {type: string, enum: [invite, reset]}
        email: {type: string}
        name: {type: string}
        companyName: {type: string}
    ChoosePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 10, maxLength: 200, description: At least 10 characters.}
        name: {type: string, minLength: 1, maxLength: 200, description: "Your name (an invitation can correct it)."}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 200}
        newPassword: {type: string, minLength: 10, maxLength: 200}
    TeamStatus:
      type: string
      description: invited = has not chosen a password yet; active; deactivated = cannot sign in.
      enum: [invited, active, deactivated]
    TeamMember:
      type: object
      required: [id, name, email, role, teamId, status, lastSignInAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        name: {type: string}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        teamId:
          nullable: true
          allOf: [{$ref: '#/components/schemas/TeamGroupId'}]
        status: {$ref: '#/components/schemas/TeamStatus'}
        lastSignInAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TeamMember'}
    InviteInput:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email: {type: string, format: email, maxLength: 254}
        name: {type: string, minLength: 1, maxLength: 200}
        role: {$ref: '#/components/schemas/Role'}
    Invitation:
      type: object
      required: [member, link, expiresAt, emailed]
      properties:
        member: {$ref: '#/components/schemas/TeamMember'}
        link: {type: string, description: "The invitation link (also emailed), to pass on another way if needed."}
        expiresAt: {type: string, format: date-time}
        emailed: {type: boolean, description: "Whether an email was queued (it fails later if no mail server is set up)."}
    TeamMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role: {$ref: '#/components/schemas/Role'}
        active: {type: boolean}
        teamId:
          description: The team they are in; null for none.
          nullable: true
          allOf: [{$ref: '#/components/schemas/TeamGroupId'}]
    IndustryId:
      type: string
      pattern: '^industry_[0-9a-hjkmnp-tv-z]{26}$'
    Industry:
      type: object
      additionalProperties: false
      required: [id, label, aliases, retired, candidateCount, companyCount]
      properties:
        id: {$ref: '#/components/schemas/IndustryId'}
        parentId: {$ref: '#/components/schemas/IndustryId'}
        sourceKey: {type: string}
        label: {type: string}
        aliases: {type: array, items: {type: string}}
        retired: {type: boolean}
        candidateCount: {type: integer}
        companyCount: {type: integer}
    IndustryCatalogue:
      type: object
      additionalProperties: false
      required: [version, items]
      properties:
        version: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/Industry'}}
    IndustryEdit:
      type: object
      additionalProperties: false
      required: [catalogueVersion, label, aliases, retired]
      properties:
        catalogueVersion: {type: integer, minimum: 1}
        label: {type: string, minLength: 1, maxLength: 100}
        parentId: {$ref: '#/components/schemas/IndustryId'}
        aliases: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 100}}
        retired: {type: boolean}
    IndustrySelections:
      type: object
      additionalProperties: false
      required: [catalogueVersion, ids]
      properties:
        catalogueVersion: {type: integer, minimum: 1}
        ids: {type: array, maxItems: 50, uniqueItems: true, items: {$ref: '#/components/schemas/IndustryId'}}
        primaryId: {$ref: '#/components/schemas/IndustryId'}
    IndustryEmployer:
      type: object
      required: [index, name, title, current]
      properties:
        index: {type: integer}
        name: {type: string}
        title: {type: string}
        current: {type: boolean}
    IndustrySuggestion:
      type: object
      additionalProperties: false
      required: [catalogueVersion, candidateVersion, status, reason, employers]
      properties:
        catalogueVersion: {type: integer}
        candidateVersion: {type: integer}
        status: {type: string, enum: [ready, needs_review]}
        reason: {type: string}
        categoryId: {$ref: '#/components/schemas/IndustryId'}
        employerIndex: {type: integer}
        employers: {type: array, items: {$ref: '#/components/schemas/IndustryEmployer'}}
    CvImportId:
      type: string
      pattern: '^cvi_[0-9a-hjkmnp-tv-z]{26}$'
      example: cvi_01jbz6w0m0k8q9x2r3s4t5v6w7
    CvImportItemId:
      type: string
      pattern: '^cvf_[0-9a-hjkmnp-tv-z]{26}$'
      example: cvf_01jbz6w0m0k8q9x2r3s4t5v6w7
