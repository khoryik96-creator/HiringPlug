        - match.scored
        - placement.invoice
        - scheduling.refresh_calendar
        - talent.rank
        - talent.ranked
        - webhook.deliver
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            requestId:
              type: string
              description: Quote this when reporting a problem.
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. `fields` for VALIDATION_FAILED.
    TenantId:
      type: string
      pattern: '^tnt_[0-9a-hjkmnp-tv-z]{26}$'
      example: tnt_01jbz6w0m0k8q9x2r3s4t5v6w7
    UserId:
      type: string
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      example: usr_01jbz6w0m0k8q9x2r3s4t5v6w7
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code, e.g. MY, SG.
      pattern: '^[A-Z]{2}$'
      example: MY
    CurrencyCode:
      type: string
      description: ISO 4217 currency code, e.g. MYR, SGD, USD.
      pattern: '^[A-Z]{3}$'
      example: MYR
    PayPeriod:
      type: string
      description: What a salary figure is per (shared by candidates and jobs).
      enum: [hour, day, month, year]
    DecimalAmount:
      type: string
      description: A non-negative amount with up to 2 decimal places, as a string so no precision is lost.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      example: '8500.00'
    AiProviderName:
      type: string
      description: deepseek = DeepSeek, claude = Claude (Anthropic), openai = ChatGPT (OpenAI).
      enum: [deepseek, claude, openai]
    AiProviderChoice:
      type: string
      description: A provider, "server" (the server's own HP_AI_* provider) or "off".
      enum: [server, off, deepseek, claude, openai]
    AiProviders:
      type: object
      required: [active, serverAvailable, keysSupported, providers]
      properties:
        active: {$ref: '#/components/schemas/AiProviderChoice'}
        serverAvailable: {type: boolean, description: The server has its own AI provider set up (HP_AI_*).}
        keysSupported: {type: boolean, description: The server can store API keys (HP_AI_KEYS_SECRET is set).}
        providers:
          type: array
          description: Every provider, in the order deepseek, claude, openai.
          items: {$ref: '#/components/schemas/AiProviderEntry'}
    AiProviderEntry:
      type: object
      required: [provider, model, keyHint, updatedAt, check]
      properties:
        provider: {$ref: '#/components/schemas/AiProviderName'}
        model: {type: string, nullable: true}
        keyHint: {type: string, nullable: true, description: 'The key''s last four characters, e.g. "…a1b2"; null: no key.'}
        updatedAt: {type: string, format: date-time, nullable: true}
        check:
          allOf: [{$ref: '#/components/schemas/AiProviderCheck'}]
          nullable: true
    AiProviderCheck:
      type: object
      required: [status, message, checkedAt]
      properties:
        status: {type: string, enum: [queued, ok, failed]}
        message: {type: string, nullable: true, description: "Why it failed: the key was refused, no credit left, an unknown model..."}
        checkedAt: {type: string, format: date-time}
    AiProviderChoiceInput:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {$ref: '#/components/schemas/AiProviderChoice'}
    AiProviderInput:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: {type: string, minLength: 1, maxLength: 100, description: 'e.g. deepseek-v4-flash, claude-opus-5-5, gpt-5.5'}
        apiKey:
          type: string
          minLength: 8
          maxLength: 500
          writeOnly: true
          description: Leave out to keep the saved key.
    AiAccess:
      type: object
      additionalProperties: false
      description: >
        The provider the company chose, for the AI worker. The key is sealed (AES-256-GCM with a key derived from HP_AI_KEYS_SECRET, the provider as associated data); only the AI worker opens it.

      required: [provider, model, sealedKey]
      properties:
        provider: {$ref: '#/components/schemas/AiProviderName'}
        model: {type: string}
        sealedKey: {type: string}
    AiProviderCheckJob:
      type: object
      additionalProperties: false
      required: [provider, access]
      properties:
        provider: {$ref: '#/components/schemas/AiProviderName'}
        access: {$ref: '#/components/schemas/AiAccess'}
    AiProviderCheckedJob:
      type: object
      additionalProperties: false
      required: [provider, sealedKey, ok, message]
      properties:
        provider: {$ref: '#/components/schemas/AiProviderName'}
        sealedKey: {type: string, description: The key checked (a check of a key since replaced is dropped).}
        ok: {type: boolean}
        message: {type: string, nullable: true}
    AssistantAnswerId:
      type: string
      pattern: '^ask_[0-9a-hjkmnp-tv-z]{26}$'
      example: ask_01jbz6w0m0k8q9x2r3s4t5v6w7
    AssistantSubjectType:
      type: string
      description: What the question is about; an application is a candidate for a job.
      enum: [candidate, job, application]
    AssistantKind:
      type: string
      description: >
        summary = a short summary; red_flags = gaps, red flags and what to ask about; fit = how well the candidate fits the job (applications only); question = your own question; market_map = market insights for a job (jobs only): who to approach, where they work, other titles, skills, pay and difficulty, from what the AI knows of the market as well as the job (estimates, to check).

      enum: [summary, red_flags, fit, question, market_map]
    AssistantAnswerStatus:
      type: string
      description: queued = waiting for the AI; done = answered; failed = the AI could not answer (see error).
      enum: [queued, done, failed]
    AssistantStatus:
      type: object
      required: [enabled, usedTokens, monthlyTokens]
      properties:
        enabled: {type: boolean, description: Whether an AI provider is set up.}
        usedTokens: {type: integer, format: int64, description: "Tokens the company used this calendar month."}
        monthlyTokens: {type: integer, format: int64, description: "The company's monthly allowance."}
    AssistantQuestion:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, kind]
      properties:
        subjectType: {$ref: '#/components/schemas/AssistantSubjectType'}
        subjectId: {type: string, maxLength: 40}
        kind: {$ref: '#/components/schemas/AssistantKind'}
        question: {type: string, maxLength: 1000, description: "Your question (for kind question)."}
    AssistantAnswer:
      type: object
      required: [id, subjectType, subjectId, kind, question, status, answer, error, model, createdAt, answeredAt]
      properties:
        id: {$ref: '#/components/schemas/AssistantAnswerId'}
        subjectType: {$ref: '#/components/schemas/AssistantSubjectType'}
        subjectId: {type: string}
        kind: {$ref: '#/components/schemas/AssistantKind'}
        question: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/AssistantAnswerStatus'}
        answer: {type: string, nullable: true}
        error: {type: string, nullable: true}
        model: {type: string, nullable: true, description: The AI model that answered.}
        createdAt: {type: string, format: date-time}
        answeredAt: {type: string, format: date-time, nullable: true}
    AssistantAnswerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AssistantAnswer'}
    AssistantSection:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title: {type: string, description: "What this is, e.g. Profile, CV text, Job."}
        text: {type: string}
    AssistantAskJob:
      type: object
      additionalProperties: false
      required: [answerId, kind, question, sections]
      properties:
        answerId: {$ref: '#/components/schemas/AssistantAnswerId'}
        kind: {$ref: '#/components/schemas/AssistantKind'}
        question: {type: string, nullable: true}
        sections:
          type: array
          description: What the asking user may see, without contact details or salary.
          items: {$ref: '#/components/schemas/AssistantSection'}
        ai:
          allOf: [{$ref: '#/components/schemas/AiAccess'}]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    AssistantAnsweredJob:
      type: object
      additionalProperties: false
      required: [answerId, answer, error, model, inputTokens, outputTokens]
      properties:
        answerId: {$ref: '#/components/schemas/AssistantAnswerId'}
        answer: {type: string, nullable: true}
        error: {type: string, nullable: true, description: "Why there is no answer (provider down, switched off, ...)."}
        model: {type: string, nullable: true}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
    AutomationId:
      type: string
      pattern: '^aut_[0-9a-hjkmnp-tv-z]{26}$'
    AutomationRunId:
      type: string
      pattern: '^arn_[0-9a-hjkmnp-tv-z]{26}$'
    TaskId:
      type: string
      pattern: '^tsk_[0-9a-hjkmnp-tv-z]{26}$'
    AutomationTrigger:
      type: string
      description: >
        application_received: a candidate applies or is added to a job; stage_changed: a candidate moves to stage; interview_scheduled: an interview is booked (days count from its day); placement_starts, guarantee_ends, invoice_due: a placement's start, the end of its guarantee, its invoice's due date (only while unpaid).

      enum: [application_received, stage_changed, interview_scheduled, placement_starts, guarantee_ends, invoice_due]
    AutomationActionKind:
      type: string
      description: "email_candidate, email_client (the job's hiring contact), email_recruiter, or task (for the recruiter)."
      enum: [email_candidate, email_client, email_recruiter, task]
    AutomationSendMode:
      type: string
      description: "send: emails go on their own; approve: they wait for a recruiter to send them."
      enum: [send, approve]
    AutomationAction:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AutomationActionKind'}
        subject: {type: string, maxLength: 300, description: "Emails: the subject, with fields like {{candidate.firstName}}."}
        body: {type: string, maxLength: 10000, description: "Emails: the message, with fields."}
        title: {type: string, maxLength: 200, description: "Tasks: what to do, with fields."}
    Automation:
      type: object
      required: [id, version, name, enabled, trigger, stage, offsetDays, companyId, companyName, actions, sendMode, preset, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/AutomationId'}
        version: {type: integer}
        name: {type: string}
        enabled: {type: boolean}
        trigger: {$ref: '#/components/schemas/AutomationTrigger'}
        stage:
          description: stage_changed only.
          allOf: [{$ref: '#/components/schemas/Stage'}]
          nullable: true
        offsetDays: {type: integer, description: "Days after (negative: before) the event or its date."}
        companyId:
          description: "IF the job is at this client (null: any)."
          allOf: [{$ref: '#/components/schemas/CompanyId'}]
          nullable: true
        companyName: {type: string, nullable: true}
        actions:
          type: array
          items: {$ref: '#/components/schemas/AutomationAction'}
        sendMode: {$ref: '#/components/schemas/AutomationSendMode'}
        preset: {type: string, nullable: true, description: Which ready-made automation it started as.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AutomationInput:
      type: object
      additionalProperties: false
      required: [name, enabled, trigger, offsetDays, actions, sendMode]
      properties:
        version: {type: integer, minimum: 1, description: "Changing one: the version read."}
        name: {type: string, minLength: 1, maxLength: 120}
        enabled: {type: boolean}
        trigger: {$ref: '#/components/schemas/AutomationTrigger'}
        stage: {$ref: '#/components/schemas/Stage'}
        offsetDays: {type: integer, minimum: -60, maximum: 365}
        companyId:
          allOf: [{$ref: '#/components/schemas/CompanyId'}]
          nullable: true
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/AutomationAction'}
        sendMode: {$ref: '#/components/schemas/AutomationSendMode'}
    AutomationSettings:
      type: object
      additionalProperties: false
      required: [defaultSendMode]
      properties:
        defaultSendMode: {$ref: '#/components/schemas/AutomationSendMode'}
    AutomationList:
      type: object
      required: [items, settings]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Automation'}
        settings: {$ref: '#/components/schemas/AutomationSettings'}
    AutomationRunStatus:
      type: string
      description: "scheduled (due later), to_approve (an email waiting), done (sent or task added), skipped (no longer applies, or a recruiter skipped it), failed."
      enum: [scheduled, to_approve, done, skipped, failed]
    AutomationRun:
      type: object
      required: [id, automationId, automationName, status, dueAt, applicationId, candidateId, candidateName, jobTitle, companyName, actions, detail, finishedAt]
      properties:
        id: {$ref: '#/components/schemas/AutomationRunId'}
        automationId: {$ref: '#/components/schemas/AutomationId'}
        automationName: {type: string}
        status: {$ref: '#/components/schemas/AutomationRunStatus'}
        dueAt: {type: string, format: date-time}
        applicationId: {type: string, nullable: true}
        candidateId: {type: string, nullable: true}
        candidateName: {type: string, nullable: true}
        jobTitle: {type: string, nullable: true}
        companyName: {type: string, nullable: true}
        actions:
          type: array
          description: The automation's actions (an approval sends its emails).
          items: {$ref: '#/components/schemas/AutomationAction'}
        detail: {type: string, nullable: true, description: "What it did, or why not."}
        finishedAt: {type: string, format: date-time, nullable: true}
    AutomationRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AutomationRun'}
    Task:
      type: object
      required: [id, title, dueOn, doneAt, applicationId, candidateId, candidateName, jobTitle, automationName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/TaskId'}
        title: {type: string}
        dueOn: {type: string, format: date}
        doneAt: {type: string, format: date-time, nullable: true}
        applicationId: {type: string, nullable: true}
        candidateId: {type: string, nullable: true}
        candidateName: {type: string, nullable: true}
        jobTitle: {type: string, nullable: true}
        automationName: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    TaskUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done: {type: boolean}
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
    AutomationEventJob:
      type: object
      required: [action, entityType, entityId]
      properties:
        action: {type: string, description: "The audit action (application.moved, ...)."}
        entityType: {type: string}
        entityId: {type: string}
        changes: {type: object, additionalProperties: true}
    AutomationRunJob:
      type: object
      required: [runId, dueAt]
      properties:
        runId: {$ref: '#/components/schemas/AutomationRunId'}
        dueAt: {type: string, format: date-time, description: When it was scheduled for (a run moved since then leaves this job behind).}
    OwnerInput:
      type: object
      additionalProperties: false
      required: [ownerId]
      properties:
        ownerId:
          description: A user of the company, or null for nobody.
          nullable: true
          allOf: [{$ref: '#/components/schemas/UserId'}]
    CandidateId:
      type: string
      pattern: '^cand_[0-9a-hjkmnp-tv-z]{26}$'
      example: cand_01jbz6w0m0k8q9x2r3s4t5v6w7
    WorkAuthorizationStatus:
      type: string
      description: >
        local = citizen; expat_eligible = expat who can already work here (see `basis`); requires_visa = needs an employment pass.

      enum: [local, expat_eligible, requires_visa]
    WorkAuthorizationBasis:
      type: string
      description: Why an expat can work without sponsorship. rp_t = Residence Pass-Talent.
      enum: [rp_t, permanent_resident, spouse_visa, other]
    WorkAuthorization:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/WorkAuthorizationStatus'}
        basis:
          description: Required when status is expat_eligible, otherwise must be empty.
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationBasis'}]
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 500
    NoticePeriodUnit:
      type: string
      enum: [day, week, month]
    NoticePeriod:
      type: object
      additionalProperties: false
      required: [value, unit]
      description: '`value: 0` means available immediately.'
      properties:
        value: {type: integer, minimum: 0, maximum: 365}
        unit: {$ref: '#/components/schemas/NoticePeriodUnit'}
    CandidateAvailability:
      type: string
      description: looking = looking out for a move; passive = open to the right offer; not_looking = not looking; placed = placed by you.
      enum: [looking, passive, not_looking, placed]
    CandidateSource:
      type: string
      description: >
        Where the candidate came from: a key from the company's source list (Settings; built in: jobstreet, linkedin, referral, careers_page, direct, other).

      pattern: '^[a-z0-9_]{1,40}$'
      example: jobstreet
    SalaryAmount:
      type: object
      additionalProperties: false
      required: [amount, currency, period]
      properties:
        description: {type: string, maxLength: 2000}
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    SalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        description: {type: string, maxLength: 2000}
        min: {$ref: '#/components/schemas/DecimalAmount'}
        max:
          description: Leave empty for a single expected figure.
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    Compensation:
      type: object
      required: [version, currentSalary, expectedSalary, updatedAt]
      properties:
        salaryNotes: {type: string, maxLength: 10000, nullable: true, description: 'Salary context kept separately from the calculation.'}
        version: {type: integer, minimum: 1}
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
        updatedAt: {type: string, format: date-time}
    CompensationUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, currentSalary, expectedSalary]
      properties:
        salaryNotes: {type: string, maxLength: 10000, nullable: true, description: 'Salary context kept separately from the calculation.'}
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 if no salary details exist yet, otherwise the version you loaded.
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
    RestrictedField:
      type: string
      description: A field left out of the response because you lack the permission to see it.
      enum: [compensation]
    WorkEntry:
      type: object
      additionalProperties: false
      required: [title, company, startDate, endDate, current, description]
      description: One job. A title or a company is required; endDate is null when current.
      properties:
        title: {type: string, nullable: true, maxLength: 200}
        company: {type: string, nullable: true, maxLength: 200}
        startDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        current: {type: boolean}
        description: {type: string, nullable: true, maxLength: 4000}
    EducationEntry:
      type: object
      additionalProperties: false
      required: [qualification, institution, endYear]
      description: One qualification. A qualification or an institution is required.
      properties:
        qualification: {type: string, nullable: true, maxLength: 200}
        institution: {type: string, nullable: true, maxLength: 200}
        endYear: {type: integer, nullable: true, minimum: 1950, maximum: 2100}
    CandidateHistoryUpdate:
      type: object
      additionalProperties: false
      required: [version, experience, education]
      properties:
        version: {type: integer, minimum: 1}
        experience:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/WorkEntry'}
        education:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/EducationEntry'}
    Candidate:
      type: object
      required:
        - id
        - tags
        - skills
        - experience
        - education
        - version
        - firstName
        - lastName
        - fullName
        - email
        - phone
        - nationality
        - residenceCountry
        - linkedinUrl
        - availability
        - availabilitySince
        - workAuthorization
        - noticePeriod
        - industry
        - specialization
        - currentTitle
        - currentCompany
        - location
        - source
        - ownerId
        - ownerName
        - restrictedFields
        - createdAt
        - updatedAt
      properties:
        ownerId:
          description: The recruiter the candidate belongs to; null for none (e.g. applied on the careers page).
          nullable: true
          allOf: [{$ref: '#/components/schemas/UserId'}]
        ownerName: {type: string, nullable: true}
        experience:
          type: array
          description: Work history, newest first.
          items: {$ref: '#/components/schemas/WorkEntry'}
        education:
          type: array
          items: {$ref: '#/components/schemas/EducationEntry'}
        id: {$ref: '#/components/schemas/CandidateId'}
        version: {type: integer, minimum: 1}
        firstName: {type: string}
        lastName: {type: string}
        fullName: {type: string}
        email: {type: string, format: email, nullable: true}
        phone:
          type: string
          nullable: true
          description: International (E.164) format, e.g. +60123456789.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        linkedinUrl: {type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah."}
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{$ref: '#/components/schemas/CandidateAvailability'}]
          nullable: true
        availabilitySince:
          type: string
          format: date-time
          nullable: true
          description: "When the status was last set (the page shows \"Not looking since 3 Nov, 5 days\"); null without a status."
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, nullable: true}
        industrySelections: {$ref: '#/components/schemas/IndustrySelections'}
        specialization: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        compensation:
          description: Left out (and listed in restrictedFields) without candidates.compensation:read. null means none recorded.
          allOf: [{$ref: '#/components/schemas/Compensation'}]
          nullable: true
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/RestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CandidateCreate:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone:
          type: string
          maxLength: 40
          nullable: true
          description: Any common format; stored in international format.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        linkedinUrl: {type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah."}
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{$ref: '#/components/schemas/CandidateAvailability'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        industrySelections: {$ref: '#/components/schemas/IndustrySelections'}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you loaded.
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        residenceCountry:
          description: Where the candidate lives now (null = not known, shown as NA).
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        linkedinUrl: {type: string, maxLength: 300, nullable: true, description: "Their LinkedIn profile, e.g. https://www.linkedin.com/in/siti-aisyah."}
        availability:
          description: Whether they are open to a move (colours their page); null = not set.
          allOf: [{$ref: '#/components/schemas/CandidateAvailability'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        industrySelections: {$ref: '#/components/schemas/IndustrySelections'}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateSummary:
      type: object
      required: [tags, id, fullName, email, phone, currentTitle, currentCompany, location, workAuthorizationStatus, updatedAt, availability, availabilitySince, noticePeriod, currentSalary, expectedSalary, salaryRestricted, workAuthorizationBasis, nationality, residenceCountry, source, industry]
      properties:
        nationality: {type: string, nullable: true, description: ISO country code.}
        residenceCountry: {type: string, nullable: true, description: ISO country code.}
        source: {type: string, nullable: true}
        industry: {type: string, nullable: true}
        workAuthorizationBasis:
          description: The pass an expat holds (or permanent resident), as on their page.
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationBasis'}]
          nullable: true
        availability:
          allOf: [{$ref: '#/components/schemas/CandidateAvailability'}]
          nullable: true
        availabilitySince: {type: string, format: date-time, nullable: true, description: When the status was last set.}
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        currentSalary:
          description: Needs candidates.compensation:read (see salaryRestricted).
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          description: Needs candidates.compensation:read (see salaryRestricted).
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
        salaryRestricted: {type: boolean, description: "true: you may not see salaries, so both are left out."}
        id: {$ref: '#/components/schemas/CandidateId'}
        fullName: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        workAuthorizationStatus:
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationStatus'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
    CandidateSearch:
      type: object
      additionalProperties: false
      properties:
        q: {type: string, maxLength: 200, description: "Name, email, phone, title or company, as the quick search."}
        boolean: {type: string, maxLength: 1000, description: "AND, OR, NOT (or -word), ( ), \"phrases\", word*; words side by side must all appear."}
        availability: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/CandidateAvailability'}}
        workAuthorization: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/WorkAuthorizationKind'}}
        nationality: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/CountryCode'}}
        residence: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/CountryCode'}}
        source: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 60}}
        industry: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 100}}
        skills: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 60}}
        skillsMatch:
          type: string
          enum: [all, any]
          default: all
          description: Whether a candidate needs every skill listed, or any one of them.
        tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 60}}
        location: {type: string, maxLength: 100, description: Part of where they are (ignoring case).}
        noticeMaxDays: {type: integer, minimum: 0, maximum: 365, description: "Notice period at most this long (a month counts as 30 days); those without one are left out."}
        expectedSalaryMax:
          description: "Expected salary (its lowest figure) at most this, per month (a year counts as 12 months, a day as 22 days, an hour as 176 hours), in this currency. Only for roles that may see salaries."
          allOf: [{$ref: '#/components/schemas/SalaryCap'}]
        owner: {type: string, minLength: 1, maxLength: 40, description: 'A user id, or "me".'}
        updatedWithinDays: {type: integer, minimum: 1, maximum: 3650}
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        cursor: {$ref: '#/components/schemas/CandidateId'}
        sort: {$ref: '#/components/schemas/CandidateSort'}
        offset: {type: integer, minimum: 0, maximum: 10000, description: "With a sort other than newest, the nextOffset of the previous page."}
    SalaryCap:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$', example: "12000"}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    WorkAuthorizationKind:
      type: string
      description: "How the list colours a candidate: local; pr (permanent resident); expat (RP-T, spouse visa or other pass held); needs_pass; unknown."
      enum: [local, pr, expat, needs_pass, unknown]
    CandidateSearchHit:
      type: object
      required: [candidate, matchedIn, cvSnippet]
      properties:
        candidate: {$ref: '#/components/schemas/CandidateSummary'}
        matchedIn:
          type: array
          description: Where the boolean was found (empty without one).
          items: {type: string, enum: [cv, profile]}
        cvSnippet:
          type: string
          nullable: true
          description: "Where the CV matches, the words found between [[ and ]] (\"... led [[SAP]] [[BW]] upgrades ...\")."
    CandidateSort:
      type: string
      enum: [newest, name, name_desc, notice, notice_desc, current_salary_asc, current_salary_desc, expected_salary_asc, expected_salary_desc]
      description: >-
        newest (the default) pages with nextCursor; the others page with nextOffset (up to 10,000 rows). name is A to Z (accents ignored), notice shortest first; unknown notice periods and salaries come last. Salary sorts use monthly equivalents, ringgit first and each other currency together, and only for roles that may see salaries.
    CandidateSearchPage:
      type: object
      required: [items, nextCursor, terms]
      properties:
        nextOffset: {type: integer, nullable: true, description: "With a sort other than newest, pass as offset for the next page."}
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateSearchHit'}
        nextCursor:
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
        terms:
          type: array
          description: The boolean's words and phrases to highlight (not those left out with NOT).
          items: {type: string}
    CandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        nextOffset: {type: integer, nullable: true, description: "With a sort other than newest, pass as offset for the next page."}
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
    SimilarCandidate:
      type: object
      required: [candidate, reasons]
      properties:
