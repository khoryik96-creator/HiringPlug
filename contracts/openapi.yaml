              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List or search contacts, newest first
      x-permission: contacts:read
      parameters:
        - name: q
          in: query
          description: "Every word must appear in the name, email or job title (ignoring case and accents); or a phone or mobile number, however it is written."
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: similar
          in: query
          description: "With q: names like q (for typos), the closest first; no further pages."
          schema: {type: boolean, default: false}
        - name: companyId
          in: query
          description: Only this company's contacts.
          schema: {$ref: '#/components/schemas/CompanyId'}
        - name: role
          in: query
          description: Only contacts with this role (a key of the contact_role list, e.g. hr or hiring_manager).
          schema: {$ref: '#/components/schemas/ContactRole'}
        - name: roleNotSet
          in: query
          description: Only contacts whose role is not set yet (ignored with role).
          schema: {type: boolean, default: false}
        - name: status
          in: query
          description: Only contacts who still work there (active) or have left.
          schema: {$ref: '#/components/schemas/ContactStatus'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: {$ref: '#/components/schemas/ContactId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact (their email is checked)
      x-permission: contacts:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      x-permission: contacts:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Change some fields of a contact
      description: >
        Only the fields you send change. Send `null` to clear a field. `version` must be the version you loaded. A changed email is checked again.

      x-permission: contacts:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/contacts/{contactId}/email-check:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmail
      tags: [contacts]
      summary: Check the contact's email again
      description: Re-runs the email check (for example after "unknown" because the mail server lookup timed out).
      x-permission: contacts:update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/contacts/{contactId}/linkedin-profile:
    parameters:
      - $ref: '#/components/parameters/ContactIdPath'
    post:
      operationId: checkContactEmployment
      tags: [contacts]
      summary: Check where the contact works now, from their LinkedIn profile saved as PDF
      description: >
        LinkedIn cannot be read automatically, so drop the PDF LinkedIn makes (More > Save to PDF on their profile). It is read in the background, compared with the contact's company, and then deleted: only what it says about their jobs is kept (Contact.employment).

      x-permission: contacts:update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202':
          description: Being read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactEmployment'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /v1/cv-templates:
    get:
      operationId: listCvTemplates
      tags: [cvformats]
      summary: The CV templates (the built-in standard one first), and the placeholders templates may use
      x-permission: cvformats:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvTemplateList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: uploadCvTemplate
      tags: [cvformats]
      summary: Upload a Word (.docx) CV template with placeholders
      x-permission: cvformats.templates:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: {type: string, maxLength: 100}
                file: {type: string, format: binary}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvTemplate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /v1/cv-templates/{cvTemplateId}:
    parameters:
      - $ref: '#/components/parameters/CvTemplateIdPath'
    delete:
      operationId: deleteCvTemplate
      tags: [cvformats]
      summary: Remove an uploaded template
      x-permission: cvformats.templates:manage
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/cv-templates/{cvTemplateId}/file:
    parameters:
      - $ref: '#/components/parameters/CvTemplateIdPath'
    get:
      operationId: downloadCvTemplate
      tags: [cvformats]
      summary: "Download a template (.docx): the standard one is the place to start your own"
      x-permission: cvformats:create
      responses:
        '200':
          description: The template
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/candidates/{candidateId}/formatted-cvs:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: formatCv
      tags: [cvformats]
      summary: Make a formatted CV for a candidate (saved with their documents)
      description: "`includeSalary` needs candidates.compensation:read."
      x-permission: cvformats:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FormatCvInput'}
      responses:
        '201':
          description: Saved as the candidate's formatted CV
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FormattedCv'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/CvNotBlind'}
  /v1/candidates/{candidateId}/studio-cvs:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listStudioCvs
      tags: [cvformats]
      summary: The candidate's latest CV Studio formatting runs, newest first
      x-permission: cvformats:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudioCvList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: startStudioCv
      tags: [cvformats]
      summary: Format one of the candidate's CVs CV Studio's way (the AI reads it; done in the background)
      x-permission: cvformats:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudioCvInput'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudioCv'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StudioCvOff'}
        '422': {$ref: '#/components/responses/StudioCvSource'}
  /v1/candidates/{candidateId}/documents:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateDocuments
      tags: [documents]
      summary: List a candidate's documents, newest first
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: uploadCandidateDocument
      tags: [documents]
      summary: Upload a CV or other document (PDF, DOCX or old Word .doc, up to 10 MB)
      description: >
        Returns immediately with status `queued`; text extraction runs in the background. Poll GET /v1/documents/{documentId} for the result.

      x-permission: documents:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source]
              properties:
                file:
                  type: string
                  format: binary
                source: {$ref: '#/components/schemas/DocumentSource'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The candidate already has this exact file (DOCUMENT_DUPLICATE).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /v1/document-matches:
    post:
      operationId: findDocumentMatches
      tags: [documents]
      summary: CVs already in HiringPlug like the files about to be uploaded
      description: >
        For each file (its name and SHA-256, worked out before uploading): a CV with exactly the same content (sameContent: skip it), and CVs with the same file name (sameName: ask). With candidateId, only that candidate's; without, any candidate's you may see.

      x-permission: documents:read
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentMatchRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentMatchList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/documents/{documentId}/parse:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      operationId: parseDocument
      tags: [documents]
      summary: Read the profile details out of a CV again
      description: >
        CVs are parsed automatically after their text is read. Use this for CVs uploaded before parsing existed, or to re-run a newer parser. Returns the document with parseStatus `queued`.

      x-permission: documents:create
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/documents/{documentId}/file:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentFile
      tags: [documents]
      summary: Download the document's file as uploaded
      description: >
        The bytes as uploaded; the document's contentType says what they are. Content-Disposition carries the original file name.

      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/documents/{documentId}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentPdf
      tags: [documents]
      summary: Download a Word document (a formatted CV, or a CV sent as Word) as PDF
      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: makeDocumentPdf
      tags: [documents]
      summary: Make a Word document's PDF copy (for previewing it), if it has none yet
      description: Word CVs uploaded since previews began get one at once; this makes one for older ones. A PDF, or a document whose copy is made or being made, is left as it is.
      x-permission: documents:read
      responses:
        '202':
          description: Being made (or already there)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a formatted CV (its file and PDF copy too)
      description: Only CVs HiringPlug made (source formatted); the candidate's own files are kept. Recorded in the audit log.
      x-permission: documents:delete
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Not a formatted CV (DOCUMENT_NOT_DELETABLE).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document, including its extracted text
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/documents/{documentId}/highlights:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: highlightDocument
      tags: [documents]
      summary: A document's text with the words of a boolean search marked
      x-permission: documents:read
      parameters:
        - name: boolean
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentHighlights'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/mailbox:
    get:
      operationId: getMailboxConnection
      tags:
        - emails
      summary: getMailboxConnection
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: saveSmtpMailbox
      tags:
        - emails
      summary: saveSmtpMailbox
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxStatus'
        '409': {$ref: '#/components/responses/Conflict'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpMailboxInput'
    delete:
      operationId: disconnectMailbox
      tags:
        - emails
      summary: disconnectMailbox
      x-permission: emails:send
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/mailbox/authorize:
    post:
      operationId: authorizeMailbox
      tags:
        - emails
      summary: authorizeMailbox
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxAuthorization'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxAuthorizeInput'
  /v1/mailbox/callback:
    get:
      operationId: completeMailboxAuthorization
      tags:
        - emails
      summary: Complete mailbox sign-in
      x-permission: public
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
            maxLength: 4096
        - in: query
          name: state
          schema:
            type: string
            maxLength: 4096
        - in: query
          name: error
          schema:
            type: string
            maxLength: 4096
      responses:
        '303':
          description: Return to email connection settings
          headers:
            Cache-Control: {schema: {type: string}}
            Referrer-Policy: {schema: {type: string}}
            Location:
              schema:
                type: string
  /v1/email-templates:
    get:
      operationId: listEmailTemplates
      tags: [emails]
      summary: The company's email templates (starter templates are added the first time)
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplateList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createEmailTemplate
      tags: [emails]
      summary: Add a template
      x-permission: emails.templates:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/email-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/EmailTemplateIdPath'
    put:
      operationId: updateEmailTemplate
      tags: [emails]
      summary: Change a template
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteEmailTemplate
      tags: [emails]
      summary: Delete a template
      x-permission: emails.templates:manage
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-previews:
    post:
      operationId: previewEmail
      tags: [emails]
      summary: Fill an email's fields for a candidate (and a job or interview), to see before sending
      description: >
        Fields ([Current salary], {{candidate.firstName}}, ...) are filled as sending would fill them; those without a value stay in brackets and are listed in `missing` (sending refuses them).

      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailPreviewRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailPreview'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-attachments:
    post:
      operationId: addEmailAttachment
      tags: [emails]
      summary: Upload a file from the computer, to attach to the next email you send
      description: Up to 10 MB a file; an email takes up to 10 files and 20 MB in all.
      x-permission: emails:send
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailAttachment'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /v1/email-banners:
    get:
      operationId: listEmailBanners
      tags: [emails]
      summary: The company's email banners
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailBannerList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: addEmailBanner
      tags: [emails]
      summary: Upload a banner image (PNG, JPEG or GIF, up to 1 MB)
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                name: {type: string, maxLength: 100}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailBanner'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /v1/email-banners/{bannerId}:
    parameters:
      - {name: bannerId, in: path, required: true, schema: {$ref: '#/components/schemas/EmailBannerId'}}
    delete:
      operationId: deleteEmailBanner
      tags: [emails]
      summary: Delete a banner (emails already sent keep it)
      x-permission: emails.templates:manage
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-banners/{bannerId}/file:
    parameters:
      - {name: bannerId, in: path, required: true, schema: {$ref: '#/components/schemas/EmailBannerId'}}
    get:
      operationId: getEmailBannerFile
      tags: [emails]
      summary: A banner's image
      x-permission: emails:send
      responses:
        '200':
          description: The image
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-drafts:
    post:
      operationId: draftEmail
      tags: [emails]
      summary: Fill a template for a candidate (and a job or interview) to review before sending
      description: >
        Placeholders without a value are left in brackets and listed in `missing`, so they are fixed before sending. Times are written in `timeZone` (the sender's, e.g. Asia/Kuala_Lumpur).

      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailDraftRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailDraft'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-batches:
    post:
      operationId: sendEmailsSeparately
      tags: [emails]
      summary: Send one email to several candidates or contacts, each their own copy
      description: >
        Each person gets their own email, to them alone, with the fields filled from them ([First name] is theirs), kept on their emails. Those who cannot be sent to (no email address, an address that is not valid, withdrew consent to be contacted, or no value for a field the message uses) are listed with the reason and left out; the others are sent. With checkOnly nothing is sent: the list says who would get it.

      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailBatch'}
      responses:
        '200':
          description: Who got it (or would get it) and who did not, in the order given
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailBatchResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  /v1/emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: Emails sent about a candidate, or to a client's contact, newest first
      description: Give candidateId or contactId.
      x-permission: emails:read
      parameters:
        - {name: candidateId, in: query, required: false, schema: {$ref: '#/components/schemas/CandidateId'}}
        - {name: contactId, in: query, required: false, schema: {$ref: '#/components/schemas/ContactId'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: sendEmail
      tags: [emails]
      summary: Send an email (it is queued and sent in the background)
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailSend'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Email'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DoNotContact'}
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who is signed in, their tenant, and what they may do
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/agency:
    put:
      operationId: renameAgency
      tags: [identity]
      summary: Rename your agency (company)
      description: >
        The name shows on formatted CVs and their file names ("Hyppies CV - Siti Aisyah.docx"), on the careers page and in the app. The careers page address stays the same.

      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgencyRename'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: The company's active users (to pick interviewers, owners, ...)
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [identity]
      summary: Sign in with email and password
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInInput'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/SignInFailed'}
        '409': {$ref: '#/components/responses/ChooseCompany'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Sign out, ending this session on the server too (its token stops working at once)
      x-permission: authenticated
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [identity]
      summary: Email a password reset link (the answer is the same whether or not the email is known)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '202': {description: "If the email belongs to an active account, a link is on its way."}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/auth/links/{linkToken}:
    parameters:
      - {name: linkToken, in: path, required: true, schema: {type: string, minLength: 20, maxLength: 200}}
    get:
      operationId: getAuthLink
      tags: [identity]
      summary: What an invitation or password reset link is for (to show before choosing a password)
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthLink'}
        '410': {$ref: '#/components/responses/LinkNotValid'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
    post:
      operationId: useAuthLink
      tags: [identity]
      summary: Choose a password with an invitation or reset link, and sign in
      description: An invitation activates the account; a reset signs out every other session.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChoosePassword'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '410': {$ref: '#/components/responses/LinkNotValid'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [identity]
      summary: Your own settings, such as the columns of your candidate list
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      operationId: putMyPreferences
      tags: [identity]
      summary: Change your own settings (no one else's)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Preferences'}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/me/password:
    put:
      operationId: changePassword
      tags: [identity]
      summary: Change your password (signs out your other sessions)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200':
          description: Changed; a new session for this browser
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/team:
    get:
      operationId: listTeam
      tags: [identity]
      summary: Everyone in the company, with invited and deactivated people
      x-permission: identity.team:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/team/invites:
    post:
      operationId: inviteUser
      tags: [identity]
      summary: Invite someone (emailed; the link is also in the answer, to pass on if email is not set up)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteInput'}
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/team/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/UserId'}}
    patch:
      operationId: updateTeamMember
      tags: [identity]
      summary: Change someone's role, or deactivate or reactivate them (deactivating signs them out)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMemberUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMember'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/team/{userId}/invite:
    parameters:
      - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/UserId'}}
    post:
      operationId: resendInvite
      tags: [identity]
      summary: Send someone who has not joined yet a new invitation (the old link stops working)
      x-permission: identity.team:manage
      responses:
        '201':
          description: Invited again
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/access:
    get:
      operationId: getAccessSettings
      tags: [identity]
      summary: What each role may do and which candidates it sees, with every permission there is
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessSettings'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/access/roles/{role}:
    parameters:
      - {name: role, in: path, required: true, schema: {$ref: '#/components/schemas/Role'}}
    put:
      operationId: setRoleAccess
      tags: [identity]
      summary: Choose a role's permissions and which candidates it sees (not the owner's)
      description: Takes effect on each user's next request. version is 0 while the role has the defaults.
      x-permission: identity.roles:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleAccessInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAccess'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RoleNotEditable'}
    delete:
      operationId: resetRoleAccess
      tags: [identity]
      summary: Give a role its default permissions back (and all candidates)
      x-permission: identity.roles:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAccess'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/RoleNotEditable'}
  /v1/teams:
    get:
      operationId: listTeams
      tags: [identity]
      summary: The company's teams (groups of users, e.g. desks), with how many people are in each
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamGroupList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      operationId: createTeam
      tags: [identity]
      summary: Add a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamGroupInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamGroup'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/teams/{teamId}:
    parameters:
      - {name: teamId, in: path, required: true, schema: {$ref: '#/components/schemas/TeamGroupId'}}
    patch:
      operationId: renameTeam
      tags: [identity]
      summary: Rename a team
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamGroupUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamGroup'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteTeam
      tags: [identity]
      summary: Remove a team; its people stay, in no team
      x-permission: identity.team:manage
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: Read the agency industry catalogue and usage counts
      x-permission: settings:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryCatalogue'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    post:
      operationId: createIndustry
      tags: [industries]
      summary: Add an industry or subindustry
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndustryEdit'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryCatalogue'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/industries/{industryId}:
    parameters:
      - {name: industryId, in: path, required: true, schema: {$ref: '#/components/schemas/IndustryId'}}
    patch:
      operationId: updateIndustry
      tags: [industries]
      summary: Rename or move a category without breaking existing selections
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndustryEdit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryCatalogue'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/industries/{industryId}/remove:
    parameters:
      - {name: industryId, in: path, required: true, schema: {$ref: '#/components/schemas/IndustryId'}}
    post:
      operationId: removeIndustry
      tags: [industries]
      summary: Retire a category or delete it after explicitly reassigning its records
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [catalogueVersion, action]
              properties:
                catalogueVersion: {type: integer, minimum: 1}
                action: {type: string, enum: [retire, delete]}
                replacementId: {$ref: '#/components/schemas/IndustryId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryCatalogue'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/industry-suggestion:
    parameters:
      - {name: candidateId, in: path, required: true, schema: {$ref: '#/components/schemas/CandidateId'}}
    get:
      operationId: suggestCandidateIndustry
      tags: [industries]
      summary: Suggest an industry from the selected employer without changing saved tags
      x-permission: candidates:read
      parameters:
        - {name: employerIndex, in: query, schema: {type: integer, minimum: 0, maximum: 199}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustrySuggestion'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/cv-imports:
    get:
      operationId: listCvImports
      tags: [intake]
      summary: Your latest imports, newest first, with each file's progress
      x-permission: intake:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvImportList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCvImport
      tags: [intake]
      summary: Start an import (then send its files one by one)
      x-permission: intake:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CvImportInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvImport'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/cv-imports/{cvImportId}:
    parameters:
      - $ref: '#/components/parameters/CvImportIdPath'
    get:
      operationId: getCvImport
      tags: [intake]
      summary: One of your imports, with each file's progress
      x-permission: intake:create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvImport'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
