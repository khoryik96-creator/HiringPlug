        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createJobAd
      tags: [jobs]
      summary: Add an ad for a job (as a draft)
      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobAdCreate'}
