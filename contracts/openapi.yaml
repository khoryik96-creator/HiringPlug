      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      description: >
        `salary` is only included with jobs.salary:read; otherwise it is left out and listed in `restrictedFields`.

      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobOrder'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Change some fields of a job
      description: >
        Only the fields you send change. Send `null` to clear a field. `version` must be the version you loaded.

      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobOrderUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobOrder'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/jobs/{jobId}/ads:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: listJobAds
      tags: [jobs]
      summary: List a job's ads, newest first
