  /v1/matches:
    get:
      operationId: listMatches
      tags: [matching]
      summary: The latest fit score of each application on a job, or of one application
      description: Give jobId or applicationId. Also says whether matching is switched on.
      x-permission: matching:read
      parameters:
        - {name: jobId, in: query, schema: {type: string, maxLength: 40}}
        - {name: applicationId, in: query, schema: {type: string, maxLength: 40}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: scoreApplication
      tags: [matching]
      summary: Score how well a candidate fits the job they are on (in the background)
      description: A score already waiting for the AI is returned instead of asking again.
      x-permission: matching:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchRequest'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/MatchingUnavailable'}
        '429': {$ref: '#/components/responses/MatchingLimitReached'}
  /v1/matches/suggestions:
    get:
      operationId: suggestCandidates
      tags: [matching]
      summary: Possible candidates for a job - people not on it whose CVs share the most words with the job's text
      description: >
        A keyword search of CVs (not the AI, so it works without one), best first, at most 20. Leaves out candidates already on the job, those who withdrew consent, and those you may not see.

      x-permission: matching:read
      parameters:
        - {name: jobId, in: query, required: true, schema: {type: string, maxLength: 40}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchSuggestionList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/MatchingUnavailable'}
  /v1/matches/for-job:
    post:
      operationId: scoreJobApplications
      tags: [matching]
      summary: Score the fit of every active candidate on a job (in the background)
      description: >
        Candidates already scored (or waiting) are left as they are unless rescore is true; candidates without a CV with readable text are counted and left out. At most 100 candidates at a time.

      x-permission: matching:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchJobRequest'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchJobResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/MatchingUnavailable'}
        '429': {$ref: '#/components/responses/MatchingLimitReached'}
  /v1/talent-searches:
    get:
      operationId: listTalentSearches
      tags: [matching]
      summary: Your latest AI candidate searches
      x-permission: matching:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TalentSearchList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: startTalentSearch
      tags: [matching]
      summary: AI candidate search - find candidates by a JD, a boolean and filters, then have the AI rank the best
      description: >
        CV Studio's AI Crawler, on your own candidates. The boolean and filters (as the advanced search) choose who may be considered; with a job description, they are ordered by how much their CVs share with it. The first ones (rank, 15 by default) are sent to the AI - their CVs without names, contact details or salary; none who withdrew consent - which reads what the job needs (responsibilities, requirements, tech stack, nice to have; not the company or benefits) and gives each a fit score with reasons and gaps, and sourcing notes. Uses the monthly AI allowance. Follow GET /v1/talent-searches/{searchId}.

      x-permission: matching:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TalentSearchInput'}
      responses:
        '202':
          description: Started (or done at once when nobody matches)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TalentSearch'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MatchingUnavailable'}
        '429': {$ref: '#/components/responses/MatchingLimitReached'}
  /v1/talent-searches/{searchId}:
    get:
      operationId: getTalentSearch
      tags: [matching]
      summary: An AI candidate search, and once done its ranking
      x-permission: matching:read
      parameters:
        - {name: searchId, in: path, required: true, schema: {$ref: '#/components/schemas/TalentSearchId'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TalentSearch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
