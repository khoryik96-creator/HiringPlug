      properties:
        jd: {type: string, maxLength: 20000, description: "The job description (optional when the search has a boolean)."}
        search: {$ref: '#/components/schemas/CandidateSearch'}
        strict: {type: boolean, default: false, description: "Must-haves are strict: a candidate missing one cannot score above 50."}
        rank: {type: integer, minimum: 3, maximum: 20, default: 15, description: How many candidates the AI ranks.}
    TalentSearchStatus:
      type: string
      enum: [queued, done, failed]
    TalentFit:
      type: object
      required: [candidateId, name, currentTitle, fit, verdict, reasons, gaps]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        name: {type: string}
        currentTitle: {type: string, nullable: true}
        fit: {type: integer, minimum: 0, maximum: 100}
        verdict: {$ref: '#/components/schemas/TalentVerdict'}
        reasons: {type: array, items: {type: string}}
        gaps: {type: array, items: {type: string}}
    TalentVerdict:
      type: string
      enum: [strong, possible, weak]
    TalentSearch:
      type: object
      required: [id, status, jd, boolean, strict, considered, sent, error, summary, mustHaves, niceToHaves, suggestedBoolean, results, createdAt, finishedAt]
      properties:
        id: {$ref: '#/components/schemas/TalentSearchId'}
        status: {$ref: '#/components/schemas/TalentSearchStatus'}
        jd: {type: string, nullable: true}
        boolean: {type: string, nullable: true}
        strict: {type: boolean}
        considered: {type: integer, description: How many candidates the boolean and filters found.}
        sent: {type: integer, description: How many the AI was asked to rank.}
        error: {type: string, nullable: true}
        summary: {type: string, nullable: true, description: "The AI's sourcing notes."}
        mustHaves: {type: array, items: {type: string}}
        niceToHaves: {type: array, items: {type: string}}
        suggestedBoolean: {type: string, nullable: true, description: "A boolean for the job, to search with next (and to mark CVs)."}
        results:
          type: array
          description: Best fit first (candidates the user may no longer see are left out).
