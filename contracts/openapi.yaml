        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAd'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/job-ads/{adId}:
    parameters:
      - $ref: '#/components/parameters/JobAdIdPath'
    get:
      operationId: getJobAd
      tags: [jobs]
      summary: Get a job ad
      x-permission: jobs:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAd'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateJobAd
      tags: [jobs]
      summary: Change an ad, or publish, unpublish or close it
      description: >
        Only the fields you send change; send `null` to clear one. `version` must be the version you loaded. Publishing needs an open job, the ad's text, and a closing date that has not passed (JOB_AD_NOT_PUBLISHABLE).

      x-permission: jobs:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobAdUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAd'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: The ad cannot be published (JOB_AD_NOT_PUBLISHABLE).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/jobs/{jobId}/salary:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    put:
      operationId: putJobSalary
      tags: [jobs]
      summary: Set a job's salary budget
      description: >
        Replaces the budget; send `range: null` to clear it. Send `expectedVersion: 0` the first time, then the `version` you loaded.

      x-permission: jobs.salary:update
      requestBody:
        required: true
