  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List or search jobs, newest first
      x-permission: jobs:read
      parameters:
        - name: q
          in: query
          description: Matches the title or location, ignoring case and accents.
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/JobStatus'}
        - name: companyId
          in: query
          description: Only this company's jobs.
          schema: {$ref: '#/components/schemas/CompanyId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
