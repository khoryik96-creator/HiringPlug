    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string, pattern: '^job_[0-9a-hjkmnp-tv-z]{26}$'}
    post:
      operationId: retryBackgroundJob
      tags: [settings]
      summary: Try a job that failed for good again, from its first attempt
      x-permission: settings:manage
      responses:
        '200':
          description: Queued again; the new status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/settings/backups:
    get:
      operationId: getBackups
      tags: [settings]
      summary: The server's backups (with sizes), the nightly backup switch and the backup service's state
      description: >
        Only the agency that runs the server sees them (HP_BACKUP_TENANT, or the only agency when there is just one); for any other, `available` is false and nothing else is filled in.

      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backups'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/settings/backups/auto:
    put:
      operationId: setAutoBackup
      tags: [settings]
      summary: Turn the nightly backup on or off
      x-permission: settings.backups:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auto]
              properties:
                auto: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backups'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/settings/backups/run:
    post:
      operationId: requestBackup
      tags: [settings]
      summary: Make a backup now (the backup service makes it within a minute)
      x-permission: settings.backups:manage
      responses:
        '202':
          description: Asked for
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backups'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/settings/backups/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    delete:
      operationId: deleteBackup
      tags: [settings]
      summary: Delete one backup from the server
      x-permission: settings.backups:manage
      responses:
        '200':
          description: Deleted; the backups left
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backups'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/settings/backups/{backupName}/link:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    post:
      operationId: createBackupDownloadLink
      tags: [settings]
      summary: A download link for one backup, valid for 10 minutes
      description: >
        The browser saves from this link where the person chooses, without loading a large backup into memory. The link names one backup and stops working after 10 minutes (a download already going finishes).

      x-permission: settings.backups:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupDownloadLink'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/backup-downloads/{backupName}:
    parameters:
      - $ref: '#/components/parameters/BackupNamePath'
    get:
      operationId: downloadBackup
      tags: [settings]
      summary: One backup as a single .tar file (from a link made by createBackupDownloadLink)
      description: >
        The backup's folder (database.dump, files.tar.gz, manifest.json) in one .tar file; unpack it to get the folder back. Needs the link's `exp` and `sig`, not a sign-in.

      x-permission: public
      security: []
      parameters:
        - {name: exp, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: sig, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
      responses:
        '200':
          description: The backup
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: {type: string}
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationFailed:
      description: The request is invalid (VALIDATION_FAILED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Missing or invalid credentials (UNAUTHENTICATED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Missing permission (FORBIDDEN).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (NOT_FOUND).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflict, e.g. CONFLICT_STALE_VERSION or a duplicate.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Too large (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Unsupported type (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AiProviderConflict:
      description: Keys cannot be stored (AI_KEYS_NOT_SET_UP), or the provider has no key (AI_PROVIDER_NO_KEY).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AssistantOff:
      description: Switched off (ASSISTANT_OFF).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AssistantLimitReached:
      description: This month's allowance is used (ASSISTANT_LIMIT_REACHED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AutomationNotAllowed:
      description: Not allowed (AUTOMATION_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    StudioCvOff:
      description: No AI for it (STUDIO_CV_OFF).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    StudioCvSource:
      description: Not a CV that can be formatted (STUDIO_CV_SOURCE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CvNotBlind:
      description: Not blind (CV_NOT_BLIND).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DoNotContact:
      description: The candidate asked not to be contacted (EMAIL_DO_NOT_CONTACT).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RoleNotEditable:
      description: The owner role cannot be changed (ROLE_NOT_EDITABLE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignInFailed:
      description: Wrong email or password (SIGN_IN_FAILED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChooseCompany:
      description: Choose the company (SIGN_IN_CHOOSE_COMPANY).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyAttempts:
      description: Too many attempts (TOO_MANY_ATTEMPTS).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LinkNotValid:
      description: The link is no longer valid (LINK_NOT_VALID).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TeamChangeNotAllowed:
      description: Not allowed (TEAM_CHANGE_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InterviewNotAllowed:
      description: Not allowed (INTERVIEW_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BlindAiOff:
      description: No AI for it (JOB_AD_BLIND_AI_OFF).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BlindTooShort:
      description: Too little text to rewrite (JOB_AD_BLIND_TOO_SHORT).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MatchingUnavailable:
      description: Switched off (MATCHING_OFF), nothing to compare yet (MATCH_NEEDS_TEXT), or the candidate withdrew consent (MATCH_CONSENT_WITHDRAWN).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MatchingLimitReached:
      description: This month's AI allowance is used (MATCHING_LIMIT_REACHED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OfferNotAllowed:
      description: Not allowed (OFFER_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PlacementNotAllowed:
      description: Not allowed (PLACEMENT_NOT_ALLOWED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SchedulingConflict:
      description: Not set up (SCHEDULING_NOT_SET_UP), the time was taken (BOOKING_SLOT_TAKEN) or the link is closed (BOOKING_CLOSED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
