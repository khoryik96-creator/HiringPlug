    description: Fetch a source's openings and update its leads (Go worker); queues the next check a day later.
  match.score:
    module: matching
    queue: ai
    payload: MatchScoreJob
    priority: normal
    description: Ask the AI provider how well a CV meets a job's requirements, quoting both (Python AI worker).
  match.scored:
    module: matching
    queue: core
    payload: MatchScoredJob
    priority: normal
    description: Check the AI's quotes against the texts it was sent, work out the score and save it (Go worker).
  placement.invoice:
    module: placements
    queue: core
    payload: PlacementInvoiceJob
    priority: normal
    description: 'On a placement''s start date: email its invoice to the client, if it is still to be emailed (Go worker).'
  scheduling.refresh_calendar:
    module: scheduling
    queue: core
    payload: SchedulingRefreshCalendarJob
    priority: low
    description: Read a user's calendar address and keep their busy times (Go worker).
  talent.rank:
    module: matching
    queue: ai
    payload: TalentRankJob
    priority: normal
    description: 'AI candidate search (CV Studio''s AI Crawler way): read what a job needs and rank the candidates sent, with fit reasons and gaps (Python AI worker).'
  talent.ranked:
    module: matching
    queue: core
    payload: TalentRankedJob
    priority: normal
    description: Save the AI's ranking and sourcing notes on the search (Go worker).
  webhook.deliver:
    module: integrations
    queue: core
    payload: WebhookDeliverJob
    priority: low
    description: POST one webhook delivery to its address (Go worker); a failure is retried later.
x-modules:
  - name: aiproviders
    description: 'The AI provider a company uses for the assistant, CV vs job matching, market insights and reading CVs: DeepSeek, Claude (Anthropic) or ChatGPT (OpenAI) with the company''s own API key, the server''s own provider (HP_AI_*), or none. Keys are sealed (encrypted) when saved, never shown again, and opened only by the AI worker. Each provider keeps its key and model, so switching back and forth needs no retyping.'
  - name: assistant
    description: The AI assistant. Go gathers what the asking user may see (never contact details, never salary), queues it for the Python AI worker, which asks the AI provider; the answer comes back on the queue. Answers are shown only to the person who asked. Off until an AI provider is set up; each company has a monthly token limit.
  - name: automations
    description: 'An automation is a rule: WHEN something happens (an application arrives, a candidate moves to a stage, an interview is booked, a placement starts, its guarantee ends, its invoice falls due), IF the job is at a given client (optional), THEN after some days (or before, for dates) email the candidate, the client''s hiring contact or the recruiter, or give the recruiter a task. Emails go from the recruiter''s mailbox, on their own or after a recruiter approves them (a choice per automation, with a default in Settings). Every run is logged; what happened is checked again when it is due, so a moved interview or a paid invoice sends nothing.'
  - name: candidates
    description: Candidate profiles. Salary details are stored and permissioned separately.
  - name: careers
    description: 'A company''s public careers page: its published job ads, and applying to one with a CV. Signed-out visitors; the page address picks the company, and everything after runs in that company''s scope.'
  - name: companies
    description: Companies you recruit for or want to win as clients, and their details.
  - name: contacts
    description: People at companies, each with a checked email address.
  - name: cvformats
    description: 'Formatted CVs: the candidate''s profile, work history and education filled into a Word template (the built-in standard one, or the company''s own), with contact details hidden unless asked and salary only when asked by someone who may see it. Or CV Studio''s way: one of the candidate''s own CVs read by the AI and laid out by CV Studio''s rules and renderer (studio CVs). The result is saved as the candidate''s formatted CV (and compared with the original like any formatted CV).'
  - name: documents
    description: 'Files attached to candidates: JobStreet/LinkedIn CVs, the original CV and formatted CVs. Uploading a CV queues text extraction in the Python AI worker.'
  - name: emails
    description: 'Email from the app: formatted templates with fields ([First name], [Expected salary], ...) filled from the candidate, job, interview and sender; cc and bcc; image banners; attachments (the candidate''s CVs or files from the computer); messages sent through the company''s mail server in the background; a record of each one on the candidate''s timeline. Replies go to the person who sent it. Salary fields fill only for senders who may see salaries, and by default an email with salary in it is hidden from roles that may not (Settings can show it to all).'
  - name: identity
    description: Tenants (companies using HiringPlug), their users, and who is signed in.
  - name: industries
    description: Editable industries and subindustries shared by candidates and companies.
  - name: intake
    description: CV imports. Each file (a CV, or a LinkedIn profile saved as PDF) becomes a candidate named after the file, owned by whoever uploaded it, and is read like any CV. When the reading is done the candidate is filled in from it (name, email, phone, location, LinkedIn link, current job, work history, education, skills, industry), or, when its email already belongs to a candidate, merged into that candidate (one candidate per email). Files are sent one per request, so a batch shows each file's progress.
  - name: integrations
    description: API keys let another system use this API as a role (never as owner); the key is shown once and only its hash is kept. Webhooks send a signed JSON POST to an HTTPS address when chosen events happen (queued in the same transaction as the change, retried when the receiver fails). API keys cannot manage API keys or webhooks.
  - name: interviews
    description: 'Interviews for an application: when, how and where, who interviews, and each interviewer''s feedback. Scheduling moves the application to the interview stage if it is at an earlier one.'
  - name: jobs
    description: Job orders (agency) or requisitions (in-house), with an optional salary budget.
  - name: leads
    description: 'Hiring signals as leads. A source is a company''s public job board feed (Greenhouse, Lever, Ashby, SmartRecruiters) or a careers page with job markup (schema.org JobPosting, as for Google for Jobs; robots.txt is respected). Sources are checked every day: each opening becomes a lead, and one no longer listed is marked closed. Ads can also be saved by hand. No scraping of sites whose terms forbid it (LinkedIn, JobStreet).'
  - name: market
    description: 'A market map for a job: who in the company''s own database does this kind of work (how many, how available, where they work and live, their work authorization, notice and, for roles that may see salaries, their pay), and the AI assistant''s market insights for it (an assistant answer of kind market_map). Exported to Word or PDF. The module keeps no data of its own: it reads other modules'' records.'
  - name: matching
    description: CV vs job match. Go sends the job's text and the candidate's CV text (without names, contact details or salary) to the Python AI worker, which asks the AI provider for the job's requirements, whether the CV meets each, and a quote from both for every one. Go keeps a requirement only if its quote is in the job's text and counts it as met only if its evidence is in the CV, then works out the score from what is left. It suggests; the recruiter decides. Off until an AI provider is set up; it uses the company's monthly AI allowance, shared with the assistant.
  - name: notes
    description: Notes on records, and what changed on them (activity).
  - name: offers
    description: 'An offer on an application: salary, start date, when it expires and other terms. Those who may approve offers send them straight away; others ask for approval first, and someone else approves (or sends it back). Then the offer is sent and the candidate accepts or declines. Making an offer moves the application to the offer stage.'
  - name: pipeline
    description: Candidates on jobs (applications) and their stages.
  - name: placements
    description: 'A placement records a candidate starting a job: the start date, the guarantee period (if they leave within it, the placement fell through), the recruiter credited, the agreed salary and the fee, and whether it has been invoiced and paid. Recording one moves the application to placed.'
  - name: privacy
    description: 'Data protection (Malaysia''s PDPA). Each candidate''s consent (given on the careers form, or recorded by a recruiter; withdrawn means do not contact, and emails to them are refused), the requests candidates make about their data with how long each has been open, and a copy of everything held about a candidate for access requests. Nothing is ever deleted or anonymised by the app: people decide each request and record what they did.'
  - name: reports
    description: 'How the business is doing over a period: how far candidates get (pipeline conversion), which sources bring candidates who get hired, placements and fees per recruiter, and how long jobs take to fill. Reports keep no data of their own: they read other modules'' records.'
  - name: scheduling
    description: Booking links. Each user sets when they take calls (weekly hours in their time zone) and may give the private calendar address Google Calendar or Outlook offers, so their own meetings count as busy. A booking link, inserted into an email to a candidate, opens a public page with the free times; the candidate picks one, and both get a calendar invitation (an .ics invite that Gmail and Outlook add to the calendar), which blocks the time. Interviews the user is on and their other bookings count as busy too. The candidate can move the time with the same link; the user can cancel it.
  - name: settings
    description: 'Main settings. Dropdown lists a company can change: open lists (candidate source, notice period, industry) take new options; fixed lists (work type, work arrangement) can be renamed, reordered and hidden only, because other systems (job boards, Google for Jobs) need their values. Fields a company makes mandatory must be filled in when a person adds a record, and cannot be emptied later.'
