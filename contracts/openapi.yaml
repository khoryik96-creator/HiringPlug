        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/cv-templates/{cvTemplateId}/file:
    parameters:
      - $ref: '#/components/parameters/CvTemplateIdPath'
    get:
      operationId: downloadCvTemplate
      tags: [cvformats]
      summary: "Download a template (.docx): the standard one is the place to start your own"
      x-permission: cvformats:create
      responses:
        '200':
          description: The template
          headers:
            Content-Disposition:
              description: attachment, with the file name.
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/candidates/{candidateId}/formatted-cvs:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    post:
      operationId: formatCv
      tags: [cvformats]
      summary: Make a formatted CV for a candidate (saved with their documents)
      description: "`includeSalary` needs candidates.compensation:read."
      x-permission: cvformats:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FormatCvInput'}
      responses:
        '201':
          description: Saved as the candidate's formatted CV
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FormattedCv'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/candidates/{candidateId}/documents:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateDocuments
      tags: [documents]
      summary: List a candidate's documents, newest first
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: uploadCandidateDocument
      tags: [documents]
      summary: Upload a CV or other document (PDF, DOCX or old Word .doc, up to 10 MB)
      description: >
        Returns immediately with status `queued`; text extraction runs in the background. Poll GET /v1/documents/{documentId} for the result.

      x-permission: documents:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source]
              properties:
                file:
                  type: string
                  format: binary
                source: {$ref: '#/components/schemas/DocumentSource'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /v1/documents/{documentId}/parse:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      operationId: parseDocument
      tags: [documents]
      summary: Read the profile details out of a CV again
      description: >
        CVs are parsed automatically after their text is read. Use this for CVs uploaded before parsing existed, or to re-run a newer parser. Returns the document with parseStatus `queued`.

      x-permission: documents:create
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/documents/{documentId}/file:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentFile
      tags: [documents]
      summary: Download the document's file as uploaded
      description: >
        The bytes as uploaded; the document's contentType says what they are. Content-Disposition carries the original file name.

      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/documents/{documentId}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocumentPdf
      tags: [documents]
      summary: Download a formatted CV as PDF
      x-permission: documents:read
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document, including its extracted text
      x-permission: documents:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/email-templates:
    get:
      operationId: listEmailTemplates
      tags: [emails]
      summary: The company's email templates (starter templates are added the first time)
      x-permission: emails:send
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplateList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createEmailTemplate
      tags: [emails]
      summary: Add a template
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/email-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/EmailTemplateIdPath'
    put:
      operationId: updateEmailTemplate
      tags: [emails]
      summary: Change a template
      x-permission: emails.templates:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailTemplateUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailTemplate'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/email-drafts:
    post:
      operationId: draftEmail
      tags: [emails]
      summary: Fill a template for a candidate (and a job or interview) to review before sending
      description: >
        Placeholders without a value are left in brackets and listed in `missing`, so they are fixed before sending. Times are written in `timeZone` (the sender's, e.g. Asia/Kuala_Lumpur).

      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailDraftRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailDraft'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: Emails sent about a candidate, newest first
      x-permission: emails:read
      parameters:
        - {name: candidateId, in: query, required: true, schema: {$ref: '#/components/schemas/CandidateId'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: sendEmail
      tags: [emails]
      summary: Send an email (it is queued and sent in the background)
      x-permission: emails:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailSend'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Email'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who is signed in, their tenant, and what they may do
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: The company's active users (to pick interviewers, owners, ...)
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [identity]
      summary: Sign in with email and password
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInInput'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/SignInFailed'}
        '409': {$ref: '#/components/responses/ChooseCompany'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [identity]
      summary: Email a password reset link (the answer is the same whether or not the email is known)
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '202': {description: "If the email belongs to an active account, a link is on its way."}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/auth/links/{linkToken}:
    parameters:
      - {name: linkToken, in: path, required: true, schema: {type: string, minLength: 20, maxLength: 200}}
    get:
      operationId: getAuthLink
      tags: [identity]
      summary: What an invitation or password reset link is for (to show before choosing a password)
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthLink'}
        '410': {$ref: '#/components/responses/LinkNotValid'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
    post:
      operationId: useAuthLink
      tags: [identity]
      summary: Choose a password with an invitation or reset link, and sign in
      description: An invitation activates the account; a reset signs out every other session.
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChoosePassword'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '410': {$ref: '#/components/responses/LinkNotValid'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/me/password:
    put:
      operationId: changePassword
      tags: [identity]
      summary: Change your password (signs out your other sessions)
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200':
          description: Changed; a new session for this browser
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyAttempts'}
  /v1/team:
    get:
      operationId: listTeam
      tags: [identity]
      summary: Everyone in the company, with invited and deactivated people
      x-permission: identity.team:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/team/invites:
    post:
      operationId: inviteUser
      tags: [identity]
      summary: Invite someone (emailed; the link is also in the answer, to pass on if email is not set up)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteInput'}
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/team/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/UserId'}}
    patch:
      operationId: updateTeamMember
      tags: [identity]
      summary: Change someone's role, or deactivate or reactivate them (deactivating signs them out)
      x-permission: identity.team:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMemberUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMember'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/team/{userId}/invite:
    parameters:
      - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/UserId'}}
    post:
      operationId: resendInvite
      tags: [identity]
      summary: Send someone who has not joined yet a new invitation (the old link stops working)
      x-permission: identity.team:manage
      responses:
        '201':
          description: Invited again
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/TeamChangeNotAllowed'}
  /v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [integrations]
      summary: The company's API keys (never the keys themselves)
      x-permission: integrations:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createApiKey
      tags: [integrations]
      summary: Create an API key (the key is in the response, once)
      x-permission: integrations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyIdPath'
    delete:
      operationId: revokeApiKey
      tags: [integrations]
      summary: Revoke an API key (it stops working at once)
      x-permission: integrations:manage
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [integrations]
      summary: The company's webhooks (never their secrets), with the events they may send
      x-permission: integrations:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createWebhook
      tags: [integrations]
      summary: Add a webhook (its signing secret is in the response, once)
      x-permission: integrations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookCreated'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
    patch:
      operationId: updateWebhook
      tags: [integrations]
      summary: Change a webhook's address, events or whether it is on
      x-permission: integrations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteWebhook
      tags: [integrations]
      summary: Remove a webhook (and its delivery record)
      x-permission: integrations:manage
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
    get:
      operationId: listWebhookDeliveries
      tags: [integrations]
      summary: A webhook's latest deliveries, newest first
      x-permission: integrations:manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDeliveryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: pingWebhook
      tags: [integrations]
      summary: Send a webhook.ping event, to check the receiver
      x-permission: integrations:manage
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/applications/{applicationId}/interviews:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    get:
      operationId: listApplicationInterviews
      tags: [interviews]
      summary: An application's interviews, soonest first
      x-permission: interviews:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: scheduleInterview
      tags: [interviews]
      summary: Schedule an interview
      x-permission: interviews:schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterviewCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Interview'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InterviewNotAllowed'}
  /v1/interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: Interviews in a time range, e.g. my upcoming ones
      description: >
        `mine=true` keeps the ones you interview on. `feedbackDue=true` keeps past, not cancelled interviews you have not given feedback on yet.

      x-permission: interviews:read
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: feedbackDue, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/interviews/{interviewId}:
    parameters:
      - $ref: '#/components/parameters/InterviewIdPath'
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get an interview
      x-permission: interviews:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Interview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateInterview
      tags: [interviews]
      summary: Reschedule, change, cancel or complete an interview
      description: Only the fields you send change. `version` must be the version you loaded.
      x-permission: interviews:schedule
      requestBody:
        required: true
