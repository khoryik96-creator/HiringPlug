        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
    TalentSearchList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TalentSearch'}}
    TalentCandidate:
      type: object
      additionalProperties: false
      required: [ref, profile, cv]
      properties:
        ref: {type: string, maxLength: 10, description: "C1, C2...: how the AI names them (not their name)."}
        profile: {type: string, maxLength: 2000, description: "Title, company, skills, industry, notice, work authorization - no name, contact or salary."}
        cv: {type: string, maxLength: 8000, description: "Their CV's text, without names, contact details or salary (may be empty)."}
    TalentRankJob:
      type: object
      additionalProperties: false
      required: [searchId, requirements, strict, candidates]
      properties:
        searchId: {$ref: '#/components/schemas/TalentSearchId'}
        requirements: {type: string, maxLength: 24000, description: "The JD (without salary), or the boolean and filters when there is none."}
        strict: {type: boolean}
        candidates: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/TalentCandidate'}}
        ai:
          allOf: [{$ref: '#/components/schemas/AiAccess'}]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    TalentRanked:
      type: object
      additionalProperties: false
      required: [ref, fit, verdict, reasons, gaps]
      properties:
        ref: {type: string, maxLength: 10}
        fit: {type: integer, minimum: 0, maximum: 100}
        verdict: {$ref: '#/components/schemas/TalentVerdict'}
        reasons: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/TalentNote'}}
        gaps: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/TalentNote'}}
    TalentNote: {type: string, maxLength: 400, description: "A reason or a gap, in a sentence."}
    TalentRequirement: {type: string, maxLength: 200, description: "A must-have or nice-to-have the AI read in the job."}
    TalentRankedJob:
      type: object
      additionalProperties: false
      required: [searchId, summary, mustHaves, niceToHaves, suggestedBoolean, results, error, model, inputTokens, outputTokens]
      properties:
        searchId: {$ref: '#/components/schemas/TalentSearchId'}
        summary: {type: string, nullable: true, maxLength: 3000}
        mustHaves: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/TalentRequirement'}}
        niceToHaves: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/TalentRequirement'}}
        suggestedBoolean: {type: string, nullable: true, maxLength: 1000}
        results: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/TalentRanked'}}
        error: {type: string, nullable: true, maxLength: 2000}
        model: {type: string, nullable: true, maxLength: 200}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
    MatchId:
      type: string
      pattern: '^mat_[0-9a-hjkmnp-tv-z]{26}$'
      example: mat_01jbz6w0m0k8q9x2r3s4t5v6w7
    MatchStatus:
      type: string
      description: queued = waiting for the AI; done = scored; failed = no score (see error).
      enum: [queued, done, failed]
    MatchVerdict:
      type: string
      description: met = the CV shows it; partly = the CV shows some of it; missing = the CV does not show it.
      enum: [met, partly, missing]
    MatchReason:
      type: object
      required: [requirement, verdict, evidence, note]
      properties:
        requirement: {type: string, description: "A requirement, quoted from the job's description or ad."}
        verdict: {$ref: '#/components/schemas/MatchVerdict'}
        evidence:
          type: string
          nullable: true
          description: "What shows it, quoted from the CV (empty for those who may not see CVs)."
        note: {type: string, nullable: true, description: "The AI's short explanation."}
    MatchDimensionName:
      type: string
      description: >
        CV Studio's six ratings: skills = technical / functional skills; experience = experience level; industry = industry / domain background; education = education and qualifications; leadership = leadership and communication; keywords = keyword and requirement match.

      enum: [skills, experience, industry, education, leadership, keywords]
    MatchDimension:
      type: object
      required: [name, score, note]
      properties:
        name: {$ref: '#/components/schemas/MatchDimensionName'}
        score: {type: integer, minimum: 0, maximum: 100}
        note: {type: string, nullable: true, maxLength: 1000, description: "The AI's reason, in a sentence."}
    MatchRecommendation:
      type: string
      description: "From the score, as CV Studio: shortlist at 70 or more, consider from 45, pass below."
      enum: [shortlist, consider, pass]
    Match:
      type: object
      required: [id, applicationId, jobId, status, score, summary, reasons, dropped, outdated, error, model, createdAt, scoredAt, dimensions, strengths, gaps, recommendation]
      properties:
        id: {$ref: '#/components/schemas/MatchId'}
        applicationId: {type: string}
        jobId: {type: string}
        status: {$ref: '#/components/schemas/MatchStatus'}
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: "How much of the job's requirements the CV shows: met counts in full, partly as half."
        summary: {type: string, nullable: true, description: "The AI's overall view, in a sentence or two."}
        reasons:
          type: array
          items: {$ref: '#/components/schemas/MatchReason'}
        dropped:
          type: integer
          minimum: 0
          description: "Requirements the AI listed that were left out: their quote was not in the job's text (or their verdict could not be read)."
        outdated:
          type: boolean
          description: "The job's description or ad changed after it was scored: score it again."
        error: {type: string, nullable: true}
        model: {type: string, nullable: true, description: The AI model that scored it.}
        createdAt: {type: string, format: date-time}
        scoredAt: {type: string, format: date-time, nullable: true}
        dimensions:
          type: array
          description: "The AI's ratings on CV Studio's six dimensions (its opinion: the score above is worked out from the quoted requirements)."
          items: {$ref: '#/components/schemas/MatchDimension'}
        strengths: {type: array, items: {type: string}, description: "The AI's notes: what speaks for the candidate."}
        gaps: {type: array, items: {type: string}, description: "The AI's notes: gaps or concerns to ask about."}
        recommendation:
          allOf: [{$ref: '#/components/schemas/MatchRecommendation'}]
          nullable: true
    MatchList:
      type: object
      required: [enabled, items]
      properties:
        enabled: {type: boolean, description: Whether an AI provider is set up.}
        items:
          type: array
          items: {$ref: '#/components/schemas/Match'}
    MatchRequest:
      type: object
      additionalProperties: false
      required: [applicationId]
      properties:
        applicationId: {type: string, maxLength: 40}
    MatchJobRequest:
      type: object
      additionalProperties: false
      required: [jobId]
      properties:
        jobId: {type: string, maxLength: 40}
        rescore: {type: boolean, default: false, description: "Also score again those already scored."}
    MatchJobResult:
      type: object
      required: [queued, alreadyScored, withoutCv, consentWithdrawn]
      properties:
        queued: {type: integer, description: Candidates sent to the AI.}
        alreadyScored: {type: integer, description: "Candidates left as they are (scored, or waiting)."}
        withoutCv: {type: integer, description: Candidates without a CV with readable text.}
        consentWithdrawn: {type: integer, description: "Candidates who withdrew consent (left out)."}
    MatchSuggestion:
      type: object
      required: [candidateId, candidateName, currentTitle, rank, snippet]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        currentTitle: {type: string, nullable: true}
        rank: {type: number, minimum: 0, maximum: 1, description: "How much the CV shares the job's words, 0 to 1 (only for ordering)."}
        snippet: {type: string, description: "Where the CV mentions the job's words, which are marked [[like this]]."}
    MatchSuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MatchSuggestion'}
    MatchScoreJob:
      type: object
      additionalProperties: false
      required: [matchId, job, cv]
      properties:
        matchId: {$ref: '#/components/schemas/MatchId'}
        job: {type: string, description: "The job's title, details, description and ad, without salary."}
        cv: {type: string, description: "The CV's text, without names, contact details or salary."}
        ai:
          allOf: [{$ref: '#/components/schemas/AiAccess'}]
          description: The provider the company chose; left out = the server's own (HP_AI_*).
    MatchClaim:
      type: object
      additionalProperties: false
      required: [requirement, verdict, evidence, note]
      properties:
        requirement: {type: string, maxLength: 2000, description: "Quoted from the job's text."}
        verdict: {$ref: '#/components/schemas/MatchVerdict'}
        evidence: {type: string, nullable: true, maxLength: 2000, description: "Quoted from the CV's text."}
        note: {type: string, nullable: true, maxLength: 2000}
    MatchScoredJob:
      type: object
      additionalProperties: false
      required: [matchId, summary, claims, dimensions, strengths, gaps, error, model, inputTokens, outputTokens]
      properties:
        matchId: {$ref: '#/components/schemas/MatchId'}
        summary: {type: string, nullable: true, maxLength: 2000}
        claims:
          type: array
          maxItems: 30
          description: The AI's reading, not yet checked against the texts (Go checks every quote).
          items: {$ref: '#/components/schemas/MatchClaim'}
        dimensions:
          type: array
          maxItems: 12
          description: The AI's ratings on CV Studio's six dimensions (Go keeps each known one once).
          items: {$ref: '#/components/schemas/MatchDimension'}
        strengths:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 1000}
        gaps:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 1000}
        error: {type: string, nullable: true, description: "Why there is no score (provider down, switched off, an answer that could not be read)."}
        model: {type: string, nullable: true}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
    NoteId:
      type: string
      pattern: '^note_[0-9a-hjkmnp-tv-z]{26}$'
      example: note_01jbz6w0m0k8q9x2r3s4t5v6w7
    NoteSubjectType:
      type: string
      enum: [candidate, job, company, contact]
    NoteKind:
      type: string
      enum: [general, screening, interview, call, reference]
    Note:
      type: object
      required: [id, subjectType, subjectId, kind, body, sensitive, authorId, authorName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/NoteId'}
        subjectType: {$ref: '#/components/schemas/NoteSubjectType'}
        subjectId: {type: string}
        kind: {$ref: '#/components/schemas/NoteKind'}
        body: {type: string}
        sensitive: {type: boolean, description: 'Only readable with notes.sensitive:read.'}
        authorId: {$ref: '#/components/schemas/UserId'}
        authorName: {type: string}
        createdAt: {type: string, format: date-time}
    NoteList:
      type: object
      required: [items, hiddenSensitive]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Note'}
        hiddenSensitive:
          type: integer
          description: How many sensitive notes were left out because you may not read them.
    NoteCreate:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, body]
      properties:
        subjectType: {$ref: '#/components/schemas/NoteSubjectType'}
        subjectId: {type: string, minLength: 1, maxLength: 40}
        kind:
          allOf: [{$ref: '#/components/schemas/NoteKind'}]
          description: Defaults to general.
        body: {type: string, minLength: 1, maxLength: 10000}
        sensitive: {type: boolean, description: 'Needs notes.sensitive:read. Defaults to false.'}
    ActivityEntityType:
      type: string
      enum: [candidate, job, company, contact, application]
    ActivityEntry:
      type: object
      required: [id, action, actorName, changes, at]
      properties:
        id: {type: string}
        action: {type: string, description: 'What happened, e.g. candidate.updated or application.moved.'}
        actorName: {type: string, description: 'Who did it (a user, or "System" for background work).'}
        changes:
          type: object
          additionalProperties: true
          description: 'Changed fields as {"field": {"from": old, "to": new}}; sensitive ones as {"changed": true, "redacted": true}.'
        at: {type: string, format: date-time}
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityEntry'}
    OfferId:
      type: string
      pattern: '^ofr_[0-9a-hjkmnp-tv-z]{26}$'
      example: ofr_01jbz6w0m0k8q9x2r3s4t5v6w7
    OfferStatus:
      type: string
      description: >
        draft → pending_approval → approved → sent → accepted or declined; approvers send a draft straight away; withdrawn at any point before the answer.

      enum: [draft, pending_approval, approved, sent, accepted, declined, withdrawn]
    OfferRestrictedField:
      type: string
      description: A field left out because you lack the permission to see it.
      enum: [salary]
    Offer:
      type: object
      required: [id, version, applicationId, candidateId, candidateName, jobId, jobTitle, companyName, status, startDate, expiresOn, terms, requestedBy, requestedByName, decidedBy, decidedByName, decidedAt, decisionNote, sentAt, answeredAt, restrictedFields, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/OfferId'}
        version: {type: integer}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string}
        companyName: {type: string}
        status: {$ref: '#/components/schemas/OfferStatus'}
        salary:
          description: Left out (and listed in restrictedFields) without offers.salary:read. null means none set.
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        startDate: {type: string, format: date, nullable: true}
        expiresOn: {type: string, format: date, nullable: true, description: The day the offer lapses if not answered.}
        terms: {type: string, nullable: true, description: "Anything else offered: benefits, probation, notice, ..."}
        requestedBy:
          description: Who asked for approval.
          allOf: [{$ref: '#/components/schemas/UserId'}]
          nullable: true
        requestedByName: {type: string, nullable: true}
        decidedBy:
          description: Who approved it (or sent it back last); the sender when an approver sent it without asking.
          allOf: [{$ref: '#/components/schemas/UserId'}]
          nullable: true
        decidedByName: {type: string, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        decisionNote: {type: string, nullable: true}
        sentAt: {type: string, format: date-time, nullable: true}
        answeredAt: {type: string, format: date-time, nullable: true}
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/OfferRestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OfferList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Offer'}
    OfferInput:
      type: object
      additionalProperties: false
      properties:
        salary: {$ref: '#/components/schemas/SalaryAmount'}
        startDate: {type: string, format: date}
        expiresOn: {type: string, format: date}
        terms: {type: string, maxLength: 5000}
    OfferUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        salary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        startDate: {type: string, format: date, nullable: true}
        expiresOn: {type: string, format: date, nullable: true}
        terms: {type: string, maxLength: 5000, nullable: true}
    OfferStep:
      type: string
      enum: [request_approval, send, accept, decline, withdraw]
    OfferStepInput:
      type: object
      additionalProperties: false
      required: [version, step]
      properties:
        version: {type: integer, minimum: 1}
        step: {$ref: '#/components/schemas/OfferStep'}
    OfferDecisionInput:
      type: object
      additionalProperties: false
      required: [version, approve]
      properties:
        version: {type: integer, minimum: 1}
        approve: {type: boolean}
        note: {type: string, maxLength: 1000, description: Why it was sent back (or a remark on the approval).}
    ApplicationId:
      type: string
      pattern: '^appl_[0-9a-hjkmnp-tv-z]{26}$'
      example: appl_01jbz6w0m0k8q9x2r3s4t5v6w7
    Stage:
      type: string
      description: >
        In order: applied, screening, submitted (to the client or hiring manager), interview, offer, placed. rejected and withdrawn close the application (with a reason); it can be reopened later.

      enum: [applied, screening, submitted, interview, offer, placed, rejected, withdrawn]
    CloseReason:
      type: string
      description: Why an application was rejected or withdrawn.
      enum: [not_qualified, salary_mismatch, client_rejected, failed_interview, position_filled, candidate_declined, accepted_other_offer, no_response, other]
    ApplicationChannel:
      type: string
      description: Where an application came from, e.g. the job board whose link the candidate used to apply.
      enum: [careers_page, jobstreet, linkedin, indeed, facebook, referral, other]
    Application:
      type: object
      required: [id, version, jobId, jobTitle, companyId, companyName, candidateId, candidateName, candidateTitle, stage, reason, reasonNote, channel, stageChangedAt, createdAt, updatedAt]
      properties:
        channel:
          allOf: [{$ref: '#/components/schemas/ApplicationChannel'}]
          nullable: true
          description: Null when a recruiter added the candidate.
        id: {$ref: '#/components/schemas/ApplicationId'}
        version: {type: integer}
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        candidateTitle: {type: string, nullable: true, description: "The candidate's current job title."}
        stage: {$ref: '#/components/schemas/Stage'}
        reason:
          description: Set when rejected or withdrawn.
          allOf: [{$ref: '#/components/schemas/CloseReason'}]
          nullable: true
        reasonNote: {type: string, nullable: true}
        stageChangedAt: {type: string, format: date-time, description: When it entered its current stage.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Application'}
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        stage:
          description: Defaults to applied. Must be an open stage.
          allOf: [{$ref: '#/components/schemas/Stage'}]
    ApplicationMove:
      type: object
      additionalProperties: false
      required: [version, stage]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        stage: {$ref: '#/components/schemas/Stage'}
        reason:
          description: Required for rejected and withdrawn; not allowed otherwise.
          allOf: [{$ref: '#/components/schemas/CloseReason'}]
        reasonNote: {type: string, maxLength: 1000}
    StageCounts:
      type: object
      description: How many applications are in each open stage.
      required: [applied, screening, submitted, interview, offer, placed]
      properties:
        applied: {type: integer}
        screening: {type: integer}
        submitted: {type: integer}
        interview: {type: integer}
        offer: {type: integer}
        placed: {type: integer}
    DashboardJob:
      type: object
      required: [jobId, title, companyId, companyName, stageCounts]
      properties:
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        title: {type: string}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        stageCounts: {$ref: '#/components/schemas/StageCounts'}
    StageMove:
      type: object
      required: [id, applicationId, candidateId, candidateName, jobId, jobTitle, companyName, fromStage, toStage, changedAt, changedByName]
      properties:
        id: {type: string}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string}
        companyName: {type: string}
        fromStage:
          description: Null when the candidate was added to the job at toStage.
          allOf: [{$ref: '#/components/schemas/Stage'}]
          nullable: true
        toStage: {$ref: '#/components/schemas/Stage'}
        changedAt: {type: string, format: date-time}
        changedByName: {type: string, nullable: true, description: Who moved them; null when the app did (or before this was recorded).}
    StageMoveList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StageMove'}
    PipelineSummary:
      type: object
      required: [openJobs, stageCounts, jobs, stuck, placedLast30Days, movedLast7Days]
      properties:
        openJobs: {type: integer, description: Jobs with status open.}
        stageCounts:
          description: Applications on open jobs, per stage.
          allOf: [{$ref: '#/components/schemas/StageCounts'}]
        jobs:
          type: array
          description: Open jobs (newest first, up to 50) with their pipelines.
          items: {$ref: '#/components/schemas/DashboardJob'}
        stuck:
          type: array
          description: Applications on open jobs longest in one stage (offer and earlier) past stuckDays, oldest first, up to 10.
          items: {$ref: '#/components/schemas/Application'}
        placedLast30Days: {type: integer}
        movedLast7Days: {type: integer, description: Applications that changed stage in the last 7 days.}
    RetainerDueKind:
      type: string
      description: "on_date: on dueOn; after_signing / after_start: dueDays after the retainer was signed / the placement starts."
      enum: [on_date, after_signing, after_start]
    RetainerStage:
      type: object
      required: [label, amount, dueKind, dueOn, dueDays, invoiceStatus, invoiceNumber, invoicedOn, paidOn]
      properties:
        label: {type: string}
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        dueKind: {$ref: '#/components/schemas/RetainerDueKind'}
        dueOn: {type: string, format: date, nullable: true, description: "The day it is due: given, or worked out (null while the signing or start day is not known)."}
        dueDays: {type: integer, nullable: true}
        invoiceStatus: {$ref: '#/components/schemas/InvoiceStatus'}
        invoiceNumber: {type: string, nullable: true}
        invoicedOn: {type: string, format: date, nullable: true}
        paidOn: {type: string, format: date, nullable: true}
    RetainerStageInput:
      type: object
      additionalProperties: false
      required: [label, amount, dueKind]
      properties:
        label: {type: string, maxLength: 100}
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        dueKind: {$ref: '#/components/schemas/RetainerDueKind'}
        dueOn: {type: string, format: date, description: on_date only.}
        dueDays: {type: integer, minimum: 0, maximum: 730, description: after_signing and after_start only.}
        invoiceStatus: {$ref: '#/components/schemas/InvoiceStatus'}
        invoiceNumber: {type: string, maxLength: 50}
        invoicedOn: {type: string, format: date}
        paidOn: {type: string, format: date}
    JobRetainer:
      type: object
      required: [version, currency, signedOn, stages, total, placementId]
      properties:
        version: {type: integer, description: 0 when the job has no retainer.}
        currency:
          allOf: [{$ref: '#/components/schemas/CurrencyCode'}]
          nullable: true
        signedOn: {type: string, format: date, nullable: true}
        stages:
          type: array
          items: {$ref: '#/components/schemas/RetainerStage'}
        total: {$ref: '#/components/schemas/DecimalAmount'}
        placementId:
          description: The placement it is taken off (the first on the job), once there is one.
          allOf: [{$ref: '#/components/schemas/PlacementId'}]
          nullable: true
    JobRetainerInput:
      type: object
      additionalProperties: false
      required: [version, stages]
      properties:
        version: {type: integer, minimum: 0}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        signedOn: {type: string, format: date, nullable: true}
        stages:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/RetainerStageInput'}
    PlacementRetainer:
      type: object
      description: The job's retainer, taken off this placement's fee.
      required: [currency, total, balance, stages]
      properties:
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        total: {$ref: '#/components/schemas/DecimalAmount'}
        balance:
          description: The fee less the retainer (never below 0); null when the fee is in another currency (nothing is taken off).
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        stages:
          type: array
          items: {$ref: '#/components/schemas/RetainerStage'}
    PlacementInvoiceJob:
      type: object
      additionalProperties: false
      required: [placementId]
      properties:
        placementId: {$ref: '#/components/schemas/PlacementId'}
        sendAt:
          type: string
          format: date-time
          description: "The send time this job was queued for (the start date at the hour). A job whose time is no longer the placement's does nothing: another is queued for the new one."
    InvoiceFormat:
      type: string
      enum: [pdf, docx]
    PlacementDefaults:
      type: object
      required: [companyId, companyName, jobTitle, jobType, feePercent, paymentTermsDays, guaranteeDays, contactId, termsSet, tiers, salaryCurrency]
      properties:
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        jobTitle: {type: string}
        jobType: {$ref: '#/components/schemas/PlacementJobType'}
        termsSet: {type: boolean, description: The client has terms of business recorded.}
        tiers:
          type: array
          description: "The client's rates by annual salary: the form picks the one for the salary typed in."
          items: {$ref: '#/components/schemas/CompanyTermsTier'}
        salaryCurrency: {type: string, description: The currency of the tiers' salary limits.}
        feePercent:
          description: From the client's terms (the rate for any salary; null when it depends on the salary).
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        paymentTermsDays: {type: integer, description: "From the client's terms (30 when not set or when it depends on the salary)."}
        guaranteeDays: {type: integer, description: "From the client's terms (90 when not set or when it depends on the salary)."}
        contactId:
          description: The job's hiring contact, when they have an email address.
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
    PlacementInvoicing:
      type: object
      required: [contactId, contactName, contactEmail, paymentTermsDays, dueOn, dueOnSet, autoSend, sendsAt, sentAt, sendError]
      properties:
        contactId:
          description: Who receives the invoice (one of the client's contacts).
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        contactName: {type: string, nullable: true}
        contactEmail: {type: string, nullable: true}
        paymentTermsDays: {type: integer}
        dueOn: {type: string, format: date, description: "When payment is due: the invoice date (the start date until invoiced) plus the terms, unless set."}
        dueOnSet: {type: boolean, description: "true: someone set the due date; false: it follows the start date and the terms."}
        autoSend: {type: boolean, description: Email the invoice to the contact on the start date.}
        sendsAt: {type: string, format: date-time, nullable: true, description: When it will be emailed (null when it will not be).}
        sentAt: {type: string, format: date-time, nullable: true}
        sendError: {type: string, nullable: true, description: Why it could not be emailed on its own.}
    PlacementInvoicingInput:
      type: object
      additionalProperties: false
      required: [contactId, paymentTermsDays, dueOn, autoSend]
      properties:
        contactId:
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        paymentTermsDays: {type: integer, minimum: 0, maximum: 365}
        dueOn: {type: string, format: date, nullable: true, description: "null: the start date plus the terms."}
        autoSend: {type: boolean}
    InvoiceSettingsBase:
      type: object
      required: [issuer, bankDetails, numberPrefix, nextNumber, taxLabel, taxPercent, lineText, footer, emailSubject, emailBody, sendHour]
      properties:
        issuer: {type: string, maxLength: 1000, description: "Your company's name and details, a line each (address, registration and tax numbers)."}
        bankDetails: {type: string, maxLength: 1000}
        numberPrefix: {type: string, maxLength: 20, example: INV-}
        nextNumber: {type: integer, minimum: 1, maximum: 99999999, description: "The next invoice's number (INV-0001)."}
        taxLabel: {type: string, maxLength: 40, example: SST}
        taxPercent: {$ref: '#/components/schemas/DecimalAmount'}
        lineText: {type: string, minLength: 1, maxLength: 1000, description: "The invoice line, with {{fields}}."}
        footer: {type: string, maxLength: 2000}
        emailSubject: {type: string, minLength: 1, maxLength: 200}
        emailBody: {type: string, minLength: 1, maxLength: 10000}
        sendHour: {type: integer, minimum: 0, maximum: 23, description: "The hour invoices go out on the start date (the agency's time zone)."}
    InvoiceSettings:
      allOf:
        - $ref: '#/components/schemas/InvoiceSettingsBase'
        - type: object
          required: [version, fields]
          properties:
            version: {type: integer, description: 0 while the defaults are in use.}
            fields:
              type: array
              description: The {{fields}} the texts may use.
              items: {$ref: '#/components/schemas/InvoiceField'}
    InvoiceField:
      type: object
      required: [key, label, example]
      properties:
        key: {type: string, example: invoice.total}
        label: {type: string}
        example: {type: string}
    InvoiceSettingsInput:
      allOf:
        - $ref: '#/components/schemas/InvoiceSettingsBase'
        - type: object
          required: [version]
          properties:
            version: {type: integer, minimum: 0}
    PlacementId:
      type: string
      pattern: '^plc_[0-9a-hjkmnp-tv-z]{26}$'
      example: plc_01jbz6w0m0k8q9x2r3s4t5v6w7
    PlacementStatus:
      type: string
      description: active = started (or starting); fell_through = left within the guarantee period; cancelled = did not start.
      enum: [active, fell_through, cancelled]
    ReplacementStatus:
      type: string
      description: "After a fall-through: owed = the client is owed a replacement candidate (or a refund); provided; refunded. none otherwise."
      enum: [none, owed, provided, refunded]
    InvoiceStatus:
      type: string
      enum: [not_invoiced, invoiced, paid]
    PlacementRestrictedField:
      type: string
      description: A field left out because you lack the permission to see it.
      enum: [money]
    PlacementMoney:
      type: object
      additionalProperties: false
      required: [salary, feePercent, feeAmount, feeCurrency, retainer]
      description: >
        The fee is either a percentage of the yearly salary (a monthly salary counts 12 times; feeAmount is then worked out) or a fixed amount (feePercent null).

      properties:
        retainer:
          description: The job's retainer when this is the first placement on a job with one.
          allOf: [{$ref: '#/components/schemas/PlacementRetainer'}]
          nullable: true
        salary:
          description: The agreed salary.
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        feePercent:
          description: e.g. "20" for 20% of the yearly salary.
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        feeAmount:
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        feeCurrency:
          allOf: [{$ref: '#/components/schemas/CurrencyCode'}]
          nullable: true
    Placement:
      type: object
      required: [id, version, applicationId, candidateId, candidateName, jobId, jobTitle, companyId, companyName, jobType, poNumber, endDate, recruiterId, recruiterName, startDate, guaranteeDays, guaranteeEndsOn, status, leftOn, statusNote, replacement, invoiceStatus, invoiceNumber, invoicedOn, paidOn, invoicing, restrictedFields, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/PlacementId'}
        version: {type: integer}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string, description: "As on the placement sheet: the job's title unless changed."}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string, description: "As on the placement sheet: the client's name unless changed."}
        jobType: {$ref: '#/components/schemas/PlacementJobType'}
        poNumber: {type: string, nullable: true, description: "The client's purchase order number."}
        endDate: {type: string, format: date, nullable: true, description: "When the placement ends (a contract's end), if known."}
        invoicing: {$ref: '#/components/schemas/PlacementInvoicing'}
        recruiterId:
          description: The recruiter credited with the placement.
          allOf: [{$ref: '#/components/schemas/UserId'}]
          nullable: true
        recruiterName: {type: string, nullable: true}
        startDate: {type: string, format: date}
        guaranteeDays: {type: integer, description: "How long after the start the candidate is guaranteed: if they leave within it, the placement fell through."}
        guaranteeEndsOn: {type: string, format: date}
        status: {$ref: '#/components/schemas/PlacementStatus'}
        leftOn: {type: string, format: date, nullable: true, description: When the candidate left (fell_through only).}
        statusNote: {type: string, nullable: true}
        replacement: {$ref: '#/components/schemas/ReplacementStatus'}
        invoiceStatus: {$ref: '#/components/schemas/InvoiceStatus'}
        invoiceNumber: {type: string, nullable: true}
        invoicedOn: {type: string, format: date, nullable: true}
        paidOn: {type: string, format: date, nullable: true}
        money:
          description: Left out (and listed in restrictedFields) without placements.fees:read. null means none recorded.
          allOf: [{$ref: '#/components/schemas/PlacementMoney'}]
          nullable: true
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/PlacementRestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CompanyBilling:
      type: object
      required: [year, thisYear, allTime]
      properties:
        year: {type: integer, description: The current year in the agency's time zone.}
        thisYear:
          type: array
          items: {$ref: '#/components/schemas/FeeTotal'}
        allTime:
          type: array
          items: {$ref: '#/components/schemas/FeeTotal'}
    FeeTotal:
      type: object
      required: [currency, total, notInvoiced, invoiced, paid]
      description: Fees of the matching placements that did not fall through or get cancelled, in one currency.
      properties:
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        total: {$ref: '#/components/schemas/DecimalAmount'}
        notInvoiced: {$ref: '#/components/schemas/DecimalAmount'}
        invoiced: {$ref: '#/components/schemas/DecimalAmount', description: Invoiced and not yet paid.}
        paid: {$ref: '#/components/schemas/DecimalAmount'}
    PlacementList:
      type: object
      required: [items, total, today]
      properties:
        items:
          type: array
          description: Newest start date first, at most 500; total says how many match.
          items: {$ref: '#/components/schemas/Placement'}
        total: {type: integer, description: "How many placements match: more than the items when the list stopped at 500."}
        today:
          type: string
          format: date
          description: "Today in the agency's time zone: what counts as started, in guarantee or overdue (not the browser's clock)."
        feeTotals:
          description: Left out without placements.fees:read.
          type: array
          items: {$ref: '#/components/schemas/FeeTotal'}
    PlacementMoneyInput:
      type: object
      additionalProperties: false
      description: "Either feePercent (with a monthly or yearly salary) or feeAmount and feeCurrency; or neither."
      properties:
        salary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        feePercent:
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        feeAmount:
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        feeCurrency:
          allOf: [{$ref: '#/components/schemas/CurrencyCode'}]
          nullable: true
    PlacementJobType:
      type: string
      description: "permanent or contract; from the job's work type unless changed (contract and temporary jobs are contract)."
      enum: [permanent, contract]
    PlacementInput:
      type: object
      additionalProperties: false
      required: [startDate]
      properties:
        startDate: {type: string, format: date}
        jobTitle: {type: string, maxLength: 300, description: "Defaults to the job's title."}
        companyName: {type: string, maxLength: 300, description: "Defaults to the client's name."}
        jobType: {$ref: '#/components/schemas/PlacementJobType'}
        poNumber: {type: string, maxLength: 100}
        endDate: {type: string, format: date}
        guaranteeDays: {type: integer, minimum: 0, maximum: 365, description: Defaults to 90.}
        recruiterId:
          description: Defaults to you.
          allOf: [{$ref: '#/components/schemas/UserId'}]
        money: {$ref: '#/components/schemas/PlacementMoneyInput'}
    PlacementUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        startDate: {type: string, format: date}
        jobTitle: {type: string, maxLength: 300}
        companyName: {type: string, maxLength: 300}
        jobType: {$ref: '#/components/schemas/PlacementJobType'}
        poNumber: {type: string, maxLength: 100, nullable: true}
        endDate: {type: string, format: date, nullable: true}
        guaranteeDays: {type: integer, minimum: 0, maximum: 365}
        recruiterId:
          allOf: [{$ref: '#/components/schemas/UserId'}]
          nullable: true
        status: {$ref: '#/components/schemas/PlacementStatus'}
        leftOn: {type: string, format: date, nullable: true}
        statusNote: {type: string, maxLength: 1000, nullable: true}
        replacement:
          description: Only for a fall-through (it becomes owed when the placement falls through).
          allOf: [{$ref: '#/components/schemas/ReplacementStatus'}]
        invoiceStatus: {$ref: '#/components/schemas/InvoiceStatus'}
        invoiceNumber: {type: string, maxLength: 100, nullable: true}
        invoicedOn: {type: string, format: date, nullable: true}
        paidOn: {type: string, format: date, nullable: true}
        money:
          description: The whole of the salary and fee (null clears them).
          allOf: [{$ref: '#/components/schemas/PlacementMoneyInput'}]
          nullable: true
    PrivacyRequestId:
      type: string
      pattern: '^prq_[0-9a-hjkmnp-tv-z]{26}$'
      example: prq_01jbz6w0m0k8q9x2r3s4t5v6w7
    ConsentStatus:
      type: string
      description: given = agreed to their data being kept and used for recruiting; withdrawn = do not contact them.
      enum: [given, withdrawn]
    ConsentMethod:
      type: string
      description: How the consent (or its withdrawal) was received; request = by closing a withdraw-consent request.
      enum: [careers_form, email, phone, in_person, document, request, other]
    Consent:
      type: object
      required: [version, status, method, day, note, updatedAt]
      properties:
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/ConsentStatus'}
        method: {$ref: '#/components/schemas/ConsentMethod'}
        day: {type: string, format: date, description: The day it was given or withdrawn.}
        note: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}
    ConsentInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, status, method, day]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        status: {$ref: '#/components/schemas/ConsentStatus'}
        method: {$ref: '#/components/schemas/ConsentMethod'}
        day: {type: string, format: date}
        note: {type: string, maxLength: 1000, nullable: true}
    PrivacyRequestKind:
      type: string
      description: >
        access = a copy of their data; correction = correct their data; withdraw_consent = stop using their data and contacting them; removal = remove their data; other = anything else.

      enum: [access, correction, withdraw_consent, removal, other]
    PrivacyRequestStatus:
      type: string
      enum: [open, done, declined]
    PrivacyRequest:
      type: object
      required: [id, version, candidateId, candidateName, kind, receivedOn, details, status, outcome, dueOn, overdue, daysOpen, closedAt, closedByName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/PrivacyRequestId'}
        version: {type: integer, minimum: 1}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        kind: {$ref: '#/components/schemas/PrivacyRequestKind'}
        receivedOn: {type: string, format: date}
        details: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/PrivacyRequestStatus'}
        outcome: {type: string, nullable: true, description: "What was done, or why it was declined."}
        dueOn:
          type: string
          format: date
          nullable: true
          description: "Access and correction requests must be answered within 21 days of receiving them (PDPA ss. 31 and 35)."
        overdue: {type: boolean, description: Still open after its due day.}
        daysOpen: {type: integer, minimum: 0, description: "Days since it was received (to when it was closed)."}
        closedAt: {type: string, format: date-time, nullable: true}
        closedByName: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    PrivacyRequestInput:
      type: object
      additionalProperties: false
      required: [kind, receivedOn]
      properties:
        kind: {$ref: '#/components/schemas/PrivacyRequestKind'}
        receivedOn: {type: string, format: date}
        details: {type: string, maxLength: 2000, nullable: true}
    PrivacyDecision:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/PrivacyRequestStatus'}
        outcome: {type: string, maxLength: 2000, nullable: true, description: "Required to close a request."}
    CandidatePrivacy:
      type: object
      required: [consent, doNotContact, requests]
      properties:
        consent:
          description: Null when none is recorded.
          nullable: true
          allOf: [{$ref: '#/components/schemas/Consent'}]
        doNotContact: {type: boolean, description: The candidate withdrew consent.}
        requests:
          type: array
          description: Newest first.
          items: {$ref: '#/components/schemas/PrivacyRequest'}
    ConsentCounts:
      type: object
      required: [given, withdrawn, notRecorded]
      properties:
        given: {type: integer}
        withdrawn: {type: integer}
        notRecorded: {type: integer, description: "Candidates with no consent recorded (added by hand, imported, sourced)."}
    WithdrawnCandidate:
      type: object
      required: [candidateId, candidateName, day]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        day: {type: string, format: date}
    PrivacyOverview:
      type: object
      required: [consent, openRequests, closedRequests, withdrawn]
      properties:
        consent: {$ref: '#/components/schemas/ConsentCounts'}
        openRequests:
          type: array
          description: Oldest first.
          items: {$ref: '#/components/schemas/PrivacyRequest'}
        closedRequests:
          type: array
          description: The 20 closed most recently.
          items: {$ref: '#/components/schemas/PrivacyRequest'}
        withdrawn:
          type: array
          description: Candidates who withdrew consent, most recent first (at most 200).
          items: {$ref: '#/components/schemas/WithdrawnCandidate'}
    DataExportField:
      type: object
      required: [label, value]
      properties:
        label: {type: string}
        value: {type: string}
    DataExportItem:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items: {$ref: '#/components/schemas/DataExportField'}
    DataExportSection:
      type: object
      required: [title, items]
      properties:
        title: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/DataExportItem'}
    CandidateDataExport:
      type: object
      required: [candidateId, candidateName, company, exportedAt, sections, notIncluded]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        company: {type: string, description: The company holding the data.}
        exportedAt: {type: string, format: date-time}
        sections:
          type: array
          items: {$ref: '#/components/schemas/DataExportSection'}
        notIncluded:
          type: array
          description: What is held but was left out because you may not see it (e.g. salary).
          items: {type: string}
    Report:
      type: object
      required: [from, to, funnel, sources, recruiters, timeToFill, feesHidden]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        funnel:
          type: array
          description: >
            Applications made in the period, by the furthest stage they reached (a rejected candidate who was interviewed counts as reaching interview), in pipeline order.

          items: {$ref: '#/components/schemas/FunnelStage'}
        sources:
          type: array
          description: "Applications made in the period by where they came from (the application's channel, else the candidate's source), most first."
          items: {$ref: '#/components/schemas/SourceRow'}
        recruiters:
          type: array
          description: Placements starting in the period per recruiter credited, most first.
          items: {$ref: '#/components/schemas/RecruiterRow'}
        timeToFill: {$ref: '#/components/schemas/TimeToFill'}
        feesHidden: {type: boolean, description: "Fees are left out (placements.fees:read is needed)."}
    FunnelStage:
      type: object
      required: [stage, reached, percentOfPrevious]
      properties:
        stage: {$ref: '#/components/schemas/Stage'}
        reached: {type: integer}
        percentOfPrevious:
          type: integer
          nullable: true
          description: Of those who reached the stage before, how many reached this one (rounded); null for the first stage or when none reached the one before.
    SourceRow:
      type: object
      required: [source, applications, interviewed, placed]
      properties:
        source: {type: string, description: "e.g. jobstreet, linkedin, careers_page, referral; unknown when not recorded."}
        applications: {type: integer}
        interviewed: {type: integer, description: Reached the interview stage.}
        placed: {type: integer}
    RecruiterRow:
      type: object
      required: [recruiterId, recruiterName, placements, fellThrough, fees]
      properties:
        recruiterId:
          allOf: [{$ref: '#/components/schemas/UserId'}]
          nullable: true
        recruiterName: {type: string, nullable: true, description: null when no recruiter is credited.}
        placements: {type: integer, description: Placements that stand (not fallen through or cancelled).}
        fellThrough: {type: integer}
        fees:
          type: array
          description: Fees of the placements that stand, per currency (empty when fees are hidden).
          items: {$ref: '#/components/schemas/MoneyTotal'}
    MoneyTotal:
      type: object
      required: [currency, amount]
      properties:
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        amount: {$ref: '#/components/schemas/DecimalAmount'}
    TimeToFill:
      type: object
      required: [medianDaysToFill, medianDaysToPlace, jobs]
      description: For candidates first placed in the period.
      properties:
        medianDaysToFill: {type: integer, nullable: true, description: From a job being opened to its first placement.}
        medianDaysToPlace: {type: integer, nullable: true, description: From a candidate being added to the job to being placed.}
        jobs:
          type: array
          description: Jobs with a placement in the period, slowest first.
          items: {$ref: '#/components/schemas/JobFill'}
    JobFill:
      type: object
      required: [jobId, jobTitle, daysToFill, placements]
      properties:
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string}
        daysToFill: {type: integer, description: From the job being opened to its first placement in the period.}
        placements: {type: integer}
    BookingLinkId:
      type: string
      pattern: '^bkl_[0-9a-hjkmnp-tv-z]{26}$'
      example: bkl_01jbz6w0m0k8q9x2r3s4t5v6w7
    WeeklyHours:
      type: object
      additionalProperties: false
      required: [day, start, end]
      properties:
        day: {type: integer, minimum: 1, maximum: 7, description: 1 = Monday ... 7 = Sunday.}
        start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'e.g. 09:00'}
        end: {type: string, pattern: '^([01][0-9]|2[0-4]):[0-5][0-9]$', description: 'e.g. 17:30; after start'}
    Schedule:
      type: object
      required: [set, timeZone, hours, bufferMinutes, minNoticeHours, maxDaysAhead, calendar]
      properties:
        set: {type: boolean, description: You have saved your hours (booking links need them).}
        timeZone: {type: string, description: 'An IANA time zone, e.g. Asia/Kuala_Lumpur.'}
        hours:
          type: array
          items: {$ref: '#/components/schemas/WeeklyHours'}
        bufferMinutes: {type: integer, description: Free time kept before and after each meeting.}
        minNoticeHours: {type: integer, description: How soon a candidate may book.}
        maxDaysAhead: {type: integer, description: How far ahead a candidate may book.}
        calendar:
          description: Your calendar address (Google Calendar's secret iCal address, or an Outlook published calendar); null when none.
          allOf: [{$ref: '#/components/schemas/CalendarFeed'}]
          nullable: true
    CalendarFeed:
      type: object
      required: [host, status, error, checkedAt, busyCount]
      properties:
        host: {type: string, description: 'The address''s host only, e.g. calendar.google.com (the address itself is private).'}
        status: {type: string, enum: [pending, ok, failed]}
        error: {type: string, nullable: true}
        checkedAt: {type: string, format: date-time, nullable: true}
        busyCount: {type: integer, description: Busy times found in the next weeks.}
    ScheduleInput:
      type: object
      additionalProperties: false
      required: [timeZone, hours, bufferMinutes, minNoticeHours, maxDaysAhead]
      properties:
        timeZone: {type: string, minLength: 1, maxLength: 64}
        hours:
          type: array
          maxItems: 21
          items: {$ref: '#/components/schemas/WeeklyHours'}
        bufferMinutes: {type: integer, minimum: 0, maximum: 120}
        minNoticeHours: {type: integer, minimum: 0, maximum: 336}
        maxDaysAhead: {type: integer, minimum: 1, maximum: 60}
        calendarUrl:
          type: string
          nullable: true
          maxLength: 2000
          writeOnly: true
          description: Your calendar's private .ics address. Leave out to keep it; null removes it.
    BookingLinkInput:
      type: object
      additionalProperties: false
      required: [candidateId, title, durationMinutes]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        applicationId: {$ref: '#/components/schemas/ApplicationId'}
        title: {type: string, minLength: 1, maxLength: 120, description: 'e.g. Call with Aina'}
        durationMinutes: {type: integer, enum: [15, 30, 45, 60, 90]}
        location: {type: string, maxLength: 500, nullable: true, description: 'A meeting link, a phone number or an address.'}
    BookingLink:
      type: object
      required: [id, url, candidateId, candidateName, hostName, title, durationMinutes, location, status, startsAt, expiresAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/BookingLinkId'}
        url: {type: string, nullable: true, description: The address to send (only when just created; the link is not stored).}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        hostName: {type: string}
        title: {type: string}
        durationMinutes: {type: integer}
        location: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/BookingStatus'}
        startsAt: {type: string, format: date-time, nullable: true, description: The booked time.}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    BookingStatus:
      type: string
      description: open = waiting for the candidate; booked; cancelled; expired = not used in time.
      enum: [open, booked, cancelled, expired]
    PublicBooking:
      type: object
      required: [companyName, hostName, title, durationMinutes, location, timeZone, status, startsAt, canChange, slots]
      properties:
        companyName: {type: string}
        hostName: {type: string}
        title: {type: string}
        durationMinutes: {type: integer}
        location: {type: string, nullable: true, description: Shown once booked.}
        timeZone: {type: string, description: The host's time zone (the page shows times in the visitor's).}
        status: {$ref: '#/components/schemas/BookingStatus'}
        startsAt: {type: string, format: date-time, nullable: true}
        canChange: {type: boolean, description: The booked time may still be moved.}
        slots:
          type: array
          description: Free start times (open, or booked and movable).
          items: {type: string, format: date-time}
    PublicBookingInput:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties:
        startsAt: {type: string, format: date-time}
    SchedulingRefreshCalendarJob:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: {type: string}
    SystemStatus:
      type: object
      required: [jobs, failed, backup]
      properties:
        jobs:
          type: array
          description: The company's background jobs by kind, kinds with none left out.
          items: {$ref: '#/components/schemas/JobKindStatus'}
        failed:
          type: array
          description: Jobs that failed for good in the last 30 days, newest first (at most 50).
          items: {$ref: '#/components/schemas/FailedJob'}
        backup:
          description: The server's last backup; null when none was ever made.
          nullable: true
          allOf: [{$ref: '#/components/schemas/BackupStatus'}]
    JobKindStatus:
      type: object
      required: [kind, waiting, running, retrying, failed, oldestWaitingSince]
      properties:
        kind: {type: string, description: "e.g. email.send"}
        waiting: {type: integer, description: Not started yet.}
        running: {type: integer}
        retrying: {type: integer, description: Failed at least once; tried again later.}
        failed: {type: integer, description: Failed for good in the last 30 days.}
        oldestWaitingSince: {type: string, format: date-time, nullable: true, description: When the longest-waiting one was queued.}
    FailedJob:
      type: object
      required: [id, kind, attempts, error, failedAt]
      properties:
        id: {type: string}
        kind: {type: string}
        attempts: {type: integer}
        error: {type: string, description: The last attempt's error.}
        failedAt: {type: string, format: date-time}
    BackupStatus:
      type: object
      required: [name, startedAt, finishedAt, status, sizeBytes, error]
      properties:
        name: {type: string, description: "The backup's folder, e.g. hiringplug-20261107-020000."}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [running, done, failed]}
        sizeBytes: {type: integer, format: int64, nullable: true}
        error: {type: string, nullable: true}
    Backups:
      type: object
      required: [available, auto, serviceSeenAt, requestedAt, last, backups, totalBytes]
      properties:
        available: {type: boolean, description: "False for an agency that does not run the server, or when this server keeps no backups (HP_BACKUP_DIR unset)."}
        auto: {type: boolean, description: The nightly backup is on.}
        serviceSeenAt: {type: string, format: date-time, nullable: true, description: When the backup service last checked in (it does every 30 seconds while running).}
        requestedAt: {type: string, format: date-time, nullable: true, description: A backup asked for with "Back up now" and not made yet.}
        last:
          description: The latest backup run (it may have failed); null before the first.
          nullable: true
          allOf: [{$ref: '#/components/schemas/BackupStatus'}]
        backups:
          type: array
          description: The backups on the server, newest first.
          items: {$ref: '#/components/schemas/BackupFile'}
        totalBytes: {type: integer, format: int64, description: The space all of them take.}
    BackupFile:
      type: object
      required: [name, createdAt, sizeBytes, files]
      properties:
        name: {type: string, description: "e.g. hiringplug-20261107-020000"}
        createdAt: {type: string, format: date-time}
        sizeBytes: {type: integer, format: int64, description: The download's size.}
        files: {type: integer, description: "How many uploaded files (CVs, documents and the like) it holds."}
    BackupDownloadLink:
      type: object
      required: [url, fileName, sizeBytes, expiresAt]
      properties:
        url: {type: string, description: "A path on this server, e.g. /v1/backup-downloads/hiringplug-20261107-020000?exp=…&sig=…"}
        fileName: {type: string, description: "e.g. hiringplug-20261107-020000.tar"}
        sizeBytes: {type: integer, format: int64}
        expiresAt: {type: string, format: date-time}
    EmailSalaryVisibility:
      type: string
      description: >
        Who sees a sent email that shows salary: salary_roles = only roles that may see salaries (the default); everyone = everyone who may read emails. Either way only senders who may see salaries can fill salary fields.

      enum: [salary_roles, everyone]
    Policies:
      type: object
      additionalProperties: false
      required: [emailSalaryVisibility]
      properties:
        emailSalaryVisibility: {$ref: '#/components/schemas/EmailSalaryVisibility'}
    FieldListName:
      type: string
      description: >
        candidate_source (a candidate's source), notice_period (keys like 1_month), industry (candidates and companies), work_type and work_arrangement (jobs and ads; fixed), screening_call and reference_check (what to ask on those calls, in order: each label is written before its answer in the call's note, e.g. "RFL: better prospects"; screening starts with RFL and LF, as notice period and salaries have their own fields on the call), company_benefits and pre_offer_process (the template for a client's benefits and its steps before an offer, on the company page; each item may carry a hint), company_category (a company's category, e.g. Signed client or VIP client, each with its colour), contact_role (what a contact does in hiring, e.g. Hiring manager or HR, each with its colour).

      enum: [candidate_source, notice_period, industry, work_type, work_arrangement, screening_call, reference_check, company_benefits, pre_offer_process, company_category, contact_role]
    FieldListKind:
      type: string
      description: open = options can be added and removed; fixed = rename, reorder and hide only.
      enum: [open, fixed]
    FieldOption:
      type: object
      required: [key, label, hint, color, hidden, builtIn]
      properties:
        key: {type: string, description: "What is stored (for notice periods: number_unit, e.g. 2_week)."}
        label: {type: string}
        hint: {type: string, nullable: true, description: "What to write for it (lists with hints only)."}
        color: {type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', description: "Its colour, e.g. #16a34a (lists with colours only)."}
        hidden: {type: boolean, description: Not offered for new choices; records that have it keep it.}
        builtIn: {type: boolean, description: "Comes with the app: hide it instead of removing it."}
    FieldList:
      type: object
      required: [name, label, kind, hints, colors, options]
      properties:
        name: {$ref: '#/components/schemas/FieldListName'}
        label: {type: string}
        kind: {$ref: '#/components/schemas/FieldListKind'}
        hints: {type: boolean, description: "Its options carry a hint (what to write)."}
        colors: {type: boolean, description: "Its options carry a colour."}
        options:
          type: array
          items: {$ref: '#/components/schemas/FieldOption'}
    FieldOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        key: {type: string, maxLength: 100, description: "Omit for a new option (made from the label); notice periods need number_unit."}
        label: {type: string, minLength: 1, maxLength: 100}
        hint: {type: string, maxLength: 300, description: "For lists with hints; ignored elsewhere."}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: "For lists with colours; ignored elsewhere."}
        hidden: {type: boolean}
    FieldListInput:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/FieldOptionInput'}
    FieldForm:
      type: string
      enum: [candidate, job]
    MandatoryField:
      type: object
      required: [form, field, label, mandatory, alwaysRequired]
      properties:
        form: {$ref: '#/components/schemas/FieldForm'}
        field: {type: string, description: "The field's name in the API, e.g. noticePeriod."}
        label: {type: string}
        mandatory: {type: boolean}
        alwaysRequired: {type: boolean, description: "Required by the app itself (e.g. a candidate's first name); cannot be turned off."}
    MandatoryFieldInput:
      type: object
      additionalProperties: false
      required: [form, field, mandatory]
      properties:
        form: {$ref: '#/components/schemas/FieldForm'}
        field: {type: string, maxLength: 50}
        mandatory: {type: boolean}
    MandatoryFieldsInput:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/MandatoryFieldInput'}
    FieldSettings:
      type: object
      required: [lists, mandatory]
      properties:
        lists:
          type: array
          items: {$ref: '#/components/schemas/FieldList'}
        mandatory:
          type: array
          items: {$ref: '#/components/schemas/MandatoryField'}
    SalaryCalculationRules:
      type: object
      additionalProperties: false
      required: [allowances, bonus, bonusOnAllowances, cents]
      properties:
        emailSalaryDisplay:
          type: string
          enum: [monthly, breakdown]
          description: Current salary presentation in emails only; omitted defaults to monthly.
        allowances: {type: boolean}
        bonus: {type: boolean}
        bonusOnAllowances: {type: boolean}
        cents: {type: boolean}
