        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createNote
      tags: [notes]
      summary: Write a note on a record
      x-permission: notes:create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoteCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/NoteId'}
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note (your own, or any with notes:manage)
      x-permission: notes:create
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/activity:
    get:
      operationId: listActivity
      tags: [notes]
      summary: What changed on a record, who changed it and when, newest first
      description: Salary changes say only that they changed, never the amounts.
      x-permission: notes.activity:read
      parameters:
        - name: entityType
          in: query
          required: true
          schema: {$ref: '#/components/schemas/ActivityEntityType'}
        - name: entityId
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 40}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityList'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/jobs/{jobId}/applications:
    parameters:
      - $ref: '#/components/parameters/JobOrderIdPath'
    get:
      operationId: listJobApplications
      tags: [pipeline]
      summary: The candidates on a job (its pipeline), oldest first
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: addApplication
      tags: [pipeline]
      summary: Put a candidate on a job
      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/candidates/{candidateId}/applications:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      operationId: listCandidateApplications
      tags: [pipeline]
      summary: The jobs a candidate is on, newest first
      x-permission: pipeline:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/applications/{applicationId}/move:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      operationId: moveApplication
      tags: [pipeline]
      summary: Move an application to another stage
      description: >
        Moving to rejected or withdrawn needs a `reason`. `version` must be the version you loaded, so two people moving the same card cannot overwrite each other.

      x-permission: pipeline:update
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationMove'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: The move is not allowed (STAGE_MOVE_NOT_ALLOWED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/pipeline/summary:
    get:
      operationId: getPipelineSummary
      tags: [pipeline]
      summary: 'The dashboard: open jobs and their pipelines, stuck applications, recent results'
      x-permission: pipeline:read
      parameters:
        - name: stuckDays
          in: query
          description: An application is stuck after this many days in one open stage (offer and earlier). Default 14.
          schema: {type: integer, minimum: 1, maximum: 365, default: 14}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PipelineSummary'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationFailed:
      description: The request is invalid (VALIDATION_FAILED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Missing or invalid credentials (UNAUTHENTICATED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Missing permission (FORBIDDEN).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (NOT_FOUND).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflict, e.g. CONFLICT_STALE_VERSION or a duplicate.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Too large (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Unsupported type (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Role:
      type: string
      enum:
        - owner
        - admin
        - recruiter
        - sourcer
        - hiring_manager
        - viewer
    Permission:
      type: string
      enum:
        - candidates.compensation:read
        - candidates.compensation:update
        - candidates:create
        - candidates:merge
        - candidates:read
        - candidates:update
        - companies:create
        - companies:read
        - companies:update
        - contacts:create
        - contacts:read
        - contacts:update
        - documents:create
        - documents:read
        - jobs.salary:read
        - jobs.salary:update
        - jobs:create
        - jobs:read
        - jobs:update
        - notes.activity:read
        - notes.sensitive:read
        - notes:create
        - notes:manage
        - notes:read
        - pipeline:read
        - pipeline:update
    ErrorCode:
      type: string
      enum:
        - APPLICATION_EXISTS
        - CANDIDATE_DUPLICATE_EMAIL
        - COMPANY_DUPLICATE_NAME
        - CONFLICT_STALE_VERSION
        - CONTACT_DUPLICATE_EMAIL
        - DOCUMENT_HAS_NO_TEXT
        - FORBIDDEN
        - INTERNAL
        - METHOD_NOT_ALLOWED
        - NOT_FOUND
        - PAYLOAD_TOO_LARGE
        - ROUTE_NOT_FOUND
        - SERVICE_UNAVAILABLE
        - STAGE_MOVE_NOT_ALLOWED
        - UNAUTHENTICATED
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
    JobKind:
      type: string
      enum:
        - document.cv_parsed
        - document.extract_text
        - document.parse_cv
        - document.text_extracted
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            requestId:
              type: string
              description: Quote this when reporting a problem.
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. `fields` for VALIDATION_FAILED.
    TenantId:
      type: string
      pattern: '^tnt_[0-9a-hjkmnp-tv-z]{26}$'
      example: tnt_01jbz6w0m0k8q9x2r3s4t5v6w7
    UserId:
      type: string
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      example: usr_01jbz6w0m0k8q9x2r3s4t5v6w7
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code, e.g. MY, SG.
      pattern: '^[A-Z]{2}$'
      example: MY
    CurrencyCode:
      type: string
      description: ISO 4217 currency code, e.g. MYR, SGD, USD.
      pattern: '^[A-Z]{3}$'
      example: MYR
    PayPeriod:
      type: string
      description: What a salary figure is per (shared by candidates and jobs).
      enum: [hour, day, month, year]
    DecimalAmount:
      type: string
      description: A non-negative amount with up to 2 decimal places, as a string so no precision is lost.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      example: '8500.00'
    CandidateId:
      type: string
      pattern: '^cand_[0-9a-hjkmnp-tv-z]{26}$'
      example: cand_01jbz6w0m0k8q9x2r3s4t5v6w7
    WorkAuthorizationStatus:
      type: string
      description: >
        local = citizen; expat_eligible = expat who can already work here (see `basis`); requires_visa = needs an employment pass.

      enum: [local, expat_eligible, requires_visa]
    WorkAuthorizationBasis:
      type: string
      description: Why an expat can work without sponsorship. rp_t = Residence Pass-Talent.
      enum: [rp_t, permanent_resident, spouse_visa, other]
    WorkAuthorization:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/WorkAuthorizationStatus'}
        basis:
          description: Required when status is expat_eligible, otherwise must be empty.
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationBasis'}]
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 500
    NoticePeriodUnit:
      type: string
      enum: [day, week, month]
    NoticePeriod:
      type: object
      additionalProperties: false
      required: [value, unit]
      description: '`value: 0` means available immediately.'
      properties:
        value: {type: integer, minimum: 0, maximum: 365}
        unit: {$ref: '#/components/schemas/NoticePeriodUnit'}
    CandidateSource:
      type: string
      enum: [jobstreet, linkedin, referral, careers_page, direct, other]
    SalaryAmount:
      type: object
      additionalProperties: false
      required: [amount, currency, period]
      properties:
        amount: {$ref: '#/components/schemas/DecimalAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    SalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        min: {$ref: '#/components/schemas/DecimalAmount'}
        max:
          description: Leave empty for a single expected figure.
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    Compensation:
      type: object
      required: [version, currentSalary, expectedSalary, updatedAt]
      properties:
        version: {type: integer, minimum: 1}
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
        updatedAt: {type: string, format: date-time}
    CompensationUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, currentSalary, expectedSalary]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 if no salary details exist yet, otherwise the version you loaded.
        currentSalary:
          allOf: [{$ref: '#/components/schemas/SalaryAmount'}]
          nullable: true
        expectedSalary:
          allOf: [{$ref: '#/components/schemas/SalaryRange'}]
          nullable: true
    RestrictedField:
      type: string
      description: A field left out of the response because you lack the permission to see it.
      enum: [compensation]
    Candidate:
      type: object
      required:
        - id
        - tags
        - skills
        - version
        - firstName
        - lastName
        - fullName
        - email
        - phone
        - nationality
        - workAuthorization
        - noticePeriod
        - industry
        - specialization
        - currentTitle
        - currentCompany
        - location
        - source
        - restrictedFields
        - createdAt
        - updatedAt
      properties:
        id: {$ref: '#/components/schemas/CandidateId'}
        version: {type: integer, minimum: 1}
        firstName: {type: string}
        lastName: {type: string}
        fullName: {type: string}
        email: {type: string, format: email, nullable: true}
        phone:
          type: string
          nullable: true
          description: International (E.164) format, e.g. +60123456789.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, nullable: true}
        specialization: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        compensation:
          description: Left out (and listed in restrictedFields) without candidates.compensation:read. null means none recorded.
          allOf: [{$ref: '#/components/schemas/Compensation'}]
          nullable: true
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/RestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CandidateCreate:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone:
          type: string
          maxLength: 40
          nullable: true
          description: Any common format; stored in international format.
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you loaded.
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        nationality:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        workAuthorization:
          allOf: [{$ref: '#/components/schemas/WorkAuthorization'}]
          nullable: true
        noticePeriod:
          allOf: [{$ref: '#/components/schemas/NoticePeriod'}]
          nullable: true
        industry: {type: string, maxLength: 100, nullable: true}
        specialization: {type: string, maxLength: 100, nullable: true}
        currentTitle: {type: string, maxLength: 200, nullable: true}
        currentCompany: {type: string, maxLength: 200, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        source:
          allOf: [{$ref: '#/components/schemas/CandidateSource'}]
          nullable: true
        tags:
          type: array
          description: Your own labels, e.g. relocate (duplicates ignoring case are removed).
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 60}
        skills:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 60}
    CandidateSummary:
      type: object
      required: [tags, id, fullName, email, phone, currentTitle, currentCompany, location, workAuthorizationStatus, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CandidateId'}
        fullName: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        currentTitle: {type: string, nullable: true}
        currentCompany: {type: string, nullable: true}
        location: {type: string, nullable: true}
        workAuthorizationStatus:
          allOf: [{$ref: '#/components/schemas/WorkAuthorizationStatus'}]
          nullable: true
        tags: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
    CandidatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
          nullable: true
    SimilarCandidate:
      type: object
      required: [candidate, reasons]
      properties:
        candidate: {$ref: '#/components/schemas/CandidateSummary'}
        reasons:
          type: array
          description: Why they may be the same person.
          items:
            type: string
            enum: [same_phone, similar_name]
    SimilarCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SimilarCandidate'}
    CandidateMerge:
      type: object
      additionalProperties: false
      required: [duplicateId, version]
      properties:
        duplicateId:
          description: The candidate to merge in (and delete).
          allOf: [{$ref: '#/components/schemas/CandidateId'}]
        version: {type: integer, minimum: 1, description: The version of the candidate you keep.}
    UsedValues:
      type: object
      required: [tags, skills, industries, specializations]
      properties:
        tags: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        industries: {type: array, items: {type: string}}
        specializations: {type: array, items: {type: string}}
    CompanyId:
      type: string
      pattern: '^comp_[0-9a-hjkmnp-tv-z]{26}$'
      example: comp_01jbz6w0m0k8q9x2r3s4t5v6w7
    CompanyType:
      type: string
      description: >
        client = you recruit for them; prospect = you want them as a client; internal = a part of your own organisation (in-house hiring).

      enum: [client, prospect, internal]
    CompanySize:
      type: string
      description: Employees. micro 1–10, small 11–50, medium 51–200, large 201–1000, enterprise over 1000.
      enum: [micro, small, medium, large, enterprise]
    Company:
      type: object
      required: [id, version, name, type, website, industry, size, phone, address, city, country, registrationNumber, about, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompanyId'}
        version: {type: integer, description: Send it back when you update.}
        name: {type: string}
        type: {$ref: '#/components/schemas/CompanyType'}
        website: {type: string, nullable: true, description: 'Always with https://, e.g. https://example.com.'}
        industry: {type: string, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        city: {type: string, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, nullable: true, description: 'Business registration number, e.g. SSM in Malaysia or UEN in Singapore.'}
        about: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        type:
          allOf: [{$ref: '#/components/schemas/CompanyType'}]
          description: Defaults to client.
        website: {type: string, maxLength: 300, nullable: true, description: 'example.com or a full address; https:// is added if missing.'}
        industry: {type: string, maxLength: 100, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, maxLength: 40, nullable: true}
        address: {type: string, maxLength: 500, nullable: true}
        city: {type: string, maxLength: 100, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, maxLength: 50, nullable: true}
        about: {type: string, maxLength: 4000, nullable: true}
    CompanyUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        name: {type: string, minLength: 1, maxLength: 200}
        type: {$ref: '#/components/schemas/CompanyType'}
        website: {type: string, maxLength: 300, nullable: true}
        industry: {type: string, maxLength: 100, nullable: true}
        size:
          allOf: [{$ref: '#/components/schemas/CompanySize'}]
          nullable: true
        phone: {type: string, maxLength: 40, nullable: true}
        address: {type: string, maxLength: 500, nullable: true}
        city: {type: string, maxLength: 100, nullable: true}
        country:
          allOf: [{$ref: '#/components/schemas/CountryCode'}]
          nullable: true
        registrationNumber: {type: string, maxLength: 50, nullable: true}
        about: {type: string, maxLength: 4000, nullable: true}
    CompanySummary:
      type: object
      required: [id, name, type, industry, city, website, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompanyId'}
        name: {type: string}
        type: {$ref: '#/components/schemas/CompanyType'}
        industry: {type: string, nullable: true}
        city: {type: string, nullable: true}
        website: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}
    CompanyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CompanySummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/CompanyId'}]
          nullable: true
    ContactId:
      type: string
      pattern: '^cont_[0-9a-hjkmnp-tv-z]{26}$'
      example: cont_01jbz6w0m0k8q9x2r3s4t5v6w7
    ContactStatus:
      type: string
      description: active = works there; left = has left the company.
      enum: [active, left]
    EmailCheckStatus:
      type: string
      description: >
        valid = well formed and the domain receives mail; risky = deliverable but a shared (hr@), disposable or catch-all address; invalid = will bounce (bad format, or the domain has no mail server); unknown = the mail server lookup failed, check again later.

      enum: [valid, risky, invalid, unknown]
    EmailCheck:
      type: object
      required: [status, reasons, checkedAt]
      properties:
        status: {$ref: '#/components/schemas/EmailCheckStatus'}
        reasons:
          type: array
          description: Why, in words (empty when valid).
          items: {type: string}
        checkedAt: {type: string, format: date-time}
    Contact:
      type: object
      required: [id, version, companyId, companyName, firstName, lastName, fullName, title, email, emailCheck, phone, mobile, linkedinUrl, status, notes, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactId'}
        version: {type: integer}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        fullName: {type: string}
        title: {type: string, nullable: true, description: 'Job title, e.g. HR Manager.'}
        email: {type: string, nullable: true}
        emailCheck:
          description: The latest check of `email`; null without an email.
          allOf: [{$ref: '#/components/schemas/EmailCheck'}]
          nullable: true
        phone: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        linkedinUrl: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ContactCreate:
      type: object
      additionalProperties: false
      required: [companyId, firstName]
      properties:
        companyId: {$ref: '#/components/schemas/CompanyId'}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        title: {type: string, maxLength: 200, nullable: true}
        email: {type: string, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        mobile: {type: string, maxLength: 40, nullable: true}
        linkedinUrl: {type: string, maxLength: 300, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, maxLength: 4000, nullable: true}
    ContactUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        title: {type: string, maxLength: 200, nullable: true}
        email: {type: string, maxLength: 254, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        mobile: {type: string, maxLength: 40, nullable: true}
        linkedinUrl: {type: string, maxLength: 300, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        notes: {type: string, maxLength: 4000, nullable: true}
    ContactSummary:
      type: object
      required: [id, fullName, title, companyId, companyName, email, emailCheckStatus, phone, mobile, status, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ContactId'}
        fullName: {type: string}
        title: {type: string, nullable: true}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        email: {type: string, nullable: true}
        emailCheckStatus:
          allOf: [{$ref: '#/components/schemas/EmailCheckStatus'}]
          nullable: true
        phone: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ContactStatus'}
        updatedAt: {type: string, format: date-time}
    ContactPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ContactSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
    DocumentId:
      type: string
      pattern: '^doc_[0-9a-hjkmnp-tv-z]{26}$'
      example: doc_01jbz6w0m0k8q9x2r3s4t5v6w7
    DocumentSource:
      type: string
      description: >
        Where the file came from. original = the candidate's own CV; formatted = a CV formatted by your team for clients.

      enum: [jobstreet, linkedin, original, formatted, other]
    DocumentStatus:
      type: string
      description: >
        queued = waiting for text extraction; extracted = text available; needs_ocr = scanned document, no text layer yet; failed = could not be read.

      enum: [queued, extracted, needs_ocr, failed]
    DocumentParseStatus:
      type: string
      description: >
        queued = being parsed; parsed = details ready to review; failed = the parser could not read it.

      enum: [queued, parsed, failed]
    Document:
      type: object
      required: [id, candidateId, source, fileName, contentType, sizeBytes, sha256, status, pageCount, extractor, errorMessage, extractionWarnings, parseStatus, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/DocumentId'}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        source: {$ref: '#/components/schemas/DocumentSource'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          nullable: true
          description: Which extractor produced the text, e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        extractionWarnings:
          type: array
          items: {type: string}
          description: >
            Problems a recruiter should know about, e.g. "OCR could not read page 3; this document may be incomplete." Empty when extraction was clean.

        extractedText:
          type: string
          nullable: true
          description: Only included when fetching a single document.
        parseStatus:
          allOf: [{$ref: '#/components/schemas/DocumentParseStatus'}]
          nullable: true
          description: Null when the document was never parsed (formatted CVs, or uploaded before parsing existed).
        parsedProfile:
          allOf: [{$ref: '#/components/schemas/ParsedProfile'}]
          nullable: true
          description: Only included when fetching a single document.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Document'}
    SourcedText:
      type: object
      additionalProperties: false
      required: [value, quote]
      description: >
        A value read from a CV and the exact CV text it came from. Values whose quote is not in the CV are dropped before saving.

      properties:
        value: {type: string, minLength: 1, maxLength: 300}
        quote: {type: string, minLength: 1, maxLength: 1000}
    ParsedJob:
      type: object
      additionalProperties: false
      required: [title, company, dates, startDate, endDate, current]
      properties:
        title: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        company: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        startDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY.}
        endDate: {type: string, nullable: true, pattern: '^[0-9]{4}(-[0-9]{2})?$', description: YYYY-MM or YYYY; null when current.}
        current: {type: boolean}
    ParsedEducation:
      type: object
      additionalProperties: false
      required: [qualification, institution, dates, endYear]
      properties:
        qualification: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        institution: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        dates: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        endYear: {type: integer, nullable: true, minimum: 1950, maximum: 2100}
    ParsedProfile:
      type: object
      additionalProperties: false
      required: [parser, fullName, email, phone, linkedinUrl, location, nationality, noticePeriod, skills, experience, education, dropped]
      description: >
        Details read from a CV, as suggestions to review. nationality is an ISO country code; noticePeriod is "<number> day|week|month".

      properties:
        parser: {type: string, description: 'name@version of the parser(s), e.g. rules@1.'}
        fullName: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        email: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        phone: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        linkedinUrl: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        location: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        nationality: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        noticePeriod: {allOf: [{$ref: '#/components/schemas/SourcedText'}], nullable: true}
        skills:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SourcedText'}
        experience:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/ParsedJob'}
        education:
          type: array
          maxItems: 15
          items: {$ref: '#/components/schemas/ParsedEducation'}
        dropped:
          type: integer
          minimum: 0
          description: How many values were dropped because their quote was not found in the CV.
    DocumentExtractTextJob:
      type: object
      additionalProperties: false
      required: [documentId, downloadUrl, contentType, fileName, sizeBytes]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        downloadUrl:
          type: string
          description: Short-lived signed URL to download the file from.
        contentType: {type: string}
        fileName: {type: string}
        sizeBytes: {type: integer, format: int64}
    ExtractionStatus:
      type: string
      enum: [extracted, needs_ocr, failed]
    DocumentTextExtractedJob:
      type: object
      additionalProperties: false
      required: [documentId, status, text, pageCount, extractor, errorMessage, warnings]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        status: {$ref: '#/components/schemas/ExtractionStatus'}
        text:
          type: string
          nullable: true
          pattern: '^[^\x00]*$'
          description: The document's plain text, with NUL characters removed.
        pageCount: {type: integer, nullable: true}
        extractor:
          type: string
          description: name@version of the extractor(s), e.g. pdfplumber@0.11+tesseract@5.3.
        errorMessage: {type: string, nullable: true}
        warnings:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 500}
          description: Problems found while reading, e.g. pages OCR could not read.
    DocumentParseCvJob:
      type: object
      additionalProperties: false
      required: [documentId, text]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        text:
          type: string
          pattern: '^[^\x00]*$'
          description: The document's saved text, so quotes match it exactly.
    DocumentCvParsedJob:
      type: object
      additionalProperties: false
      required: [documentId, profile, errorMessage]
      properties:
        documentId: {$ref: '#/components/schemas/DocumentId'}
        profile: {allOf: [{$ref: '#/components/schemas/ParsedProfile'}], nullable: true}
        errorMessage: {type: string, nullable: true}
    Me:
      type: object
      required: [user, tenant, role, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tenant: {$ref: '#/components/schemas/Tenant'}
        role: {$ref: '#/components/schemas/Role'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    User:
      type: object
      required: [id, email, name]
      properties:
        id: {$ref: '#/components/schemas/UserId'}
        email: {type: string, format: email}
        name: {type: string}
    Tenant:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/TenantId'}
        name: {type: string}
    JobOrderId:
      type: string
      pattern: '^jo_[0-9a-hjkmnp-tv-z]{26}$'
      example: jo_01jbz6w0m0k8q9x2r3s4t5v6w7
    JobStatus:
      type: string
      description: open = recruiting; on_hold = paused; filled = all openings filled; closed = cancelled or lost.
      enum: [open, on_hold, filled, closed]
    WorkType:
      type: string
      enum: [full_time, part_time, contract, temporary, internship]
    WorkArrangement:
      type: string
      enum: [onsite, hybrid, remote]
    JobRestrictedField:
      type: string
      enum: [salary]
    JobSalaryRange:
      type: object
      additionalProperties: false
      required: [min, currency, period]
      properties:
        min: {$ref: '#/components/schemas/DecimalAmount'}
        max:
          description: Leave empty for a single figure.
          allOf: [{$ref: '#/components/schemas/DecimalAmount'}]
          nullable: true
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        period: {$ref: '#/components/schemas/PayPeriod'}
    JobSalary:
      type: object
      required: [version, range, updatedAt]
      properties:
        version: {type: integer}
        range:
          allOf: [{$ref: '#/components/schemas/JobSalaryRange'}]
          nullable: true
        updatedAt: {type: string, format: date-time}
    JobSalaryUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion, range]
      properties:
        expectedVersion: {type: integer, minimum: 0, description: '0 if no budget exists yet, otherwise the version you loaded.'}
        range:
          allOf: [{$ref: '#/components/schemas/JobSalaryRange'}]
          nullable: true
    JobOrder:
      type: object
      required: [id, version, companyId, companyName, contactId, contactName, title, status, location, workType, workArrangement, openings, description, restrictedFields, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/JobOrderId'}
        version: {type: integer}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        contactId:
          description: The hiring contact at the company.
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        contactName: {type: string, nullable: true}
        title: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        location: {type: string, nullable: true}
        workType:
          allOf: [{$ref: '#/components/schemas/WorkType'}]
          nullable: true
        workArrangement:
          allOf: [{$ref: '#/components/schemas/WorkArrangement'}]
          nullable: true
        openings: {type: integer, description: How many people to hire.}
        description: {type: string, nullable: true}
        salary:
          description: Left out (and listed in restrictedFields) without jobs.salary:read. null means no budget recorded.
          allOf: [{$ref: '#/components/schemas/JobSalary'}]
          nullable: true
        restrictedFields:
          type: array
          items: {$ref: '#/components/schemas/JobRestrictedField'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    JobOrderCreate:
      type: object
      additionalProperties: false
      required: [companyId, title]
      properties:
        companyId: {$ref: '#/components/schemas/CompanyId'}
        contactId:
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        title: {type: string, minLength: 1, maxLength: 200}
        status: {$ref: '#/components/schemas/JobStatus'}
        location: {type: string, maxLength: 200, nullable: true}
        workType:
          allOf: [{$ref: '#/components/schemas/WorkType'}]
          nullable: true
        workArrangement:
          allOf: [{$ref: '#/components/schemas/WorkArrangement'}]
          nullable: true
        openings: {type: integer, minimum: 1, maximum: 999, description: Defaults to 1.}
        description: {type: string, maxLength: 20000, nullable: true}
    JobOrderUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        contactId:
          allOf: [{$ref: '#/components/schemas/ContactId'}]
          nullable: true
        title: {type: string, minLength: 1, maxLength: 200}
        status: {$ref: '#/components/schemas/JobStatus'}
        location: {type: string, maxLength: 200, nullable: true}
        workType:
          allOf: [{$ref: '#/components/schemas/WorkType'}]
          nullable: true
        workArrangement:
          allOf: [{$ref: '#/components/schemas/WorkArrangement'}]
          nullable: true
        openings: {type: integer, minimum: 1, maximum: 999}
        description: {type: string, maxLength: 20000, nullable: true}
    JobOrderSummary:
      type: object
      required: [id, title, companyId, companyName, status, location, openings, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/JobOrderId'}
        title: {type: string}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        location: {type: string, nullable: true}
        openings: {type: integer}
        updatedAt: {type: string, format: date-time}
    JobOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/JobOrderSummary'}
        nextCursor:
          description: Pass as `cursor` to get the next page; null on the last page.
          allOf: [{$ref: '#/components/schemas/JobOrderId'}]
          nullable: true
    NoteId:
      type: string
      pattern: '^note_[0-9a-hjkmnp-tv-z]{26}$'
      example: note_01jbz6w0m0k8q9x2r3s4t5v6w7
    NoteSubjectType:
      type: string
      enum: [candidate, job, company, contact]
    NoteKind:
      type: string
      enum: [general, screening, interview, call]
    Note:
      type: object
      required: [id, subjectType, subjectId, kind, body, sensitive, authorId, authorName, createdAt]
      properties:
        id: {$ref: '#/components/schemas/NoteId'}
        subjectType: {$ref: '#/components/schemas/NoteSubjectType'}
        subjectId: {type: string}
        kind: {$ref: '#/components/schemas/NoteKind'}
        body: {type: string}
        sensitive: {type: boolean, description: 'Only readable with notes.sensitive:read.'}
        authorId: {$ref: '#/components/schemas/UserId'}
        authorName: {type: string}
        createdAt: {type: string, format: date-time}
    NoteList:
      type: object
      required: [items, hiddenSensitive]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Note'}
        hiddenSensitive:
          type: integer
          description: How many sensitive notes were left out because you may not read them.
    NoteCreate:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, body]
      properties:
        subjectType: {$ref: '#/components/schemas/NoteSubjectType'}
        subjectId: {type: string, minLength: 1, maxLength: 40}
        kind:
          allOf: [{$ref: '#/components/schemas/NoteKind'}]
          description: Defaults to general.
        body: {type: string, minLength: 1, maxLength: 10000}
        sensitive: {type: boolean, description: 'Needs notes.sensitive:read. Defaults to false.'}
    ActivityEntityType:
      type: string
      enum: [candidate, job, company, contact, application]
    ActivityEntry:
      type: object
      required: [id, action, actorName, changes, at]
      properties:
        id: {type: string}
        action: {type: string, description: 'What happened, e.g. candidate.updated or application.moved.'}
        actorName: {type: string, description: 'Who did it (a user, or "System" for background work).'}
        changes:
          type: object
          additionalProperties: true
          description: 'Changed fields as {"field": {"from": old, "to": new}}; sensitive ones as {"changed": true, "redacted": true}.'
        at: {type: string, format: date-time}
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityEntry'}
    ApplicationId:
      type: string
      pattern: '^appl_[0-9a-hjkmnp-tv-z]{26}$'
      example: appl_01jbz6w0m0k8q9x2r3s4t5v6w7
    Stage:
      type: string
      description: >
        In order: applied, screening, submitted (to the client or hiring manager), interview, offer, placed. rejected and withdrawn close the application (with a reason); it can be reopened later.

      enum: [applied, screening, submitted, interview, offer, placed, rejected, withdrawn]
    CloseReason:
      type: string
      description: Why an application was rejected or withdrawn.
      enum: [not_qualified, salary_mismatch, client_rejected, failed_interview, position_filled, candidate_declined, accepted_other_offer, no_response, other]
    Application:
      type: object
      required: [id, version, jobId, jobTitle, companyId, companyName, candidateId, candidateName, candidateTitle, stage, reason, reasonNote, stageChangedAt, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ApplicationId'}
        version: {type: integer}
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        jobTitle: {type: string}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        candidateName: {type: string}
        candidateTitle: {type: string, nullable: true, description: "The candidate's current job title."}
        stage: {$ref: '#/components/schemas/Stage'}
        reason:
          description: Set when rejected or withdrawn.
          allOf: [{$ref: '#/components/schemas/CloseReason'}]
          nullable: true
        reasonNote: {type: string, nullable: true}
        stageChangedAt: {type: string, format: date-time, description: When it entered its current stage.}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Application'}
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: {$ref: '#/components/schemas/CandidateId'}
        stage:
          description: Defaults to applied. Must be an open stage.
          allOf: [{$ref: '#/components/schemas/Stage'}]
    ApplicationMove:
      type: object
      additionalProperties: false
      required: [version, stage]
      properties:
        version: {type: integer, minimum: 1, description: The version you loaded.}
        stage: {$ref: '#/components/schemas/Stage'}
        reason:
          description: Required for rejected and withdrawn; not allowed otherwise.
          allOf: [{$ref: '#/components/schemas/CloseReason'}]
        reasonNote: {type: string, maxLength: 1000}
    StageCounts:
      type: object
      description: How many applications are in each open stage.
      required: [applied, screening, submitted, interview, offer, placed]
      properties:
        applied: {type: integer}
        screening: {type: integer}
        submitted: {type: integer}
        interview: {type: integer}
        offer: {type: integer}
        placed: {type: integer}
    DashboardJob:
      type: object
      required: [jobId, title, companyId, companyName, stageCounts]
      properties:
        jobId: {$ref: '#/components/schemas/JobOrderId'}
        title: {type: string}
        companyId: {$ref: '#/components/schemas/CompanyId'}
        companyName: {type: string}
        stageCounts: {$ref: '#/components/schemas/StageCounts'}
    PipelineSummary:
      type: object
      required: [openJobs, stageCounts, jobs, stuck, placedLast30Days, movedLast7Days]
      properties:
        openJobs: {type: integer, description: Jobs with status open.}
        stageCounts:
          description: Applications on open jobs, per stage.
          allOf: [{$ref: '#/components/schemas/StageCounts'}]
        jobs:
          type: array
          description: Open jobs (newest first, up to 50) with their pipelines.
          items: {$ref: '#/components/schemas/DashboardJob'}
        stuck:
          type: array
          description: Applications on open jobs longest in one stage (offer and earlier) past stuckDays, oldest first, up to 10.
          items: {$ref: '#/components/schemas/Application'}
        placedLast30Days: {type: integer}
        movedLast7Days: {type: integer, description: Applications that changed stage in the last 7 days.}
  parameters:
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CandidateId'}
