# Shared part of the HiringPlug API contract.
#
# Do not put module endpoints here: each module has its own file in
# contracts/modules/. `task gen` merges this file and every module file into
# contracts/openapi.yaml (generated, never edit it by hand), from which the Go
# server, the TypeScript client and the Python models are generated.
openapi: 3.0.3
info:
  title: HiringPlug API
  version: 0.1.0
  description: |
    The HiringPlug applicant tracking system API.

    **Authentication.** Send `Authorization: Bearer <token>` on every request.

    **Permissions.** Every operation declares `x-permission`: the permission a
    caller needs. `authenticated` means any signed-in user. The permissions a
    role has by default are listed under `x-permissions`.

    **Errors.** Every error response has the same shape (`Error`). Use
    `error.code` to decide what to do, and quote `error.requestId` when
    reporting a problem: it finds every log line for that request.

    **Concurrency.** Records that can be edited carry a `version`. Send it back
    when you change the record; if someone else changed it first you get
    `409 CONFLICT_STALE_VERSION` instead of silently overwriting their change.
servers:
  - url: /
security:
  - bearerAuth: []

# Roles every tenant starts with. Module files grant permissions to these.
x-roles:
  owner: Full access, including users and billing.
  admin: Full access to recruiting data and settings.
  recruiter: Works candidates, jobs and clients, including salary details.
  sourcer: Finds and adds candidates; no salary details.
  hiring_manager: Reviews candidates for their jobs; no salary details.
  viewer: Read-only access; no salary details.

# Error codes shared by every module. Modules add their own in x-module.errorCodes.
x-error-codes:
  VALIDATION_FAILED: { status: 400, description: The request is invalid. `details` says which fields and why. }
  UNAUTHENTICATED: { status: 401, description: Missing, invalid or expired credentials. }
  FORBIDDEN: { status: 403, description: You are signed in but lack the permission this operation needs. }
  NOT_FOUND: { status: 404, description: The record does not exist, or you cannot see it. }
  ROUTE_NOT_FOUND: { status: 404, description: No such endpoint. }
  METHOD_NOT_ALLOWED: { status: 405, description: The endpoint exists but not with this HTTP method. }
  CONFLICT_STALE_VERSION: { status: 409, description: Someone changed the record since you loaded it. Reload and try again. }
  PAYLOAD_TOO_LARGE: { status: 413, description: The request body or uploaded file is too large. }
  UNSUPPORTED_MEDIA_TYPE: { status: 415, description: The content type or file type is not supported. }
  INTERNAL: { status: 500, description: Something went wrong on our side. Quote the requestId when reporting it. }
  SERVICE_UNAVAILABLE: { status: 503, description: A dependency is temporarily unavailable. Retry later. }

paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationFailed:
      description: The request is invalid (VALIDATION_FAILED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or invalid credentials (UNAUTHENTICATED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing permission (FORBIDDEN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (NOT_FOUND).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict, e.g. CONFLICT_STALE_VERSION or a duplicate.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Too large (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Unsupported type (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # Generated by the bundler from x-roles, x-permissions, x-error-codes and
    # x-jobs. Listed here as placeholders so references resolve while editing.
    Role:
      type: string
      enum: [__generated__]
    Permission:
      type: string
      enum: [__generated__]
    ErrorCode:
      type: string
      enum: [__generated__]
    JobKind:
      type: string
      enum: [__generated__]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            requestId:
              type: string
              description: Quote this when reporting a problem.
            details:
              type: object
              additionalProperties: true
              description: Extra context, e.g. `fields` for VALIDATION_FAILED.

    # IDs are a type prefix plus a time-sortable 26-character ULID, so an ID in a
    # log line tells you what kind of record it is.
    TenantId:
      type: string
      pattern: '^tnt_[0-9a-hjkmnp-tv-z]{26}$'
      example: tnt_01jbz6w0m0k8q9x2r3s4t5v6w7
    UserId:
      type: string
      pattern: '^usr_[0-9a-hjkmnp-tv-z]{26}$'
      example: usr_01jbz6w0m0k8q9x2r3s4t5v6w7

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code, e.g. MY, SG.
      pattern: '^[A-Z]{2}$'
      example: MY
    CurrencyCode:
      type: string
      description: ISO 4217 currency code, e.g. MYR, SGD, USD.
      pattern: '^[A-Z]{3}$'
      example: MYR
    DecimalAmount:
      type: string
      description: A non-negative amount with up to 2 decimal places, as a string so no precision is lost.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      example: '8500.00'
