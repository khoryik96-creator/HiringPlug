# sqlc turns the SQL in db/queries/<module>.sql into typed Go functions in
# internal/modules/<module>/internal/store. Go's `internal` rule means only
# that module can import its store: no module can query another module's tables
# through generated code. Run via `task gen`.
version: "2"
sql:
  - &module
    engine: postgresql
    schema: db/migrations
    queries: db/queries/identity.sql
    gen:
      go: &go
        package: store
        out: internal/modules/identity/internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # Meaning vectors go in as text and are compared in the database; Go never reads them.
          - column: meaning_role.field
            go_type: string
          - column: meaning_role.work
            go_type: string
          - column: meaning_passage.vec
            go_type: string
          - column: meaning_query_need.vec
            go_type: string
          - column: meaning_candidate.profile
            go_type:
              type: string
              pointer: true
          - column: meaning_query.role
            go_type:
              type: string
              pointer: true
          - column: meaning_query.whole
            go_type:
              type: string
              pointer: true
          - column: meaning_query.context
            go_type:
              type: string
              pointer: true
  - <<: *module
    queries: [db/queries/candidates.sql, db/queries/candidates_words.sql]
    gen:
      go:
        <<: *go
        out: internal/modules/candidates/internal/store
  - <<: *module
    queries: db/queries/documents.sql
    gen:
      go:
        <<: *go
        out: internal/modules/documents/internal/store
