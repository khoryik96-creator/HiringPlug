# sqlc turns the SQL in db/queries/<module>.sql into typed Go functions in
# internal/modules/<module>/internal/store. Go's `internal` rule means only
# that module can import its store: no module can query another module's tables
# through generated code. Run via `task gen`.
version: "2"
sql:
  - &module
    engine: postgresql
    schema: db/migrations
    queries: db/queries/identity.sql
    gen:
      go: &go
        package: store
        out: internal/modules/identity/internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - <<: *module
    queries: db/queries/candidates.sql
    gen:
      go:
        <<: *go
        out: internal/modules/candidates/internal/store
  - <<: *module
    queries: db/queries/documents.sql
    gen:
      go:
        <<: *go
        out: internal/modules/documents/internal/store
  - <<: *module
    queries: db/queries/companies.sql
    gen:
      go:
        <<: *go
        out: internal/modules/companies/internal/store
  - <<: *module
    queries: db/queries/contacts.sql
    gen:
      go:
        <<: *go
        out: internal/modules/contacts/internal/store
  - <<: *module
    queries: db/queries/jobs.sql
    gen:
      go:
        <<: *go
        out: internal/modules/jobs/internal/store
  - <<: *module
    queries: db/queries/pipeline.sql
    gen:
      go:
        <<: *go
        out: internal/modules/pipeline/internal/store
  - <<: *module
    queries: db/queries/notes.sql
    gen:
      go:
        <<: *go
        out: internal/modules/notes/internal/store
  - <<: *module
    queries: db/queries/interviews.sql
    gen:
      go:
        <<: *go
        out: internal/modules/interviews/internal/store
  - <<: *module
    queries: db/queries/emails.sql
    gen:
      go:
        <<: *go
        out: internal/modules/emails/internal/store
  - <<: *module
    queries: db/queries/placements.sql
    gen:
      go:
        <<: *go
        out: internal/modules/placements/internal/store
        # Dates as time.Time (midnight UTC), like timestamps.
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { type: time.Time, pointer: true }
  - <<: *module
    queries: db/queries/offers.sql
    gen:
      go:
        <<: *go
        out: internal/modules/offers/internal/store
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { type: time.Time, pointer: true }
  - <<: *module
    queries: db/queries/integrations.sql
    gen:
      go:
        <<: *go
        out: internal/modules/integrations/internal/store
  - <<: *module
    queries: db/queries/leads.sql
    gen:
      go:
        <<: *go
        out: internal/modules/leads/internal/store
  - <<: *module
    queries: db/queries/cvformats.sql
    gen:
      go:
        <<: *go
        out: internal/modules/cvformats/internal/store
  - <<: *module
    queries: db/queries/assistant.sql
    gen:
      go:
        <<: *go
        out: internal/modules/assistant/internal/store
  - <<: *module
    queries: db/queries/matching.sql
    gen:
      go:
        <<: *go
        out: internal/modules/matching/internal/store
  - <<: *module
    queries: db/queries/privacy.sql
    gen:
      go:
        <<: *go
        out: internal/modules/privacy/internal/store
  - <<: *module
    queries: db/queries/settings.sql
    gen:
      go:
        <<: *go
        out: internal/modules/settings/internal/store
