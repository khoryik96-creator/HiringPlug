          - { column: meaning_role.field, go_type: string }
          - { column: meaning_role.work, go_type: string }
          - { column: meaning_passage.vec, go_type: string }
          - { column: meaning_query_need.vec, go_type: string }
          - { column: meaning_candidate.profile, go_type: { type: string, pointer: true } }
          - { column: meaning_query.role, go_type: { type: string, pointer: true } }
          - { column: meaning_query.whole, go_type: { type: string, pointer: true } }
