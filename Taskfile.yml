# One entry point for everything, on Windows, macOS and Linux.
# Install Task once: https://taskfile.dev (winget install Task.Task / brew install go-task)
# Then:  task setup   task gen   task verify   task dev
version: "3"

dotenv: [".env"]

vars:
  GO_TOOL: go tool -modfile=tools/go.mod
  PY_GEN: >-
    uv run datamodel-codegen --input ../contracts/openapi.yaml --input-file-type openapi
    --output-model-type pydantic_v2.BaseModel --target-python-version 3.12
    --use-standard-collections --use-union-operator --use-annotated --field-constraints
    --use-subclass-enum --strict-nullable --use-double-quotes --disable-timestamp
    --formatters ruff-format
    --custom-file-header "# GENERATED by task gen from contracts/openapi.yaml. DO NOT EDIT."
    --output src/hiringplug_ai/contracts.py
  GENERATED: >-
    contracts/openapi.yaml backend/internal/api backend/internal/modules
    ai/src/hiringplug_ai/contracts.py web/src/api/schema.d.ts

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Install everything (Go modules and tools, Python and web dependencies)
    cmds: [task: setup:go, task: setup:py, task: setup:web]

  setup:go:
    dir: backend
    cmds: [go mod download, go mod download -modfile=tools/go.mod]

  setup:py:
    dir: ai
    cmds: [uv sync]

  setup:web:
    dir: web
    cmds: [pnpm install --frozen-lockfile]

  # --- Code generation: the contract and SQL are the source of truth ---

  gen:
    desc: Regenerate all code from contracts/ and backend/db/ (run after editing them)
    cmds:
      - task: gen:contract
      - task: gen:go
      - task: gen:py
      - task: gen:ts

  gen:contract:
    desc: Merge contracts/openapi.base.yaml + contracts/modules/*.yaml into contracts/openapi.yaml
    dir: backend
    cmds: [go run ./cmd/contracts]

  gen:go:
    dir: backend
    cmds:
      - "{{.GO_TOOL}} oapi-codegen -config oapi-codegen.yaml ../contracts/openapi.yaml"
      - "{{.GO_TOOL}} sqlc generate"

  gen:py:
    dir: ai
    cmds: ["{{.PY_GEN}}"]

  gen:ts:
    dir: web
    cmds: [pnpm run gen]

  check:gen:
    desc: "CI: fail if committed generated code is out of date (needs a clean checkout)"
    cmds:
      - task: gen
      - git diff --exit-code -- {{.GENERATED}}
      - test -z "$(git status --porcelain -- {{.GENERATED}})"

  check:migrations:
    desc: Fail if a migration that already exists on main was edited or deleted
    cmds:
      - |
        base=$(git merge-base origin/main HEAD 2>/dev/null) || { echo "no origin/main to compare with; skipping"; exit 0; }
        changed=$(git diff --name-only --diff-filter=MDR "$base" -- backend/db/migrations)
        if [ -n "$changed" ]; then echo "Committed migrations must never change; add a new one instead:"; echo "$changed"; exit 1; fi

  # --- Quality ---

  lint:
    desc: Lint and type-check all three parts
    cmds: [task: lint:go, task: lint:py, task: lint:web]

  lint:go:
    dir: backend
    cmds: ["{{.GO_TOOL}} golangci-lint run ./..."]

  lint:py:
    dir: ai
    cmds: [uv run ruff check src tests, uv run ruff format --check src tests, uv run mypy src tests]

  lint:web:
    dir: web
    cmds: [pnpm run lint, pnpm run typecheck]

  test:
    desc: Run every test (needs PostgreSQL - `task db:up` - and Tesseract)
    cmds: [task: test:go, task: test:py, task: test:web]

  test:go:
    dir: backend
    cmds: [go test -race ./...]

  test:py:
    dir: ai
    cmds: [uv run pytest]

  test:web:
    dir: web
    cmds: [pnpm run test]

  build:web:
    dir: web
    cmds: [pnpm run build]

  verify:
    desc: Everything CI checks. Run before pushing (then commit any regenerated files).
    cmds:
      - task: gen
      - task: check:migrations
      - task: lint
      - task: test
      - task: build:web

  # --- Local development ---

  db:up:
    desc: Start PostgreSQL in Docker
    cmds: [docker compose -f deploy/docker-compose.yml up -d --wait postgres]

  db:setup:
    desc: Migrate, create the database roles, and create demo users (prints sign-in tokens)
    dir: backend
    cmds: [go run ./cmd/hp dev-setup]

  dev:
    desc: Run the API, both workers and the web app (Ctrl+C stops all)
    deps: [dev:api, dev:worker, dev:ai, dev:web]

  dev:api:
    dir: backend
    cmds: [go run ./cmd/api]

  dev:worker:
    dir: backend
    cmds: [go run ./cmd/worker]

  dev:ai:
    dir: ai
    cmds: [uv run hiringplug-ai]

  dev:web:
    dir: web
    cmds: [pnpm dev]

  e2e:
    desc: "End-to-end test across the real services (start them first with `task dev`)"
    dir: ai
    cmds: [uv run pytest -m e2e tests/e2e]

  # --- Adding things ---

  new:module:
    desc: "Create a module. Example: task new:module -- name=job_ads entity=job_ad"
    dir: backend
    cmds:
      - "go run ./cmd/scaffold {{.CLI_ARGS}}"
