# Security headers for the web app (included by nginx.conf; the browser smoke
# tests serve the app with these same headers, read from this file).
# - Scripts only from the app itself: an injected <script> does not run.
# - Styles may be inline: rich emails and the composer carry their own styles.
# - Images: the app, data/blob URLs, and https (pictures inside emails).
# - Frames: the app and blob URLs (CV previews); the app is not framed elsewhere.
# Behind HTTPS, the proxy in front should also send Strict-Transport-Security.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
