# Local-first deployment: the whole system on one machine.
#   docker compose -f deploy/docker-compose.yml up -d --build
# (or double-click update-hiringplug.command / update-hiringplug.bat)
# then open http://localhost:3000 (web) and http://localhost:8080/docs (API docs).
# Services restart on their own whenever Docker starts, so this is only needed
# after pulling new code.
# For development you usually start only PostgreSQL and Mailpit: `task db:up`.
#
# Before running this anywhere but your own laptop, replace every *_dev
# password and secret below (see .env.example).
name: hiringplug

x-backend-env: &backend-env
  HP_ENV: development
  HP_DATABASE_URL: postgres://hp_api:hp_api_dev@postgres:5432/hiringplug?sslmode=disable
  HP_DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/hiringplug?sslmode=disable
  HP_AI_DATABASE_URL: postgres://hp_ai:hp_ai_dev@postgres:5432/hiringplug?sslmode=disable
  HP_AUTH_JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
  HP_FILES_URL_SECRET: dev-only-secret-change-me-0123456789abcdef
  HP_FILES_DIR: /data/files
  HP_INTERNAL_BASE_URL: http://api:8080
  HP_CLIENT_IP_HEADER: X-Real-IP # set by nginx (deploy/nginx.conf)
  HP_PUBLIC_URL: ${HP_PUBLIC_URL:-http://localhost:3000} # where people reach the app
  HP_TIME_ZONE: ${HP_TIME_ZONE:-Asia/Kuala_Lumpur} # times in reminder emails
  # Email from the app. By default it goes to Mailpit, which catches every
  # message (nothing reaches real inboxes): read it at http://localhost:8025.
  # For real email set these to your mail server (see .env.example).
  HP_SMTP_HOST: ${HP_SMTP_HOST:-mailpit:1025}
  HP_SMTP_USERNAME: ${HP_SMTP_USERNAME:-}
  HP_SMTP_PASSWORD: ${HP_SMTP_PASSWORD:-}
  HP_SMTP_FROM: ${HP_SMTP_FROM:-no-reply@hiringplug.local}
  HP_SMTP_TLS: ${HP_SMTP_TLS:-none}
  # The AI assistant: off until a provider is set up (see docs/playbooks/run-locally.md).
  HP_AI_PROVIDER: ${HP_AI_PROVIDER:-off}
  # Seals the AI keys companies enter in Settings > AI provider (the AI worker opens them).
  HP_AI_KEYS_SECRET: ${HP_AI_KEYS_SECRET:-dev-only-ai-keys-secret-change-me-0123456789}
  HP_AI_MONTHLY_TOKENS: ${HP_AI_MONTHLY_TOKENS:-2000000}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hiringplug
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # Applies migrations and creates the database roles, then exits.
  bootstrap:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/hp", "bootstrap"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/api"]
    restart: unless-stopped
    environment: *backend-env
    ports: ["8080:8080"]
    volumes: [files:/data/files]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes: [files:/data/files]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  ai-worker:
    build: { context: .., dockerfile: deploy/ai.Dockerfile }
    restart: unless-stopped
    environment:
      HP_AI_DATABASE_URL: postgres://hp_ai:hp_ai_dev@postgres:5432/hiringplug?sslmode=disable
      HP_AI_OCR_LANGUAGES: eng
      HP_AI_PROVIDER: ${HP_AI_PROVIDER:-off}
      HP_AI_PROVIDER_URL: ${HP_AI_PROVIDER_URL:-}
      HP_AI_PROVIDER_KEY: ${HP_AI_PROVIDER_KEY:-}
      HP_AI_MODEL: ${HP_AI_MODEL:-}
      HP_AI_KEYS_SECRET: ${HP_AI_KEYS_SECRET:-dev-only-ai-keys-secret-change-me-0123456789}
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  # A backup of the database and the uploaded files every night, the newest
  # 14 kept, in the backups folder next to this repository (copy them to
  # another disk or the cloud too). Restore one with:
  #   docker compose -f deploy/docker-compose.yml stop api worker ai-worker
  #   docker compose -f deploy/docker-compose.yml run --rm backup /app/hp restore hiringplug-YYYYMMDD-HHMMSS -yes
  #   docker compose -f deploy/docker-compose.yml up -d
  backup:
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *backend-env
      HP_BACKUP_DIR: /backups
      HP_BACKUP_KEEP: ${HP_BACKUP_KEEP:-14}
    volumes: [files:/data/files, ../backups:/backups]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  # Catches email sent from the app (development): http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
  files:
