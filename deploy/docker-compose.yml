# Local-first deployment: the whole system on one machine.
#   docker compose -f deploy/docker-compose.yml up -d --build
# (or double-click update-hiringplug.command / update-hiringplug.bat)
# then open http://localhost:3000 (web) and http://localhost:8080/docs (API docs).
# Services restart on their own whenever Docker starts, so this is only needed
# after pulling new code.
# For development you usually start only PostgreSQL and Mailpit: `task db:up`.
#
# The passwords and secrets below are published defaults for a laptop. Before
# running this anywhere others can reach (an office server, the cloud), put
# your own in deploy/.env, next to this file (never commit it):
#   HP_ENV=production            refuses to start with a published secret
#   HP_PUBLIC_URL=...            the address others open, e.g. http://192.168.1.10:3000
#                                (on the internet: https, see deploy-to-a-server.md)
#   HP_AUTH_JWT_SECRET=...       32+ random characters (signs sign-ins)
#   HP_FILES_URL_SECRET=...      32+ random characters (signs file links)
#   HP_MAIL_KEYS_SECRET=...      32+ random characters (seals mailbox sign-ins)
#   HP_AI_KEYS_SECRET=...        32+ random characters (seals AI keys)
#   HP_WEBHOOK_KEYS_SECRET=...   32+ random characters (seals webhook secrets)
#   HP_DB_ADMIN_PASSWORD=...     letters and digits; set before the first start
#   HP_DB_API_PASSWORD=...  HP_DB_AI_PASSWORD=...
# The database, the API port and the mail catcher listen on this machine only
# (127.0.0.1); only the web app (port 3000) is reachable from other computers.
# See docs/playbooks/run-locally.md.
name: hiringplug

x-backend-env: &backend-env
  HP_ENV: ${HP_ENV:-development}
  HP_DATABASE_URL: postgres://hp_api:${HP_DB_API_PASSWORD:-hp_api_dev}@postgres:5432/hiringplug?sslmode=disable
  HP_DATABASE_ADMIN_URL: postgres://postgres:${HP_DB_ADMIN_PASSWORD:-postgres}@postgres:5432/hiringplug?sslmode=disable
  HP_AI_DATABASE_URL: postgres://hp_ai:${HP_DB_AI_PASSWORD:-hp_ai_dev}@postgres:5432/hiringplug?sslmode=disable
  HP_AUTH_JWT_SECRET: ${HP_AUTH_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  HP_FILES_URL_SECRET: ${HP_FILES_URL_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  HP_FILES_DIR: /data/files
  HP_INTERNAL_BASE_URL: http://api:8080
  HP_CLIENT_IP_HEADER: X-Real-IP # set by nginx (deploy/nginx.conf)
  HP_PUBLIC_URL: ${HP_PUBLIC_URL:-http://localhost:3000} # where people reach the app
  HP_TIME_ZONE: ${HP_TIME_ZONE:-Asia/Kuala_Lumpur} # times in reminder emails
  # Email from the app. By default it goes to Mailpit, which catches every
  # message (nothing reaches real inboxes): read it at http://localhost:8025.
  # For real email set these to your mail server (see .env.example).
  HP_APOLLO_BROKER_URL: ${HP_APOLLO_BROKER_URL:-}
  HP_APOLLO_KEYS_SECRET: ${HP_APOLLO_KEYS_SECRET:-}
  HP_MAIL_KEYS_SECRET: ${HP_MAIL_KEYS_SECRET:-}
  HP_MAIL_MICROSOFT_CLIENT_ID: ${HP_MAIL_MICROSOFT_CLIENT_ID:-}
  HP_MAIL_MICROSOFT_CLIENT_SECRET: ${HP_MAIL_MICROSOFT_CLIENT_SECRET:-}
  HP_MAIL_GOOGLE_CLIENT_ID: ${HP_MAIL_GOOGLE_CLIENT_ID:-}
  HP_MAIL_GOOGLE_CLIENT_SECRET: ${HP_MAIL_GOOGLE_CLIENT_SECRET:-}
  HP_SMTP_HOST: ${HP_SMTP_HOST:-mailpit:1025}
  HP_SMTP_USERNAME: ${HP_SMTP_USERNAME:-}
  HP_SMTP_PASSWORD: ${HP_SMTP_PASSWORD:-}
  HP_SMTP_FROM: ${HP_SMTP_FROM:-no-reply@hiringplug.local}
  HP_SMTP_TLS: ${HP_SMTP_TLS:-none}
  # Who is emailed when the server needs someone (failed backups, a full disk...).
  HP_ALERT_EMAIL: ${HP_ALERT_EMAIL:-}
  # The AI assistant: off until a provider is set up (see docs/playbooks/run-locally.md).
  HP_AI_PROVIDER: ${HP_AI_PROVIDER:-off}
  # Seals the AI keys companies enter in Settings > AI provider (the AI worker opens them).
  HP_AI_KEYS_SECRET: ${HP_AI_KEYS_SECRET:-dev-only-ai-keys-secret-change-me-0123456789}
  # Seals webhook signing secrets in the database (empty: kept as they are).
  HP_WEBHOOK_KEYS_SECRET: ${HP_WEBHOOK_KEYS_SECRET:-}
  HP_AI_MONTHLY_TOKENS: ${HP_AI_MONTHLY_TOKENS:-2000000}

services:
  postgres:
    # PostgreSQL 16 with pgvector (search by meaning compares vectors in the database).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${HP_DB_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: hiringplug
    ports: ["127.0.0.1:5432:5432"] # this machine only: never the network
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Over TCP: while the image first sets up the database it runs a
      # temporary server on its socket only, which must not count as ready
      # (bootstrap, which connects over the network, would fail).
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      retries: 30

  # Applies migrations and creates the database roles, then exits.
  bootstrap:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/hp", "bootstrap"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/api"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      HP_BACKUP_DIR: /backups # Settings > Backups: list, download, delete
    ports: ["127.0.0.1:8080:8080"] # this machine only: people use the web app, which reaches the API itself
    volumes: [files:/data/files, ../backups:/backups]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    command: ["/app/worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes: [files:/data/files]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  ai-worker:
    build: { context: .., dockerfile: deploy/ai.Dockerfile }
    restart: unless-stopped
    environment:
      HP_AI_DATABASE_URL: postgres://hp_ai:${HP_DB_AI_PASSWORD:-hp_ai_dev}@postgres:5432/hiringplug?sslmode=disable
      HP_AI_OCR_LANGUAGES: eng
      HP_AI_PROVIDER: ${HP_AI_PROVIDER:-off}
      HP_AI_PROVIDER_URL: ${HP_AI_PROVIDER_URL:-}
      HP_AI_PROVIDER_KEY: ${HP_AI_PROVIDER_KEY:-}
      HP_AI_MODEL: ${HP_AI_MODEL:-}
      HP_AI_KEYS_SECRET: ${HP_AI_KEYS_SECRET:-dev-only-ai-keys-secret-change-me-0123456789}
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  # A backup of the database and the uploaded files every night (only files
  # new since the night before are copied; unchanged ones are shared), the newest
  # 14 kept, in the backups folder next to this repository, and each copied
  # off this server when HP_OFFSITE_S3_* or HP_OFFSITE_DIR are set (deploy/.env). Settings > Backups turns the nightly
  # backup off or on, makes one now, and downloads one. Restore one with:
  #   docker compose -f deploy/docker-compose.yml stop api worker ai-worker
  #   docker compose -f deploy/docker-compose.yml run --rm backup /app/hp restore hiringplug-YYYYMMDD-HHMMSS -yes
  #   docker compose -f deploy/docker-compose.yml up -d
  # On a new server, bring the newest back from off the server first:
  #   docker compose -f deploy/docker-compose.yml run --rm backup /app/hp fetch
  backup:
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *backend-env
      HP_BACKUP_DIR: /backups
      HP_BACKUP_KEEP: ${HP_BACKUP_KEEP:-14}
      # The API runs as this user (not root): it is given the backups, so
      # Settings > Backups can list, download and delete them.
      HP_BACKUP_OWNER: "65532:65532"
      # ...and the files a restore puts back (the API and worker read them as
      # this user); `hp repair-files -apply` fixes a server restored before.
      HP_FILES_OWNER: "65532:65532"
      # Each backup also copied off this server (see .env.example and
      # docs/playbooks/deploy-to-a-server.md); empty: not set up.
      HP_OFFSITE_S3_BUCKET: ${HP_OFFSITE_S3_BUCKET:-}
      HP_OFFSITE_S3_ENDPOINT: ${HP_OFFSITE_S3_ENDPOINT:-}
      HP_OFFSITE_S3_REGION: ${HP_OFFSITE_S3_REGION:-}
      HP_OFFSITE_S3_ACCESS_KEY: ${HP_OFFSITE_S3_ACCESS_KEY:-}
      HP_OFFSITE_S3_SECRET_KEY: ${HP_OFFSITE_S3_SECRET_KEY:-}
      # Or a folder on another disk of this computer (a USB drive, a network
      # share): HP_OFFSITE_DIR in deploy/.env is that folder, seen here as /offsite.
      HP_OFFSITE_DIR: ${HP_OFFSITE_DIR:+/offsite}
    volumes: [files:/data/files, ../backups:/backups, "${HP_OFFSITE_DIR:-/dev/null}:/offsite"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  # Catches email sent from the app (development): http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
  files:
