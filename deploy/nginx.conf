server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # Signed file downloads are for the workers inside the network only.
  location /internal/ { return 404; }

  # OAuth codes and signed state must not enter proxy access logs.
  location = /v1/mailbox/callback { access_log off; add_header X-Content-Type-Options "nosniff" always; proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; }
  location /v1/ { add_header X-Content-Type-Options "nosniff" always; proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; }
  location = /openapi.json { proxy_pass http://api:8080; }
  location = /docs { proxy_pass http://api:8080; }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
