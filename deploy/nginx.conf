server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # Signed file downloads are for the workers inside the network only.
  location /internal/ { return 404; }

  # OAuth codes and signed state must not enter proxy access logs.
  location = /v1/mailbox/callback { access_log off; add_header X-Content-Type-Options "nosniff" always; proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; }
  # A backup download: the link's signature must not enter access logs, and
  # a backup of many gigabytes streams straight through, however long it takes.
  location /v1/backup-downloads/ { access_log off; proxy_buffering off; proxy_read_timeout 1h; proxy_send_timeout 1h; add_header X-Content-Type-Options "nosniff" always; proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; }
  location /v1/ { add_header X-Content-Type-Options "nosniff" always; proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Real-IP $remote_addr; }
  # The API reference stays on the API's own port (this machine only): its
  # page loads an outside script, which must not run on the app's address.
  location = /openapi.json { return 404; }
  location = /docs { return 404; }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
